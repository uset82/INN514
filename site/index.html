: 282}, {"n": 4, "title": "Industry, knowledge and support systems", "slides": [20, 21, 22, 23], "readings": "Fløysand et al. 2022, pp. 18, 19, 20, 21, 24; Isaksen & Trippl 2014; Stuck et al. 2015", "paragraphs": ["To compare the two regions, the authors look at three sub systems: the industrial system, the knowledge system, and the support system. On page 18, the article describes how the authors gathered evidence. They screened policy documents, built regional industry models from employment data, and carried out 24 semi-structured interviews with key regional leaders.", "The two regional profiles turn out to be quite different. To explain the contrast, the authors build on Isaksen and Trippl from 2014 and Stuck and colleagues from 2015. Hordaland has an organizationally thick and diversified regional innovation system with an interactive networking structure. A thick system has both a critical mass of active firms and a rich infrastructure of universities and research institutes. Being diversified means its firms operate across several distinct sectors: subsea engineering, maritime clean tech, seafood farming, media technology, and financial innovation.", "Its knowledge system is mature and broad. Bergen established its university museum in 1825, the fishery directorate in 1900, the business school NHH in 1936, the seafood nutrition institute NIFES in 1947, and the University of Bergen. It also hosts the Institute of Marine Research and the Western Norway University of Applied Sciences. These organisations serve many sectors at once.", "Rogaland, centred on Stavanger, has an organizationally thick and specialized system that is rather dirigiste. It is heavily concentrated around offshore petroleum. Its knowledge organisations are much younger and were built specifically to serve offshore oil and gas. For example, the petroleum directorate opened in 1972, the petroleum safety authority in 2004, and the University of Stavanger gained full university status in 2004. Almost all research and engineering in the region relates to the oil value chain.", "Their support policies differ too. Hordaland pursued national cluster programmes with enthusiasm. The lecture calls Bergen a cluster Klondike. On page 24, the article says that five of Norway's fifteen national centres of expertise, and one of its three global centres, are in Hordaland. The slide lists the programmes: subsea technology, tourism, maritime clean tech, media, seafood innovation and finance innovation. Rogaland focused instead on smart specialisation, aiming to develop related branches directly from its dominant oil and gas sector."], "checks": [{"q": "How do the knowledge systems of Hordaland and Rogaland differ in their origins?", "a": "Hordaland has mature, broad organisations founded across two centuries for varied sectors. Rogaland has younger organisations established mainly after 1970 to serve petroleum."}, {"q": "What methods did the authors use to study the two regions?", "a": "They screened policy documents, analysed employment and industry data, and conducted 24 semi-structured interviews with regional leaders (page 18)."}], "audio": "audio/T3-04.mp3", "seconds": 179.2, "words": 364}, {"n": 5, "title": "Collective leadership versus individual leadership", "slides": [24, 25, 26, 27], "readings": "Fløysand et al. 2022, pp. 21, 22, 23; Bækkelund 2021", "paragraphs": ["The fifth part examines how regional leaders behave. It compares change agency with reproductive agency. Change agency alters institutions to support new practices. Reproductive agency reproduces existing habits and preserves established structures. Nora Bækkelund's 2021 study shows that every economy needs both forms of agency. Stability keeps business predictable, while change allows adaptation. But when a region needs a green transition, the balance between them becomes critical.", "In Hordaland, regional key actors developed change agency. They took cluster terminology and cluster practices into their everyday language. An R and D director quoted on slide 24 says that knowledge clusters have become paramount for interaction. An industry leader on slide 25 notes a major cultural shift: firms now care far more about cooperating across boundaries than they did before. The lecture calls this collective leadership.", "In Rogaland, the study found reproductive agency. Daily practices still reflect what the authors call individual strategic leadership. This model links to the historical institutional entrepreneurship of former Stavanger mayor Arne Rettedal. After the North Sea oil and gas discoveries, Rettedal worked as a strong individual leader. He convinced Norwegian state bodies like Equinor and the petroleum directorate to choose Rogaland as their petroleum headquarters. He did the same with foreign multinationals like Phillips, Exxon, Shell, British Petroleum, Elf, Schlumberger and Halliburton.", "That historic success created a lasting expectation. People in Rogaland still look for a strong individual leader to solve regional problems. But as the quotes on slide 26 reveal, local industry leaders feel that regional leadership is now fragmented. One leader noted that compared with ten to fifteen years ago, regional leadership was at its lowest level, with people busy making obstacles for each other rather than working collectively."], "checks": [{"q": "What kind of leadership developed in Hordaland's cluster programmes?", "a": "Collective leadership, characterized by cross-sector collaboration and shared cluster practices."}, {"q": "Why does Rogaland still look to individual strategic leadership?", "a": "Because the region's oil path was created by strong individual leadership, particularly former mayor Arne Rettedal after the North Sea oil and gas discoveries (page 22)."}], "audio": "audio/T3-05.mp3", "seconds": 141.7, "words": 292}, {"n": 6, "title": "Legitimating green crossover", "slides": [28, 29, 30], "readings": "Fløysand et al. 2022, pp. 23, 24, 25", "paragraphs": ["The differences in leadership directly affected green industrial restructuring. When the oil price dropped sharply between 2014 and 2017, both regions felt the economic shock. But their institutional work produced very different results.", "In Hordaland, collective leadership legitimized green restructuring. Cluster networks encouraged crossover programmes from the oil and gas industry to salmon farming. On slide 28, an intermediary notes that the cluster programme contributes to more collaboration and looks for opportunities for green solutions. The intermediary observed that across the entire cluster programme, all the regional clusters look for opportunities for green solutions. On slide 29, the lecture highlights how this crossover worked in practice. An intermediary stated on page 23 that while the oil market decreased, around forty to fifty traditional oil and gas firms found a new market in ocean farming. They developed technology for green and development concessions that looked like a crossover between traditional aquaculture and an oil installation. An industry leader on slide 28 cautioned that networks must demand doing things together rather than just talking, asking how to find clusters that create practical action.", "In Rogaland, regional leaders also discussed green diversification. But the institutional work struggled against the pull of petroleum. Slide 30 highlights an intermediary's warning about what would happen if the oil price surged. The intermediary warned that a booming oil price would cause the industry to re-employ workers and reverse emerging restructuring processes, because high profitability would make it very difficult to start new industrial initiatives. An industry leader added that creating new regional industries was very difficult and required billions. As the authors note on page 25, the thick and specialized system risked bouncing back into its established petroleum path."], "checks": [{"q": "What is crossover in industrial innovation?", "a": "Applying skills, knowledge, and technologies from one sector, such as oil engineering, to another, such as ocean fish farming."}, {"q": "What was the intermediary's warning about a booming oil price in Rogaland?", "a": "That high oil profits would lead the industry to re-employ workers and reverse emerging restructuring processes, making new initiatives hard to establish (slide 30)."}], "audio": "audio/T3-06.mp3", "seconds": 132.8, "words": 287}, {"n": 7, "title": "How the study was done and what it means", "slides": [31, 32, 33, 34], "readings": "Fløysand et al. 2022, pp. 18, 24, 25, 26; Martin & Sunley 2006; Cooke et al. 1998; Lawrence et al. 2011", "paragraphs": ["The lecture ends with a theoretical summary and an intriguing puzzle. To explain these findings, the authors combine three theoretical perspectives: evolutionary economic geography, regional innovation systems, and institutional work. Evolutionary economic geography, represented by Martin and Sunley from 2006, highlights path dependence, industrial branching and regional history. The regional innovation system perspective, drawing on Cooke and colleagues from 1998, shows how local firms, universities and support agencies interact. Institutional work, from Lawrence and colleagues in 2011, explains the day-to-day actions of regional actors who either shift or protect regional rules.", "Combining these theories makes an important academic point. On slide 31, the lecture explains that a broad, practice-based approach informed by evolutionary economic geography is needed to study how regional key actors contribute, or fail to contribute, to changing regional institutions. Real people must invest physical and mental effort every day to reproduce old ways or legitimate new ones.", "The study confirms that institutional work operates within context-specific systems. In Hordaland, an organizationally thick, diversified, and interactive networking system fostered collective leadership that actively legitimized green crossover. In Rogaland, an organizationally thick, specialized, and rather dirigiste system maintained individual leadership habits that delegitimized green restructuring.", "Yet the lecture adds an observation and two open questions on slide 34. Even though institutional work in both regions aimed for a green shift, the oil and gas industry unintentionally continued to dominate regional business life. Why did that happen? The lecture asks two alternative questions. First, was this continuation driven by institutional work led by national key actors in the national innovation system, such as Equinor and national authorities, rather than regional actors? Second, was it driven by institutional work within global innovation systems?", "Here is an exam tip. In December 2024, the exam asked how agency in innovation systems can promote or inhibit sustainable transformation. You can use Hordaland as an example of change agency promoting green crossover, and Rogaland as an example of reproductive agency inhibiting transformation."], "checks": [{"q": "What three theoretical frameworks does the 2022 study combine?", "a": "Evolutionary economic geography, regional innovation systems, and institutional work."}, {"q": "What two open questions does slide 34 ask about why oil and gas remained dominant?", "a": "Whether it was driven by institutional work by national key actors like Equinor and national authorities, or by institutional work in global innovation systems."}], "audio": "audio/T3-07.mp3", "seconds": 169.3, "words": 338}], "seconds": 1108.1}, "T4": {"id": "T4", "title": "Lecture 4: Entrepreneurial ecosystems and sustainable transformation", "session": "Kursplan 2026, session 4 (28 September)", "lecturer": "Nora Geirsdotter Bækkelund", "deck": "Forelesning3 Entreprenørielle økosystem H2025.pdf (H2025, 24 slides)", "chapters": [{"n": 1, "title": "Innovation, entrepreneurship and waves of change", "slides": [1, 2, 3, 4, 5], "readings": "Autio et al. 2014, p. 1097", "paragraphs": ["This fourth lecture explores a different perspective on innovation. Earlier lectures examined territorial systems across nations and regions. Here, Nora Geirsdotter Bækkelund puts the entrepreneur at the centre. Bækkelund examines how the environment around founders shapes their ability to build new ventures.", "The lecture begins by connecting innovation with entrepreneurship. Innovation means putting new combinations and novel ideas into practice. The Austrian economist Joseph Schumpeter, in early work from 1912, argued that the entrepreneur is the central figure who innovates. Robert Baron, in a 2012 book, defined entrepreneurship as what happens when people use creativity, resourcefulness, energy and talent to develop something new and useful. That activity creates economic and social value.", "Yet the lecture makes an important distinction: entrepreneurship is not always innovative. On page 1097 of their article, Autio and colleagues point out that the general public and policymakers often confuse the two terms. They support one in the hope of getting the other. In reality, most new businesses simply copy existing models. A standard shop is an enterprise, but it rarely introduces a novel combination.", "To show why innovation matters over time, slide 3 presents long waves of economic prosperity. The model comes from Allianz in 2010 and builds on Kondratieff waves. Over two centuries, five technological waves transformed industry, from steam engines and railways to electricity, automobiles and computers. We are now in the sixth wave, which began around 2010. This wave is driven by renewable energies and smart grids.", "In modern business, fast-growing startups valued at more than one billion dollars are called unicorns. Slide 4 displays examples of these firms, such as Tesla, OpenAI, Discord, and the warehouse robotics company Autostore. But unicorns do not appear evenly across the globe. Slide 5 presents data compiled by Acs and colleagues, alongside a map from Stam and Saberi from 2017. They show that high-growth startups cluster tightly in a handful of global cities. San Francisco leads the world table with 34 unicorns, followed by Beijing and New York. This raises a pressing question. Why do certain places produce so many high-growth firms while other places produce very few?"], "checks": [{"q": "What is the difference between entrepreneurship and innovation according to the lecture?", "a": "Innovation involves putting new combinations and novel ideas into practice, whereas entrepreneurship can include non-innovative businesses that replicate existing models."}, {"q": "According to the Allianz model on slide 3, what technologies drive the sixth Kondratieff wave?", "a": "Renewable energies and smart grids, beginning around 2010."}], "audio": "audio/T4-01.mp3", "seconds": 172.7, "words": 360}, {"n": 2, "title": "Why context matters: from individuals to ecosystems", "slides": [6, 7, 8, 9, 10], "readings": "Autio et al. 2014, pp. 1098, 1099, 1100; Spigel & Harrison 2018; Stam & van de Ven 2021, p. 809", "paragraphs": ["Why do some places produce many successful startups while others struggle? The lecture answers with a single word: context.", "On slide 6, the lecture highlights a core insight from Autio and colleagues, published in 2014. On page 1099 of their article, they write that it is the context that regulates what individuals and teams get to see, what choices they are likely to make, and what the outcomes of those choices are likely to be. Human beings never act in an isolated vacuum. The rules, relationships and resources around a founder shape every step of the entrepreneurial journey.", "Slide 7 asks what factors around the entrepreneur influence innovative entrepreneurship. To answer, slide 8 presents the organizing framework from Autio and colleagues, published on page 1098. On page 1100, the authors identify four overlapping contexts. First is the organizational context, including company cultures and learning habits. Second is the institutional and policy context, covering formal regulations and informal social norms. Third is the industry and technological context, including digital platforms and technical standards. Fourth is the social context, including personal networks. These four contexts operate within a temporal context of historical time, across local, regional, national and global levels. Together, they shape both the type of entrepreneurial innovation and its performance.", "Slide 9 shows how academic research moved towards this contextual view. Historically, entrepreneurship research focused almost entirely on the individual. Scholars examined personal traits, psychology, cognition, mindset and founder identity. But looking at individuals in isolation could not explain why similar people succeed in one region and fail in another. Meanwhile, innovation scholars studied systems, developing theories of industrial clusters and regional innovation systems. Yet as Spigel and Harrison point out in their 2018 article, cluster and system models were designed primarily for large, established firms. They pay less attention to the birth of brand-new ventures.", "This gap gave rise to the concept of entrepreneurial ecosystems. This perspective places entrepreneurs directly at the centre. It focuses on the local entrepreneurial community rather than only on formal state support. On page 809 of their 2021 article, Stam and van de Ven note that the concept is growing in popularity, but that it remains loosely defined and measured.", "Slide 10 provides a classic definition. Quoting Stam and Spigel from 2016, an entrepreneurial ecosystem is a set of interdependent actors and factors coordinated in such a way that they enable productive entrepreneurship. The slide leaves us with two open questions: who are these actors, and what factors coordinate them?"], "checks": [{"q": "What role does context play in entrepreneurship, according to Autio and colleagues?", "a": "Context regulates what individuals and teams get to see, what choices they are likely to make, and what the outcomes of those choices are likely to be (page 1099)."}, {"q": "Why were traditional cluster and innovation system theories insufficient for studying new startups?", "a": "Because they were designed mainly to study innovation in large, established firms rather than the unique challenges of creating new ventures (Spigel & Harrison 2018)."}], "audio": "audio/T4-02.mp3", "seconds": 203.9, "words": 425}, {"n": 3, "title": "Two models of the ecosystem", "slides": [11, 12, 13], "readings": "Stam & van de Ven 2021, pp. 810, 813, 814; Spigel & Harrison 2018, p. 152", "paragraphs": ["To turn the broad concept of an ecosystem into a practical framework, researchers have developed analytical models. The lecture introduces two influential examples.", "The first model comes from Stam and van de Ven in 2021, shown on slide 11. On page 810, they build on van de Ven's work from 1993 on the infrastructure for entrepreneurship. On page 813, they present a framework divided into two main layers.", "At the base sit institutional arrangements. These are formal institutions, such as legal rules and property rights; informal culture, such as social attitudes towards ambition; and networks linking local actors. Resting on these institutions are resource endowments. These include physical infrastructure, market demand, intermediaries who connect people, talent, scientific knowledge, leadership, and access to finance.", "The model links these parts through three propositions, set out on page 814. Proposition one states that the elements are mutually interdependent and co-evolve. Proposition two, which the authors call upward causation, states that the elements together explain the level of productive entrepreneurship in a territory, the ecosystem's output. Productive entrepreneurship means activity that creates net economic and social value. Proposition three, downward causation, describes a feedback loop: successful entrepreneurial outputs feed back into the ecosystem, enriching local institutions and resources over time.", "The second model, presented on slide 12, comes from Spigel and Harrison. The slide also cites a 2016 paper by Stam and Spigel. The model sorts the ecosystem into three interdependent elements: cultural, social and material.", "Cultural elements provide the shared outlook. They include positive social attitudes towards business creation, inspiring local success stories, and an acceptance of failure as a natural step in learning.", "Social elements provide the human connections and resources. They include risk capital, skilled workers, and experienced mentors who advise young founders.", "Material elements provide the physical and organizational backbone. They include startup incubators and accelerators, university research centres, transport infrastructure, and targeted public policies.", "Slide 13 adds a short video titled How to Build a Thriving Entrepreneurial Ecosystem Anywhere. On page 152 of their article, Spigel and Harrison explain that the global popularity of ecosystems was accelerated by practitioners. In particular, venture investor Brad Feld wrote about startup communities in Boulder, Colorado, while Daniel Isenberg wrote about ecosystem domains. Both argued that a flourishing startup scene depends on community cooperation rather than bureaucratic planning."], "checks": [{"q": "What are the two layers in Stam and van de Ven's 2021 ecosystem model?", "a": "Institutional arrangements (formal institutions, culture, networks) and resource endowments (infrastructure, demand, intermediaries, talent, knowledge, leadership, finance)."}, {"q": "Name the three elements of an entrepreneurial ecosystem in Spigel and Harrison's model.", "a": "Cultural elements (attitudes, success stories, acceptance of failure), social elements (risk capital, skilled talent, mentors), and material elements (incubators, research institutes, infrastructure, policy)."}], "audio": "audio/T4-03.mp3", "seconds": 199.9, "words": 392}, {"n": 4, "title": "Ecosystems develop over time: resources and networks", "slides": [14, 15, 16], "readings": "Spigel & Harrison 2018, pp. 158, 159, 160, 162, 163", "paragraphs": ["An ecosystem is not a static machine that you assemble from a checklist. It is an evolving process. On slide 14, the lecture turns to the process perspective developed by Spigel and Harrison.", "To understand how ecosystems grow, the authors identify two central dimensions on page 158: resources and networks. Simply having resources inside a region is not enough. The lecture points out the contrast between Cambridge, Massachusetts, and San Francisco, California. Both regions possess world-class universities and capital. But San Francisco grew into an entrepreneurial leader because founders had access to dense social networks where resources circulate freely.", "On page 159, the authors explain that a founder's capabilities and credibility depend on social relations. Critical resources are wrapped up in informal social networks. If a founder is not trusted by the local community, capital and talent remain out of reach. Learning between entrepreneurs, mutual trust, and supportive cultural attitudes keep resources moving.", "A central engine of ecosystem growth is resource recycling, discussed on page 159. When successful entrepreneurs build a company and reach a profitable exit, their journey does not end. In a well-functioning ecosystem, founders reinvest their wealth, knowledge, and prestige locally. On page 160, the authors note that successful founders remain in the region as angel investors, serial entrepreneurs, advisors, and mentors. They help the next wave of startups. Even when a firm fails, its workers and technical insights are recycled into other local businesses, provided the local culture treats failure as an educational milestone.", "Slide 15 illustrates this evolution with Figure 1 from Spigel and Harrison, published on page 162. An ecosystem moves through distinct stages. It starts as a nascent ecosystem, where connectivity is low, resources leak away to other regions, and little recycling occurs. As connectivity improves and dealmakers emerge to link different groups, it becomes a strengthening ecosystem, attracting external resources. Over time, it can mature into a resilient ecosystem that survives industry downturns through dense networks and continuous resource creation. But if an economic shock breaks local connections and talent departs, it can decline into a weakened ecosystem.", "Slide 16 shows Figure 2 from page 163, classifying ecosystems across network strength and resource munificence. Strong ecosystems, like Silicon Valley and Boulder, combine abundant resources with well-functioning networks. Arid ecosystems, like Accra and Lagos, have strong networks but sparse resources. Irrigated ecosystems, like Calgary and Aberdeen, have abundant financial resources from resource industries but poor network connectivity for new startups. Finally, weak ecosystems, like Hull and Flint, struggle with both sparse resources and fragmented networks."], "checks": [{"q": "What is resource recycling in an entrepreneurial ecosystem?", "a": "When successful founders exit a business and reinvest their capital, experience, networks and reputation back into the local community as investors, mentors and advisors (Spigel & Harrison 2018, p. 159)."}, {"q": "How do Spigel and Harrison distinguish strong, arid, irrigated, and weak ecosystems on slide 16?", "a": "By crossing network strength (well-functioning versus poorly-functioning) with resource munificence (abundant versus sparse resources)."}], "audio": "audio/T4-04.mp3", "seconds": 218.5, "words": 431}, {"n": 5, "title": "Can public policy build an ecosystem?", "slides": [17, 18], "readings": "Spigel & Harrison 2018, p. 164; Autio et al. 2014, p. 1099", "paragraphs": ["Can public policy build an entrepreneurial ecosystem? This is one of the most debated questions in modern economic development, and slide 17 tackles it directly.", "The lecture's primary conclusion is straightforward: ecosystems must grow from the bottom up. The most decisive elements of a healthy ecosystem come from entrepreneurs themselves. Government officials cannot create mutual trust, informal social networks, or a culture of ambition by administrative decree. On page 164, Spigel and Harrison stress that policy makers should support existing entrepreneurial communities rather than attempt to engineer ecosystems from scratch.", "This does not mean the public sector is powerless. A table on page 1099 of the article by Autio and colleagues compares three views, each with its own policy emphasis. The national innovation system view supports research with subsidy programmes. The entrepreneurship view supports the creation and growth of firms. The view the authors argue for, entrepreneurial innovation in context, aims to help whole entrepreneurial ecosystems develop. Slide 17 lists practical ways the state can support the entrepreneurial community.", "First, it can create arenas and meeting places where entrepreneurs meet and build social ties. Second, it can finance incubators, accelerators and supporting infrastructure. Third, it can make risk capital and venture funds available. Fourth, it can offer training programmes.", "Fifth, it can create incentives for contact between research and entrepreneurs, and for academic spin-offs. Sixth, it can influence culture by speaking well of entrepreneurship. Seventh, it can use immigration policy, such as start-up visas in the United States or work visas in Norway. The slide adds that Spigel and Harrison have a good chapter on policy.", "On slide 18, the lecturer returns to the core question: what factors around the entrepreneur influence innovative entrepreneurship? This reminds us that policy works best when it removes bottlenecks in the surrounding environment, allowing private initiative and community networks to thrive."], "checks": [{"q": "Why must entrepreneurial ecosystems grow from the bottom up?", "a": "Because the most critical drivers, such as mutual trust, personal networks, and an ambitious culture, come from the entrepreneurs themselves and cannot be created by decree."}, {"q": "Name four ways public policy can support an entrepreneurial community, according to slide 17.", "a": "Any four of: arenas and meeting places, financing incubators and accelerators, risk capital and venture funds, training programmes, incentives for research contact and academic spin-offs, speaking well of entrepreneurship, and immigration policy such as start-up visas."}], "audio": "audio/T4-05.mp3", "seconds": 150.5, "words": 315}, {"n": 6, "title": "A founder house in Bergen: an ecosystem in practice", "slides": [19, 20], "readings": "none new", "paragraphs": ["To see how these concepts apply to our own region, slide 19 introduces a local case: a new investor and founder house in Bergen.", "The slide features an article from the Norwegian business news website Shifter with the headline: Investor couple buys villas to make Bergen a bit more like Silicon Valley. The subtitle explains that the investor couple Kristin and Johan Odfjell will turn two old villas into an investor house and a founder house. The caption shows how the villas in Jahnebakken in Bergen will look once they are renovated.", "The lecturer uses this real-world initiative to pose two questions for class reflection. First, what does this article reveal about Bergen's innovation ecosystem? What key actors, cultural attitudes, material resources, and social networks are visible? Second, do you believe this investor and founder house can make a genuine difference to local entrepreneurial activity, and if so, how?", "Here is one way of our own to approach the questions, not from the lecture. Use the three kinds of element from chapter 3. On the material side, the house gives founders a physical place to work and meet. On the social side, it puts investors and founders under one roof. That could help resources move through networks, which Spigel and Harrison see as the key to a growing ecosystem. On the cultural side, ask whether it creates visible success stories and role models. Whether it makes a real difference is the open question the slide leaves you with.", "Slide 20 connects this case to a broader framework: Daniel Isenberg's classic 2009 diagram of the domains of an entrepreneurship ecosystem. Isenberg places entrepreneurship at the centre of six interconnected domains: policy, finance, culture, supports, human capital, and markets. Each domain contains distinct components. Finance includes angel investors, private equity, and venture capital. Culture includes tolerance of failure and visible success stories. Supports include physical infrastructure and technical experts. Human capital includes skilled workers and universities. The Bergen villa project touches almost every domain, showing how private actors attempt to build regional entrepreneurial momentum."], "checks": [{"q": "What is the investor and founder house in Jahnebakken, Bergen?", "a": "An investor couple is turning two old villas into an investor house and a founder house, to bring investors and founders together. The slide asks what this tells us about Bergen's ecosystem and whether it can make a difference."}, {"q": "What are the six domains in Daniel Isenberg's 2009 ecosystem diagram?", "a": "Policy, finance, culture, supports, human capital, and markets."}], "audio": "audio/T4-06.mp3", "seconds": 158.7, "words": 353}, {"n": 7, "title": "Critique and the three readings", "slides": [21, 22, 23, 24], "readings": "Spigel & Harrison 2018, pp. 151, 158; Stam & van de Ven 2021, p. 809; Autio et al. 2014, p. 1097", "paragraphs": ["The lecture concludes with a critical assessment of the entrepreneurial ecosystem framework and a review of the three assigned readings.", "On slide 21, the lecturer notes that while the ecosystem perspective offers valuable insights into the context of business creation, the concept faces serious academic criticism. On page 158 of their 2018 article, Spigel and Harrison outline three major weaknesses.", "First, the ecosystem concept is tautological. An ecosystem is defined as a place with successful entrepreneurship, and whenever successful entrepreneurship is found, researchers assume a strong ecosystem must be present. The cause and the outcome are circular.", "Second, the framework is often purely descriptive. It presents what critics call a laundry list of factors without explaining how cause and effect work, or how the various components cohere into a functioning system.", "Third, the concept lacks a clear geography. There is ongoing confusion about the correct level of analysis. Scholars disagree on whether an ecosystem should be studied at the level of a city, a region, an entire country, or even non-spatial units like corporate networks and global value chains.", "Slide 22 addresses this challenge by contrasting abstraction with contextualization. Grouping factors into cultural, social, and material categories is an abstract exercise. To produce meaningful research, scholars must investigate what actually happens inside real interpersonal relationships in specific local settings.", "Slide 23 summarizes what each assigned reading contributes.", "Spigel and Harrison, in their 2018 article, explain what the theory is about and trace its history. They clarify how ecosystems differ from clusters and regional innovation systems, and present a process-oriented theory based on resources and networks.", "Autio and colleagues, in their 2014 article, examine which contextual factors shape entrepreneurial innovation and explore how public policies can nurture ambitious startups.", "Stam and van de Ven, in their 2021 article, review earlier contextual literature, provide an operational framework linking institutional arrangements and resource endowments to productive entrepreneurship, and offer tools to measure and benchmark ecosystems across territories.", "Slide 24 provides the lecturer's contact address for further discussion.", "Here is an exam tip. In December 2024, the exam asked what you understand by innovation systems, sustainable transformation, institutions, and agency. You can use the entrepreneurial ecosystem perspective to explain agency: individual and collective entrepreneurs act as deliberate change agents, but their choices and success remain bound by local institutional rules and social networks."], "checks": [{"q": "What are the three main critiques of the entrepreneurial ecosystem concept identified by Spigel and Harrison?", "a": "It is tautological, it presents a descriptive laundry list without causal mechanisms, and it lacks clear geographical boundaries (page 158)."}, {"q": "How do Spigel and Harrison distinguish entrepreneurial ecosystems from traditional clusters and regional innovation systems?", "a": "Ecosystems put the entrepreneur at the centre and focus on startup creation and resource flows, whereas clusters and regional systems focus mainly on established firms and formal research links."}], "audio": "audio/T4-07.mp3", "seconds": 193.9, "words": 396}], "seconds": 1298.1}, "T5": {"id": "T5", "title": "Lecture 5: Agency and changing innovation systems", "session": "Kursplan 2026, session 5 (29 September)", "lecturer": "Nora Geirsdotter Bækkelund", "deck": "Forelesning 6 System og aktørskap H2025.pdf (H2025, 22 slides)", "chapters": [{"n": 1, "title": "The limits of systems and the return of agency", "slides": [1, 2, 3, 4, 5], "readings": "Garud & Karnøe 2003, p. 277; Bækkelund 2021, p. 757; Miörner & Trippl 2017, p. 481", "paragraphs": ["This fifth lecture explores the human side of economic transformation: agency. In earlier lectures, we looked at innovation systems as collections of organisations, institutions and networks. Here, Nora Geirsdotter Bækkelund asks a basic question. How do real people act within established systems, and how can human choices change those systems over time?", "The lecture begins on slide 2 by examining the strengths and weaknesses of the innovation system perspective. The approach has three major advantages. First, it shows that innovation is an interactive process rather than something that happens inside a single company. Second, it gives policymakers a tool to promote innovation in a country, region, city or industry. Third, it provides an overview of actors, components and connections, helping public authorities improve existing innovation infrastructure.", "Yet the perspective also has three notable weaknesses. First, it does not explain how innovation systems or regional advantages arise in the first place. Second, it offers a static picture of how systems function rather than a dynamic explanation of change. Third, it suffers from a chicken-and-egg problem.", "Slide 3 presents these chicken-and-egg questions directly. National and regional innovation systems usually share the same specialisation as their existing industries. How, then, can genuinely new specialisations emerge? Is an innovation system the result of existing industrial strengths, or the cause of them? And can an established innovation system help build entirely new industries?", "Slide 4 introduces the three core articles that address these questions:", "Garud and Karnøe, in 2003, compare how the wind energy industry developed in Denmark and the United States, as set out on page 277 of their article. Their theoretical focus contrasts a science-focused, top-down approach with a bottom-up approach that leaves room for distributed initiative.", "Bækkelund, in 2021, studies how new industries develop in small places with limited economic preconditions, examining tourism in three villages in Western Norway, Flåm, Odda and Sogndal, as explained on page 757 of the article. This lecture concentrates on Flåm. Bækkelund's theoretical focus is on the interplay between different types of agency and how agency changes over time.", "Miörner and Trippl, in 2017, investigate the digital games industry in Scania in southern Sweden, as introduced on page 481 of their article. Their theoretical focus is on how actors navigate existing structures when building a new industry that does not fit established regional patterns.", "Slide 5 links these debates to fundamental social science questions: the relationship between individual action and social structure, and the relationship between stability and change."], "checks": [{"q": "Name two advantages and two disadvantages of the innovation system perspective from slide 2.", "a": "Advantages: shows innovation is interactive; serves as a policy tool; maps components to improve infrastructure. Disadvantages: does not explain origins; provides a static view; suffers from a chicken-and-egg problem."}, {"q": "What empirical cases do the three core articles examine?", "a": "Wind energy in Denmark versus the USA (Garud & Karnøe 2003), tourism development in Flåm, Odda and Sogndal, of which the lecture uses Flåm (Bækkelund 2021), and the video games industry in Scania (Miörner & Trippl 2017)."}], "audio": "audio/T5-01.mp3", "seconds": 201.7, "words": 423}, {"n": 2, "title": "What is agency? Embeddedness, networks and positions", "slides": [6, 7], "readings": "Bækkelund 2021, p. 758", "paragraphs": ["Slide 6 introduces the central concept of the lecture: agency. The slide defines agency, quoting Gregory and colleagues from 2009, as the ability of people to act and have an effect.", "Slide 7 emphasizes that agency is a relational phenomenon. Human action never occurs in isolation. The slide quotes Grillitsch and Sotarauta from 2020: agency depends on, and is conditioned by, agents' positions in society.", "The slide also quotes Bækkelund from page 758 of the 2021 article. Drawing on Weik and Battilana, Bækkelund writes that even when one or a few agents work for a specific change, they depend on others to change practices and gain access to resources. Therefore, an actor's social network is an integral part of that actor's agency.", "Slide 7 outlines four key insights about relational agency:", "First, actors build up their networks and social positions over time. Social embeddedness does not happen overnight.", "Second, both too little and too much embeddedness can hinder change agency, as Battilana argued in 2006. Actors who have no local connections lack the trust and credibility needed to mobilize others. But actors who are too deeply embedded in existing structures may become blind to new opportunities or bound by established routines.", "Third, maintaining broad networks and knowing people across different sectors gives actors access to diverse perspectives and resources. This social position allows them to serve as bridges between isolated groups.", "Fourth, an actor's position in society determines their ability to influence others and coordinate collective action."], "checks": [{"q": "How does the lecture define agency on slide 6?", "a": "The ability of people to act and have an effect (Gregory et al. 2009)."}, {"q": "Why can both too little and too much social embeddedness hinder change agency, according to slide 7?", "a": "Too little embeddedness leaves actors without trust and resources; too much embeddedness locks actors into existing routines and loyalties (Battilana 2006)."}], "audio": "audio/T5-02.mp3", "seconds": 120.7, "words": 256}, {"n": 3, "title": "Heroic versus distributed agency: wind turbines in Denmark and the USA", "slides": [8, 9, 10], "readings": "Garud & Karnøe 2003, pp. 277, 279, 282, 285, 289, 295", "paragraphs": ["Slide 8 contrasts two different perspectives on human agency: heroic agency versus distributed agency.", "The heroic perspective focuses on the single individual, rational planning, and direct control. It assumes that a visionary entrepreneur or planner can foresee the future and implement a master plan.", "The distributed perspective, by contrast, sees agency as shared across multiple actors, emergent over time, and deeply relational. Change happens through ongoing interaction among many contributors rather than through a single command.", "Slide 9 explores distributed agency through Garud and Karnøe's 2003 comparative study of wind power in Denmark and the United States, introduced on page 277. On page 279, Figure 2 diagrams the distributed agents involved in building a technological path. The technological artifact sits at the centre, connected by mutual embedding processes to four distinct domains: regulation, evaluation, design and production, and use.", "On page 295, Garud and Karnøe explain that the Danish wind power path was a process of co-shaping between actors and artifacts. Learning blurred the traditional boundaries between design and production, planning and execution, and rule making and rule following. Danish actors did not focus on dramatic technological leaps. Instead, they built up competencies step by step. On page 285, the authors describe where this started. Early Danish firms had skilled workers and practical engineers from the machine industry. They saw wind turbines as similar to the agricultural machinery they had built before. Lacking theory on turbine aerodynamics, they learned by deploying components, seeing them fail, and redesigning them. The path was emergent, adapting to unfolding challenges and gradually improving turbine functionality.", "Slide 10 analyses these two national experiences from an innovation system perspective:", "Denmark developed what the slide calls a balanced innovation system. The Danish system grew largely from the bottom up. Users and producers played a central role, and they were involved in developing regulations. On page 282, the article gives an example: a law requiring certification of turbines brought engineers at the production sites into closer contact with the Danish test station.", "The United States, by contrast, made a more top-down attempt at innovation. It made large investments in research-based innovation, which the slide calls a top-heavy innovation system. On page 289, the authors describe one result. When American turbines ran into problems, firms replaced the failed components but did not take the time to analyse the problems and redesign their turbines."], "checks": [{"q": "What is the difference between heroic agency and distributed agency?", "a": "Heroic agency assumes an isolated individual with rational planning and direct control. Distributed agency sees action as emergent, relational, and shared across multiple actors."}, {"q": "How did the Danish and American wind turbine innovation systems differ on slide 10?", "a": "Denmark developed a balanced, bottom-up system where users and producers helped develop regulations; the United States made a top-down attempt with large investments in research-based innovation, a top-heavy system (slide 10; Garud & Karnøe 2003)."}], "audio": "audio/T5-03.mp3", "seconds": 198.0, "words": 407}, {"n": 4, "title": "The trinity of change agency: entrepreneurs, institutions and places", "slides": [11, 12, 13], "readings": "Miörner & Trippl 2017, pp. 481, 491; Bækkelund 2021, pp. 757, 759, 764", "paragraphs": ["Slide 11 opens a debate: who exercises agency in an innovation system? Does it matter who exercises agency, or does it matter most what they actually do?", "To clarify what actors do, slide 12 introduces the trinity of change agency, formulated by Grillitsch and Sotarauta in 2020 for new regional industrial path development:", "The first type is Schumpeterian entrepreneurship. This is classic commercial entrepreneurship. Individual actors establish new innovative firms, or existing firms pursue radical diversification into new markets.", "The second type is institutional entrepreneurship. This involves deliberate action to create brand-new institutions or to alter existing rules, regulations and cultural norms.", "The third type is place-based leadership. This consists of efforts to bring together diverse regional actors, formulate shared goals, and coordinate action toward those goals.", "Slide 13 addresses who exercises these three forms of agency. Different actors often take on distinct roles:", "Firms and commercial entrepreneurs typically exercise Schumpeterian agency.", "Politicians, public organisations, individual citizens and businesses can all engage in institutional entrepreneurship.", "Politicians, non-governmental organisations, private citizens, firms and entrepreneurs can all exercise place-based leadership.", "Slide 13 emphasizes that the same person or organisation can exercise multiple types of agency at the same time. The slide gives two examples from the syllabus:", "In the Scania digital games industry, the slide names one entrepreneur as the driving force behind the Nordic Game Programme. On page 491 of their 2017 article, Miörner and Trippl describe him as the private contractor in Malmö who administered the programme. The slide classifies his actions as Schumpeterian and institutional entrepreneurship, and partly place-based leadership. That classification is the lecturer's, applying the course's typology to their case; the article itself does not use these terms.", "In the Flåm tourism case, the slide says the local mayor exercised place-based leadership and Schumpeterian entrepreneurship by establishing a municipal company, with institutional entrepreneurship as part of the process. On page 764, Bækkelund describes how the mayor enacted strong change agency after the railway's closure was announced. The municipality and the local bank then bought the railway and the hotel, so the same parties were involved in institutional as well as Schumpeterian entrepreneurship."], "checks": [{"q": "Name the three types of change agency in the framework by Grillitsch and Sotarauta (2020).", "a": "Schumpeterian entrepreneurship (new firms or diversification), institutional entrepreneurship (changing rules), and place-based leadership (mobilizing actors around shared goals)."}, {"q": "How do the Scania games industry and the Flåm case show that one actor can combine multiple types of agency?", "a": "In Scania, the slide classifies the entrepreneur behind the Nordic Game Programme as combining Schumpeterian and institutional entrepreneurship and partly place-based leadership; in Flåm, the mayor combined place-based leadership, Schumpeterian entrepreneurship and institutional entrepreneurship (slide 13; Bækkelund, page 764)."}], "audio": "audio/T5-04.mp3", "seconds": 184.3, "words": 366}, {"n": 5, "title": "How agency meets structure: critical junctures and opportunity spaces", "slides": [14, 15, 16], "readings": "Bækkelund 2021, pp. 759, 760", "paragraphs": ["Slide 14 illustrates how the three types of agency connect to structural elements, drawing on a 2024 model by Frimanslund and Bækkelund.", "Schumpeterian entrepreneurship connects to materiality and the physical structure of business and industry.", "Institutional entrepreneurship connects to institutions, visions, and shared narratives.", "Place-based leadership connects to social structures, interpersonal relationships, networks, and finding a common direction.", "Slide 15 turns to actor-structure interaction, drawing on Archer's 2010 work. Agency is always exercised within existing structures. Yet purposeful agency can alter those structures over time. Once changed, the new structures become the structural conditions that shape future action.", "Slide 16 examines the time dimension of agency in economic development, focusing on the specific situation.", "First, drawing on Emirbayer and Mische, the slide explains that when actors face problematic situations requiring imagination and judgment, they gain a reflective distance from routine patterns, enabling conscious choice and purposeful action.", "Second, the slide quotes Capoccia and Kelemen from 2007 on critical junctures: relatively short periods of time during which there is a substantially heightened probability that agents' choices will affect outcomes of interest.", "Third, it references Kurikka and colleagues from 2023 on regional opportunity spaces. An opportunity space can be absolute or perceived. It depends on the real conditions in the region, relationships across geographic levels, and how local actors perceive their situation.", "The slide summarizes this situational dynamic in a simple formula: crisis equals danger plus a turning point."], "checks": [{"q": "How do the three types of agency connect to structural elements in Frimanslund and Bækkelund's 2024 model?", "a": "Schumpeterian entrepreneurship connects to materiality and business structures; institutional entrepreneurship connects to institutions, visions, and narratives; place-based leadership connects to social structures, networks, and shared direction."}, {"q": "What is a critical juncture according to Capoccia and Kelemen (2007)?", "a": "A relatively short period of time during which there is a substantially heightened probability that agents' choices will affect the outcome of interest (slide 16)."}], "audio": "audio/T5-05.mp3", "seconds": 126.1, "words": 248}, {"n": 6, "title": "Change agency versus reproductive agency: the Flåm railway", "slides": [17, 18, 19, 20], "readings": "Bækkelund 2021, pp. 759, 760, 764", "paragraphs": ["Slide 17 examines the evolutionary dimension of agency over time. Building a new industry or transforming an innovation system takes decades. Development is not only about disruption; it requires sustained daily effort involving both change agency and reproductive agency.", "The slide presents a contrast table from Bækkelund's 2021 article, on page 759:", "Under reproductive agency, we find replicative entrepreneurship, institutional work aimed at maintaining rules, and place-based maintenance leadership.", "Under change agency, we find Schumpeterian entrepreneurship, institutional entrepreneurship aimed at altering rules, and place-based change leadership.", "On page 760, Bækkelund's model outlines four phases of path evolution: preformation, critical juncture, path creation, and path development. Path development can lead either to a stable state dominated by reproductive agency, or to a dynamic process that balances change agency and reproductive agency.", "Slide 18 details the timeline of tourism development in Flåm from Bækkelund's research:", "In 1941, the Flåm railway opened.", "In the 1990s, early warnings emerged that the railway line might be closed down.", "In 1994, a local project began to develop the railway as a tourism product.", "In 1997, the state railway company, NSB, announced the closure of the line. The mayor of Aurland attempted to persuade regional railway managers in Vestland, but failed. The municipality hired a consultant to develop a plan for the railway as a tourism product, and presented it to NSB's central management. NSB agreed to participate on two conditions: Aurland municipality had to purchase the railway infrastructure and pay NSB for operations, and the municipality had to build a cruise terminal in Flåm.", "Around 2000, the municipality secured investment capital from the state enterprise Siva instead of private investors.", "The 2000s saw rapid growth in mass tourism. In 2005, the neighbouring Nærøyfjord received UNESCO world heritage status. By 2014 and 2015, local protests arose against the negative impacts of cruise tourism. In 2018, the Norwegian parliament proposed a zero-emission requirement for cruise ships in world heritage fjords starting in 2026, as noted on page 764 of the article.", "Slide 19 tracks how agency shifted across these development phases:", "In the preformation phase, the mayor exercised place-based change leadership, gathering local actors around tourism development.", "During path creation, sparked by the critical juncture of the railway closure, the municipality exercised Schumpeterian entrepreneurship by establishing a municipal company. The mayor exercised place-based change leadership to secure votes in the municipal council and bring in NSB. Local actors exercised institutional entrepreneurship by reframing the identity of Flåm and the role of the municipality.", "In the path development phase, the municipal company expanded operations through replicative entrepreneurship, while private tourism spinoffs multiplied. The municipality exercised place-based leadership in the UNESCO application, while business actors engaged in institutional work to defend cruise tourism.", "In further development, replicative entrepreneurship brought zero-emission vessels and electric cars. Place-based maintenance leadership took the form of dialogue meetings between the tourism industry and residents, and local cooperation to find step-by-step solutions. Local critics exercised institutional entrepreneurship by protesting cruise pollution and demanding stricter regulation, while established tourism actors carried out institutional work to lobby against the strict zero-emission mandate.", "Slide 20 highlights multi-level dynamics. Non-local factors, including national railway budgets, growing global tourism, UNESCO designations, and national environmental laws, continuously reshaped the local opportunity space."], "checks": [{"q": "What are the three forms of reproductive agency in Bækkelund's 2021 model on page 759?", "a": "Replicative entrepreneurship, institutional work (maintaining rules), and place-based maintenance leadership."}, {"q": "What two conditions did NSB set in 1997 before agreeing to keep the Flåm railway open?", "a": "Aurland municipality had to buy the railway infrastructure and pay NSB for operations, and the municipality had to build a cruise terminal (slide 18)."}], "audio": "audio/T5-06.mp3", "seconds": 283.2, "words": 550}, {"n": 7, "title": "Can innovation systems change themselves?", "slides": [21, 22], "readings": "Bækkelund 2021, p. 757; Garud & Karnøe 2003, p. 277; Miörner & Trippl 2017, p. 481", "paragraphs": ["Slide 21 brings together the lecture's core themes, asking whether innovation systems can transform themselves.", "Innovation systems are part of existing structures. Yet system actors can also drive change in two main ways: by building new industries or by changing the innovation system itself.", "Alternatively, actors can work outside established systems. They can develop informal networks that eventually force changes in the established system, or they can build an entirely new system alongside the old one.", "The slide asks whether established industries without an innovation system are more rigid. It leaves students with a final question for reflection: innovation systems are usually linked to existing industries and structures, but they can serve both as tools for change and as sources of rigidity. What determines which role they play?", "Slide 22 lists the core references for the lecture, covering agency, critical junctures, opportunity spaces, and path evolution.", "Here is an exam tip. In December 2024, the exam asked two related questions: Question 1 asked what you understand by an innovation system, sustainable transformation, agency, and institutions. Question 2 asked how agency in innovation systems can promote or inhibit sustainable transformation.", "You can answer using the distinction between change agency and reproductive agency from Bækkelund's 2021 article. Change agency promotes transformation when actors start new firms, alter rules, and coordinate local action around a new path. The early Flåm restructuring shows all three. The Danish wind case shows how distributed agency built a new technology path. Reproductive agency can inhibit transformation when actors use institutional work to defend established, polluting routines, as seen in the defence of conventional cruise tourism. But reproductive agency is also necessary to maintain standards and scale up green solutions once a new path is created."], "checks": [{"q": "How can actors drive change when an existing innovation system is rigid, according to slide 21?", "a": "They can build new industries within the system, change the system itself, or work outside established structures to force institutional change or create a new system."}, {"q": "In the December 2024 exam questions, how can agency both promote and inhibit sustainable transformation?", "a": "Change agency promotes transformation by introducing new combinations, changing institutions, and mobilizing networks; reproductive agency can inhibit transformation by defending established routines, but is also needed to stabilize new solutions over time."}], "audio": "audio/T5-07.mp3", "seconds": 139.8, "words": 295}], "seconds": 1253.8}, "T6": {"id": "T6", "title": "Lecture 6: Technological innovation systems", "session": "Kursplan 2026, session 6 (20 October)", "lecturer": "Rune Njøs (guest lecture, H2025; Kelvin Ivankovic in Kursplan 2026)", "deck": "Forelesning 4 Njøs.pdf (H2025, 43 slides)", "chapters": [{"n": 1, "title": "What technology development is really about", "slides": [1, 2, 3, 4, 5, 6, 7], "readings": "none new", "paragraphs": ["This lecture introduces technological innovation systems, often shortened to TIS. In Kursplan 2026, Kelvin Ivankovic teaches this session. These slides come from the 2025 guest lecture by Rune Njøs, who holds a PhD and works at Digdir.", "Slide 2 outlines the agenda. The lecture begins with theoretical foundations on sociotechnical systems and the TIS framework from Hekkert and colleagues in 2007. It then explores an academic case on carbon capture and storage in Norway from Steen and colleagues in 2024. Next, it examines a practical case on digital identity wallets from public administration. It concludes with an overall summary.", "On slide 3, the lecturer highlights four core lessons:", "First, technology development is not only about technical devices.", "Second, technology is socially constructed, meaning that narratives about technology are shaped by society.", "Third, technological innovation systems provide an analytical tool to study this connection.", "Fourth, understanding the interplay between technology and society demands interdisciplinary cooperation across engineering and the social sciences.", "Slide 4 marks the start of part one on background concepts.", "Slide 5 opens with a question posed by economist Richard Nelson in 1974: \"If we can land a man on the moon, why can't we solve the problems of the ghetto?\" Nelson pointed out a sharp contrast. Society could achieve an astonishing technical feat, yet struggled to resolve chronic urban poverty.", "Slide 6 asks whether landing on the moon was merely a technical problem. It quotes President John F. Kennedy's famous speech. Kennedy declared that we choose to go to the moon not because it is easy, but because it is hard. That goal served to organize and measure the best of our energies and skills. In general terms, not the slide's own words, reaching the moon also took political will, public agencies working together, large budgets and public support. The engineering was only one part of it.", "Slide 7 asks whether society can solve a problem simply by deciding to do so. The slide quotes Jelley from 2020 on wind and solar resources, noting that each has the potential to provide all the energy the world needs, solar many times over. If abundant clean energy resources already exist, why is the world still dependent on fossil fuels? Technology cannot be separated from the institutions, economic habits, and physical infrastructure built around existing energy sources."], "checks": [{"q": "Why does the lecture quote Richard Nelson's 1974 question about the moon landing?", "a": "To show that technology development is not just technical; solving complex societal problems requires social organisation, political will, and institutional alignment (slides 5 and 6)."}, {"q": "What are the two empirical cases examined in this lecture?", "a": "Carbon capture and storage from the academic literature (Steen et al. 2024) and the digital identity wallet from public administration practice (slide 2)."}], "audio": "audio/T6-01.mp3", "seconds": 181.1, "words": 394}, {"n": 2, "title": "Energy technologies and path dependence", "slides": [8, 9, 10, 11], "readings": "Steen et al. 2024, p. 2", "paragraphs": ["Slide 8 presents a historical timeline of energy technologies, contributed by Geoffrey Gilpin from Western Norway University of Applied Sciences in Sogndal. The timeline reveals a surprising pattern. Many technologies that we view as modern alternatives were invented over a century ago:", "Commercial natural gas began in the United Kingdom around 1785. The battery was invented in Italy in 1800. Ethanol was used in early internal combustion engines in the 1820s. The fuel cell was developed in the United Kingdom in 1838. James Young refined oil in the United Kingdom in 1847. France saw a commercial tidal power plant in 1866. The United States opened a commercial hydroelectric station in 1882.", "Wind and solar power also have deep roots. James Blyth built the first electricity-generating wind turbine in the United Kingdom in 1887. The first patented photovoltaic solar cell appeared in the United States in 1888, followed by commercial solar collectors in the late 1800s and space applications in the 1950s. Italy developed the first geothermal plant in 1904, turning commercial in 1911. The United States opened the first nuclear power station in 1951.", "Why did fossil fuels dominate when alternatives existed so early? Slide 9 illustrates the answer using a diagram of personal transportation, alongside pictures of an early vintage car and a modern electric car, such as a Tesla. The physical vehicle forms only one part of the configuration. That vehicle relies on oil refineries, petrol stations, road networks, traffic laws, car taxes, repair shops, and cultural ideas of freedom. Replacing petrol cars with electric vehicles requires changing all these interconnected parts, not just swapping an engine.", "Slide 10 addresses path dependence. Steen and colleagues state on page 2 that sustainability transitions are typically hindered by path dependencies and various technological, economic, political, and institutional barriers. The slide also quotes Hanson and colleagues from 2011. Ensuring technology is actually adopted and used is at least as great a challenge as developing new energy sources.", "Slide 11 shows the Clean Energy Technology Guide poster from the International Energy Agency alongside an offshore oil platform. The poster maps hundreds of supply, demand, and storage technologies, illustrating the sheer complexity of transforming established energy systems."], "checks": [{"q": "What does the historical timeline on slide 8 show about clean energy technologies?", "a": "Many clean energy technologies, including wind turbines, solar cells, fuel cells, and electric batteries, were first invented in the 19th century, yet remained marginal for decades."}, {"q": "What is a sociotechnical configuration according to slide 9?", "a": "A broader system where a physical machine is embedded in fuel infrastructure, road networks, regulations, repair services, user habits, and cultural meanings."}], "audio": "audio/T6-02.mp3", "seconds": 181.9, "words": 371}, {"n": 3, "title": "What is a technological innovation system?", "slides": [12, 13, 14, 15, 16], "readings": "Hekkert et al. 2007, pp. 413, 415, 421, 422, 423, 424, 425", "paragraphs": ["Slide 12 defines a technological innovation system. Quoting Carlsson and Stankiewicz from 1991, as cited on slide 12, a TIS is a network of actors interacting in a specific technological field under a particular institutional infrastructure to generate, diffuse, and utilize a technology.", "The structure of a TIS consists of three main elements:", "First, actors: commercial firms, public authorities, universities, research institutes, banks, and non-governmental organisations, as van Alphen and colleagues explain on slide 12.", "Second, networks: the links between actors, and between actors and institutions.", "Third, institutions: formal laws, regulations, and policy targets, as well as informal norms and cultural habits.", "Slide 13 emphasizes the core lesson: a technology cannot be understood in isolation from the social system in which it operates.", "Slide 14 explains the sociotechnical view of technology development. Quoting Hanson and colleagues from 2011, as cited on slide 14, developing technology is a process that brings together firms, knowledge bodies, financial organisations, and public agencies. Technical performance alone does not determine success. A TIS serves as an analytical tool to identify system weaknesses, such as lack of research funding, poor market incentives, or negative public perceptions.", "To evaluate these dynamics, the lecture introduces the functional approach. On slide 15, seven system functions surround an electric vehicle icon:", "First is entrepreneurial activities, covering commercial experiments that test new concepts and reduce uncertainty (Hekkert et al. 2007, page 421).", "Second is knowledge development, which includes research, patents, and practical learning (page 422).", "Third is knowledge diffusion through networks, sharing knowledge through partnerships, conferences, and collaborative projects (page 423).", "Fourth is guidance of the search, setting clear roadmaps, visions, and regulatory expectations that direct attention toward the technology (page 423).", "Fifth is market formation, creating protected market niches through tax exemptions, public procurement, or subsidies (page 424).", "Sixth is resource mobilisation, providing financial investments and skilled labour (page 425).", "Seventh is creation of legitimacy, overcoming political and social resistance to establish social acceptance (page 425).", "Slide 16 shows the energy technology guide poster again."], "checks": [{"q": "Name the three structural elements of a technological innovation system on slide 12.", "a": "Actors (firms, universities, public agencies), networks (links between actors), and institutions (laws, regulations, norms)."}, {"q": "What are the seven TIS functions formulated by Hekkert and colleagues (2007)?", "a": "Entrepreneurial activities, knowledge development, knowledge diffusion through networks, guidance of the search, market formation, resource mobilisation, and creation of legitimacy."}], "audio": "audio/T6-03.mp3", "seconds": 192.5, "words": 343}, {"n": 4, "title": "Carbon capture and storage: the Norwegian case", "slides": [17, 18, 19, 20, 21], "readings": "Steen et al. 2024, pp. 1, 2, 7", "paragraphs": ["Slide 17 marks the start of part two, examining carbon capture and storage, commonly known as CCS.", "Slide 18 explains why CCS matters. CCS captures carbon dioxide from industrial exhaust and stores it underground, preventing emissions from reaching the atmosphere. Global studies suggest CCS is focal for meeting Paris Agreement goals, accounting for roughly 14 percent of needed cumulative emission reductions and requiring about 2500 large facilities worldwide. In 2018, only about 40 million tons of carbon dioxide were stored annually worldwide.", "Norway became a pioneer in CCS. In 1991, Norway introduced an offshore carbon dioxide tax, motivating oil companies to reinject carbon offshore. This led to storage at the Sleipner gas field in 1996 and at Snøhvit in 2008. In 2005, the Norwegian Prime Minister announced plans for full-scale capture at Mongstad, famously labelling the project Norway's moon landing.", "A technology test centre opened at Mongstad costing approximately 7.6 billion Norwegian kroner. Research was supported through FME programs, spending around 200 million kroner annually, while state enterprise Gassnova pursued a breakthrough policy strategy. In 2013, the planned full-scale capture facility at Mongstad was abandoned, ending the original moon landing project, although the test facility is still in operation. In 2024, Norway launched Longship, a demonstration chain capturing carbon at domestic cement and waste plants and transporting it to seabed storage via the Northern Lights project.", "Slide 19 examines the structural components:", "Actors include technology users, equipment suppliers, universities like NTNU, research bodies like SINTEF, energy firms such as Equinor and Aker, government agencies, and environmental groups.", "Networks are regional, national and international. Many are linked to research and to industry clusters, and the Northern Lights project is important.", "Institutions feature broad political support and little resistance to CCS in Norway, with more resistance in some other countries. Norwegian regulations allow carbon dioxide storage, but receiving carbon dioxide from other countries is not yet possible.", "Slides 20 and 21 analyze the initial system functions from Steen and colleagues in 2024:", "For knowledge development and diffusion on slide 20, Norway maintains strong research activity, but diffusion is limited because capture setups are often customized and patent-protected. Knowledge has broadened from petroleum into gas power, and recently into heavy process industries.", "For entrepreneurial experimentation on slide 21, testing has expanded at Technology Centre Mongstad. On page 7, Steen and colleagues identify an important policy dilemma: balancing the high costs of supporting testing and demonstration while simultaneously ensuring variety in capture technologies.", "For market formation on slide 21, commercial markets for industrial carbon storage remain immature because capture is expensive and carbon prices remain insufficient without state subsidies (page 7)."], "checks": [{"q": "Why did Norway introduce carbon storage at the Sleipner field in 1996?", "a": "Norway introduced an offshore carbon dioxide tax in 1991, giving operators an economic incentive to capture and reinject carbon dioxide into seabed formations (slide 18)."}, {"q": "What policy dilemma regarding technology testing do Steen and colleagues (2024) identify on page 7?", "a": "The challenge of balancing the high public cost of testing and demonstration with the need to maintain variety across different capture technologies."}], "audio": "audio/T6-04.mp3", "seconds": 225.5, "words": 446}, {"n": 5, "title": "Assessing the CCS system: strengths and systemic weaknesses", "slides": [22, 23, 24, 25, 26, 27, 28], "readings": "Steen et al. 2024, pp. 7, 8, 9; Hekkert et al. 2007, pp. 413, 415", "paragraphs": ["Slide 22 examines two further functions: direction of the search and resource provision.", "Direction of the search has shifted from power plants toward hard-to-abate process industries, such as cement manufacturing and waste incineration, where chemical processes generate unavoidable emissions.", "Resource provision presents mixed results. Research grants are accessible, but private commercial capital is difficult to attract without viable business models. Implementing CCS at scale is capital-intensive; the Longship project alone represents about 25 billion kroner. Qualified human talent is also a potential bottleneck.", "Slide 23 addresses legitimation. Acceptance of CCS has varied over time and between places. Norway shows relatively high acceptance, even after the long and bumpy national history of CCS, while CCS is more disputed in some other countries. Leading environmental organisations in Norway have supported CCS. On page 9 of Steen and colleagues, informants emphasize that reaching climate targets requires a broad toolbox, making CCS indispensable for heavy industry. However, informants also highlight the need for stronger political will to shape viable commercial markets.", "Slide 24 covers positive externalities and materialization. Experienced engineering firms are present across the value chain, though customized project designs limit cross-project learning. Materialization was long restricted to petroleum operations. Longship creates the first shared transport and subsea storage infrastructure, but further pipeline networks will require substantial capital and social approval.", "Slide 25 displays Table 3 from Steen and colleagues in 2024, on page 9. The table rates three functions as weak: market formation, resource provision, and materialization. The remaining five functions are rated as intermediate.", "Slide 26 presents the central finding from Steen and colleagues on page 9. Overall developments for Norwegian CCS have been positive since 2020. However, the system still suffers from weaknesses in market formation, securing resources, and materialization, reflecting the immaturity of the technology.", "Slide 27 shows an article by Njøs, Sjøtun, Jakobsen, and Fløysand from 2020 in Economic Geography, studying path creation by connecting technological innovation systems with regional geography in Western Norway.", "Slide 28 concludes part two. A TIS framework provides a sociotechnical lens to evaluate drivers and barriers, pinpoint specific bottlenecks, guide targeted policy, and compare clean technologies."], "checks": [{"q": "Which three functions in the Norwegian CCS system are rated as weak in Table 3 of Steen and colleagues (2024)?", "a": "Market formation, resource mobilisation, and materialisation (slide 25, page 9)."}, {"q": "Why has the direction of search for CCS shifted toward cement and waste incineration?", "a": "Because those heavy process industries generate chemical process emissions that cannot be eliminated solely through renewable electricity (slide 22; Steen et al. 2024, p. 9)."}], "audio": "audio/T6-05.mp3", "seconds": 192.7, "words": 363}, {"n": 6, "title": "Digital identity wallets: common solutions in the public sector", "slides": [29, 30, 31, 32, 33, 34, 35, 36], "readings": "none new", "paragraphs": ["Slide 29 opens part three of the lecture, turning from energy technology to a public administration case: the digital identity wallet.", "Slide 30 introduces Digdir, the national agency for public digitalisation. The slide gives Digdir four aims: promoting coordination for an efficient public sector; leading innovative use of data and artificial intelligence; ensuring secure access to digital services; and solving complex societal challenges together.", "Slide 31 shows Digdir's organisation across Norway. The agency employs 459 people as of August 2025 across three offices: 95 in Brønnøysund, 159 in Leikanger, and 205 in Oslo.", "Slide 32 explains common solutions in public administration. In public administration, common needs are solved through shared digital platforms. These components are developed once, managed centrally, and reused across municipalities and government agencies, simplifying citizen access to services.", "Slide 33 provides a link to the digital wallet project on the public collaboration portal.", "Slide 34 sets out the goal: offering a digital identity wallet to all citizens by 2030. Digdir's vision involves four objectives: securing societal value; anchoring legal and technical choices in European Union standards; safeguarding Norwegian interests in technical standards and rules; and actively involving public bodies and market actors.", "Slide 35 outlines the digital wallet for citizens. Its common requirements are:", "First, a harmonised solution and a harmonised business model in all countries.", "Second, one digital wallet app on the phone, holding attested proofs. The slide's picture shows a national eID, a driving licence, a diploma, insurance, travel and payment.", "Third, compulsory acceptance in most sectors, including banking. Big platforms such as Amazon, Google and Facebook must accept the wallet too.", "Fourth, user control, which the picture shows as selective disclosure: the user shares only the proofs a service provider needs. Here is an example of our own, not from the lecture: a person could prove that they are old enough to buy something without showing their name or address.", "Slide 36 turns to digital wallets for businesses, which Digdir and the Brønnøysund registers work on together. The aims are simpler and more efficient processes for business, secure and controlled data sharing, more competitiveness and innovation, and trust and security in digital processes."], "checks": [{"q": "What is the primary purpose of public common solutions on slide 32?", "a": "To solve shared administrative needs once, manage them centrally, and reuse them across public agencies to simplify citizen access."}, {"q": "What does selective disclosure allow a citizen to do with a digital wallet on slide 35?", "a": "It allows citizens to prove specific attributes, such as legal age, without sharing unnecessary personal details like their full name, address, or national identity number."}], "audio": "audio/T6-06.mp3", "seconds": 182.6, "words": 370}, {"n": 7, "title": "Governing technological transitions and exam tips", "slides": [37, 38, 39, 40, 41, 42, 43], "readings": "Hekkert et al. 2007, pp. 413, 415; Steen et al. 2024, pp. 1, 2", "paragraphs": ["Slide 37 illustrates the European Digital Identity reference framework, abbreviated as the ARF. The diagram maps structural roles within the wallet system: users, wallet applications, qualified attribute providers, authentic data sources, relying parties, and supervisory bodies.", "Slide 38 shows how Digdir organises its work on the European eIDAS regulation, under the normal management dialogue with its ministry. A project owner and a project office lead three subprojects. The first assesses selected measures in the action plan for the national eID strategy. The second works in the European eIDAS groups and brings the regulation into Norwegian law. The third
