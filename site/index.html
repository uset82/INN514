adaptation, low power and novel application."], "labels": ["Page 485", "Page 486", "Page 487"], "checks": [{"q": "What three forms of power do Sotarauta and Mustikkamäki distinguish?", "a": "Interpretative power, the ability to create a new vocabulary and lead sense making; network power, the ability to remove obstacles to communication and collaboration; and institutional power, the power to act, decide, create formal institutions and direct resources."}, {"q": "Which mode of change does Table 1 link to a low degree of power?", "a": "Novel application: using existing elements in new and possibly unforeseen ways."}], "audio": "audio/P16-03.mp3", "seconds": 150.0, "words": 303}, {"n": 4, "title": "Scania's games industry, and what held it back", "slides": [], "readings": "", "pages": "488–490", "paragraphs": ["Scania, the authors explain, is the southernmost county of Sweden, with an organizationally thick and diversified regional innovation system, strong universities and more than 100 intermediary organizations. Policy actors have accepted a need to consolidate this system, and are reluctant to expand public support into new areas. The study uses document studies and 13 in-depth interviews of 60 to 90 minutes, held between October and December 2015: seven with founders and chief executives, two with the public sector, one with education and three with industry experts. The industry has about 40 firms and 600 to 700 employees, clustered in Malmö.", "Many of Scania's leading games firms began in neighbouring Blekinge in the late 1990s, helped by an incubator branch for games and by local education. In the early 2000s several moved to Malmö to find senior developers and to attract talent from abroad. The authors then name three constraints. Higher education was too academic and badly matched to the industry's needs. Customized public initiatives for networking, projects and start-up services were lacking; the MINC incubator had not reached game developers. And there was a lack of both private and public support for start-ups, with private venture capital scarce.", "Some interviewees said business support bodies did not understand the industry: ALMI found it hard to judge firms, because games are made as single projects and young developers lack a record. Policy actors, reluctant to add support bodies in a region that had many, pointed firms to structures built for the new media industry; interviewees rejected this, citing cultural differences. Nor was the industry seen as serious business. The authors then introduce three new elements: the Nordic Game Conference, the Game Assembly and Game City. Several key actors were outsiders or returnees who brought competences from elsewhere."], "labels": ["Page 488", "Page 489", "Page 490"], "checks": [{"q": "How many interviews did the study rest on, and with whom?", "a": "Thirteen in-depth interviews: seven with founders and chief executives of firms, two with the public sector, one with the education system and three with industry experts."}, {"q": "What three constraints did the authors identify in Scania's support structure?", "a": "Higher education badly matched to the industry's needs; a lack of customized public initiatives for networking, projects and start-up services; and a lack of both private and public support for start-ups."}], "audio": "audio/P16-04.mp3", "seconds": 142.9, "words": 311}, {"n": 5, "title": "Three new elements: the conference, the school and the cluster", "slides": [], "readings": "", "pages": "491–493", "paragraphs": ["The Nordic Game Conference is an annual conference in Malmö and among the largest in Europe. It gives firms networking opportunities and markets Scania as a game development region, helping recruitment and funding. Its creation was layering, preceded by an adaptation at a higher scale: it began as a way of spreading results from the Nordic Game Programme. A private entrepreneur in Malmö administered that programme, with high interpretative power at the Nordic level but little institutional power in the region. Later funding from the City of Malmö and Region Skåne therefore came through a novel application of existing structures.", "Funding for the conference did not lead to new regional structures. The Game Assembly, founded in 2008, is an advanced vocational training school that supplies junior talent. More than 70 employees of Massive Entertainment have trained there. Its creation was layering at the regional level, helped by adaptation and novel application elsewhere. Representatives of Massive approached a firm that runs vocational schools across Sweden. Study plans were written with one of Massive's lead programmers, and the national agency for higher vocational education approved them. A private entrepreneur with knowledge from Blekinge and high interpretative and network power made the approach.", "Game City began as an attempt to adapt Media Evolution, which refused customized activities for games. One of the founders of Massive Entertainment, a board member of Media Evolution, then formed Game City with other key actors as an independent cluster organization, a case of layering. Region Skåne was reluctant to fund another cluster body, so in spring 2015 Game City applied with Media Evolution to a programme on youth unemployment and won funding, a novel application. Key individuals also worked on public opinion. All three cases, the authors say, show a few key actors using a mix of modes."], "labels": ["Page 491", "Page 492", "Page 493"], "checks": [{"q": "Which mode of change created the Nordic Game Conference, and what came before it?", "a": "Layering, preceded by an adaptation of the Nordic Game Programme at a higher spatial scale, after which the conference was funded through a novel application of existing regional structures."}, {"q": "How did Game City win funding when Region Skåne was reluctant to fund another cluster organization?", "a": "It applied together with Media Evolution to a programme on youth unemployment and was granted public funding, a novel application of existing structures."}], "audio": "audio/P16-05.mp3", "seconds": 140.6, "words": 318}, {"n": 6, "title": "Conclusions and the reference list", "slides": [], "readings": "", "pages": "494–497", "paragraphs": ["The authors say the paper moves past a simple enabling or constraining label. They offer the three modes, borrowed from work on institutional change. Power shapes which one is used: high power allows layering, and actors without it can only adapt existing elements or use them in new ways. In Scania the constraints reflect path dependencies in higher education and policy, and little knowledge of the new industry. The authors add that their key actors were by no means heroic individuals. The changes relied on bringing other actors in, and change is often a collective endeavour.", "The authors extend the argument in several ways. Change is multi-dimensional, and in Scania the key actors came mainly from the private sector. Actors lacking regional power turned to other scales. There is no inherent hierarchy between the modes, since a novel application could be as beneficial as layering. Three questions are left for future research: how actors navigate scales, how the modes interrelate with knowledge and power, and how other parts of the regional environment change. The findings rest on one case and are not claimed to be generalizable.", "These pages are the reference list."], "labels": ["Page 494", "Page 495", "Pages 496-497"], "checks": [{"q": "What limit do the authors state about their findings?", "a": "That the findings are based on one case, so the authors do not claim that they are generalizable to other growth paths and regions."}], "audio": "audio/P16-06.mp3", "seconds": 94.6, "words": 205}], "seconds": 1004.5}, "P17": {"id": "P17", "kind": "reading", "title": "Reading 17: Expanding analyses of path creation: interconnections between territory and technology", "session": "Njøs et al. 2020", "lecturer": "Njøs et al.", "deck": "Economic Geography 96(3)", "authors": "Njøs et al.", "year": 2020, "source": "Economic Geography 96(3)", "lectures": ["T8"], "chapters": [{"n": 1, "title": "The paper in brief", "slides": [], "readings": "", "pages": "the whole paper", "paragraphs": ["Njøs, Sjøtun, Jakobsen and Fløysand ask how evolutionary economic geography explains the emergence of new industries, and how the technological innovation system literature can inform its analyses of path creation (page 267). Their starting point is that evolutionary economic geography explains regional development through territorial capabilities, such as knowledge sharing, support structures and industrial policy. They argue it says little about technology itself. Territorial dynamics or technological characteristics alone do not explain path creation. What matters is how the two connect, and how that connection plays out in time and space (page 266).", "The paper defines path creation as the emergence of new development trajectories in a region. It follows MacKinnon and colleagues, who tie this to new industrial sectors, products, techniques or forms of organisation (page 268). It adopts Martin's three phases: preformation, path creation and path development. It then reviews four topics in the EEG literature: regional capabilities, multiscalar dynamics, actors and agency, and policy (page 268). From the technological innovation system literature it takes the seven functions. It uses three of them, guidance of the search, market formation and legitimation, because EEG already covers the other four (page 271). Together these give seven analytical dimensions (Table 1, page 272).", "The design is a comparative case study of two green technologies linked to southwestern Norway: carbon capture and storage, and maritime battery technology (page 274). The CCS case rests on fourteen interviews in 2018–19 and the battery case on twenty-three interviews from 2012–18, with fifteen further interviews with regional stakeholders, plus documents, media and conferences. The region is defined as Hordaland and Rogaland (page 274). The two technologies sit in the same region but in different phases of development (page 273), so an EEG reading would expect them to be similarly influenced (page 274).", "The battery case ends in green path creation (page 282). Regional firms had world-leading competence in power electronics and battery integration, and global battery development in the car industry supplied the technology. Regional actors lobbied, the cluster NCE Maritime CleanTech set a direction, and public procurement created a market. About seventy ferry lines were expected to use battery or hybrid technology by 2022. The CCS case remains in preformation (page 281). The region has petroleum and subsea expertise and hosts Technology Centre Mongstad. But there are few dedicated CCS firms, development runs top-down from national policy, there is no market, and commercial actors have few incentives. The authors stress that new infrastructure alone may not be enough, as the moon landing project and the test centre suggest (page 279).", "The contribution is a framework that gives technology explanatory weight in path creation, and an argument that the regional level can matter less than EEG expects, as the CCS case shows (page 283). They name three directions for further work: the interplay between the seven dimensions, which dimensions matter when and where, and whether green path creation differs from the emergence of traditional industries (page 284). They also note that narratives, which they observe in the battery case, have been studied by neither literature (page 283).", "The paper is the reading for Lecture 9, the course's summary and exam-preparation session, which takes from page 266 the point that neither territory nor technology alone explains path creation, and from page 268 the definition of path creation. For the June 2025 exam, Question 2 asked in what way a regional innovation system can promote or inhibit industrial restructuring. In our own reading, the two cases fit that question: batteries were promoted by procurement, a cluster and regional agency, while CCS was held back by cost, missing markets and a top-down process. Here is an example of our own, not from the paper: a region can have the skills for a new industry and still wait years for a market that only public buying can create."], "labels": [null, null, null, null, null, null], "checks": [{"q": "What do the authors say explains path creation?", "a": "Not territorial dynamics or technological characteristics alone, but the interconnections between them, and how those play out in time and space."}, {"q": "Which three TIS functions do the authors add to the EEG dimensions?", "a": "Guidance of the search, market formation and legitimation."}], "audio": "audio/P17-01.mp3", "seconds": 309.7, "words": 644}, {"n": 2, "title": "The argument, the EEG gap and the definition of path creation", "slides": [], "readings": "", "pages": "cover, 266–268", "paragraphs": ["The publisher's sheet gives the citation: Economic Geography 96(3), 266–288, published online 3 July 2020.", "The title page gives the four authors, all at the Mohn Centre for Innovation and Regional Development at Western Norway University of Applied Sciences in Bergen, the keywords, and the abstract. The abstract states the gap: evolutionary economic geography has paid little attention to technological characteristics when explaining new industries. Building on technological innovation systems, the article develops a framework for interconnections between territorial dynamics and technological characteristics. It applies the framework to two green technologies in southwestern Norway, carbon capture and storage and maritime battery technology. Its claim is that neither alone explains path creation.", "The introduction sets out the departure point. Evolutionary economic geography explains regional development through territorial capabilities, such as knowledge sharing, support structures and industrial policy. The authors argue that it lacks clarity about technology and its link to industry development, and that it has paid far less attention to green industrial development, quoting Grillitsch and Hansen on EEG being in principle agnostic about the greenness of industries. Two research questions follow: how EEG explains new industries, and how the TIS literature can inform EEG-inspired analyses of path creation.", "The introduction ends with the plan: build a framework, apply it to CCS and maritime battery technology in southwestern Norway, then conclude. The theoretical background adopts MacKinnon and colleagues' definition of path creation as the emergence of new development trajectories based on new sectors, products, techniques or forms of organisation. The authors note that this is less radical than definitions that stress novelty to the world. They then use Martin's three phases, preformation, path creation and path development, and identify four EEG topics: regional capabilities, multiscalar dynamics, agency, and policy."], "labels": ["Cover", "Page 266", "Page 267", "Page 268"], "checks": [{"q": "What gap in evolutionary economic geography does the paper identify?", "a": "That it has paid little attention to technological characteristics when explaining new industries, and little attention to green industrial development."}, {"q": "How do the authors define path creation, and whose definition do they use?", "a": "Following MacKinnon and colleagues: the emergence of new development trajectories in a region based on new industrial sectors, products, techniques or forms of organisation."}], "audio": "audio/P17-02.mp3", "seconds": 158.9, "words": 309}, {"n": 3, "title": "Regional capabilities, agency and policy, and what TIS adds", "slides": [], "readings": "", "pages": "269–272", "paragraphs": ["The page reviews the first two topics and opens the third. On regional capabilities, it reports Corradini's study of green technology entry across 900 NUTS3 regions in fifteen European countries, which finds green path creation more likely where regional capabilities fit. The authors add that relatedness struggles to explain how novelty arrives. On multiscalar dynamics, they cite Essletzbichler on UK renewable energy, who argues the industry cannot be understood without the national scale. On agency, they note that firm and nonfirm actors both matter.", "The page finishes the review with policy. It uses Garud and Karnøe's distinction between bricolage, which builds competence across many actors through incremental steps, and breakthrough, which concentrates resources on few large players. The authors then set out two criticisms of EEG: its policy advice encourages innovation in general rather than green innovation, and technology is treated as an output, read off regional capabilities, rather than as part of the system. They close by introducing the TIS approach.", "The page defines TIS, quoting Markard and Truffer, and lists the seven functions from Hekkert and colleagues: entrepreneurship, knowledge development, knowledge diffusion, guidance of the search, market formation, resource mobilization, and legitimacy. It argues that TIS takes technological characteristics and materiality seriously, and that its focus on green technologies brings explicit policy advice. The authors then say which functions EEG already covers, entrepreneurship, knowledge development, knowledge diffusion and resources, and which three it lacks: guidance of the search, market formation and legitimation.", "The page works through the three functions TIS adds. Guidance of the search is about activities that make wants visible to technology users, and about how one technology attracts investment over others. On market formation, the authors quote Martin and colleagues: EEG has left demand largely unconsidered. New technologies struggle against embedded ones, so early markets need nursing through protected space or tax regimes. Legitimation is about overcoming resistance from existing industries, through advocacy coalitions, and about acceptance varying between places. Table 1 combines the four EEG dimensions with the three TIS ones."], "labels": ["Page 269", "Page 270", "Page 271", "Page 272"], "checks": [{"q": "Which three TIS functions do the authors say EEG lacks?", "a": "Guidance of the search, market formation and legitimation."}, {"q": "What distinguishes bricolage from breakthrough as a policy approach?", "a": "Bricolage builds competence across many actors in incremental steps, while breakthrough concentrates resources on few large players."}], "audio": "audio/P17-03.mp3", "seconds": 178.0, "words": 356}, {"n": 4, "title": "The method, the region and the two technologies", "slides": [], "readings": "", "pages": "273–276", "paragraphs": ["The page explains that the seven dimensions are dynamically interconnected. One can influence others, some pairs may matter more, and some may block a new industry. Following Martin, the authors argue that different dimensions matter in different phases and places, and they quote Binz and Truffer on territories and technologies coming together differently in different contexts. They also cite Steen and Hansen on offshore wind in Norway, where territorial dynamics became a barrier. The methodology section then begins, choosing two technologies in different phases.", "The method follows George and Bennett on case studies as a detailed examination of a historical episode. Because EEG stresses regional dynamics, the authors note, two technologies in the same region should be similarly influenced. The CCS case rests on fourteen interviews in 2018–19, mostly with informants outside the region. The battery case rests on twenty-three interviews from 2012–18, mainly in the region, plus conference and workshop data. Fifteen regional stakeholders were also interviewed. The region is Hordaland, with 505,000 inhabitants, and Rogaland, with 473,000.", "The page defines CCS and gives the case for it. The European Commission, the IEA and the IPCC see CCS as central to the Paris Agreement. The IEA is cited for the claim that CCS must deliver around 14 percent of the emission cuts, which means more than 2,500 large facilities by 2040. As of 2018, eighteen facilities operate, five are under construction and twenty are in development; together they will capture and store about forty million tons a year. Figure 1 maps Norway, with the studied region in grey.", "The page defines maritime battery technology and its drivers: battery development in the car industry, a 50 percent rise in electric vehicle sales from 2016 to 2017, and cell producers in Asia whose scale cut lithium-ion prices. Around three hundred battery ships now sail or are being built, up from almost none in 2009–10. The CCS case opens: the region has petroleum and subsea expertise and hosts Technology Centre Mongstad, which cost the state about 7.4 billion kroner. Yet TCM has sparked surprisingly little commercial activity, which the authors explain by national-level processes and technological characteristics."], "labels": ["Page 273", "Page 274", "Page 275", "Page 276"], "checks": [{"q": "How many interviews support each case?", "a": "Fourteen for CCS in 2018–19 and twenty-three for maritime battery technology in 2012–18, plus fifteen with regional stakeholders."}, {"q": "What does Figure 1 show?", "a": "A map of Norway with the studied region in grey, marking Bergen and Stavanger in the southwest and Oslo as the capital."}], "audio": "audio/P17-04.mp3", "seconds": 182.4, "words": 373}, {"n": 5, "title": "The CCS case and the battery case", "slides": [], "readings": "", "pages": "277–280", "paragraphs": ["Sleipner and Snøhvit inject about 1.7 million tons a year. In 2007 Prime Minister Stoltenberg called CCS Norway's moon landing, but full-scale plans at Mongstad were abandoned in 2013, and the Paris Agreement later renewed interest. The authors find few dedicated CCS companies or path advocates in the region: CCS is a matter of supraregional circumstances. Gassnova, the Research Council and the FME centres have funded research for years, so the national strategy resembles a breakthrough strategy. TCM and the oil companies give the search clear guidance, but the search for cost-efficient CCS lacks momentum.", "The planned full-scale project would capture CO2 at two industrial sites in eastern Norway, store it near a gas processing facility in the southwest, and inject it under the North Sea. It would capture about 800,000 tons a year, at an estimated 7–12.6 billion kroner, with a funding decision expected in 2020–21. Informants see strong legitimation for CCS in Norway and few critics of the technology itself, but the public is sceptical about cost, and companies are waiting for the decision. There is no market, and commercial actors have few incentives.", "The page closes the CCS case: as the moon landing project and TCM show, new infrastructure alone may not be enough for green path creation. Favourable territorial dynamics are not sufficient, and the technology's characteristics are important for explaining the situation. The battery case then opens. Strong regional capabilities, with world-leading competence in power electronics and battery integration, have led to green path creation. Battery development came from the global car industry, but bottom-up action by regional actors anchored it in the region, where Corvus has opened its main battery factory.", "The page shows how the battery path was built. The cluster NCE Maritime CleanTech was set up in 2011 and, informants say, linked global technology to regional capabilities through demonstration projects and lobbying, including for green public procurement. Enova funded projects, the NOx Fund gave firms an alternative to emission taxes, and road authorities demanded low- or zero-emission ferries. The authors call this mix a bricolage approach. Guidance came from procurement rules and IMO regulations, and Equinor's charter demanded batteries."], "labels": ["Page 277", "Page 278", "Page 279", "Page 280"], "checks": [{"q": "Why do the authors say CCS has not become a path in the region?", "a": "Because the technology is expensive, there are few dedicated actors and few incentives, there is no market, and development depends on national and supraregional processes."}, {"q": "How did public procurement help create the battery market?", "a": "Low- or zero-emission requirements in ferry tenders shifted ferries from diesel to batteries, creating a market that many newcomers entered."}], "audio": "audio/P17-05.mp3", "seconds": 180.0, "words": 374}, {"n": 6, "title": "The comparison, the discussion and the reference list", "slides": [], "readings": "", "pages": "281–288", "paragraphs": ["Table 2 sets the two cases side by side across the seven dimensions. Battery technology is strong on regional capabilities, driven by global technological development and national policy, with a proactive regional response, a bricolage policy mix, guidance from mature technology and regulations, confidence in the solution, and new markets, ending in green path creation. CCS has strong petroleum and subsea competence, top-down processes, a reactive region with few dedicated actors, a breakthrough strategy, actors awaiting a decision, few opponents but cost resistance, and no market: preformation.", "The page finishes the battery case. Public procurement shifted ferries from diesel to batteries and created a market many newcomers entered; by 2022 about seventy ferry lines are expected to use battery or hybrid technology, mostly in western Norway. The market is spreading to offshore supply and short sea shipping, and Corvus won a contract for battery packs on four cruise ships in the fjords. The authors conclude that battery technology is green path creation, explained by interconnections between territory and technology. The discussion then begins.", "For CCS, the discussion finds technology arriving top-down with weak commercial demand. Policy must support infrastructure and a market, and relying on top-down initiatives is unlikely to be enough. For batteries, strong regional competence and a risk-taking culture met global battery development, with regional actors lobbying on procurement and the cluster setting direction. Narratives also seem to support the battery path, a topic neither literature has studied. The authors conclude that the regional level can be less influential than EEG leads us to expect: for CCS, technology-specific explanations appear crucially important.", "The page ends the discussion with future research: the interplay between the seven dimensions, which dimensions matter when and where, and whether green path creation differs from the emergence of traditional industries. The authors say such work should refine EEG's apparatus rather than add empirical accounts, and they describe the article itself as an early attempt at that. The reference list then begins at the foot of the page.", "These pages are the reference list."], "labels": ["Page 281", "Page 282", "Page 283", "Page 284", "Pages 285-288"], "checks": [{"q": "What outcome does Table 2 give each case?", "a": "Green path creation for maritime battery technology and preformation for CCS."}, {"q": "What future research do the authors call for?", "a": "Work on the interplay between the seven dimensions, on which dimensions matter when and where, and on whether green path creation differs from the emergence of traditional industries."}], "audio": "audio/P17-06.mp3", "seconds": 172.3, "words": 359}], "seconds": 1181.3}, "T1": {"id": "T1", "title": "Lecture 1: Innovation as systemic and sustainable transformation", "session": "Kursplan 2026, session 1 (21 September)", "lecturer": "Arnt Fløysand", "deck": "Forlesning 1 Fløysand.pdf (H2025, 41 slides)", "chapters": [{"n": 1, "title": "What this lecture is about", "slides": [1, 2, 12], "readings": "Fagerberg, Mowery & Verspagen 2009; Fløysand, Jakobsen & Hidle 2013", "paragraphs": ["This first lecture of the course asks a big question. Where does innovation really come from, and can it help us build a more sustainable society? Arnt Fløysand, who leads the course, answers in four steps.", "First, Fløysand shows why innovation is best understood as something that happens in a system, not inside a single firm. Second, the lecture uses the history of Norway to show what such a system looks like in real life. Third, it offers a simple model of innovation as a set of relations between teams, tools and tasks. Fourth, it asks whether innovation systems can be steered towards sustainable transformation, and who gets to choose the direction.", "Two readings belong to this lecture. The first is the article by Fagerberg, Mowery and Verspagen, from 2009, on how Norway's national innovation system developed. The second is a conference paper by Fløysand, Jakobsen and Hidle, from 2013, on what they call the trinity of innovation. The lecture also draws on other work, especially the article by Schlaile and colleagues on the moral side of innovation systems.", "Keep one word in mind as you listen: relations. The whole lecture is about how people, rules and things connect, and what those connections make possible."], "checks": [{"q": "Name the four parts of this lecture.", "a": "Innovation as systemic; Norway's national innovation system (Fagerberg and colleagues); innovation as relations between teams, tools and tasks; and innovation systems steered towards sustainable transformation."}], "audio": "audio/T1-01.mp3", "seconds": 90.8, "words": 212}, {"n": 2, "title": "Innovation happens in systems", "slides": [13, 14, 15, 16], "readings": "Markard & Truffer 2008 and Binz et al. 2017, as quoted on slides 15 and 16", "paragraphs": ["Start with a common picture of innovation: a clever engineer in a company lab invents a new product. The lecture says this picture is too narrow. Firms matter a great deal, but many other actors take part too. They include knowledge producers such as universities, political authorities, consumers and voluntary organisations. Innovation comes out of their interaction. In the lecture's words, the actors become part of something bigger: an innovation system.", "A well-known picture of this is the triple helix, which the lecture takes from a textbook by Trott. It shows three circles that touch: universities, industry and government. Universities supply educated people, new technology and new entrepreneurs. Industry brings capital, market knowledge and supply chains. Government brings research funding, grants and support programmes. Small gears are drawn between the circles, and they make the point. Each part keeps the others turning.", "The lecture then gives a more exact definition, quoted from Markard and Truffer in 2008. An innovation system is made of networks of actors and institutions that develop, spread and use innovations. Put simply, it has three building blocks. The first is organisations: the actors themselves, which the lecture also calls teams. The second is institutions. These are the rules of the game: laws, regulations, social and technical norms, habits of practice and shared beliefs about why and how to innovate. The third is networks: the links between the actors.", "Why does this matter? The lecture quotes Binz and colleagues, from 2017. Innovation grows out of complex interaction between actors with skills that complete each other, for example in technology, management, investment or regulation. When firms, universities, policy makers and go-betweens work together, they create benefits that no single actor could produce or control alone. Economists call such shared benefits positive externalities. So the lecture's conclusion is simple. An innovation is shaped by the system it belongs to.", "One more idea belongs here: path dependence. A system develops along a path. Early choices, such as which industries a country builds, make some later options easy and others hard. Keep this idea in mind, because it explains a lot about Norway.", "Here is an exam tip. The December 2024 exam asked: what do you understand by innovation system? The three building blocks, organisations, institutions and networks, give you a clear structure for that answer."], "checks": [{"q": "What are the three building blocks of an innovation system in this lecture?", "a": "Organisations (the actors, or teams), institutions (the rules of the game: laws, norms, habits and beliefs) and networks (the links between the actors)."}, {"q": "Why can no single firm produce all the benefits of an innovation system?", "a": "Because the benefits come from interaction between actors with complementary skills. These positive externalities are hard for any one actor to produce or control alone."}], "audio": "audio/T1-02.mp3", "seconds": 188.4, "words": 391}, {"n": 3, "title": "Norway's innovation puzzle", "slides": [17, 20, 21, 22], "readings": "Fagerberg, Mowery & Verspagen 2009, pp. 431, 432, 438, 442", "paragraphs": ["The second part of the lecture turns to the first reading. Fagerberg, Mowery and Verspagen study how Norway's national innovation system grew over time. On their first page, they describe Norway as a small, open economy built on natural resources. They follow how industry and policy developed together, each shaping the other.", "Their starting point is a puzzle, which others have called the Norwegian paradox. The article explains it on page 432. Norway has high growth in productivity and income, yet it spends relatively little on research and development, which is often shortened to R and D. On the usual measures of innovation, a country like that should not be doing so well.", "The lecture shows the puzzle with three slides. The first is a map of Europe from an innovation survey. The darkest regions are the innovation leaders, and none of them is in Norway. The second is a chart of spending on research and development as a share of national income in 2016. Norway spends about two percent, clearly less than Sweden, Denmark and Finland. The third slide tells a different story. Norwegian firms work a lot with universities and university colleges. About a quarter of the member firms of NHO, the main Norwegian business organisation, had worked with one in the past five years. Among firms with more than 250 employees, the share was over 60 percent.", "So how does Norway do it? As the lecture presents the article, the answer has three parts. First, national policy, both concession policy and industrial policy. In general terms, not the lecture's own words, concession policy means the rules for licences to use natural resources. Second, the resource-based industries, such as power-intensive industry, oil and gas, and fish farming, and the knowledge, skills and supplier firms that grew up around them. Third, institutions. On page 438, the authors name an important strength of the Norwegian system. It is good at spreading knowledge and at cooperation in innovation. The usual indicators, which count things like research spending, tend to miss exactly this.", "The article also shows the other side of the coin. On page 442, the authors say that Norway's system has strong path dependence. Innovation has stayed concentrated in the resource industries. New industries less tied to natural resources have done relatively poorly, despite considerable public support. Notice the authors' explanation. They do not blame resistance from powerful firms. Rather, the resource industries simply kept on innovating and growing."], "checks": [{"q": "What is the Norwegian paradox?", "a": "Norway combines high productivity and income with relatively low spending on research and development."}, {"q": "According to Fagerberg and colleagues, what is an important strength of the Norwegian innovation system?", "a": "Its strong performance in knowledge diffusion and cooperation in innovation (page 438), which standard indicators tend to miss."}], "audio": "audio/T1-03.mp3", "seconds": 190.1, "words": 414}, {"n": 4, "title": "Two ways of learning: STI and DUI", "slides": [18, 19, 23], "readings": "the lecture's framing, linked to Fagerberg, Mowery & Verspagen 2009", "paragraphs": ["To explain the puzzle, the lecture introduces two ways of innovating, each tied to a kind of knowledge. These terms come from the lecture, which connects them to Fagerberg's argument. The article itself does not use them.", "The first way is called STI, short for science, technology and innovation. Here innovation follows a straight line. Research leads to a new product or service, so research and development is critical. New technology is pushed onto the market, and the results are often radical, meaning big jumps. The knowledge behind it is analytical knowledge. It is scientific, general and written down, the kind that holds true everywhere.", "The second way is called DUI, short for doing, using and interacting. Here firms learn by working closely with customers and partners. New ideas are pulled by what the market needs, and the results are usually incremental, meaning many small improvements. The knowledge behind it is synthetic knowledge. It is practical, often tacit, built on experience and tied to a particular place and situation. Tacit means hard to write down. It lives in people's heads and hands.", "Here is an example of our own, not from the lecture. A drug company that spends years in its lab developing a new medicine works in the STI way. A shipyard that improves its hull design a little with each new vessel, after talking to the crews who sail them, works in the DUI way.", "The lecture's point is that the Norwegian model uses less STI and more DUI, with a great deal of cooperation and sharing of knowledge. The institutions of the national innovation system help to link the two ways. The lecture also makes a bigger claim. Norway went from a poor country to a rich one through policies that both built on this model and carried it forward. An equal society and cooperation based on trust were part of that model.", "So the paradox is less strange than it looks. If you only count lab spending, you miss the learning that happens on the factory floor and through the network."], "checks": [{"q": "Match each mode to its knowledge: STI and DUI.", "a": "STI goes with analytical, scientific knowledge and often radical innovation. DUI goes with synthetic, experience-based and often tacit knowledge and incremental innovation."}, {"q": "Why does the lecture say Norway can do well with little research spending?", "a": "Because much Norwegian innovation happens through DUI learning, cooperation and knowledge sharing, supported by institutions that link DUI and STI."}], "audio": "audio/T1-04.mp3", "seconds": 146.7, "words": 354}, {"n": 5, "title": "Teams, tools and tasks", "slides": [24, 25, 26, 27, 28, 29], "readings": "Fløysand, Jakobsen & Hidle 2013, PDF pp. 10-11 (paper in preparation, do not quote)", "paragraphs": ["The third part presents a model from the second reading, the conference paper by Fløysand, Jakobsen and Hidle. The paper is marked as work in progress, so here we describe it in our own words rather than quote it.", "The paper calls its idea the trinity of innovation. Innovation, it says, is a practical system of three linked parts. Teams are the actors: the people and organisations who innovate. Tools are the objects: machines and technologies, and even landscapes. Tasks are the ideas: the knowledge, values and goals that say what the tools should achieve. The paper looks at each pair. Between a company and its tools, the question is how it organises and uses its skills. Between tools and tasks, the question is production and use, and that includes side effects nobody planned, such as carbon dioxide emissions. Between the company and its tasks, the question is how it creates value.", "The lecture adds an important twist. Some relations are necessary. Every innovation needs teams, tools and tasks working together. Other relations are contingent, which means they depend on the context. In the lecture's diagram, the contingent relations come from what we can observe in practice. That practice is shaped by industrial history, cultural conditions and national or regional policy. The diagram also names the theories behind each side: critical realism for the necessary relations, and actor-network theory with an evolutionary perspective for the contingent ones.", "Why does this matter for sustainability? The lecture defines sustainable transformation as change that meets today's needs without destroying the chance for future generations to meet theirs. It then shows three pillars. Economic sustainability is an innovation's ability to stay viable over the long term. Social sustainability is its ability to support well-being, fairness and inclusion in communities. Environmental sustainability is its ability to use ecosystems without harming them beyond their capacity to recover.", "Traditionally, the lecture says, the teams in innovation were firms, shareholders, employees and suppliers. Their main task was to make a profit. But teams also include research institutions, local communities, regional and national governments, and voluntary organisations. For some of them, the most important task may be different. It could be cutting carbon emissions, or sharing resources fairly between social classes, or between city and countryside. These relations reflect different histories, values and interests. So the lecture's conclusion is that they must be taken into account if innovation systems are to move towards sustainable transformation."], "checks": [{"q": "What do teams, tools and tasks stand for?", "a": "Teams are actors, tools are objects such as technologies, and tasks are ideas: the knowledge, values and goals the tools should serve."}, {"q": "What is the difference between necessary and contingent relations?", "a": "Necessary relations are the links every innovation needs between teams, tools and tasks. Contingent relations depend on context, such as industrial history, culture and policy."}], "audio": "audio/T1-05.mp3", "seconds": 190.5, "words": 412}, {"n": 6, "title": "Giving innovation a direction", "slides": [30, 31, 32, 33], "readings": "Schlaile et al. 2017, pp. 1, 3, 6, 7; Markard et al. 2012, as quoted on slide 32", "paragraphs": ["The fourth part asks the hardest question. Can we steer innovation systems towards sustainability? The lecture builds on the article by Schlaile and colleagues. The slide dates it 2019, but the article on your reading list was published in 2017.", "The authors argue that it is not enough simply to make room for more innovation. This links back to the course INN500 and its discussions of responsible innovation. An innovation system must also be given a direction, so that it helps to solve the big problems of society. That is what they mean by the normative dimension. A normative question is about how things ought to be, not how they are. On their first page, they call for more research on three linked ideas: directionality, legitimacy and responsibility.", "On page 6, the authors tie each idea to a question. Directionality asks what we should transform or keep. In other words, what is the goal of the system? Legitimacy asks why: what makes a goal acceptable? Responsibility asks by whom and for whom. On page 7, they connect responsibility to power: who can bring about change, and who has to live with the results.", "The lecture then links back to institutions. Formal and informal rules, norms and values are the starting point for innovation practice. Could institutions push teams, tools and tasks to balance economic, social and environmental goals? The slide simply asks: is that unproblematic?", "Two more ideas make the challenge clearer. First, on page 3, Schlaile and colleagues say that transformation also means changing the practices, routines and habits of both producers and consumers. It also needs kinds of innovation that go beyond technology. Second, the lecture quotes Markard and colleagues, from 2012. They describe a sustainability transition as a long, many-sided and fundamental shift towards more sustainable ways of producing and consuming. Both ideas point to path dependence again. Systems tend to stay locked into old ways.", "The lecture ends this part with open questions, framed in the language of teams, tools and tasks. Which direction should an innovation system take? That is, which tasks should it solve? Who decides whose view wins? That is, which teams get heard? How do we carry out the change, and which tools, old or new, can help? And does everyone even agree that this is the way forward? Behind these questions sit deeper tensions. There is state steering against market forces, and the hope for a technological fix. There are unintended consequences. And there are hard choices, for example between solving environmental problems and solving problems of fair distribution."], "checks": [{"q": "Which three ideas do Schlaile and colleagues want innovation system research to take seriously?", "a": "Directionality (what to transform or keep), legitimacy (why that goal is acceptable) and responsibility (by whom and for whom)."}, {"q": "Why is giving a system a direction hard?", "a": "Because people disagree about goals, unintended consequences are likely, and systems are path dependent, so practices, routines and habits must change too."}], "audio": "audio/T1-06.mp3", "seconds": 198.0, "words": 434}, {"n": 7, "title": "Progress or crisis?", "slides": [34, 35, 36, 37, 38, 39, 40, 41], "readings": "none new", "paragraphs": ["The lecture closes with a debate you can join yourself. Are you a technology optimist or a technology sceptic?", "The optimist, as the lecture describes it, believes that technological innovation can and will solve the world's problems. People who do not have good lives now will get them through new technology. Competition and economic growth are good, because they drive more innovation. Better technology means better lives.", "The sceptic agrees that innovations raise productivity and growth. But the sceptic warns that they also bring consequences nobody foresaw. Some sceptics go further and argue that the capitalist system cannot be sustainable by definition, so technology within that system will not help. Quick fixes treat the symptoms, not the illness. Instead, sceptics look to innovation without profit, social entrepreneurship, societies without growth, alternative knowledge such as that of indigenous peoples, and new business models.", "Two pictures make the debate concrete. The first is a figure called the shrinking world. It shows how faster transport, from sailing ships to jet aircraft, made the world feel smaller. That looks like progress. But the lecture writes a warning across it: an unforeseen consequence is global warming. The second picture shows two cartoons about globalisation. In one, every city in the world looks the same. In the other, the rich North sets the South on fire. So the question stands. Does innovation bring progress or crisis?", "In class, you are asked to take a side, write down your reasons for two minutes, and then defend your view with a partner. It is worth doing on your own too, because the exam rewards positions that are argued with reasons.", "The summary slide brings the threads together. Innovation is systemic. It depends on organisations, institutions and networks. Norway's national system shows that a country can do well with relatively little research spending, thanks to institutions that encourage cooperation, knowledge sharing and links between DUI and STI. Thinking in teams, tools and tasks shows that innovation can help sustainable transformation, but does not have to. And the big question remains how to give innovation a direction.", "The last slides preview the rest of the course. Over time, researchers have described many kinds of systems. Territorial systems, which can be national, regional or global, put geography at the centre. Entrepreneurial ecosystems put the entrepreneur at the centre. Technological innovation systems put the technology at the centre. In each case, the focus is on how institutions and networks work together. The next lecture starts with regional innovation systems."], "checks": [{"q": "Give one argument of a technology optimist and one of a technology sceptic.", "a": "Optimist: technology and competition will bring better lives and solve world problems. Sceptic: innovation brings unforeseen consequences such as global warming, and quick fixes treat symptoms, not causes."}, {"q": "Which kinds of innovation system does the lecture preview, and what does each put at the centre?", "a": "Territorial systems (national, regional, global) put geography at the centre; entrepreneurial ecosystems put the entrepreneur at the centre; technological innovation systems put the technology at the centre."}], "audio": "audio/T1-07.mp3", "seconds": 193.0, "words": 422}], "seconds": 1197.5}, "T2": {"id": "T2", "title": "Lecture 2: Regional innovation systems and sustainable transformation", "session": "Kursplan 2026, session 2 (22 September)", "lecturer": "Arnt Fløysand", "deck": "Forlesning 2 Fløysand.pdf (H2025, 44 slides)", "chapters": [{"n": 1, "title": "Why geography matters", "slides": [1, 2, 3, 4, 5, 6, 7, 8, 9], "readings": "Fløysand et al. 2022; Schlaile et al. 2017; Fløysand & Jakobsen 2016", "paragraphs": ["The second lecture moves from the whole country down to the region. Its message fits in two words on the third slide: geography matters. Innovation systems can be national, regional or even global, and this lecture is about the regional level, with Western Norway as the case.", "Three readings belong here. The main one is the article by Fløysand and colleagues from 2022 on institutional work and green restructuring in Hordaland and Rogaland. The second is the article by Schlaile and colleagues on giving innovation systems a direction, which you met in the first lecture. The third is a Norwegian book chapter by Fløysand and Jakobsen from 2016 on industrial development in Western Norway.", "The lecture starts with a recap of the national level. Countries differ a lot in how well they innovate and grow. The lecture lists the reasons, taken from Trott's textbook. Countries differ in their labour, natural resources, capital and infrastructure. They differ in what their customers demand, and in their suppliers and related industries. They differ in research conditions, the STI side. And they differ in institutions, both informal ones, such as norms and ways of doing things, the DUI side, and formal ones, such as laws and regulations. So national innovation systems are about how a national context makes a difference to innovation as an interactive process. Norway's paradox from the first lecture is the example.", "The recap ends with the teams, tools and tasks model and the three pillars of sustainability. Then comes a short class exercise. Which energy solutions could help sustainable transformation in Vestland county, and which tools, old or new, could move it towards economic, social and environmental sustainability? Take two minutes to jot down your own answer. The rest of the lecture gives you material to check it against."], "checks": [{"q": "Name four kinds of national difference that shape innovation, according to the lecture.", "a": "Labour, natural resources, capital and infrastructure; demand conditions; suppliers and related industries; research conditions; and institutions, both formal (laws, regulations) and informal (norms, ways of doing things)."}], "audio": "audio/T2-01.mp3", "seconds": 132.5, "words": 304}, {"n": 2, "title": "The regional level", "slides": [10, 11, 12, 13], "readings": "none new", "paragraphs": ["Why look at regions at all? Because conditions differ inside a country as well as between countries. The lecture says that firms are part of a region's material, social and cultural inventory. Regional conditions shape how firms innovate, and firms in turn shape the region.", "The lecture says an innovating firm has to do three things. It has to build up unique knowledge inside its own organisation. It has to bring in extra knowledge from outside actors. And it has to live with regional conditions that can either stimulate or hold back its innovation.", "Three kinds of regional condition matter most. The first is the natural resource base and the technical infrastructure. These are often sunk costs: money already spent on plants, harbours and pipelines that cannot easily be moved or recovered. The second is networks that stretch across the region. Researchers call the lively local exchange of news, gossip and know-how local buzz. The third is institutions anchored in the region. These include DUI learning and tacit knowledge, and also research that has been sharpened to fit the region's existing industries.", "The lecture also introduces the founding father of this research. Philip Cooke started research on regional innovation systems in 1992. He was an adjunct professor at HVL from 2015 to 2024. He also founded the journal European Planning Studies, which the lecture names as a main source for this research, together with Regional Studies and Research Policy.", "So what is a regional innovation system, or RIS? In the lecture's first, simple version, it is the infrastructure, network dynamics and institutions that support innovation in a region. Some of these are hard factors, such as knowledge organisations. Others are soft factors, such as networks, institutions and the tacit knowledge that flows through local buzz."], "checks": [{"q": "Name the three kinds of regional condition that shape innovation.", "a": "The natural resource base and technical infrastructure (sunk costs); networks across the region (local buzz); and institutions anchored in the region, such as DUI learning, tacit knowledge and research tailored to local industry."}], "audio": "audio/T2-02.mp3", "seconds": 134.7, "words": 300}, {"n": 3, "title": "What a regional innovation system is made of", "slides": [14, 15], "readings": "Fløysand et al. 2022", "paragraphs": ["The lecture admits that there are several definitions of a regional innovation system. But the basic one sees it as three subsystems that work together.", "The first subsystem is firms and industries, which are often organised in clusters, together with the public sector. The second is knowledge organisations for research and education, such as universities, university colleges and research institutes. The third is support organisations, such as regional authorities, cluster organisations and incubators. An incubator is a place that helps new firms in their first years with space, advice and contacts.", "Knowledge and learning flow in complex ways within and between these three subsystems. This happens in networks, and the networks follow institutions, meaning informal rules for how people behave and work together. And the subsystems are built up over time. The lecture calls this an evolutionary perspective, and it points to the article by Fløysand and colleagues on Rogaland and Hordaland as the example.", "There is also a broad and a narrow way to draw the boundary. The broad approach covers the whole regional economy: all private and public firms, plus the wider set of organisations and institutions that support learning and innovation. The narrow approach, which the lecture credits to Asheim and Gertler from 2005, looks only at the interplay between research institutions, knowledge-intensive firms, technology transfer organisations and other support organisations.", "Here is an exam tip. The June 2025 exam asked: what do you understand by a regional innovation system? The three subsystems, the flows of knowledge between them in networks, and the role of institutions give you a strong answer. Add one Western Norway example, which you will meet later in this lecture."], "checks": [{"q": "What are the three subsystems of a regional innovation system?", "a": "Firms and industries (often in clusters) plus the public sector; knowledge organisations for research and education; and support organisations such as regional authorities, cluster organisations and incubators."}, {"q": "What is the difference between the broad and the narrow RIS approach?", "a": "The broad approach covers the whole regional economy and all the organisations and institutions supporting learning. The narrow approach covers only research institutions, knowledge-intensive firms, technology transfer and support organisations."}], "audio": "audio/T2-03.mp3", "seconds": 126.1, "words": 287}, {"n": 4, "title": "Different kinds of regional innovation system", "slides": [16, 17], "readings": "Fløysand et al. 2022, pp. 16, 19", "paragraphs": ["Regional innovation systems come in many forms, and researchers sort them in different ways. The lecture uses two typologies.", "The first sorts regions by how they are connected. In a networked RIS, firms have strong links to regional research institutions, and regional policy works to strengthen innovation. The lecture asks, with a question mark, whether Hordaland fits here. In a dirigiste RIS, firms and research institutions are tied mainly into the national innovation system. Outside actors play a key role, and innovation tends to follow the linear, research-driven STI path. The lecture asks whether Rogaland fits here. In a grassroots RIS, firms innovate mainly by learning from each other in local networks, with less contact with research institutions.", "The second typology sorts regions by how they are organised, and the article by Fløysand and colleagues uses it on page 16. An organisationally thick and diversified RIS has many firms in a varied mix of industries and clusters, and a critical mass of knowledge and support organisations. These are often big city regions, and the article places Hordaland here on page 19. An organisationally thick and specialised RIS also has many firms, but in only a few industries, often one dominant cluster, with knowledge and support organisations specialised to match. Rogaland, with its petroleum industry, is the example. An organisationally thin RIS has only a few innovative firms and few or weak knowledge and support organisations. These are often rural areas.", "Why does the type matter? Because it shapes what kind of change is easy. A diversified region has more different pieces to combine into something new. A specialised region is very good at what it already does, which can make it harder to change course. Keep this contrast in mind for the end of the lecture."], "checks": [{"q": "Name the three organisational types of RIS and give the course example for two of them.", "a": "Organisationally thick and diversified (Hordaland), organisationally thick and specialised (Rogaland, petroleum), and organisationally thin (often rural regions)."}], "audio": "audio/T2-04.mp3", "seconds": 137.5, "words": 304}, {"n": 5, "title": "Giving a region a direction", "slides": [18, 19, 21, 22, 23, 24], "readings": "Schlaile et al. 2017, p. 1", "paragraphs": ["The lecture now brings back Schlaile and colleagues. Making room for innovation is not enough. Regional innovation systems, too, need a direction that helps solve the problems of society. On their first page, the authors call for more research on directionality, legitimacy and responsibility. The lecture adds an important point. Technical solutions alone will not reach the goals of sustainability. Innovation practice in networks, and the institutions around it, must change too. Is that unproblematic, the slide asks, and how can it be done?", "Where does the push for green change come from? The lecture traces it from the global level down to the region. At the global level, there is a long line of agreements under the United Nations. It runs from the Brundtland report in 1987 and the Rio conference in 1992 to the Paris agreement in 2015, which gives every country obligations. The slide also lists the seventeen sustainable development goals, and the Glasgow climate conference, where countries had to strengthen their climate targets. The European Union adds its own strategies, research programmes and the European Green Deal from 2020. Norway is linked to EU policy through the EEA agreement. The slide notes that this picture was drawn before Trump's return in 2024.", "New ideas about policy also travel. One is transformative or mission-oriented innovation policy. It tackles grand challenges through big efforts across sectors, active cooperation between state and business, and new kinds of partnership. The lecture quotes Mazzucato from 2021: it is not only about setting the rules of the game, but changing the game itself. The other idea is smart specialisation, developed in the EU. It builds on what a region is already good at, renewing existing industries and growing new, related ones. The lecture credits the idea of finding related opportunities to Foray, in 2015, and notes that it now also includes the sustainable development goals.", "In Norway, the country has promised to cut emissions by at least 50 percent, and up to 55 percent, by 2030, compared with 1990. The Solberg government, from 2013 to 2021, mainly trusted the market, though it became more active because of climate pressure and the Covid crisis. The Støre government, from 2021, wants an active industrial policy and a bigger role for the state, municipalities and counties. Still, most policy is made nationally, and most funding tools are national, such as the Research Council, SIVA and Innovation Norway. Regional policy often only facilitates national initiatives, the lecture says, citing Uyarra and colleagues from 2020. So the lecture asks: how much room for action does Western Norway really have?"], "checks": [{"q": "What is the difference between mission-oriented policy and smart specialisation?", "a": "Mission-oriented policy tackles grand challenges by changing the game itself, with big cross-sector efforts. Smart specialisation builds on what a region is already good at, renewing existing industries and growing related ones."}, {"q": "Why might a region have limited room to steer its own green transformation in Norway?", "a": "Because most industrial policy and most funding tools (the Research Council, SIVA, Innovation Norway) are national, and regional policy often only facilitates national initiatives."}], "audio": "audio/T2-05.mp3", "seconds": 198.3, "words": 439}, {"n": 6, "title": "Western Norway's double challenge", "slides": [20, 25, 26, 27, 28, 29, 30, 31], "readings": "none new", "paragraphs": ["Now the case. In 2021, Vestland county launched big plans for regional green restructuring, called Green Region Vestland. The lecture asks a sharp question: wishful thinking or convincing plans?", "To answer it, you need to see how much the region depends on oil and gas. The lecture's figures, for Hordaland and Rogaland in 2015, are striking. Two thirds of Norway's oil and gas exports came from this region. The petroleum sector had a turnover of 515 billion kroner there. It employed about 60,000 full-time workers, counting both extraction and suppliers, which was about half of all petroleum jobs in Norway. Other big sectors are the maritime sector, with about 25,000 workers, and seafood, with about 7,000. The region is also a leader in hydropower, producing about 34 terawatt hours a year out of a national total of about 140.", "A chart from the 2019 report on Western Norway adds that in 2017, oil and gas created 265 billion kroner of value in Norway, and 71 percent of it was created in Western Norway. Another slide shows where Vestland's emissions come from. Industry, oil and gas cause 42 percent, with the Mongstad refinery as the largest single source. Then come shipping at 21 percent, road traffic at 13 percent, energy supply at 8 percent and farming at 6 percent.", "So the region faces what the lecture calls a double challenge. First, it must reduce its dependence on oil and gas by developing new green industries. Second, it must make its existing industries greener, for example through electrification, more renewable energy, hydrogen, and capturing and storing carbon dioxide.", "How far has the first part come? The fall in the oil price in 2015 did reduce the dependence. The share of all employees working in petroleum fell from 17 to 11 percent in Hordaland, and from 36 to 29 percent in Rogaland, between 2014 and 2019. But then oil prices rose again, and the Covid rescue package from 2020 to 2022 helped keep investment on the continental shelf stable. So the trend is not one-way."], "checks": [{"q": "What is Western Norway's double challenge?", "a": "To reduce its dependence on oil and gas by developing new green industries, and to make its existing industries greener, for example through electrification, hydrogen and carbon capture and storage."}, {"q": "How did petroleum's share of employment change from 2014 to 2019?", "a": "It fell from 17 to 11 percent in Hordaland and from 36 to 29 percent in Rogaland, after the 2015 oil price fall."}], "audio": "audio/T2-06.mp3", "seconds": 159.7, "words": 348}, {"n": 7, "title": "Green paths in practice", "slides": [32, 33, 34, 35, 36, 37, 38, 39], "readings": "none new", "paragraphs": ["The lecture then walks through real attempts at green change, sector by sector.", "New industries come first. Wind power can supply electrification and more power production, but it carries an environmental risk of its own: the loss of nature in Norway. Building of new wind power on land has stopped. Battery production for the maritime sector is another new path.", "Then the greening of existing industries. The maritime sector, with its shipyards, shipowners and suppliers, has a history in the ferry and offshore markets. It has used that experience to move into clean technology. The lecture says, citing Sjøtun from 2019, that the region is now seen as world-leading in building and running battery-powered ferries. Maritime battery technology is spreading to new markets, such as local cruise traffic, fishing vessels and well boats, and it cuts carbon emissions from shipping. This is a good example of DUI learning: experience from one market carried into the next.", "In the energy sector, including oil and gas, a diagram shows two routes to hydrogen. Green hydrogen is made from water with electricity from wind, water or sun. Blue hydrogen is made from natural gas, and the carbon dioxide it releases is captured and stored under the seabed.", "Seafood, mainly salmon farming, has serious environmental risks. Escaped farmed salmon change the genes of wild salmon. Salmon lice from fish farms raise the death rate of wild salmon, and disease and lice treatments kill many farmed fish too. Waste from the farms changes the seabed and its animal life near the farms. Responses include electrifying the farm sites and the boats that serve them. Another is reducing lice in the pens. In 2015, the Directorate of Fisheries handed out development licences for this: 24 projects with 104 licences, equal to about 90,000 tonnes of fish. The lecture cites research by Sjøtun, Fløysand and colleagues from 2022 on this case."], "checks": [{"q": "Why are battery ferries a good example of regional path development?", "a": "Because the maritime cluster used its experience from the ferry and offshore markets to develop battery technology, and is now spreading it to new markets such as cruise traffic, fishing vessels and well boats."}, {"q": "What is the difference between green and blue hydrogen in the lecture's diagram?", "a": "Green hydrogen is made from water using renewable electricity; blue hydrogen is made from natural gas, with the carbon dioxide captured and stored."}], "audio": "audio/T2-07.mp3", "seconds": 143.3, "words": 320}, {"n": 8, "title": "What the case shows", "slides": [40, 41, 42, 43, 44], "readings": "Fløysand et al. 2022, pp. 15, 25; Fløysand & Jakobsen 2016, p. 324", "paragraphs": ["So is Western Norway transforming? The lecture's honest answer is: not in the deep sense. Remember Mazzucato's phrase about changing the game itself. The lecture says the Western Norway case is not mainly about that. It is about reducing the region's dependence on petroleum by growing new green industries, such as batteries, offshore wind and hydrogen. And it is, above all, about making existing industries greener through technology, such as electric ferries and gas-powered ships, electrification and carbon storage in petroleum, and new technology in seafood.", "The summary slide explains why. There are many signs of path dependence. Most solutions are technical fixes inside existing industries. Path creation, meaning the growth of genuinely new industries, meets resistance from the region's material conditions: its established resource industries and their infrastructure. And the region's institutional and social conditions stay mostly unchanged.", "The final slide gives the main reading's answer. Fløysand and colleagues argue that institutional work is needed for green restructuring. Institutional work means the efforts people make to change, keep or break the rules of the game. The next lecture explains it in detail. In Hordaland, the diversified region, the authors observe several new patterns of institutional work, including new guiding rules for how actors work together. They say this on page 25, and it helped make the green shift legitimate. In Rogaland, the specialised petroleum region, the efforts aim to broaden the region's industries. But on page 15 and again on page 25, the authors find strong signs that the deep-rooted logic of the oil and gas industry is bouncing back. So the green shift there risks being mainly talk.", "The book chapter by Fløysand and Jakobsen adds a useful frame. On page 324, it describes regional renewal as the sum of processes at three levels. At the industry level, cluster dynamics matter. At the firm level, related variety matters, meaning firms whose knowledge is different but connected. At the individual level, entrepreneurship and a start-up culture matter.", "The next lecture, by Nora Geirsdotter Bækkelund, turns to entrepreneurial ecosystems."], "checks": [{"q": "How do Hordaland and Rogaland differ in the article by Fløysand and colleagues?", "a": "In diversified Hordaland, new patterns of institutional work, including new guiding rules of interaction, helped legitimise green restructuring. In specialised Rogaland, the oil and gas logic is bouncing back, which delegitimises the green shift."}, {"q": "Why does the lecture say Western Norway's change is not 'changing the game itself'?", "a": "Because it mostly reduces petroleum dependence through new green industries and greens existing industries through technology, while path dependence, material conditions and unchanged institutions limit deeper transformation."}], "audio": "audio/T2-08.mp3", "seconds": 162.4, "words": 345}], "seconds": 1194.5}, "T3": {"id": "T3", "title": "Lecture 3: Institutional work in the regional innovation systems of Hordaland and Rogaland", "session": "Kursplan 2026, session 3 (25 September)", "lecturer": "Arnt Fløysand", "deck": "Forelesning 5 Fløysand Institusjonelt arbeid....pdf (H2025, 34 slides)", "chapters": [{"n": 1, "title": "Systems, places and institutions", "slides": [1, 2, 3, 4, 5, 6, 7], "readings": "Fløysand et al. 2022, pp. 14, 15, 16, 19", "paragraphs": ["This lecture examines a detailed study of two neighbouring regions in Western Norway: Hordaland and Rogaland. Arnt Fløysand, who co-wrote the article on your reading list, asks a practical question. How do people in a region change the rules and habits of their industries when they need to build greener jobs?", "The lecture starts by reminding us what systemic innovation means. Innovation does not happen in a vacuum. It is not an isolated discovery made inside a single company laboratory. Instead, it grows out of continuous interaction between many different organisations and social groups.", "The slides review the territorial systems introduced in earlier lectures. Slide 4 points out that territorial systems can be national, regional, or global. In each case, researchers focus on geographical anchoring. This means examining how economic networks, cultural habits, and public institutions are rooted in a specific physical territory. National innovation systems, which we explored in Lecture 1, put state laws, funding agencies and national research programmes at the centre. Regional innovation systems, introduced in Lecture 2, zoom in on sub-national geography, regional cultures, and local supplier networks. Geography matters because physical closeness makes trust and daily learning easier. When firms, universities and regional officials meet often, they exchange tacit knowledge that cannot easily travel over long distances.", "The article gives Hordaland as an example of how place shapes industry. On page 19, it describes fishery-related industries and, in the early 20th century, metal industries built on hydropower plants in the fjord landscape.", "A regional innovation system is more than a collection of factories, docks and schools. It is also an institutional setup. Institutions shape how people think, what they reward, and how they cooperate with each other. The main reading for this lecture is the 2022 article by Fløysand and colleagues. On page 14, the authors explain that regions face urgent demands for green industrial restructuring. Yet old industrial ways tend to stick around. To understand why some regions move faster than others, we need to look beyond machines and patents. We have to examine institutional work."], "checks": [{"q": "Why does geography matter in regional innovation systems?", "a": "Physical closeness makes trust and daily learning easier, allowing actors to share tacit knowledge and build cooperative habits."}], "audio": "audio/T3-01.mp3", "seconds": 163.8, "words": 348}, {"n": 2, "title": "What is institutional work?", "slides": [8, 9, 10, 11, 12, 13, 14, 15], "readings": "Fløysand et al. 2022, pp. 15, 17; North 1990; Lawrence et al. 2011; Lawrence & Suddaby 2006", "paragraphs": ["To explain change, the lecture reviews other kinds of systems. These include global systems, entrepreneurial ecosystems, technological systems and sectoral systems. In each one, we find teams, tools and tasks. On slide 12, the lecture quotes van Alphen and colleagues from 2011. They remind us that technology cannot be understood in isolation from its socio-cultural system. Tools need teams of people who know how to build and operate them, and tasks that define why they matter.", "Systems do more than provide resources and infrastructure. They also structure human action. They guide what people consider normal, acceptable, or risky. Scholars call these shared guidelines institutional logics. An institutional logic is a set of social beliefs and principles that directs what counts as legitimate practice.", "This brings us to the core concept: institutions. The lecture adopts the classic definition from North, in 1990. Institutions are the formal and informal rules that organise social, political and economic relations. Formal rules are written down by governments: laws, regulations, and official policy targets. Informal rules are unwritten: shared habits, traditions, routines, and taken for granted ways of doing things in everyday business life.", "If institutions are so powerful, can people ever change them? The lecture answers yes, through agency. Agency means the conscious capacity of actors to make choices and take deliberate action. When actors work purposefully to affect institutions, they perform what scholars call institutional work.", "The lecture takes its definition from Lawrence and colleagues in 2011. On page 15 of the article, the authors quote it as physical and mental efforts aimed at affecting an institution or set of institutions. On page 17, they explain that institutional work has three faces. It can create new institutions, maintain existing ones, or disrupt old ones. Lawrence and Suddaby showed in 2006 that this work is not just about grand legal changes. Creating institutions involves building new routines of collaboration between organisations. Maintaining institutions involves policing standards and repeating established habits. Disrupting institutions involves undermining the legitimacy of outdated practices.", "Here is an exam tip. In June 2025, the exam asked: what do you understand by institutional work? You can answer with Lawrence's definition and the three forms of work: creating, maintaining, and disrupting."], "checks": [{"q": "What are institutions according to North (1990)?", "a": "Formal and informal rules that organise social, political and economic relations."}, {"q": "What are the three forms of institutional work identified by Lawrence and colleagues?", "a": "Creating new institutions, maintaining existing ones, and disrupting old ones."}], "audio": "audio/T3-02.mp3", "seconds": 186.9, "words": 374}, {"n": 3, "title": "Two regions and the triple challenge", "slides": [16, 17, 18, 19], "readings": "Fløysand et al. 2022, pp. 16, 17, 18; Maguire et al. 2004", "paragraphs": ["Now the lecture introduces the empirical puzzle. Hordaland and Rogaland sit next to each other on the southwest coast of Norway. Both grew wealthy from North Sea oil and gas over the past half century. Yet both regions now face what the lecture calls a triple challenge.", "First, they must reduce their dependence on oil and gas by developing new green industries. Second, they must make their existing industries more environmentally friendly. Third, they must deal with path dependence, as described in evolutionary economic geography. Path dependence means that past industrial choices condition current possibilities, making green shifts harder to launch. High petroleum wages and specialized offshore engineering skills make other sectors struggle to attract talent and capital.", "To see how the regions handle this challenge, Fløysand and colleagues study regional key actors across three main groups: research and development, business intermediaries, and industry leaders. Drawing on Maguire and colleagues from 2004, the lecture describes them as institutional entrepreneurs. These are actors who have an interest in institutional arrangements and leverage resources to protect or transform them.", "On slide 18, the lecture emphasizes that the study focuses on informal rules. It examines emerging ways of doing things and new forms of interorganizational collaboration. The study investigates two main questions. First, how does the institutional work of regional key actors balance the maintenance, creation, and change of institutional entrepreneurship behaviour? Second, how is this institutional work legitimizing or delegitimizing green industrial restructuring? To legitimize means to make a new path seem natural, necessary, and worthy of public and private investment. To delegitimize means to treat it as unrealistic, unimportant, or a distraction from profitable business."], "checks": [{"q": "What three challenges make up the triple challenge for Hordaland and Rogaland?", "a": "Reducing oil dependence through new green sectors, greening existing industries, and dealing with path dependence."}, {"q": "What does it mean for institutional work to legitimize green restructuring?", "a": "It makes green restructuring appear natural, necessary, and worthy of public and private investment."}], "audio": "audio/T3-03.mp3", "seconds": 134.4, "words"
