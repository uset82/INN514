citing Lawrence and colleagues?", "a": "Physical and mental efforts aimed at affecting an institution or set of institutions, including maintaining, creating, changing, or disrupting them."}], "audio": "audio/P03-01.mp3", "seconds": 313.0, "words": 654}, {"n": 2, "title": "Introduction, regional innovation systems and institutional work", "slides": [], "readings": "", "pages": "cover, 14–17", "paragraphs": ["This page is the publisher's cover sheet with journal details and digital identifiers.", "The authors introduce their study of regional key actors and green industrial restructuring in petroleum-dependent regions. While evolutionary economic geography has examined agency in regional path development, it struggles to account for the dynamic interplay between agency and institutions across regional contexts. Cortinovis and colleagues argue that scholars should investigate how actors engage in collective action to mobilize knowledge, resources and public opinion to create or adapt institutions. The authors respond by combining evolutionary economic geography with institutional work, comparing Hordaland and Rogaland in Western Norway.", "The authors define institutional work, following Lawrence and colleagues, as physical and mental efforts aimed at affecting institutions. Evolutionary economic geography holds that regional development follows path-dependent trajectories that are hard to alter. Drawing on Maguire and colleagues, the authors study institutional entrepreneurship and ask two questions: how institutional work balances maintaining, creating and changing institutional entrepreneurship behaviour, and how it legitimizes or delegitimizes green industrial restructuring. They preview the answer: collective-oriented work in diversified Hordaland legitimizes a green shift, while individual-oriented work in petroleum-specialized Rogaland delegitimizes it.", "The authors define a regional innovation system, citing Cooke, as interacting subsystems of knowledge generation and exploitation; following Stuck and colleagues, these are knowledge infrastructure, industry and governance. Systems are thick or thin, following Asheim and colleagues; diversified or specialized, following Isaksen and Trippl; and interactive networking, grassroots or dirigiste, following Stuck and colleagues. Related variety, following Boschma and Frenken, gives learning opportunities across related sectors. Citing North, institutions are formal and informal rules. Institutional entrepreneurship, from Maguire and colleagues and DiMaggio, means leveraging resources to create or transform institutions.", "Institutional entrepreneurship is criticized for treating change as the work of heroic individuals, whereas institutional work also includes taken-for-granted practices and can maintain, create, change or disrupt institutions, following Lawrence and colleagues. Green industrial restructuring is defined, through UNEP, as change that reduces carbon emissions and pollution, improves energy and resource efficiency, and prevents loss of biodiversity. Grillitsch and Sotarauta name three forms of change agency. For specialized regions, Grillitsch and Hansen see greening existing industries and green diversification as the most realistic strategy. Following Bækkelund, agency divides into change agency and reproductive agency."], "labels": ["Cover", "Page 14", "Page 15", "Page 16", "Page 17"], "checks": [{"q": "How does institutional work differ from institutional entrepreneurship according to page 17?", "a": "Institutional entrepreneurship risks focusing on heroic individuals and special skills, whereas institutional work includes taken-for-granted practices and can maintain, create, change or disrupt institutions."}, {"q": "What two research questions do the authors pose on page 15?", "a": "How regional institutional work balances maintaining, creating and changing institutional entrepreneurship behaviour, and how this institutional work legitimizes or delegitimizes green industrial restructuring."}], "audio": "audio/P03-02.mp3", "seconds": 209.6, "words": 389}, {"n": 3, "title": "Materials, methods and regional innovation system structures", "slides": [], "readings": "", "pages": "18–21", "paragraphs": ["Page 18 connects institutional work with institutional logics and presents the research methods. Institutional logics are practice patterns of behaviour and social prescriptions directing legitimate practice, following Thornton and Almandoz. Combining institutional work and evolutionary economic geography shows how actors maintain, create or change institutions within regional structures. The authors used a mixed-methods design. They modelled related variety using Shannon's entropy measure on five-digit and two-digit 2002 NACE codes, following Frenken and colleagues. From a list of about 40 stakeholders, they conducted 24 semi-structured interviews with regional key actors, using snowball sampling.", "The authors applied the principle of saturation, following Bowen, and draw on 35 face-to-face interviews of 30 to 90 minutes, including earlier studies of greening in seafood, petroleum and maritime sectors. More systematic dialogue with interviewees, they note, might have increased validity. Both regions host major resource industries but differ in structure; in 2019, Hordaland had 524,495 residents and Rogaland 475,654. Bergen, once a Hanseatic trading post, built trade, shipbuilding and fisheries. Hydropower-based metallurgy followed in the early twentieth century, and fjord tourism brings over 300 cruise dockings a year.", "Page 20 compares the knowledge and industrial systems of both regions. Bergen hosts the Directorate of Fishery from 1900, the Norwegian School of Economics from 1936, the University of Bergen and Western Norway University of Applied Sciences, supporting a thick and diversified system. Rogaland shifted toward offshore petroleum after oil discoveries in 1969. Equinor was placed in Stavanger in 1972, followed by the Norwegian Petroleum Directorate. Table 1 shows that non-renewable energy accounted for 12 percent of person years in Hordaland, but double that share in Rogaland. Figure 1 shows higher related variety in Hordaland than Rogaland.", "National cluster programmes, run by Innovation Norway, Siva and the Research Council of Norway, include Arena, the NCE programme from 2006 and Global Centres of Expertise from 2014. In Hordaland, six cluster projects became Centres of Expertise, from NCE Subsea in 2006, now GCE Ocean Technology, to NCE Finance Innovation in 2017. Leaders took cluster terminology into everyday language, creating a cluster Klondike. The authors read this as change agency at first, then reproductive agency extending existing paths, yet it also triggered deeper change."], "labels": ["Page 18", "Page 19", "Page 20", "Page 21"], "checks": [{"q": "How did the economic profiles of Hordaland and Rogaland differ in Table 1 on page 20?", "a": "Non-renewable energy represented 12 percent of person years in Hordaland but double that share in Rogaland."}, {"q": "Which organisations manage the national cluster programme mentioned on page 21?", "a": "Innovation Norway, Siva, and the Research Council of Norway."}], "audio": "audio/P03-03.mp3", "seconds": 205.6, "words": 380}, {"n": 4, "title": "Institutional work, cluster dynamics and green restructuring", "slides": [], "readings": "", "pages": "22–25", "paragraphs": ["That deeper change came, somewhat unexpectedly, through networking across clusters: AquaCloud drew on finance and media expertise for aquaculture digitization, opening the way for change agency. Rogaland instead pursued smart specialization through Arena projects such as the Norwegian Smart Care Cluster and Stiim Aqua Cluster, but most of these, if not always intentionally, supported continued petroleum dependence. Institutional work there is anchored in individual strategic leadership. This is a legacy of former Stavanger mayor Arne Rettedal, who worked to convince Equinor, state agencies and multinational companies to base their Norwegian petroleum headquarters in Rogaland.", "Greening appears in salmon farming, where environmental problems led to green production licences. As oil prices fell and salmon prices rose in 2014–2017, an intensive crossover programme was set up in Hordaland. An intermediary says forty to fifty oil and gas firms now also supply ocean fish farming. NCE Maritime CleanTech has become world leading in maritime battery technology, which is reaching new markets, such as Corvus Energy's battery packs for cruise ships. Yet stakeholders voice contradictions; an industry leader warns that networks risk becoming talk without action.", "Page 24 analyzes lock-in dynamics in Rogaland and begins the discussion. In Rogaland, 50 years of petroleum dominance and high wages drain talent from other industries. When oil prices recover after a recession, lowered costs yield high profit margins that pull capital and labour back into petroleum. An intermediary warned that a booming oil price reverses emerging restructuring processes. The discussion highlights that Hordaland's thick and diversified system fostered collective leadership that legitimized green restructuring, backed by five of the country's fifteen NCEs and one of three GCEs in Hordaland.", "Rogaland's thick, specialized and rather dirigiste system shows individual leadership delegitimizing green restructuring, reducing greening to a mainly discursive process. The regions also differ in industrial history, so a thick, diversified system is a potential advantage but not a sufficient precondition. In Hordaland, change agency builds on reproductive agency around clustering; in Rogaland, change agency targets renewal of existing industries. The conclusions note a striking observation: institutional work aimed at a green shift can unintentionally sustain oil and gas. This challenges studies that explain restructuring as the outcome of intended, successful agency."], "labels": ["Page 22", "Page 23", "Page 24", "Page 25"], "checks": [{"q": "Why did an intermediary in Rogaland consider a booming oil price dangerous on page 24?", "a": "High profits and recovering petroleum markets lead the industry to re-employ workers and reverse emerging restructuring processes."}, {"q": "How did oil and gas suppliers in Hordaland respond to oil price drops between 2014 and 2017 on page 23?", "a": "As oil prices fell and salmon prices rose, an intensive crossover programme was set up, and around forty to fifty oil and gas firms now also supply ocean fish farming."}], "audio": "audio/P03-04.mp3", "seconds": 189.5, "words": 381}, {"n": 5, "title": "Conclusions and the reference list", "slides": [], "readings": "", "pages": "26–28", "paragraphs": ["The conclusions end with an implication: change and reproductive agency can have different contents in different regions. Reproductive agency can sustain emerging greening efforts, but it becomes a barrier when tied to historically developed logics in an already specialized system that lacks the conditions to reorient them. After the acknowledgements, which thank the Regional Research Fund of Western Norway, the reference list begins.", "These pages are the rest of the reference list."], "labels": ["Page 26", "Pages 27-28"], "checks": [{"q": "When does reproductive agency become a barrier to greening according to the conclusions on page 26?", "a": "When it is too strongly linked to historically developed institutional logics that support an already specialized or overspecialized system lacking the conditions to reorient those logics."}], "audio": "audio/P03-05.mp3", "seconds": 40.4, "words": 83}], "seconds": 958.1}, "P04": {"id": "P04", "kind": "reading", "title": "Reading 4: Innovation systems for transformations towards sustainability? Taking the normative dimension seriously", "session": "Schlaile et al. 2017", "lecturer": "Schlaile et al.", "deck": "Sustainability 9(12)", "authors": "Schlaile et al.", "year": 2017, "source": "Sustainability 9(12)", "lectures": ["T1", "T2", "T8"], "chapters": [{"n": 1, "title": "The paper in brief", "slides": [], "readings": "", "pages": "the whole paper", "paragraphs": ["The paper asks how the innovation systems framework can support transformations towards sustainability (page 1). Humanity faces multiple crises, and Rockström and colleagues claim that several planetary boundaries have already been crossed. Such wicked problems have emergent, socially embedded causes and uncertain effects. Technological solutions alone will not suffice, the authors argue; wicked problems call for transformations in economic, institutional, technical, cultural and organizational dimensions (page 2).", "The central claim is that this needs a paradigm shift. In the current paradigm, innovation is seen as per se desirable and mostly technological (page 1). Following Niosi and colleagues, an innovation system is a system of interacting agents aiming at the production of science and technology, whose interaction serves its development, protection, financing or regulation (page 2). On page 4, a paradigm is a set of assumptions, concepts, values and practices that make up a worldview and span a bounded performative space, with feedback loops between paradigm and practice. The authors call the alternative a dedicated innovation system, a term from Pyka, here dedicated to transformations towards sustainability. Table 1 on page 5 contrasts the two paradigms: economic growth, efficiency and system improvement against continuity of ecological systems, justice between and within generations, and quality of life. Dedicated systems add transformative innovation, which Steward calls paradigm-breaking, system-wide novelty, and policies against what Weber and Rohracher call transformational failures.", "Three questions follow (pages 5 to 7). Directionality asks what to transform or sustain. Legitimacy asks why, and who decides. Responsibility asks by and for whom. Each is hard. Debates on direction often assume we already know the right direction, which clashes with open-ended evolutionary processes and conflicting interests. Top-down steering is futile in a network society, yet bottom-up participation cannot guarantee the right solutions either. Corporate social responsibility and liability do not fit collective, uncertain outcomes (page 7).", "The method is a conceptual synthesis. The authors review building blocks: transformative innovation policy, innovation systems foresight, the entrepreneurial state, green industrial policy, inclusive innovation systems, reflexive governance, transitions research and responsible innovation (pages 7 to 9). Their verdict is that these strands are scattered, and that only a shift to the paradigm level can integrate the normativity of sustainability (page 10). A dedicated system can in principle subordinate innovation trajectories to a sustainability goal. The paper ends with nine open research questions, from resistance to change and leverage points to shared responsibility, stakeholder selection, and differences in space and time (pages 9 and 10). It names no limitations of its own, but closes with Sendzimir and colleagues' reminder that no analysis will ever eliminate surprise and uncertainty.", "In the course, the paper is used most in Lecture 1, Innovation as systemic and sustainable transformation, whose fourth part builds on pages 1, 3, 6 and 7. Lecture 2 brings it back for regional innovation systems, and Lecture 9 shows it on slide 27. Among its eight authors are Jan Fagerberg, of Reading 1, and Allan Dahl Andersen, of Reading 10. In our own reading, it helps with Question 1 of December 2024, which asks what you understand by innovation system, sustainable transformation, agency and institutions. Here is an example of our own, not from the paper: a regional system that funds every new technology alike has no direction; asking what to change, who decides and who answers for the result turns it towards sustainability."], "labels": [null, null, null, null, null], "checks": [{"q": "What shift in perspective do the authors call for in this paper?", "a": "A paradigm shift: from conventional innovation systems, which treat innovation as per se desirable and mostly technological, to innovation systems dedicated to transformations towards sustainability."}, {"q": "What three core normative questions must dedicated innovation systems address according to the authors?", "a": "Directionality (what to transform or keep), legitimacy (why and who decides), and responsibility (by and for whom)."}], "audio": "audio/P04-01.mp3", "seconds": 271.3, "words": 565}, {"n": 2, "title": "Introduction and the limits of conventional innovation systems", "slides": [], "readings": "", "pages": "1–3", "paragraphs": ["The abstract states the aim: to complement research on transformations towards sustainability with the innovation systems framework. In the current paradigm, innovations are seen as per se desirable and mostly technological, so the authors call for a paradigm shift towards systems dedicated to sustainability, with research on directionality, legitimacy and responsibility. Among the eight authors are Fagerberg and Andersen. The introduction lists multiple crises, from climate change to the unjust distribution of wealth. Rockström and colleagues claim that planetary boundaries have been crossed, and such wicked problems have emergent, socially embedded causes and uncertain effects.", "Because sustainability is deeply normative, technological solutions will not suffice, and wicked problems call for transformations in economic, institutional, technical, cultural and organizational dimensions. The authors aim to discuss the missing normative dimension of innovation systems and argue for a paradigm shift. Innovation systems grew from evolutionary economics as a challenge to neoclassical economics. Following Niosi and colleagues, they are systems of interacting agents aiming at the production of science and technology, whose interaction serves its development, protection, financing or regulation. The framework informs research, policy and firms, and has been applied at national, regional, sectoral and technological levels.", "Page 3 highlights the limits of conventional innovation systems when confronting sustainability. For decades, innovation research has suffered from a pro-innovation bias, assuming innovation is per se desirable. Existing sustainability-oriented approaches focus narrowly on solving environmental problems through technological solutions. The authors argue this is insufficient. Transformations towards sustainability require changing routines, practices and habits of producers and consumers, embracing institutional and cultural changes. Because sustainability is not merely a technical optimization puzzle, innovation systems research must explicitly address the normative goals and desirability of innovation processes."], "labels": ["Page 1", "Page 2", "Page 3"], "checks": [{"q": "What inherent fallacy in innovation research do the authors identify on page 3?", "a": "The assumption that innovation is per se desirable, which overlooks the ethical acceptability and societal desirability of innovations."}, {"q": "How do the authors define an innovation system on page 2 citing Niosi and colleagues?", "a": "Systems of interacting agents aiming at the production of science and technology, whose interaction serves its development, protection, financing or regulation."}], "audio": "audio/P04-02.mp3", "seconds": 155.7, "words": 297}, {"n": 3, "title": "The normative dimension and dedicated innovation systems", "slides": [], "readings": "", "pages": "4–6", "paragraphs": ["Firms such as Unilever and Shell see a sustainable society differently from Greenpeace, so presuming consensus is a mistake. The authors therefore shift attention to the paradigm level. A paradigm is a set of assumptions, concepts, values and practices that make up a worldview and span a bounded performative space; paradigm and practice shape each other through feedback loops. Following Pyka, they call the alternative a dedicated innovation system, here dedicated to transformations towards sustainability. Early innovation systems aimed at economic development, but today innovation is treated as an aim in itself, with economic growth and efficiency as dominant values.", "Page 5 compares conventional and dedicated innovation system frameworks. Following Renn and colleagues, sustainability norms include ecological continuity, intergenerational and intragenerational justice, and quality of life. Table 1 contrasts the two frameworks. While conventional systems focus on supply-side technological innovation and traditional system failures, dedicated systems emphasize transformative innovation, following Steward, and transformational failures, following Weber and Rohracher. Dedicating systems to sustainability requires answering three central questions: transform or sustain what, why, and by and for whom.", "Directionality asks what to transform or keep, opening diverse pathways while closing unsustainable ones. Debates often assume we already know the right direction, which is questionable for wicked problems: direction-setting clashes with open-ended evolutionary processes, as the German Advisory Council on Global Change notes, and consensus is unlikely. Legitimacy asks why a goal is desirable and who decides. Top-down steering is futile in a network society, yet bottom-up participation cannot guarantee the right solutions, and grassroots movements need critical mass. Values and paradigms, many argue, are shaped by cultural evolution."], "labels": ["Page 4", "Page 5", "Page 6"], "checks": [{"q": "What three central questions must a dedicated innovation system address according to page 5?", "a": "Transform or sustain what, why, and by and for whom."}, {"q": "Why is setting directionality difficult in an evolutionary system according to page 6?", "a": "Because transformations are open-ended processes with uncertain results, and wicked problems involve multiple actors with conflicting interests."}], "audio": "audio/P04-03.mp3", "seconds": 144.9, "words": 282}, {"n": 4, "title": "Responsibility, building blocks and the research agenda", "slides": [], "readings": "", "pages": "7–9", "paragraphs": ["Responsibility asks by and for whom, linking agency with power and consequences. Corporate social responsibility and liability do not fit collective processes with unknown causalities, so neither individual nor collective responsibility concepts are entirely suitable. To sum up, transformations can be analysed with an innovation systems framework, but only after a paradigm change that engages with directionality, legitimacy and responsibility. Section 4 turns to building blocks: agreements from the Kyoto Protocol to the Sustainable Development Goals show that setting goals is easier than directing innovation. Transformative innovation policies aim to steer socio-technical systems in socially desirable directions.", "Page 8 reviews frameworks that create goal-orientation and legitimacy. Innovation systems foresight, from Andersen and Andersen, builds participatory visions for system change. Mazzucato highlights the entrepreneurial state, while Rodrik advocates distributed green industrial policy. Inclusive innovation systems focus on lower-income groups, and Bryden and Gezelius combine innovation systems with human rights and triple bottom line accounting. Lindner and colleagues suggest reflexive governance. Proponents of sustainability transitions research, applied in the Netherlands and Belgium, provide operational frameworks like transition management, strategic niche management and transition arenas.", "Responsible innovation, following Arnaldi and colleagues, steers innovation from the inside towards societal goals, and Lubberink and colleagues name six dimensions, such as anticipation, reflexivity and deliberation. The building blocks are scattered, so the main question is how dedicated innovation systems can incorporate legitimate goal-orientation for transformative innovation by and for society. Seven open questions follow on this page: systemic resistance to change, multiple pathways, places to intervene, a systemic concept of responsibility, responsibility as shared and tied to power, policies against transformational failures, and how to encourage participation and select the right stakeholders."], "labels": ["Page 7", "Page 8", "Page 9"], "checks": [{"q": "What central question for future research do the authors propose on page 9?", "a": "How dedicated innovation systems can incorporate legitimate goal-orientation for transformative innovation by and for society."}, {"q": "Why are traditional concepts of responsibility insufficient for innovation systems on page 7?", "a": "Because complex systems involve unknown causalities, unintended consequences, and outcomes resulting from combined individual and collective action."}], "audio": "audio/P04-04.mp3", "seconds": 153.2, "words": 291}, {"n": 5, "title": "Conclusions and the reference list", "slides": [], "readings": "", "pages": "10–20", "paragraphs": ["Two more questions close the agenda: which elements of dedicated systems are universal or contingent, and how systems differ in time. Citing Sendzimir and colleagues, researchers must engage uncertainty as a stimulus rather than a basis for apathy. The conclusions say the current framework focuses too much on technology and treats innovation as per se desirable, so shifting attention to the paradigm level is the only way to integrate the normativity of sustainability. A dedicated system can in principle subordinate innovation trajectories to a sustainability goal.", "These pages are the reference list."], "labels": ["Page 10", "Pages 11-20"], "checks": [{"q": "What main conclusion do the authors reach regarding the conventional innovation systems framework on page 10?", "a": "It is insufficient for sustainability transformations because it focuses excessively on technological solutions and assumes innovation is per se desirable."}], "audio": "audio/P04-05.mp3", "seconds": 48.7, "words": 103}], "seconds": 773.8}, "P05": {"id": "P05", "kind": "reading", "title": "Reading 5: Business development in Western Norway: adaptability and regional renewal (in Norwegian)", "session": "Fløysand & Jakobsen 2016", "lecturer": "Fløysand & Jakobsen", "deck": "Book chapter in Region og regionalisering, Novus Forlag", "authors": "Fløysand & Jakobsen", "year": 2016, "source": "Book chapter in Region og regionalisering, Novus Forlag", "lectures": ["T2"], "chapters": [{"n": 1, "title": "The paper in brief", "slides": [], "readings": "", "pages": "the whole paper", "paragraphs": ["This book chapter examines business development and regional renewal in Western Norway from an evolutionary economic perspective. The authors analyze how industrial restructuring operates across geographical scales, from regional systems to individual firms and entrepreneurs (page 323). They argue that internationalisation and related variety decide how far a region renews, and ask whether such conditions can be traced in Western Norway (pages 323, 324). Western Norway encompasses the four counties of Rogaland, Hordaland, Sogn and Fjordane, and Møre and Romsdal. Its economy concentrates ocean industries: petroleum, maritime transport and seafood. Falling oil prices in 2015 and 2016 made the question urgent (page 324).", "The authors ground their analysis in evolutionary economic geography. In this field, regional renewal is treated as the phenomenon to be explained rather than the explanation (page 325). They define regional innovation systems, citing Cooke and colleagues, as interacting subsystems of knowledge infrastructure and commercial exploitation (page 326). Knowledge flows within clusters generate local buzz through tacit knowledge and geographical proximity, citing Bathelt and Glückler (page 326). They review Porter's diamond and Malmberg and Power's criteria for true clusters (pages 326, 327). To explain industrial paths, the authors adopt the four trajectories of path exhaustion, path extension, path renewal, and path creation (page 328). At the firm level, they use related variety and cross-industry innovation (pages 329, 330).", "The study uses a multi-scale empirical approach rather than a single quantitative indicator (page 330). At the industry level, they examine the region's place in the national cluster programme (page 333). At the regional level, they draw on employment data from Statistics Norway between 1970 and 2010. They also examine an index of related variety across 89 Norwegian economic regions (pages 331, 337). At the actor level, they analyze an interview with two generations of leadership at Ulstein Group (pages 340, 341).", "The authors show that Western Norway kept a high share of secondary-sector jobs: its share of national secondary employment rose from 24 percent in 1970 to 33 percent in 2010 (pages 331, 332). The region hosts two of Norway's three Global Centres of Expertise in maritime and subsea engineering, alongside five Norwegian Centres of Expertise (page 333). While mature clusters such as subsea and shipping primarily exhibit path extension, newer initiatives in green maritime technology, media, and culinary niches represent regional path creation (pages 333, 335). Ten of eighteen western economic areas score above the national median for related variety, which gives more potential to connect related industries (page 337). Initiatives such as microalgae farming at Mongstad would, if they succeed, be path creation built on related variety, and Ulstein's thruster, inspired by an aircraft's nose wheel, shows such borrowing in practice (pages 337, 342).", "The chapter shows that regional renewal is a multi-scale process where path extension and path creation co-exist. The authors conclude that Western Norway's structure and entrepreneurial practice do support breaks from old paths (page 343). Because the field has no stringent method for studying renewal across scales, they use a geographically scaled study (page 330). The Ulstein conversation came from a cluster study and was not designed for this question (page 340). It is also hard to say whether cluster policy, international capital, related variety or entrepreneurial culture is the main driver (page 343).", "This reading belongs to Lecture 2, Regional innovation systems and sustainable transformation. The lecture uses page 324 to structure regional renewal across three levels: cluster dynamics at the industry level, related variety at the firm level, and entrepreneurship at the individual level. In our own reading, it helps with Question 2 of the June 2025 exam, which asks in what way a regional innovation system can promote or inhibit industrial restructuring. Here is an example of our own, not from the paper: an answer can contrast specialised clusters, which may lock a region into path extension, with related variety, which can open cross-industry innovation and green path creation."], "labels": [null, null, null, null, null, null], "checks": [{"q": "What three levels constitute regional renewal in the framework on page 324?", "a": "Regional renewal is the sum of processes at the industry level through cluster dynamics, the firm level through related variety, and the individual level through entrepreneurship."}], "audio": "audio/P05-01.mp3", "seconds": 340.3, "words": 656}, {"n": 2, "title": "Concepts and theories of regional renewal", "slides": [], "readings": "", "pages": "323–327", "paragraphs": ["This introductory page frames business restructuring and regional renewal in Western Norway from an evolutionary economic perspective, as a continuous process that both influences and is influenced by regional conditions. The authors argue that taking part in internationalisation and having related variety are decisive for the degree of regional renewal. Western Norway here means four counties: Rogaland, Hordaland, Sogn and Fjordane, and Møre and Romsdal. It concentrates petroleum, seafood and the maritime sector, is often called the gold coast, and one indicator of its strength is its many projects in the national cluster programme.", "Admission to the national cluster programme recognises the innovation potential of established industries, but specialisation can also breed continuity and, at worst, stagnation. To avoid that, the literature points to related industries, international networks (global pipelines) and an entrepreneurial culture based on tacit knowledge (local buzz). The authors ask whether such conditions can be traced in Western Norway, a question made urgent by falling oil prices in 2015 and 2016. Regional renewal, they propose, is the sum of processes at the industry level (cluster dynamics), the firm level (related variety) and the individual level (entrepreneurship).", "The authors distinguish between creative destruction caused by internal factors and restructuring triggered by external crises. While regional innovation systems literature often treats regional characteristics as the explanatory factor, or explanans, evolutionary economic geography adopts regional development as the explanandum, the phenomenon to be explained. The primary objective is understanding how regional economic landscapes evolve over time. Within this field, regional renewal represents an empirical reality where stagnation and growth can occur simultaneously within the same region. Consequently, regional renewal reflects where a regional business community positions itself along an analytical axis between continuity and change.", "The authors trace concepts of continuity and change. In the 1990s, Cooke and colleagues introduced regional innovation systems, emphasizing interactive innovation between regional actors and institutions. Such systems contain two main subsystems: knowledge infrastructure producing codified knowledge, and commercial exploitation producing tacit, experience-based knowledge. Tacit knowledge exchange generates local buzz, drawing on geographical, social, and cultural proximity. Regional systems often encompass business clusters. Turning to cluster theory, the authors introduce Porter's diamond model, which explains international competitiveness through four regional conditions: factor conditions such as skilled labor and infrastructure, and domestic demand conditions regarding customer sophistication.", "The authors examine the remaining components of Porter's diamond: related and supporting industries providing competitive inputs, and firm rivalry driving innovation. Moving to regional clusters, Porter emphasized geographic concentrations of firms and supporting institutions. The authors also review Malmberg and Power's definition of true clusters, which requires four criteria. First, multiple firms must share related industries or technologies within a bounded region. Second, firms must actively interact through flows of goods, ideas, and knowledge. Third, actors must recognize a common identity and engage in joint action. Fourth, the cluster must demonstrate commercial success and competitiveness."], "labels": ["Page 323", "Page 324", "Page 325", "Page 326", "Page 327"], "checks": [{"q": "What are the two subsystems of a regional innovation system described on page 326?", "a": "A regional innovation system comprises a knowledge infrastructure producing codified knowledge and an exploitation subsystem of firms and clusters producing tacit knowledge."}], "audio": "audio/P05-02.mp3", "seconds": 257.6, "words": 494}, {"n": 3, "title": "Industrial paths, related variety and regional structure", "slides": [], "readings": "", "pages": "328–332", "paragraphs": ["Cluster theory highlights knowledge spillovers through geographic proximity as a key asset for high-cost economies. However, clusters also require external connections through pipelines to prevent negative path dependency, balancing local buzz with global pipelines. The authors examine path dependency and lock-in, where routines and institutionalized practices hinder necessary adaptation. They outline four path development trajectories from evolutionary geography: path exhaustion, involving industrial decline; path extension, representing continuation of existing activities; path renewal, denoting modernization and upgrading; and path creation, referring to the establishment of entirely new industrial sectors.", "The authors explain that new industrial paths often emerge close to existing regional capabilities, using established knowledge in novel ways through co-evolution. Moving to the firm level, related variety is essential for regional renewal. When regional industries share cognitive proximity, workers displaced during economic shocks can transition into related firms, while enterprises can diversify into adjacent markets. This dynamic stimulates cross-industry innovation, where firms apply insights from external sectors to develop new products and target diverse customer segments.", "The literature assumes that cross-industry innovation is more common in regions with related variety, and stresses networks at different scales. Summarizing the literature, the authors observe that evolutionary economic geography lacks a standardized methodology to operationalize multi-scale relational renewal. Measuring regional renewal requires looking beyond aggregate material shifts in industrial employment. A comprehensive assessment must investigate how firms organize across network scales, generate and share knowledge, access international channels, and foster entrepreneurship. The authors therefore structure their empirical analysis of Western Norway across three levels: industry clusters, firm-level variety and global pipelines, and individual entrepreneurial culture.", "The authors examine the evolution of Western Norway's maritime economy. During the twentieth century, employment shifted from primary to secondary and tertiary sectors. Early industrialization was driven by hydroelectric power, fish processing, and shipbuilding. From the 1970s, petroleum discoveries stimulated offshore suppliers, while aquaculture expanded in the 1980s. This history combined path creation in oil, gas, and fish farming with path renewal in maritime transport. Between 1970 and 2010, total secondary employment declined nationally while expanding in Western Norway, where roughly 24 percent of national industrial workers lived in 1970.", "The authors report that Western Norway's share of national secondary-sector employment increased from 24 percent in 1970 to 33 percent in 2010, shown in Figure 2. Figure 1 illustrates that secondary employment remained higher in Western Norway than nationally, stabilizing around 24 percent compared to 20 percent nationwide. Primary employment fell to between 3 and 4 percent, while services expanded to over 70 percent. Figure 2 shows Western Norway accounting for roughly 30 percent of primary jobs and 24 percent of service jobs. Petroleum extraction and offshore supply constitute the leading secondary industry."], "labels": ["Page 328", "Page 329", "Page 330", "Page 331", "Page 332"], "checks": [{"q": "How did Western Norway's share of national secondary-sector employment change between 1970 and 2010?", "a": "Western Norway's share of national secondary employment rose from 24 percent in 1970 to 33 percent in 2010."}], "audio": "audio/P05-03.mp3", "seconds": 249.1, "words": 464}, {"n": 4, "title": "Cluster programmes, path creation and related variety", "slides": [], "readings": "", "pages": "333–337", "paragraphs": ["Major oil companies run offices and offshore fields from the region. In the national cluster programme, the region secured two of Norway's three Global Centres of Expertise: GCE Subsea and GCE Blue Maritime. It also hosts five Norwegian Centres of Expertise in tourism, seafood, media, clean maritime technology, and culinary industries. The maritime cluster and the subsea cluster, which focuses on operations and maintenance, gained NCE status in 2006 and GCE status in 2014 and 2015. The authors interpret Blue Maritime, Subsea, Seafood, and Tourism as examples of path extension, where established industrial trajectories are expanded through continuity-bearing path dependency.", "Figure 3 maps the geographical distribution of seventeen advanced clusters in the Norwegian cluster programme. Western Norway hosts seven of these initiatives: Blue Maritime, Tourism, Subsea, Seafood, Media, Maritime CleanTech, and Culinology. The remaining clusters are located across eastern, southern, and central Norway. Alongside reinforcing established paths, the cluster programme explicitly aims to foster industrial renewal. Consequently, cluster initiatives combine elements of continuity with significant path renewal across the regional economy.", "While mature maritime and seafood clusters pursue cross-industry innovation, three clusters represent regional path creation. NCE Maritime CleanTech unites shipyards, equipment suppliers, renewable energy providers, and research organizations to pioneer low-emission maritime transport. NCE Media emerged in Bergen following the launch of television broadcaster TV2 in 1990, generating visual technology spin-offs like Vizrt. NCE Culinology, in the south of the region, shifted traditional agriculture toward high-value, locally sourced food products, responding to evolving culinary demand and international influences. Both media and food clusters illustrate path creation that diversified the regional economy.", "The authors acknowledge criticism that cluster policies can be overly narrow, focusing on specialized supply chains while neglecting broader renewal dynamics. For example, NCE Subsea concentrated heavily on aftermarket maintenance, risking lock-in if market conditions change. Falling petroleum prices highlighted the danger of excessive oil dependency, underscoring the need for regional differentiation. The authors outline three dimensions of adaptability to examine next: related variety and cross-industry linkages in section 4.1, international pipelines in section 4.2, and local entrepreneurial culture in section 4.3.", "Figure 4 maps related variety across Norway's 89 economic regions. Ten of eighteen western areas score above the national median, among them Bergen, Ålesund, Stavanger and Sandnes, and Jæren, while single-industry towns such as Odda and Høyanger show unrelated variety. Where variety is related, industries can more easily be connected. Several initiatives try to use regional knowledge in new ways and, if they succeed, will be path creation. One is a microalgae pilot at Mongstad, built by the University of Bergen and partners, using CO2 from oil and gas activity to grow fish feed."], "labels": ["Page 333", "Page 334", "Page 335", "Page 336", "Page 337"], "checks": [{"q": "Which three cluster initiatives in Western Norway represent path creation on page 335?", "a": "NCE Maritime CleanTech, NCE Media, and NCE Culinology represent regional path creation."}], "audio": "audio/P05-04.mp3", "seconds": 247.5, "words": 457}, {"n": 5, "title": "Pipelines, entrepreneurship and cross-industry innovation", "slides": [], "readings": "", "pages": "338–342", "paragraphs": ["Figure 4 displays a horizontal bar chart ranking Norway's 89 economic regions by their related variety score. Metropolitan and diversified areas in eastern Norway and Bergen occupy the highest positions. Western Norway exhibits substantial internal divergence. Larger coastal urban centers and diversified maritime districts attain elevated scores, whereas specialized single-industry communities rank in the lower half of the distribution. This ranking demonstrates that potential for cross-industry collaboration varies considerably across western districts.", "The authors discuss emerging cross-industry opportunities. Beyond microalgae, industrial initiatives explore seaweed cultivation for food, feed, and cosmetics, drawing on practices in Asia. Another frontier is seabed mining for seafloor minerals including copper, gold, nickel, and cobalt, providing new markets for offshore petroleum suppliers during downscaling. In section 4.2, the authors highlight international pipelines. Leading clusters like GCE Blue Maritime and GCE Subsea balance intense local knowledge exchange with global connections, preventing insular stagnation and maintaining competitive capabilities.", "The authors explain that global pipelines operate when domestic cluster firms establish subsidiaries abroad and multinational companies invest locally. External knowledge spillovers stimulate innovation, while local buzz strengthens trust and absorption capacity. Section 4.3 draws on a conversation with Idar Ulstein and Gunvor Ulstein of Ulstein Group in Ulsteinvik, held in a cluster study rather than designed for this question, though the authors call it a strategically chosen case. Gunvor Ulstein emphasizes that regional entrepreneurship is driven by persistent curiosity, compelling founders to build larger, more powerful vessels for fishing, towing offshore platforms, and deploying heavy anchors.", "Idar Ulstein explains that local business development frequently originated when capable employees disagreed with existing practices and founded independent workshops, citing a former shipyard blacksmith who manufactured harpoons. Global pipelines, Idar Ulstein stresses, were established early: a trip abroad in 1974 was followed in 1975 by the firm's first sales office in Singapore, alongside Hydro, and at most the firm was present in nearly thirty places worldwide. Furthermore, regional collaboration fostered a true cluster through the local workshop association, guided by the principle of cooperating whenever possible and competing when necessary.", "Idar Ulstein recounts reading economic and technical journals for ideas, and a banker's advice to visit fairs outside shipping. For example, observing the nose wheel of an airplane at Oslo airport inspired Ulstein engineers to design a retractable 360-degree swing-up azimuth thruster. In their conclusion, the authors summarize that regional renewal in Western Norway reflects both continuity and change. The region's strong cluster presence can be read as an indication of adaptability, but many of its clusters follow historically established industrial paths."], "labels": ["Page 338", "Page 339", "Page 340", "Page 341", "Page 342"], "checks": [{"q": "What cross-industry inspiration led to Ulstein's retractable swing-up thruster on page 342?", "a": "Idar Ulstein was inspired by the nose wheel of an airplane at Oslo airport, prompting engineers to design a 360-degree retractable thruster."}], "audio": "audio/P05-05.mp3", "seconds": 228.4, "words": 437}, {"n": 6, "title": "Conclusions and the reference list", "slides": [], "readings": "", "pages": "343–346", "paragraphs": ["Breaking established paths, the theories say, depends on whether industrial structure and entrepreneurial practice encourage it, and for Western Norway this seems to be the case. Western Norway combines heavy industrial traditions with continuous adaptation enabled by local buzz and global pipelines. The authors acknowledge that it remains difficult to determine whether cluster policy, international capital, related variety, or entrepreneurial culture is the primary driver of this system. Concluding the text, Idar Ulstein affirms that business leaders must actively welcome change and exploit emerging challenges as new commercial opportunities. The reference list begins on this page.", "These pages are the reference list."], "labels": ["Page 343", "Pages 344-346"], "checks": [{"q": "What conclusion do the authors draw on page 343 about the ultimate driver of regional renewal?", "a": "The authors conclude it is difficult to determine whether cluster policy, international capital, related variety, or entrepreneurial culture is the primary driver."}], "audio": "audio/P05-06.mp3", "seconds": 60.2, "words": 113}], "seconds": 1383.1}, "P06": {"id": "P06", "kind": "reading", "title": "Reading 6: Toward a process theory of entrepreneurial ecosystems", "session": "Spigel & Harrison 2018", "lecturer": "Spigel & Harrison", "deck": "Strategic Entrepreneurship Journal 12(1)", "authors": "Spigel & Harrison", "year": 2018, "source": "Strategic Entrepreneurship Journal 12(1)", "lectures": ["T4"], "chapters": [{"n": 1, "title": "The paper in brief", "slides": [], "readings": "", "pages": "the whole paper", "paragraphs": ["Spigel and Harrison ask what an entrepreneurial ecosystem actually is, and whether the idea deserves more than its status as a policy slogan. On page 152 they set out the problem. The term became popular faster than research could follow, so it has turned into what they call, following Sayer, a chaotic conception: something that describes rather than explains. Their aim is to give the concept a theoretical base and to explain the evolution and transformation of ecosystems.", "The central move is to treat an ecosystem as a process rather than a thing. On page 158 the authors say ecosystems are better understood as ongoing processes through which entrepreneurs acquire resources, knowledge and support. On page 161 they separate two dimensions that the rest of the paper uses: how many resources an ecosystem holds, which they call its munificence, and how easily entrepreneurs can reach them, which they call its functionality. On page 153 they sort ecosystem attributes into cultural, social and material elements, a scheme they take from Spigel's earlier work.", "There is no dataset here. The paper is conceptual. It reviews two literatures, industrial clusters and regional innovation systems, compares them with the ecosystem literature, and derives propositions from the comparison. On page 154 it takes three principles from cluster theory. On page 155 it takes three concepts from innovation systems: networks, universities as anchor organisations, and policy. Table 1 on page 157 sets the traditions side by side across five themes.", "What the paper offers is a set of propositions rather than findings. On page 159 the authors argue that access matters more than presence: firms that can reach ecosystem resources will be more competitive, access depends on an entrepreneur's perceived legitimacy, and entrepreneurs differ in their willingness to engage. On page 160 they describe recycling, where successful founders return as investors and mentors and workers from failed ventures carry their skills elsewhere, though this depends on a culture that does not punish failure. On page 161 they add that resources tend to stay where entrepreneurs are rooted, unless a shock drives them out. Figures 1 and 2 on pages 162 and 163 turn this into four stages of development and a typology of strong, arid, irrigated and weak ecosystems. Their central prediction is that strong, well-functioning ecosystems will see more growth-oriented entrepreneurship and resilient growth. Defining ecosystems by their levels of activity would be circular (page 164).", "The authors claim two contributions: a conceptual basis that separates ecosystems from clusters and regional innovation systems, and a process perspective on how resources flow, are recycled and are attracted. They are careful about the status of their claims. The propositions are offered to guide research, and page 165 calls for rigorous social science inquiry to validate them, including the idea that entrepreneurs, not the state, should lead. Page 164 adds a warning for policy: some things, such as a culture of risk taking, cannot be created from outside but develop over time, and growth of this kind can have a dark side, raising costs and pushing out other employment.", "Lecture 4, Entrepreneurial ecosystems and sustainable transformation, uses this paper throughout. It takes the three elements on slide 12, the process perspective on slide 14, and both figures on slides 15 and 16. It also takes the paper's three criticisms on slide 21, the tautology, the laundry list and the unclear level of analysis. The lecture's exam tip links the ecosystem perspective to December 2024's Question 1, on innovation systems, sustainable transformation, institutions and agency: entrepreneurs act as deliberate change agents, but their choices are bound by local institutions and networks. That link is the lecture's, and the paper's nearest support for it is propositions 1b and 1c, where legitimacy and willingness to engage decide what the ecosystem offers. On the paper's own use of the word, sustainable means lasting growth, not the course's sustainable transformation."], "labels": [null, null, null, null, null, null], "checks": [{"q": "What does the paper say is wrong with existing research on entrepreneurial ecosystems?", "a": "It is largely typological and atheoretical, and it has not explored how ecosystems influence the entrepreneurship process."}, {"q": "What are the three kinds of element the paper uses to organise the attributes of an ecosystem?", "a": "Cultural elements, social elements and material elements, a scheme the authors take from Spigel's earlier work."}], "audio": "audio/P06-01.mp3", "seconds": 297.5, "words": 653}, {"n": 2, "title": "The argument, the three elements and clusters", "slides": [], "readings": "", "pages": "151–154", "paragraphs": ["The article appears in a special issue of the Strategic Entrepreneurship Journal, and both authors are at the University of Edinburgh Business School. The research summary makes two moves. It says the ecosystem idea has become popular in policy and practice, but that research on it has been largely typological and atheoretical, and it proposes a process-based view instead. The managerial summary adds the mechanism: success and failure inside an ecosystem produce resources such as investment capital, skilled workers and entrepreneurial knowledge, and these support later ventures. The keywords list clusters, culture, networks and regional innovation systems.", "The introduction states the problem in the paper's own terms. Research has lagged behind interest, so the term has become a chaotic conception, with little consistent evidence and few frameworks. Following Stam, the authors say this leaves policy leading theory. Two practitioner sources then explain the idea's rise: Isenberg's article in the Harvard Business Review and Feld's book Startup Communities. The authors promise three contributions, a distinct domain, a process perspective on entrepreneurial resources, and a better basis for policy, and trace the shift from personality-based explanations in the 1980s and 1990s.", "The page turns to what the literature says a strong ecosystem needs. The authors note that a focus on growth is a way of picking winners rather than giving blanket support to all new firms, an argument they credit to Storey. They then set out the three-part scheme the paper uses throughout, following Spigel. Cultural elements are attitudes to entrepreneurship, which can normalise risk or block it. Social elements are resources reached through networks, such as capital, workers and mentors. Material elements are the organisations and policies rooted in a place. A supportive culture alone, they add, is not enough.", "The section on conceptual antecedents opens with industrial clusters. Following Marshall, forces outside the firm but inside the region raise its competitiveness, and both practitioner accounts cite Porter. Clusters help new ventures through a pool of specialised workers and through knowledge spillovers that give access to technology and market information. Ecosystem work takes up three cluster principles: the presence of other firms, knowledge drawn from outside the firm, and the value of physical proximity. Section 3.2 then turns to regional innovation systems, which Cooke and colleagues divide into region, innovation and system."], "labels": ["Page 151", "Page 152", "Page 153", "Page 154"], "checks": [{"q": "What two practitioner sources does the paper credit with the recent popularity of the ecosystem idea?", "a": "Isenberg's article in the Harvard Business Review and Feld's book Startup Communities, both cited on page 152."}, {"q": "In which two ways does the paper say clusters increase the competitiveness of new ventures?", "a": "By attracting or training a large pool of specialised skilled workers, and through knowledge spillovers that give access to cutting-edge technology and non-public market information."}], "audio": "audio/P06-02.mp3", "seconds": 186.2, "words": 398}, {"n": 3, "title": "Innovation systems, what is new, and Table 1", "slides": [], "readings": "", "pages": "155–157", "paragraphs": ["Cooke's entrepreneurial regional innovation system differs from a traditional one. It has pools of venture capital and market-focused serial entrepreneurs, and no central anchor, so entrepreneurs build their own networks and institutions. Three concepts pass into ecosystem research: networks, universities and policy. Section 4 then asks what is new about ecosystems at all. The first difference is access: new ventures may gain less from knowledge spillovers than established firms, because their absorptive capacity is lower, which makes local universities less important as a source of innovation.", "The page finishes the first difference and adds two more. Access also depends on the workforce, since start-ups need people who can work with less structure, which takes a cultural normalisation of particular work habits. Ecosystems also widen what counts as knowledge, adding knowledge about the entrepreneurial process, such as spotting opportunities, planning and pitching, learned from mentors and from immersion. The second difference is that practitioners such as Feld say ecosystems should be led by entrepreneurs, with the state facilitative. This is a normative view, though it fits Lerner's argument. The third is that they are industry agnostic.", "The page draws out the consequence of that indifference to sectors. Because local start-ups rarely compete directly, they can learn from each other in a trust-based setting, which sits awkwardly with Porter's emphasis on competition, though they still meet global competition. The authors then explain why the two traditions cannot share one causal story: in clusters and systems, competitiveness follows from economies of scale and scope or from sticky tacit knowledge, while ecosystem functioning follows from the social embeddedness of entrepreneurship. Table 1 compares them across five themes: the state, regional resources, knowledge, key actors, and industry."], "labels": ["Page 155", "Page 156", "Page 157"], "checks": [{"q": "How does Cooke's entrepreneurial regional innovation system differ from a traditional one?", "a": "It lacks a central anchor such as a multinational firm, a university or a research lab, and depends on entrepreneurs to create their own networks and institutions."}, {"q": "Which five themes does Table 1 compare between clusters and innovation systems on one side and ecosystems on the other?", "a": "The role of the state, access to regional resources and benefits, the role of knowledge, key actors, and industry."}], "audio": "audio/P06-03.mp3", "seconds": 139.2, "words": 298}, {"n": 4, "title": "The process perspective and the seven propositions", "slides": [], "readings": "", "pages": "158–161", "paragraphs": ["The section on process perspectives names the paper's central problem. Current uses of the ecosystem idea lack historical and contextual sensitivity, and the authors follow Sayer in calling such a category a chaotic conception: it can describe, but it becomes problematic when explanatory weight or policy is placed on it. They give three symptoms. It is tautological, it offers a laundry list without causes, and the level of analysis is unclear. Their answer is to treat ecosystems as processes rather than as things. The section then opens the first set of propositions, on resource acquisition.", "Access to resources, not their presence, is the point. Resources sit inside social networks, so an entrepreneur's position, capabilities and perceived legitimacy decide what can be reached, and those who do not look like high-growth founders may find the ecosystem harder to enter. Propositions 1a to 1d follow. Firms that can reach ecosystem resources will be more competitive; access depends on perceived legitimacy; entrepreneurs vary in their ability and willingness to engage; and public bodies that create occasions for meeting will show up in how developed an ecosystem is.", "Successful founders usually stay in the region and return as angel investors, serial entrepreneurs, dealmakers or advisers. Failure recycles too: it is often a matter of market timing, and workers from failed ventures carry their skills on, if the local culture does not punish failure. Proposition 2 says entrepreneurs in strong ecosystems can draw on resources from earlier rounds of success and failure. Resources also persist, since entrepreneurs are tied to places by social and family bonds, but they leak, and shocks speed the leak, as the dot-com collapse did in Ottawa.", "Propositions 3a to 3c follow: well-functioning ecosystems keep more of their resources, imprint more strongly on new ventures, and weaker ones lose resources to stronger ones. The page reads Figure 1 as a movement from nascent to strengthening, resilient and, after a shock, weakened. Section 6 then defines the two dimensions. Munificence is the aggregate amount of resources, such as finance, knowledge, workers and mentors; sparse ecosystems lack them. Functionality is how easily entrepreneurs can reach them, through dense, trust-based networks and a culture of connecting."], "labels": ["Page 158", "Page 159", "Page 160", "Page 161"], "checks": [{"q": "What three symptoms does the paper give for calling the ecosystem concept a chaotic conception?", "a": "That it is tautological, that it presents a laundry list of factors with no reasoning about cause and effect, and that it is unclear at what level it should be analysed."}, {"q": "What does resource recycling mean, and what does the recycling of failure depend on?", "a": "Successful founders stay and return as investors, advisers or serial entrepreneurs, and workers from failed ventures carry their skills to other firms; recycling failure depends on a local culture that does not punish it."}], "audio": "audio/P06-04.mp3", "seconds": 175.2, "words": 379}, {"n": 5, "title": "The two figures and the policy argument", "slides": [], "readings": "", "pages": "162–164", "paragraphs": ["Figure 1 fills the page and carries its own legend. The legend names the actors, high-growth firms, anchor organisations and other ecosystem actors, and three kinds of process: resource flow, resource recycling and creation, and flow into and out of the ecosystem. Four stages are drawn. A nascent ecosystem has low connectivity, little recycling and leakage to other regions. A strengthening one has more connections and emerging dealmakers. A resilient one attracts resources from outside and creates new ones. A weakened one has been hit by a shock and loses firms and resources.", "The page turns the two dimensions into Figure 2, a square with resources across the bottom, from munificent to sparse, and network strength up the side, from well-functioning to poorly functioning. Strong ecosystems, such as Silicon Valley and Boulder, have both. Arid ones, such as Accra and Lagos, have networks but few resources. Irrigated ones, such as Calgary and Aberdeen, have resources but weak networks, which leaves them exposed when the industry turns. Weak ones, such as Hull and Flint, have neither. The flow of resources, the authors conclude, matters as much as their presence.", "Ecosystems should not be defined by their levels of activity, which would confuse cause with effect. The authors predict that strong, well-functioning ecosystems will see more growth-oriented entrepreneurship and resilient growth. For policy, the culture and networks that matter come from entrepreneurs, so the state should cultivate what exists, which Audretsch calls the strategic management of place: backing dealmakers, forums and events. Public venture capital or incubators add resources but have little effect without thick networks. Growth can also raise rents and drive out other jobs, so policy should aim at prosperity."], "labels": ["Page 162", "Page 163", "Page 164"], "checks": [{"q": "How do the four ecosystem types in Figure 2 differ?", "a": "By network strength and by how munificent their resources are: strong has both, arid has networks but few resources, irrigated has resources but weak networks, and weak has neither."}, {"q": "What does the paper say the proper role of the state is?", "a": "To cultivate the entrepreneurial community and culture that already exist rather than create resources from scratch, which the authors call the strategic management of place."}], "audio": "audio/P06-05.mp3", "seconds": 139.8, "words": 295}, {"n": 6, "title": "The conclusion and the reference list", "slides": [], "readings": "", "pages": "165–168", "paragraphs": ["The conclusion restates the problem and the contribution. Research on ecosystems has been driven by observation of success stories rather than by social science, which leaves the concept chaotic. The authors claim two contributions. The first is a stronger conceptual basis, which separates ecosystems from clusters and systems by the agent of action, the entrepreneur rather than the state, and by the resources that matter. The second is a process perspective that explains how resources flow, are recycled and are attracted. They end with a research agenda and a warning that networks can exclude people.", "These three pages are the reference list, which ends with the journal's suggested citation for the article."], "labels": ["Page 165", "Pages 166-168"], "checks": [{"q": "What two contributions does the paper claim in its conclusion?", "a": "A stronger conceptual basis that separates ecosystems from clusters and regional innovation systems, and a process perspective on how resources flow, are recycled and are attracted."}, {"q": "What does the conclusion say about who benefits from an ecosystem?", "a": "That not everyone benefits equally, since entrepreneurs can be excluded from local networks by gender, race, age or level of education."}], "audio": "audio/P06-06.mp3", "seconds": 59.7, "words": 124}], "seconds": 997.6}, "P07": {"id": "P07", "kind": "reading", "title": "Reading 7: Entrepreneurial ecosystem elements", "session": "Stam & van de Ven 2021", "lecturer": "Stam & van de Ven", "deck": "Small Business Economics 56", "authors": "Stam & van de Ven", "year": 2021, "source": "Small Business Economics 56", "lectures": ["T4"], "chapters": [{"n": 1, "title": "The paper in brief", "slides": [], "readings": "", "pages": "the whole paper", "paragraphs": ["The paper asks a question the ecosystem literature had left hanging: if regional context shapes entrepreneurship, how should that context be defined and measured, and does its quality show up in entrepreneurial output? Their answer has three parts: a definition, a ten-element model, and an index applied to the twelve Dutch provinces.", "The authors date the turn to the 1980s and 1990s, when research moved away from the entrepreneurial personality and towards the community that a venture draws on. They then name three faults in the literature. It is tautological, because a successful ecosystem is inferred from the success it is meant to explain. It offers laundry lists of factors without reasoning about cause and effect. And it is vague about the level of analysis, since an ecosystem might be a city, a region or a country.", "The definition follows. Entrepreneurial means the exploration, evaluation and exploitation of opportunities, though the authors resist narrowing it to high-growth start-ups. Ecosystem is taken from biology, through Tansley and Hawley, and keeps Hawley's three features: co-evolution, mutualistic interdependence and a complex nested system of diverse actors. An ecosystem begins when entrepreneurs pursue their own intentions, their paths cross, and cooperation and competition emerge. Coordination arrives sometimes through an ecosystem leader and sometimes through partisan mutual adjustment, which Lindblom defined as coordination without a coordinator.", "The model has ten elements, drawn from van de Ven's infrastructure for entrepreneurship. Formal institutions, culture and networks make up the institutional arrangements. Physical infrastructure, finance, leadership, talent, knowledge, intermediate services and demand make up the resources. Proprietary functions, the firms commercialising innovations, become the output, measured as productive entrepreneurship in Baumol's sense. Three propositions hold the model together: the elements co-evolve, they explain the level of activity in a territory through upward causation, and activity feeds back into them through downward causation.", "Measuring this for the Netherlands, the authors use one indicator per element, lag them one to three years behind the output, and proxy output with the share of high-growth firms. Each element is normalised to an average of one and the ten are summed, which puts an average province at ten. Utrecht reaches 12.42 and Drenthe 5.99. The correlations show three clusters, talent with new firms and business services, knowledge with leadership, and infrastructure with demand, while quality of government correlates negatively with everything else.", "The results support the propositions, with a caveat the authors state themselves. The index explains between four-tenths and six-tenths of the variation in high-growth firms, which is a strong association rather than a causal demonstration, and their own feedback results suggest endogeneity. They call the tests indications of tendencies, not direct tests of causal mechanisms, and say the aim is to understand, not to predict (page 827).", "The obvious test would regress output on the ten elements, and the authors refuse it. Substantively, an ecosystem is one system rather than ten independent causes. Statistically, the elements are so collinear that the coefficients would be meaningless. Instead they build an index, arguing that a complex system, in the sense of Simon and of Martin and Sunley, allows only limited functional decomposability.", "The contribution is therefore a measurement instrument and a claim about method. The authors name the limits: twelve regions, three points in time, one country. In the course, Lecture 4 uses the paper for the roots and the elements of the ecosystem idea (pages 809, 810 and 813). In our own reading, it helps with Question 1 of December 2024, which asks what you understand by innovation systems, sustainable transformation, institutions and agency: the model sets institutions beside resources, and proposition 3 shows entrepreneurs feeding back into their own context. Here is an example of our own, not from the paper: a founder who sells a firm and becomes a local investor changes the finance element that the next founders draw on."], "labels": [null, null, null, null, null, null, null, null], "checks": [{"q": "What is the paper's main methodological argument?", "a": "That the ecosystem should not be decomposed into ten elements for regression, because it is one system and the elements are collinear, so an index is built instead."}, {"q": "How well does the index explain entrepreneurial output?", "a": "It explains between 0.437 and 0.6245 of the variation in high-growth firms across the three years, which suggests upward causation but does not settle it."}], "audio": "audio/P07-01.mp3", "seconds": 292.2, "words": 647}, {"n": 2, "title": "The concept, the definition and the model", "slides": [], "readings": "", "pages": "809–812", "paragraphs": ["The paper opens with its abstract, which states the problem and the result together. The ecosystem idea is popular but loosely defined and measured, so the authors take a systems view of the context of entrepreneurship, build a measurement instrument, and compose an index for the Netherlands. They report that the prevalence of high-growth firms in a region is strongly related to the quality of its ecosystem, and that the elements are strongly interrelated. Stam is at Utrecht University and van de Ven at the University of Minnesota. The introduction repeats the gap, following Stam.", "The literature section traces the idea's roots. The turn came in the 1980s and 1990s, away from personality-based research and towards a community perspective, and van de Ven argued in 1993 that no entrepreneur can command all the resources and institutions a venture needs. The authors call entrepreneurship a collective achievement. They then list empirical work, from Mack and Mayer on Phoenix to Spigel on Waterloo and Calgary, before naming the concept's problems. First, it is tautological. Second, it offers laundry lists of factors without reasoning about cause and effect.", "The page finishes the critique and defines the term. The third problem is the level of analysis, since an ecosystem could be a city, a region or a country, and the authors settle on the region for most elements while laws work nationally. They then take the term apart. Entrepreneurial means the exploration, evaluation and exploitation of opportunities, though the approach often narrows it to high-growth start-ups, a claim the authors call too exclusive. Ecosystem is borrowed from biology, through Tansley's definition and Hawley's three features: co-evolution, mutualistic interdependence and a complex nested system of diverse organisations.", "The definition continues and the model begins. The authors explain how an ecosystem starts: entrepreneurs pursue their own intentions, their paths intersect, and cooperation and competition emerge, sometimes through an ecosystem leader and sometimes through partisan mutual adjustment, which Lindblom defines as coordination without a coordinator. As numbers reach a critical mass, the network becomes a loosely coupled, partly hierarchical field, and loose coupling keeps it adaptable. Figure 1 is introduced here, with productive entrepreneurship as the output. The four components come from van de Ven's 1993 list."], "labels": ["Page 809", "Page 810", "Page 811", "Page 812"], "checks": [{"q": "What three problems do the authors identify in the ecosystem literature?", "a": "It is tautological, it offers laundry lists of factors without reasoning about cause and effect, and it is unclear what the appropriate level of analysis is."}, {"q": "How do the authors define productive entrepreneurship, and whose definition do they use?", "a": "As any entrepreneurial activity that contributes directly or indirectly to the net output of the economy or to the capacity to produce additional output, following Baumol."}], "audio": "audio/P07-02.mp3", "seconds": 179.0, "words": 387}, {"n": 3, "title": "The ten elements and the three propositions", "slides": [], "readings": "", "pages": "813–816", "paragraphs": ["The authors position their model against three earlier ones. Feld stressed interaction between players and access to resources, with government enabling in the background. Isenberg named six domains: policy, finance, culture, support, human capital and markets. The World Economic Forum proposed eight pillars covering resources, actors, formal and informal institutions, and access to customers. From these and from van de Ven's infrastructure for entrepreneurship, the authors build a model of ten elements. Institutions cover formal institutions, culture and networks; resources cover physical infrastructure, finance, leadership, talent, knowledge, intermediate services and demand.", "Talent is perhaps the most important element, and the page separates it from knowledge. Human capital covers education and experience; knowledge covers science and technology, and Romer and Foray make the distinction. Talent creates and absorbs new knowledge, which is the absorptive capacity argument from Cohen and Levinthal. Intermediaries lower entry barriers and shorten time to market, and demand means money in the population to buy things. Table 1 then fixes each concept, construct and element, and the authors state three propositions: elements co-evolve, elements explain activity, activity feeds back.", "Proposition three gets its examples here. Successful entrepreneurs become investors, role models, leaders and network builders, feeding back into finance, culture, leadership and networks. Section five then explains the method, calling the ten elements middle-level constructs between abstract concepts and measurable variables. Formal institutions follow North's rules of the game, measured through the Quality of Governance survey of 34,000 citizens in 172 European regions. Culture is read indirectly, from how common new firms are, and networks from the share of businesses collaborating on innovation.", "Physical infrastructure is a composite of motorway and railway accessibility and the daily number of passenger flights reachable within a ninety-minute drive, using Spiekermann and Wegener's model on regional centroids and giving the most weight to population within four hours. Demand combines disposable income per capita with two measures of potential market demand. Leadership is measured by innovation project leaders, drawn from 2231 subsidised projects with at least two partners between 2010 and 2013, because Sotarauta finds rigorous regional studies sparse. Talent is the share of people aged 15 to 65 holding a higher education degree."], "labels": ["Page 813", "Page 814", "Page 815", "Page 816"], "checks": [{"q": "What are the ten elements?", "a": "Formal institutions, culture, networks, physical infrastructure, finance, leadership, talent, knowledge, intermediate services and demand."}, {"q": "What separates upward from downward causation?", "a": "Upward causation is structure affecting agency, the elements explaining levels of activity in a territory; downward causation is agency affecting structure, prior entrepreneurial activity feeding back into the elements."}], "audio": "audio/P07-03.mp3", "seconds": 192.4, "words": 378}, {"n": 4, "title": "Measuring the elements and the output", "slides": [], "readings": "", "pages": "817–820", "paragraphs": ["Finance is measured as venture capital for start-up and growth, taken from the private equity association's register of Dutch deals, and averaged over three lagged years because annual figures swing on a handful of deals. Knowledge is research and development spending as a share of gross domestic product. Intermediate services are the share of business service firms in the business population. All elements are lagged one to three years behind the output. Output itself is productive entrepreneurship, proxied by the share of high-growth firms, since unicorns would leave many regions at zero.", "Table 2 is the measurement table, and it is worth reading as a list. Ten elements become ten variables: quality of government, new firms, accessibility, demand, innovation collaboration, project leaders, education, venture capital, research spending and business services. Each row names the construct, the indicator and the source. The sources are a mix: a governance survey, the Dutch census bureau, a European competitiveness index, an innovation survey, a consultancy and the private equity register. Accessibility and demand are both set relative to the European average.", "The output measure is built by hand. T
