he financial newspaper, with the chambers of commerce, counts independent firms whose turnover grew at least a fifth a year for three years. The funnel behind that number is severe. Two million firms are registered, most need not publish accounts, eleven thousand published them, and after the growth, profitability and quality tests under four hundred remained. Regions differ fifteen-fold in relative terms. The unit of analysis is the province, twelve in all, though the authors concede that borders are arbitrary.", "Table 3 gives the means, minima, maxima and standard deviations for each element in three years, and the spread is wide: on most elements the top region scores more than double the bottom one. The correlations in Table 4 carry the argument. Education, new firms and business services move together; research spending and project leaders move together; accessibility and demand move together. Quality of government, oddly, correlates negatively with everything else. Figure 2 draws the same interdependence as a web. The authors read all this as support for proposition one."], "labels": ["Page 817", "Page 818", "Page 819", "Page 820"], "checks": [{"q": "Why does the paper reject unicorns as the output measure?", "a": "Because high-growth firms are already rare, and counting only privately held start-ups valued over a billion dollars would leave many regions with zero output."}, {"q": "Why is the province the unit of analysis, and what is the objection?", "a": "It is the NUTS 2 region in the Netherlands, twelve in all, but the authors accept that provincial borders are arbitrary and that a nested or polycentric view may fit better."}], "audio": "audio/P07-04.mp3", "seconds": 173.5, "words": 370}, {"n": 5, "title": "The correlation table and the two figures", "slides": [], "readings": "", "pages": "821–824", "paragraphs": ["Table 4 is the correlation matrix and the paper's first test of proposition 1. It correlates the ten elements, the index and high-growth firms with each other across 2009, 2012 and 2015. In the 2009 block, quality of government is negative against every other element, while education, venture capital and business services correlate strongly with one another, and the index correlates strongly with most elements.", "The table continues with the 2012 block and the start of 2015. Several elements correlate very highly with their own earlier values, new firms at .987 between 2012 and 2015 for instance, which the authors later read as strong path dependence. Quality of government in 2012 again correlates negatively with most other elements, and high-growth firms in 2012 correlate positively with the index.", "The table ends with the 2015 block and its key: two stars mark significance at the one per cent level, one star at five per cent, and the tests are two-tailed. In 2015 the index correlates strongly with business services and education, and high-growth firms correlate positively with the index and with most of the elements. Several values in the 2015 block are significant at the one per cent level.", "Two figures close the section. Figure 2 redraws the matrix as a web: ten nodes, a solid line for a positive correlation, a dashed one for a negative. Every dashed line runs to quality of governance, so that node is the odd one out. Figure 3 puts the index on a bar chart for the twelve provinces under three ways of combining the elements, additive, multiplicative and logarithmic. The rankings agree. The levels do not, and the logarithmic version sends the weaker provinces well below zero, which is a warning about reading the index as an absolute score."], "labels": ["Page 821", "Page 822", "Page 823", "Page 824"], "checks": [{"q": "What does Figure 2 add to the correlation table?", "a": "It shows the ten elements as nodes, with solid lines for positive and dashed lines for negative correlations, and every negative link running to quality of government."}, {"q": "What does Figure 3 show, and what is the caveat?", "a": "The index value of each Dutch province in 2009 under three combining methods, which rank the provinces alike but differ sharply in level, the logarithmic version falling below zero."}], "audio": "audio/P07-05.mp3", "seconds": 138.1, "words": 313}, {"n": 6, "title": "The index, the results and the discussion", "slides": [], "readings": "", "pages": "825–828", "paragraphs": ["In Figure 2, solid lines mark positive correlations of at least 0.6 and dotted ones negative, and education and business services are the best connected. A principal component analysis finds one dominant dimension covering every element but formal institutions. Only business services relates consistently to later high-growth firms. For proposition 3, high-growth firms correlate positively with most later element values, though not in every period. The authors then refuse a regression of output on the ten elements: a complex system allows only limited functional decomposability, following Martin and Sunley.", "The objection to regression has two halves. Substantively the ecosystem is one system, not a set of independent elements; statistically the elements are collinear, as Table 4 showed. So the authors build an index instead. Each element is normalised to an average of one, and the ten are added, which puts an average region at ten and gives a range from 12.42 in Utrecht down to 5.99 in Drenthe. A multiplicative version gives far more spread but seems to have insufficient external validity.", "Z-scores, dropping an element and later years all leave the ranking much the same. Then the test: the index and high-growth firms correlate strongly, and a simple line through them explains between four-tenths and six-tenths of the variation, depending on the year. Endogeneity is plausible, they add, and their feedback results partly confirm it. The discussion says the aim is to understand, not to predict. It finds substantial evidence for proposition 1, with strong path dependence, evidence for proposition 2, and inconsistent evidence for proposition 3, and calls the tests indications of tendencies, not direct tests of causal mechanisms.", "The systems section gives the argument its ancestry: Simon described complex systems as nearly decomposable into subsystems, and a systems approach looks at the performance of whole sets of elements. The index is offered as a quantitative complement to the case studies of Mack and Mayer and of Spigel. For the future the authors suggest Boolean comparative analysis, naming a fuzzy-set study of regions in the United States. Three implications follow. Context should not be treated as an exogenous control. Entrepreneurship is not confined to for-profit firms. And any single firm is one actor among many."], "labels": ["Page 825", "Page 826", "Page 827", "Page 828"], "checks": [{"q": "How much variation in high-growth firms does the index explain?", "a": "Between 0.437 in 2009 and 0.6245 in 2012, with 0.5256 in 2015, which the authors read as support for upward causation while warning about endogeneity."}, {"q": "What three implications does the systems view have?", "a": "Context must not be treated as an exogenous control, entrepreneurship is not confined to the for-profit sector, and any single firm is only one actor among many."}], "audio": "audio/P07-06.mp3", "seconds": 177.2, "words": 384}, {"n": 7, "title": "Limitations and the reference list", "slides": [], "readings": "", "pages": "829–832", "paragraphs": ["The limitations are stated plainly. The sample is small: twelve regions, three points in time, thirty-six observations, all in one country. The authors want the analysis repeated in city regions, larger European countries, the United States and China, and over much longer periods, because the high autocorrelations they found mean real change needs more time to show. They also concede that measurement must be local, since Dutch indicators may not travel. Elements can develop unevenly and become bottlenecks, and the process has a history of creative destruction.", "These pages are the reference list."], "labels": ["Page 829", "Pages 830-832"], "checks": [{"q": "What does the paper say should be repeated, and where?", "a": "The analysis should be repeated in other regions such as city regions in larger European countries, the United States or China, and over longer periods of preferably ten years or more."}, {"q": "Why do the authors want a longer time series?", "a": "Because the high intertemporal autocorrelations they found mean short windows cannot reveal change, and because elements may develop unevenly and act as bottlenecks."}], "audio": "audio/P07-07.mp3", "seconds": 53.6, "words": 104}], "seconds": 1206.0}, "P08": {"id": "P08", "kind": "reading", "title": "Reading 8: Entrepreneurial innovation: The importance of context", "session": "Autio et al. 2014", "lecturer": "Autio et al.", "deck": "Research Policy 43(7)", "authors": "Autio et al.", "year": 2014, "source": "Research Policy 43(7)", "lectures": ["T4"], "chapters": [{"n": 1, "title": "The paper in brief", "slides": [], "readings": "", "pages": "the whole paper", "paragraphs": ["Autio, Kenney, Mustar, Siegel and Wright edited a special issue of Research Policy on entrepreneurial innovation, and this is their introduction to it. Their question is narrow and useful: not whether entrepreneurs innovate, but when and where they do, and what in the surrounding context decides the difference. The answer they build is a framework of contexts, a comparison of two literatures, and a research agenda.", "They start from an awkward fact. Schumpeter's gales of creative destruction and Baumol's claim about national advantage both treat entrepreneurship and innovation as one thing. Policy has followed: small business research programmes, university spin-off schemes, innovation laws. Yet survey data show that fewer than 30 percent of new ventures report products new to their customers, so the majority are not innovative at all. Innovation is not entrepreneurship. What varies is the rate, and the rate varies enormously between countries and between regions inside them.", "The gap they identify is symmetrical. Innovation systems research explains structures and institutions, but it studies them at the expense of agency, reduces innovation to patentable technology, and barely mentions entrepreneurship. Entrepreneurship research has the opposite shape: broad about what counts as innovation, centred on the individual or the team, bottom up, and largely blind to context. Table 1 sets the three positions side by side, and the authors' own position is the third column, entrepreneurial innovation.", "Context, on their account, works in two ways. Selection effects decide who becomes an entrepreneur at all, through opportunity costs and social legitimacy. Strategic choice effects decide what those who enter then attempt, through what they judge desirable and feasible. Figure 1 puts six contexts around the entrepreneur: industry and technology, organization, institutions and policy, and social, with temporal and spatial dimensions overlaying them all. Their claim is that the interplay of these contexts is what makes different ecosystems produce different kinds of innovation.", "The special issue illustrates the framework rather than testing it. Agarwal and Shah compare knowledge from prior employment, universities and users. Stuart and Liu show that publication earns rewards in a science-based firm, but only for scientists in leadership roles. Nelson follows one technology from Stanford into a start-up and finds the same people behaving differently in the two settings. Clarysse and colleagues find start-ups in Flanders whose knowledge network is concentrated, whose business network is missing, and whose public funding is disconnected from both. Garud and colleagues read innovation as narrative.", "The agenda in Table 3 is honest about what is missing. We do not know how contexts shape the heuristics founders use under uncertainty, which ecosystems suit which technologies, or how ecosystems mature and decline. The policy section is the most practical part. Instruments are mapped onto each context, from German biotechnology programmes to French incubators to Taiwan's research institute. The authors end with a warning: because contexts interact, a context mix needs a policy mix, and evaluation has to become finer.", "The paper's standing for the course is as a map rather than a finding. It is an editorial introduction, so it proposes rather than demonstrates, and its own evidence is other people's papers. What it gives Lecture 4 is the vocabulary: selection and strategic choice, the four contexts with time and space over them, and the argument that context regulates what founders see, choose and achieve. In our own reading, it helps with Question 1 of December 2024, on innovation systems, sustainable transformation, institutions and agency: it joins the systems view of institutions with the founder's agency, and it says policy should foster ecosystems in each context (page 1100). Here is an example of our own, not from the paper: a university that changes its spin-off rules alters the organizational context, and so who becomes a founder."], "labels": [null, null, null, null, null, null, null], "checks": [{"q": "What is the paper's central claim about context?", "a": "That context regulates what individuals and teams get to see, what choices they are likely to make, and what the outcomes of those choices are likely to be, through selection and strategic choice effects."}, {"q": "Why is the paper a framework rather than a finding?", "a": "Because it introduces a special issue: it compares two literatures, proposes a framework of six contexts, situates other papers in it, and sets out a research agenda rather than testing hypotheses itself."}], "audio": "audio/P08-01.mp3", "seconds": 279.3, "words": 628}, {"n": 2, "title": "The gap and the two literatures", "slides": [], "readings": "", "pages": "1097–1099", "paragraphs": ["This is the introduction to a Research Policy special issue, by five authors from Imperial College, the University of California at Davis and at Berkeley, Mines ParisTech, Albany and Ghent. It opens with Schumpeter's gales of creative destruction and with Baumol's claim that entrepreneurial innovation is the true source of national competitive advantage. It lists the disruptive innovations Scherer attributed to entrepreneurial firms. Governments answered with programmes: small business innovation and technology transfer schemes in the United States, the Science Enterprise Challenge in the UK, an innovation law in France, and ProTon Europe. Innovation, the authors insist, is not entrepreneurship.", "The data make the case less comfortable. On average fewer than 30 percent of new ventures report products new to their customers, so the majority are not innovative at all. Across countries the share of technology-based new ventures with a genuinely new product runs from under a tenth to nearly half. So the question is not whether entrepreneurs innovate but when and where they do. The authors then fault two literatures: innovation systems for leaving entrepreneurship out, and entrepreneurship research for leaving context out. Figure 1 sets out their framework, and the paper's structure follows from it.", "The two literatures are then compared. Innovation systems is credited with showing that innovation is non-linear and embedded, but criticised for studying structure at the expense of agency, for reducing innovation to patentable technology, and for ignoring entrepreneurship. Entrepreneurship research goes the other way: it counts services, processes and informal property as innovation, and puts the individual or team at the centre. It works bottom up, and treats context as an afterthought. Yet context, they insist, decides what founders see, which choices look open, and how they turn out. Table 1 sets the three positions side by side."], "labels": ["Page 1097", "Page 1098", "Page 1099"], "checks": [{"q": "Why do the authors say innovation is not the same as entrepreneurship?", "a": "Because not all entrepreneurs innovate: on average fewer than 30 per cent of new ventures report products that are new to their customers, and most of the rest simply imitate."}, {"q": "What is each literature's blind spot?", "a": "Innovation systems studies structure and ignores agency, micro-foundations and entrepreneurship; entrepreneurship research centres the individual and team and treats context as an afterthought."}], "audio": "audio/P08-02.mp3", "seconds": 143.0, "words": 309}, {"n": 3, "title": "How context works, and the six contexts", "slides": [], "readings": "", "pages": "1100–1102", "paragraphs": ["Ecosystems, the authors say, regulate the direction and quality of entrepreneurial innovation, so the main purpose of policy is to foster ecosystems in different contexts. Two mechanisms organise the framework: selection effects on entry, through opportunity costs and social legitimacy, and strategic choice effects after entry, through what founders judge desirable and feasible. Six contexts follow: industry and technology, organization, institutions and policy, and social, with temporal and spatial over them. Industry context matters most early in a life cycle, and organizational context covers the firm a founder came from.", "Formal institutions cover property protection, entry regulation and the rule of law; informal ones cover culture, norms and peer influence. Social context is the network of founders, financiers, partners and customers. Temporal context matters because industries, firms and laws age, and successful founders reshape their region, as in Silicon Valley. Spatial context covers scale and founders' mobility. The special issue's papers follow: Agarwal and Shah expect academic and user founders to bring product innovations, employee founders both product and process ones, and Stuart and Liu find publication rewarded only for scientists in leadership roles.", "Table 2 summarises the special issue in a grid: authors, research question, theory, data and method, findings. Six papers appear. Agarwal and Shah compare employee, academic and user knowledge sources in a theory paper. Stuart and Liu study publication rewards in one science-based firm, using nearly two thousand person-year observations between 2001 and 2008. Nelson follows a waveguide technology from Stanford into a start-up. Leyden, Link and Siegel write on social networks. Clarysse and colleagues track a hundred and thirty-eight start-ups in Flanders. Garud and colleagues bring narrative."], "labels": ["Page 1100", "Page 1101", "Page 1102"], "checks": [{"q": "What separates selection effects from strategic choice effects?", "a": "Selection effects work on entry, shaping who becomes an entrepreneur through opportunity costs and social legitimacy; strategic choice effects work after entry, shaping what founders judge desirable and feasible."}, {"q": "What are the four contexts, and what overlies them?", "a": "Industry and technological, organizational, institutional and policy, and social contexts, overlaid by temporal and spatial dimensions."}], "audio": "audio/P08-03.mp3", "seconds": 150.6, "words": 287}, {"n": 4, "title": "The papers in the issue and the research agenda", "slides": [], "readings": "", "pages": "1103–1105", "paragraphs": ["Three papers close the summaries. Leyden, Link and Siegel model the entrepreneur as an agent acting under uncertainty in a social setting that can reduce it. Clarysse and colleagues find that the knowledge ecosystem around their start-ups in Flanders is concentrated, the business ecosystem is almost absent, and the public financial network is disconnected from both, which hurts output and survival. Garud and colleagues take a narrative view, in which founders constitute their innovations by telling stories, and regional conferences and state-sponsored expositions work as anchor events. The research agenda then opens.", "Table 3 turns the agenda into questions, sorted by which part of the framework they touch. The headings run from organization and ownership through the ecosystem itself and policy to behaviour, innovation type and performance. Behaviour is the first strand. Entrepreneurs face pervasive uncertainty about market acceptance, resources and whether the technology works, so they judge by heuristics and justify themselves with narratives. We know little about how context shapes those heuristics. Innovation type is the second, since ICT, clean technology, biotechnology, health and scientific instruments may each need a different ecosystem.", "The policy section is the practical payoff, and it maps instruments onto the contexts. Authorities can raise the quantity of entry through general measures, such as entrepreneurship education or easier registration, or target groups: women, immigrants, the unemployed, students, academics. They can also back growth with research support, export help or money to hire experienced managers. Germany built a biotechnology sector with a set of programmes. France changed the law in 1999 to let academics start firms, creating thirty university incubators, and the results fell short of expectations. Taiwan's industrial research institute is offered as a network success."], "labels": ["Page 1103", "Page 1104", "Page 1105"], "checks": [{"q": "What does Clarysse and colleagues find in Flanders?", "a": "The knowledge ecosystem is concentrated around a few central actors, the business ecosystem is almost non-existent, and the publicly backed financial network is disconnected from both, which harms innovative output and survival."}, {"q": "What does the French law of 1999 illustrate about policy?", "a": "It changed the formal and organizational context, letting academics create firms and producing thirty university incubators, yet the results fell far below expectations."}], "audio": "audio/P08-04.mp3", "seconds": 148.6, "words": 299}, {"n": 5, "title": "The conclusion and the reference list", "slides": [], "readings": "", "pages": "1106–1108", "paragraphs": ["The policy section closes the argument. The SBIR programme, which funds feasibility, then proof of concept, then the move to market, has mostly positive evaluations, though some found distortions, and several countries copied it. Spatial policy follows: Japan's cluster project, France's competitiveness poles, and immigration rules, including a United States proposal for a start-up visa and the return of trained emigrants to Taiwan and China. The conclusion then names the point: a context mix needs a policy mix, which asks more of evaluation. The reference list begins.", "These pages are the reference list."], "labels": ["Page 1106", "Pages 1107-1108"], "checks": [{"q": "What does the paper mean by needing a policy mix?", "a": "Because the contexts are interdependent, fostering one aspect of entrepreneurial innovation needs a specific combination of instruments matched to a particular combination of contexts."}, {"q": "What is the paper's overall conclusion?", "a": "That joining the innovation systems literature, which studies structures and institutions, with the entrepreneurship literature, which studies individuals and firms, through the contexts of entrepreneurial innovation, is the academic advance the field needs."}], "audio": "audio/P08-05.mp3", "seconds": 55.7, "words": 105}], "seconds": 777.2}, "P09": {"id": "P09", "kind": "reading", "title": "Reading 9: Functions of innovation systems: a new approach for analysing technological change", "session": "Hekkert et al. 2007", "lecturer": "Hekkert et al.", "deck": "Technological Forecasting and Social Change 74(4)", "authors": "Hekkert et al.", "year": 2007, "source": "Technological Forecasting and Social Change 74(4)", "lectures": ["T6"], "chapters": [{"n": 1, "title": "The paper in brief", "slides": [], "readings": "", "pages": "the whole paper", "paragraphs": ["The authors start from a claim about why some technologies spread and others do not. Innovation systems, they argue, are an important determinant of technological change, and the emergence of a new system co-evolves with the technology itself. Their problem is that the usual way of analysing such systems does not capture this. Most studies compare structures, so they describe a system as it stands rather than how it changes, and they explain performance through institutions rather than through what entrepreneurs do (page 414).", "Their answer is to study what happens inside a system. They call the relevant activities functions of innovation systems, and they propose seven of them: entrepreneurial activities, knowledge development, knowledge diffusion through networks, guidance of the search, market formation, resource mobilization, and the creation of legitimacy (pages 421-425). The unit of analysis is a technology specific innovation system, which takes a technology rather than a region or a sector as its starting point (page 416).", "The paper is conceptual. Its examples come from Sustainable Technology Development: solar cells, hydrogen, biofuels in Germany and the Netherlands, and biomass gasification. The seven functions themselves draw on empirical studies at Utrecht University (page 421). The method they propose is process analysis, or history event analysis. Events are collected from newspapers and professional journals, allocated to the seven functions, rated as positive or negative, and plotted over time (pages 427-428).", "The findings are about how the functions behave together. The authors argue that fulfilling one function quite likely affects the others, and they expect a non-linear model with many interactions (pages 425-426). Following Jacobsson and Johnson, they describe virtuous cycles that build momentum. Seven functions allow many interactions, but their empirical work shows that developments often start from a few functions that pull the others. Figure 2 shows three such patterns, which they call motors of change (page 426). They also allow for vicious cycles, and give biomass gasification as the example (page 427). First studies of biomass digestion, biomass gasification and biofuels in the Netherlands, they report, found that the functions fit the empirical data well (page 428).", "The contribution the authors claim is a framework that makes system dynamics visible and gives policy a set of targets. They say it makes comparison between systems with different institutional set-ups easier, allows a more systematic mapping of the determinants of innovation, and can deliver policy targets and instruments (page 420). They are careful about the word function. They reject the positivist and organic assumptions of functionalism, prefer Merton's middle-range propositions, and keep the term for its heuristic value only (page 429).", "The paper is a core reading for Lecture 6, Technological innovation systems, where it supplies the seven functions the lecture introduces before its Norwegian carbon capture case. That case is assessed with a related but longer list of functions, so the two lists are not identical. For the December 2024 exam, Question 3 asked how technologies in innovation systems can promote or inhibit sustainable transformation. The lecture answers that question with the functions. The paper's own advice fits: assess how well each function is fulfilled, then stimulate the weak ones or remove blocking mechanisms (page 430). Here is an example of our own, not from the paper: a new technology can have excellent laboratories behind it and still fail because no one has built a market for it."], "labels": [null, null, null, null, null, null], "checks": [{"q": "What method do the authors propose for mapping the functions?", "a": "Process analysis, or history event analysis: events are collected from newspapers and professional journals, allocated to the seven functions, rated positive or negative, and plotted over time."}, {"q": "What are the seven functions of innovation systems?", "a": "Entrepreneurial activities, knowledge development, knowledge diffusion through networks, guidance of the search, market formation, resource mobilization, and the creation of legitimacy."}], "audio": "audio/P09-01.mp3", "seconds": 262.9, "words": 565}, {"n": 2, "title": "Why a structural view of innovation systems was not enough", "slides": [], "readings": "", "pages": "413–416", "paragraphs": ["The abstract and the first lines of the introduction set up the argument. The authors say innovation systems are an important determinant of technological change, and that the emergence of a new system and changes in existing ones co-evolve with that change. Traditional analysis, which focuses on the structure of innovation systems, has proved insufficient. They therefore propose a framework built on processes they call functions of innovation systems, plus a method of process analysis or history event analysis to map them. The examples come from Sustainable Technology Development.", "The introduction defines its terms. Technological change here means technology developing in interaction with the system in which it is embedded, and an innovation is a successful combination of hardware, software and orgware, where orgware is the components of the innovation system. The authors then name two shortcomings of the innovation system framework. Most analyses are quasi-static, comparing structures rather than dynamics. And the framework's explanatory power lies in institutions at the macro level, not in the actions of the entrepreneur at the micro level.", "The authors state the central idea: analysis should map the activities that result in technological change, and these are called functions. Section 2 sets out the innovation system approach, in which innovation is both an individual and a collective act. An innovation system is defined as the institutions and economic structures that affect the rate and direction of technological change. Freeman calls it a network of institutions whose activities and interactions bring in, change and spread new technologies. The systemic character of change, the authors add, explains why change is slow and why systems lock in.", "The authors adopt the concept of a technological system, where the starting point is a technology rather than a region or a sector. They give Carlsson and Stankiewicz's definition, a network of agents that interact under an institutional infrastructure and generate, diffuse and use a technology. Lundvall, they add, also treats technological systems as a version of innovation systems, and notes that most innovation policy supports existing systems rather than new ones. Hughes's Large Technological Systems include physical artifacts; the authors exclude them and call their object a Technology Specific Innovation System."], "labels": ["Page 413", "Page 414", "Page 415", "Page 416"], "checks": [{"q": "What two shortcomings of the innovation system framework do the authors identify?", "a": "That most analyses are quasi-static and compare structures rather than dynamics, and that the framework's explanatory power lies in institutions at the macro level rather than in the actions of the entrepreneur at the micro level."}, {"q": "How does a technology specific innovation system differ from Hughes's Large Technological Systems?", "a": "The Large Technological Systems include physical artifacts, while the technology specific system takes a technology and its agents as the starting point and leaves those artifacts out."}], "audio": "audio/P09-02.mp3", "seconds": 171.8, "words": 382}, {"n": 3, "title": "From mapping structure to mapping functions", "slides": [], "readings": "", "pages": "417–420", "paragraphs": ["Figure 1 shows the boundary relations: one technology specific innovation system overlapping four national systems and three sectoral ones, which are themselves inside national systems. The authors then argue that dynamics are hard to map at national level, because the number of actors, networks and institutions is extreme. Studies of national systems therefore focus on current structure, using indicators such as R&D, patents, the quality of education, university-industry collaboration and venture capital. In a technology specific system the number of actors is much smaller, so a dynamic analysis becomes possible.", "The authors give an example of why dynamics matter. Germany and the Netherlands both support renewable energy, but Germany diffuses it faster. A structural comparison would show that German producers receive higher prices and longer contracts. A dynamic analysis would add how those regulations came about: the lobby, the opposition, external events, and the co-evolution of rules and learning. Because many activities take place in a system, only relevant ones should be mapped, meaning those that influence the system's goal of developing, applying and diffusing new technological knowledge.", "The authors review earlier lists of functions. Galli and Teubal separate hard functions, which need organizations performing R&D, from soft ones such as diffusion, policy making and standard setting. Liu and White name five activities: research, implementation, end-use, linkage and education. Johnson identifies eight system functions, from supplying incentives and resources to guiding the search, creating markets and providing legitimacy. The authors note that Johnson's set is written in an active sense, so that it is close to a set of policy recommendations.", "The authors trace how Johnson's eight functions were reduced to five in later empirical work: creating new knowledge, guiding the search, supplying resources, creating positive external economies, and forming markets. They give three reasons for adopting a functions approach. It makes comparison between systems with different institutional set-ups easier. It gives a more systematic way of mapping the determinants of innovation. And it can deliver policy targets and instruments. The page ends with a list from Smits and Kuhlmann, two of this paper's own authors, of functions that policy instruments should support."], "labels": ["Page 417", "Page 418", "Page 419", "Page 420"], "checks": [{"q": "Why is a technology specific innovation system easier to analyse dynamically than a national one?", "a": "Because it contains far fewer actors, networks and relevant institutions, which reduces complexity and makes a dynamic analysis possible at that level of aggregation."}, {"q": "What five activities do Liu and White focus on?", "a": "Research, implementation, end-use, linkage and education."}], "audio": "audio/P09-03.mp3", "seconds": 175.7, "words": 369}, {"n": 4, "title": "Seven functions for analysing an innovation system", "slides": [], "readings": "", "pages": "421–425", "paragraphs": ["The page finishes the policy argument. Smits and Kuhlmann say innovation processes need instruments that support functions such as providing platforms for learning and an infrastructure for strategic intelligence. The authors add that system-level instruments exist, such as standards and foresight programmes, but that evaluations in OECD countries find policy portfolios still dominated by financial support for R&D in individual firms. Section 5 then proposes the authors' own seven functions and describes the first: entrepreneurial activities, in which entrepreneurs turn the potential of new knowledge, networks and markets into action.", "Entrepreneurs' risky experiments cope with uncertainty and teach actors about the technology. Active entrepreneurs are a first sign of system performance; when they lag, the cause may lie in the other six functions. Van de Ven asks which functions a firm performs itself, and with which organizations it links or competes. Dutch biofuel firms lobbied together for a tax exemption while competing for R&D money. Suurs and Hekkert found diversifying incumbents more active in fulfilling system functions than start-ups. Function 2, knowledge development, covers learning by searching and by doing, mapped through R&D projects, patents and R&D investment.", "Function 3 is knowledge diffusion through networks, which the authors call a precondition for learning by interacting and, in user-producer networks, for learning by using. Function 4 is guidance of the search. Because resources are limited, choices must be made among technological options, and this selection can be made by industry, government or the market. The authors give examples: a Dutch goal of 10% renewable energy in 2020, and Californian rules obliging car makers to sell zero emission vehicles by 2003. Frenken and colleagues showed that the Californian goal raised R&D on low emission vehicles.", "The page continues guidance of the search with hydrogen: its promise as a clean fuel raises expectations that encourage research funding, and the words policy makers use signal those expectations. Function 5 is market formation. New technologies struggle against embedded ones, so they need protected space, such as temporary niche markets, or a temporary advantage through favourable taxes or minimum consumption quotas. In Germany, a tax exemption made biofuels cost the same as fossil fuels, and they reached many gas stations. In the Netherlands, the lack of a structural exemption blocked such initiatives.", "Function 6 is resource mobilization, meaning financial and human capital. The authors note that this function is hard to measure over time, so the best method is to ask core actors in interviews whether access to resources is a problem. Function 7 is the creation of legitimacy, or countering resistance to change. Parties with vested interests may oppose a new technology, and advocacy coalitions can put it on the agenda, lobby for resources and favourable tax rules, and so build legitimacy. The authors illustrate this with the German biofuels lobby, which grew from farmers' subsidies into the UFOP."], "labels": ["Page 421", "Page 422", "Page 423", "Page 424", "Page 425"], "checks": [{"q": "What is the authors' first function, and what does it cover?", "a": "Entrepreneurial activities: entrepreneurs turn the potential of new knowledge, networks and markets into concrete actions, and they can be new entrants or incumbent firms diversifying their business."}, {"q": "Why is resource mobilization hard to analyse over time, and how do the authors suggest mapping it?", "a": "Because it is difficult to capture with specific indicators, so the best method is to detect through interviews whether core actors perceive access to sufficient resources as problematic."}], "audio": "audio/P09-04.mp3", "seconds": 231.5, "words": 493}, {"n": 5, "title": "Motors of change, process analysis and the functionalist worry", "slides": [], "readings": "", "pages": "426–429", "paragraphs": ["Functions influence one another, the authors argue, so a non-linear model with many interactions is to be expected. Following Jacobsson and Johnson, they say fulfilment can produce virtuous cycles that build momentum for creative destruction. Seven functions allow many interactions, but the authors' empirical work shows developments often start from a few functions that pull the others. Figure 2 shows three such patterns, called motors of change. In sustainable technologies, a common trigger is guidance of the search: government goals bring resources, then knowledge and rising expectations. Another is entrepreneurs lobbying for resources or for market formation.", "Vicious cycles are also possible: in Dutch biomass gasification, high expectations met poor results from demonstration projects, disappointment spread, and the system took years to recover. System change, the authors argue, happens only when functions reach certain thresholds, so the order of events matters, and the dominant variance approach, which ignores that order, is inadequate. The process approach, or sequence analysis, explains outcomes by the sequence of events and tells a story line. Its unit is the event. Van de Ven's Minnesota studies mapped events around single projects; the authors collect system-level events from newspaper archives and professional journals.", "These events, such as workshops, new R&D projects, expectations in the press and announced resources, are allocated to the seven functions. This also tests the list: many events that fit no function would show it is incomplete. First studies of biomass digestion, biomass gasification and biofuels in the Netherlands found that the functions fit the data well. Each event is rated positive or negative, and seven plots over time support a storyline, from which cross-case analysis seeks general patterns. Section 8 then names functionalism's two features: an objective social world studied like nature, and society modelled on an organism.", "The authors share the criticisms of both features. Against positivism, they stress that social reality is contingent and reflexive, citing their focus on entrepreneurs. In the organic view, agents serve the survival of the whole, like organs in a body, and Parsons even saw the world as a system of societies. The authors prefer Merton's middle-range propositions to grand theory, and keep the word function for its heuristic value, not its positivistic one. Section 9 begins the conclusions: the innovation system concept is useful but too static and too little concerned with the micro level."], "labels": ["Page 426", "Page 427", "Page 428", "Page 429"], "checks": [{"q": "What does the authors' term motors of change refer to?", "a": "Three initial patterns of interaction, shown in Figure 2, in which a limited number of functions pull the others and set a virtuous cycle going."}, {"q": "Why do the authors prefer the process approach to the variance approach?", "a": "Because the variance approach ignores the order of events, while system change depends on thresholds and sequence, and the process approach explains outcomes as the result of that order."}], "audio": "audio/P09-05.mp3", "seconds": 192.1, "words": 409}, {"n": 6, "title": "Conclusions and the reference list", "slides": [], "readings": "", "pages": "430–432", "paragraphs": ["The conclusions close the argument: mapping functions over time gives insight into dynamics, and process analysis suits this because it treats change as a sequence of events. The authors say the insight is likely to be highly relevant for policy. A first step is to understand how the relevant system currently functions, and the next is to deploy systemic instruments that stimulate weak functions or remove blocking mechanisms. They call for further theoretical and empirical work. The page then carries the acknowledgements and the start of the reference list.", "These pages are the reference list."], "labels": ["Page 430", "Pages 431-432"], "checks": [{"q": "What do the authors say policy should do with the functions?", "a": "Use insight into how the relevant system currently functions, then deploy systemic instruments that stimulate weak functions or remove blocking mechanisms."}], "audio": "audio/P09-06.mp3", "seconds": 50.7, "words": 106}], "seconds": 1084.7}, "P10": {"id": "P10", "kind": "reading", "title": "Reading 10: CCS technological innovation system dynamics in Norway", "session": "Steen et al. 2024", "lecturer": "Steen et al.", "deck": "International Journal of Greenhouse Gas Control 136", "authors": "Steen et al.", "year": 2024, "source": "International Journal of Greenhouse Gas Control 136", "lectures": ["T6"], "chapters": [{"n": 1, "title": "The paper in brief", "slides": [], "readings": "", "pages": "the whole paper", "paragraphs": ["Steen and colleagues ask what are the strengths and weaknesses of the carbon capture and storage innovation system in Norway. The question matters because CCS is vital to most net-zero scenarios and especially important in hard-to-abate sectors, such as energy-intensive processing industries and waste (page 1). Capture is technically possible, but key challenges persist: financing, low carbon prices, transport and storage infrastructure, insufficient regulation and policy, public acceptance, and legitimacy.", "The authors work in the sustainability transitions field and use the technological innovation system, or TIS, framework (page 2). A TIS has three building blocks: actors, networks and institutions. Its performance is then read through functions, the processes that build and spread a technology. The paper uses eight, adapted from Bergek and colleagues and listed in Table 1 (page 3): knowledge development and diffusion, entrepreneurial experimentation, market formation, direction of search, resource mobilization, legitimation, development of positive externalities, and materialization. Materialization is the one the authors say has had little attention, and they add it because CCS depends on large physical infrastructure (page 2).", "The design is mixed-methods with an emphasis on qualitative work (page 3). Nineteen semi-structured interviews were conducted from 2020 to 2022 with firms, public bodies, NGOs and interest organisations. Most were held online, then transcribed and coded in NVivo against the framework. Notes from a December 2021 workshop with the CaptureX advisory board added to the data, and tentative results were presented at a second workshop in September 2022 to validate the findings. Bibliometric and patent data support the knowledge function, and the appendices print the search strings, the comparison figures, the quotes and the interview guide.", "The authors find that the system has grown quickly and still has systemic weaknesses (page 9). Knowledge development is considerable, but diffusion is limited because each project is customised and firms protect their intellectual property. Experimentation is rising across user sectors, yet much of it stays with amine capture. Market formation is rated weak: costs are high, the business case is unclear, and the emissions trading system does not yet justify investment. Resource mobilization is weak on people, with experts near retirement, and on capital beyond exploration. Materialization is weak because little has been built outside oil and gas, with Longship and Northern Lights as the exceptions. Legitimation, direction of search, experimentation, knowledge and externalities are rated intermediate. Overall, the authors say, momentum appears positive, not least because of the launch of large-scale projects, with Longship the most prominent, and the growing number of actors (page 10). Their most striking finding on legitimacy is that it rises as CCS moves from fossil energy into waste and process industry (page 9).", "The authors' aims are mainly empirical: a current account of one national CCS system. They say the case also adds to the transitions literature by considering how political, sectoral and geographical context shape the system's dynamics, and by including materialization. They name three limits (page 11): other interviewees might have produced slightly different results; how the segments of the value chain interact needs more work; and CCS innovation is international, so a wider geographical lens would help.", "The paper is a core reading for Lecture 6, Technological innovation systems and sustainable transformation, where it is the empirical case that follows Hekkert and colleagues' functions. For the June 2025 exam, Question 3 asked how technological innovation systems can be guided to promote sustainable transformation. The lecture answers with the framework: find the weak functions and aim policy at them. The paper supports this. Assessing strengths and weaknesses, it says, allows detailed policy recommendations (page 3), and it calls for a more comprehensive policy mix beyond Longship (page 10). Here is an example of our own, not from the paper: a technology can have strong research behind it and still stall because nobody has paid for the pipes that would carry its product away."], "labels": [null, null, null, null, null, null], "checks": [{"q": "What question does the paper ask?", "a": "What are the strengths and weaknesses of the CCS innovation system in Norway."}, {"q": "Which function do the authors add to the usual set, and why?", "a": "Materialization, because CCS requires large-scale investment in physical infrastructure and the function has received limited attention."}], "audio": "audio/P10-01.mp3", "seconds": 297.0, "words": 649}, {"n": 2, "title": "The question, the framework and the Norwegian setting", "slides": [], "readings": "", "pages": "1–4", "paragraphs": ["The title page carries the abstract and the first lines of the introduction. CCS is presented as a key technology for cutting emissions in hard-to-abate sectors, such as energy-intensive processing industries and the waste sector. Capture is technically possible, yet challenges persist, and over the past decade the focus has turned from the energy sector to energy-intensive industry. There has been little social science research on CCS innovation dynamics, which the authors approach as socio-technical change, and most studies stay within one sector, such as oil and gas. Their finding: systemic weaknesses, yet a relatively positive momentum.", "The authors use the TIS framework to ask what the strengths and weaknesses of the CCS innovation system in Norway are. Norway is chosen as a CCS frontrunner; the earlier TIS study of Norwegian CCS, by van Alphen and colleagues, is around 15 years old. Longship, one of the first full-scale value chains for land-based industry, is being finalised in 2024. The latest White Paper on energy says Norway can play an important role in developing CCS. Section 2 presents the TIS blocks, actors, networks and institutions, and cites Jacobsson and Bergek: structure alone does not predict performance.", "The section closes by noting that earlier Norwegian studies covered only oil, gas and fossil energy, while CCS now spreads across sectors whose value-chain elements differ in maturity. Section 3 then sets out the method: a mixed-methods design with emphasis on qualitative work, 19 semi-structured interviews from 2020 to 2022 with firms, public actors, NGOs and interest organisations, mostly online, coded in NVivo. Workshop notes and feedback on tentative results helped validate the findings. The setting is the whole value chain, and Table 1 lists eight functions, from knowledge development to materialization.", "The page traces the Norwegian record. Capture began at Sleipner in 1996 and Snøhvit in 2008, with the 1991 CO2 tax a key driver. The Mongstad full-scale project, launched in 2006, was cancelled in 2013 over cost uncertainty, though its test centre remains. Longship followed in 2020, with two capture sites and ship transport to a saline aquifer. The page then sets out the actors and networks. Informally, CCS meets no strong opposition and has broad political support; formally, the ETS is seen as insufficient, and rules on cross-border CO2 transfer are a bottleneck."], "labels": ["Page 1", "Page 2", "Page 3", "Page 4"], "checks": [{"q": "Why do the authors choose Norway as the case?", "a": "Because Norway is considered a CCS frontrunner, and because the earlier TIS study of Norwegian CCS, by van Alphen and colleagues, is around 15 years old, so an update is due."}, {"q": "How was the interview material produced and coded?", "a": "Through 19 semi-structured interviews from 2020 to 2022, mostly online, transcribed and coded in NVivo, with two workshops used to check the findings."}], "audio": "audio/P10-02.mp3", "seconds": 188.3, "words": 399}, {"n": 3, "title": "Knowledge, experimentation, markets and the direction of search", "slides": [], "readings": "", "pages": "5–7", "paragraphs": ["The first function, knowledge development and diffusion, is measured partly through publication. Table 2 puts SINTEF first with 247 publications and NTNU second with 213. Behind them come the universities of Bergen, Oslo and Stavanger and Equinor. Norwegian publishing rose from 15 papers in 2010 to 115 in 2022. On patenting, the authors report a stable regional picture, with Norway low in absolute terms but highest per head together with Denmark. The rest of the page traces how knowledge moved from oil and gas into power and then process industries, and why amine capture dominates.", "The page ends the knowledge function with what practitioners still need: strategies for full value chains, smaller units, inland operation and lower energy use. Diffusion is held back because each project is customised and firms protect their intellectual property, an obstacle the authors also find in earlier research; the European ECCSEL platform is given as a counter-example. The second function, entrepreneurial experimentation, is then introduced: pilots and demonstrations are spreading across user sectors, and actor and technological complexity has grown. Two charts carry the publishing and patent numbers.", "Both amine solutions chosen for Longship were developed and tested at TCM, operating since 2012, though one centre cannot meet every plant's needs. The state required early choice of suppliers to keep costs down, while picking two suppliers reflected its wish for variety: a policy dilemma. Market formation is growing from a low base: most plants worldwide serve enhanced oil recovery, costs remain a main challenge, and storage, not capture, is named as what made a value chain feasible. Direction of search has moved to cement, waste and other process industries."], "labels": ["Page 5", "Page 6", "Page 7"], "checks": [{"q": "Why is knowledge diffusion limited in this field?", "a": "Because CCS implementation is customised from project to project and actors protect their intellectual property, so learning is hard to transfer; the ECCSEL platform is given as a positive exception."}, {"q": "What policy dilemma does the state's role in Longship create?", "a": "Balancing the cost of supporting testing and demonstration against the need to keep variety in capture technology, since the state required early selection of suppliers."}], "audio": "audio/P10-03.mp3", "seconds": 136.5, "words": 290}, {"n": 4, "title": "Resources, legitimacy and the verdict on the functions", "slides": [], "readings": "", "pages": "8–10", "paragraphs": ["Informants are slightly concerned about people: many experts are close to retirement, oil and gas engineers move across only partly, and start-ups struggle to hire. On money, green finance is plentiful for exploration, but investors want a revenue stream before funding deployment. Longship costs an estimated NOK 25.1 billion, two thirds from the state. The page also sets out CLIMIT, which gave about NOK 2.7 billion between 2005 and 2022. Legitimacy then opens: informants describe it as fluctuating, though Norway stands out for high acceptance.", "Legitimacy gets the most space. The authors report that CCS gained acceptance as it moved from oil and gas to waste and process industry, and that all informants see it as necessary for cement and waste-to-energy. Costs remain a legitimacy problem, and informants ask for more full-scale projects and stronger political will. Positive externalities are present, with specialised suppliers in every segment, though learning across projects is limited because plants are unique. Materialization is limited beyond oil and gas. Table 3 rates market formation, resource mobilization and materialization weak, the rest intermediate.", "Compared with van Alphen and colleagues' earlier study, the authors rate knowledge development and legitimation intermediate where it found them relatively strong, while direction of search and experimentation have strengthened. Market formation and resources were weak in both. Context shapes the dynamics: attention after the Paris agreement, petroleum actors still central to transport and storage, offshore storage facing less opposition, and lack of power supply halting some projects. The conclusions then note that announced projects multiply while investment lags, and that support beyond Longship is not yet enough for investment decisions."], "labels": ["Page 8", "Page 9", "Page 10"], "checks": [{"q": "Which functions does Table 3 rate as weak?", "a": "Market formation, resource mobilization and materialization; the other five are rated intermediate."}, {"q": "How does this assessment differ from van Alphen and colleagues' earlier study?", "a": "They rated knowledge development and legitimation relatively strong where this paper rates them intermediate; direction of search and experimentation have strengthened since; market formation and resource mobilization were weak in both."}], "audio": "audio/P10-04.mp3", "seconds": 137.2, "words": 284}, {"n": 5, "title": "Conclusions, limitations and the appendices", "slides": [], "readings": "", "pages": "11–13", "paragraphs": ["The conclusions close with what would make CCS feasible: concerted efforts from policy, societal pressure and demand for low-carbon products. The authors then state three limitations. Other interviewees might have produced slightly different results, though they hold the assessment to be robust. How dynamics differ across value-chain segments needs more work. And CCS innovation is international, so a wider geographical view would help. After the funding statement, Appendix 1 lists the organisations interviewed and Appendix 2 begins the search strings.", "Appendix 2 gives the search strings: publications from Scopus with the terms carbon capture or carbon storage for 2010 to 2022, and three patent steps covering capture, transport and storage. Appendix 3 adds two comparison figures, indexed publishing for the North Sea countries and patents per million inhabitants, the first built on three-year moving averages. Appendix 4 then begins the table of verbatim interview quotes, arranged by function, starting with knowledge development and diffusion.", "The quote table continues through the functions, printed verbatim and grouped by function. A public body explains that it cannot share what it learns because the details are business secrets. A technology user says a plant has to test capture on its own flue gas rather than at a shared centre. A storage provider points to the economics of scale at an injection site. A cluster describes how carbon capture fluctuated, with peaks and troughs, and is now widely recognised as a tool."], "labels": ["Page 11", "Page 12", "Page 13"], "checks": [{"q": "What three limitations do the authors name?", "a": "That other interviewees might have led to slightly different results, that dynamics across value-chain segments need more study, and that CCS innovation is international rather than national."}, {"q": "What does Appendix 4 add, and what does Appendix 3 show?", "a": "Appendix 4 collects verbatim interview quotes by function; Appendix 3 compares publishing and patenting across North Sea countries."}], "audio": "audio/P10-05.mp3", "seconds": 116.9, "words": 250}, {"n": 6, "title": "The interview guide and the reference list", "slides": [], "readings": "", "pages": "14–16", "paragraphs": ["The page closes Appendix 4 with three more quotes: petroleum firms bring offshore experience, too few projects reach the ground, and Norway's permanent storage may be the game changer. Appendix 5 then prints the generic interview guide, adapted to each informant: purpose of the study, the informant, the organisation, motivations and direction of search, technology and knowledge, experimentation, market formation, money and people, legitimacy, and closing questions. The reference list begins at the foot of the page.", "These pages are the reference list."], "labels": ["Page 14", "Pages 15-16"], "checks": [{"q": "What does the generic interview guide in Appendix 5 cover?", "a": "The study's purpose, the informant, the organisation, motivations and direction of search, technology and knowledge, experimentation, market formation, money and people, legitimacy, and closing questions."}], "audio": "audio/P10-06.mp3", "seconds": 49.0, "words": 96}], "seconds": 924.9}, "P11": {"id": "P11", "kind": "reading", "title": "Reading 11: Crowdfunding and innovation: a bibliometric review and future research agenda", "session": "Bargoni et al. 2024", "lecturer": "Bargoni et al.", "deck": "European Journal of Innovation Management 27(4)", "authors": "Bargoni et al.", "year": 2024, "source": "European Journal of Innovation Management 27(4)", "lectures": ["B1"], "chapters": [{"n": 1, "title": "The paper in brief", "slides": [], "readings": "", "pages": "the whole paper", "paragraphs": ["The paper asks three questions about a literature that has grown quickly. How has research on crowdfunding and innovation evolved? Which fields and research streams have emerged from the two? And which questions are still open (page 1111)? It matters because earlier mappings of crowdfunding took single aspects, such as one campaign model or the success factors of a campaign. None framed the knowledge structure of the whole field.", "The authors treat crowdfunding as more than a source of money. On page 1110 they argue that it is also a valid instrument to foster innovation. Collective financing lets users act like venture capitalists. Crowdfunding spread for two reasons: it finances innovation at lower cost than traditional finance, and it tests projects outside the organisation. Three concepts carry the analysis. Innovativeness comes in two forms. On page 1115, following Chan and Parhankangas, incremental innovativeness is a cumulative improvement of existing technology, knowledge and capabilities. Radical innovativeness is more drastic, unique and comprehensive. Openness comes from open innovation. Following Stanko and Henard, crowdfunding can be viewed as an embodiment of that paradigm, since it seeks ideas from outside (page 1116). Social capital is the third, defined on page 1117 through Nahapiet and Ghoshal as the resources available through the network of relationships of an individual or social unit.", "The method is a bibliometric review. The authors searched Elsevier's Scopus in January 2022. They looked for articles with crowdfunding terms and innovation terms in the title, abstract or keywords. A PRISMA diagram took 2,544 records down to 150 studies (page 1112). They analysed those 150 with VosViewer and the Bibliometrix package in R. Three tools did the work: co-citation of cited references, co-occurrence of author keywords, and a conceptual thematic map (page 1113). The map sorts themes by Callon's centrality and density. The articles were written by 379 authors in 115 journals, with 31 citations per document on average (page 1114).", "The co-citation network gives three clusters (page 1121). They are crowdfunding as a source of radical and incremental innovation, crowdfunding and the openness construct, and crowdfunding and platform innovation. The keyword analysis gives seven, from crowdfunding and innovation through knowledge to crowdfunding, innovation and social media (page 1119). The thematic map puts reward-based crowdfunding among the motor themes. Crowdfunding, fintech and equity crowdfunding sit among the basic and transversal themes, and venture financing among the niche themes. Finance is left isolated among the emerging themes (page 1120). The paper reports that 2018 and 2019 were the strongest years, with 64 articles. Ordanini et al. is the most cited work, with 544 citations (page 1114). The paper closes with 25 research questions in three clusters (page 1123).", "The authors call this the first study to combine content analysis with bibliometric analysis on these two fields (page 1121). They say it offers a holistic view and a research agenda (page 1127). They name two limits. Scopus was the only source, so work indexed elsewhere, such as Web of Science, may be missing. Articles in languages other than English were excluded (page 1127).", "The paper is the reading for the bonus lecture, The art of crowdfunding. That lecture uses the thematic map from page 1120 to explain motor, basic, emerging and niche themes. The lecture notes that crowdfunding was not on the December 2024 or the June 2025 exam. Question 2 of December 2024 asked how agency in innovation systems can promote or inhibit sustainable transformation. Our Bonus lecture page suggests, as an example of our own rather than the lecturer's, that crowdfunding communities could be one form of such agency. Here is an example of our own, not from the paper: a small firm could use backers' pledges to show demand for a green product. The paper's nearest point, on page 1125, is that SMEs and MNEs may use crowdfunding to reduce uncertainty about demand."], "labels": [null, null, null, null, null, null], "checks": [{"q": "What are the three clusters of the co-citation analysis?", "a": "Crowdfunding as a source of radical and incremental innovation, crowdfunding and the openness construct, and crowdfunding and platform innovation."}, {"q": "Which database and which software did the authors use?", "a": "Scopus, with VosViewer and the Bibliometrix package in R."}], "audio": "audio/P11-01.mp3", "seconds": 314.8, "words": 647}, {"n": 2, "title": "The question, the three research questions and the search", "slides": [], "readings": "", "pages": "1109–1112", "paragraphs": ["This bibliometric review of the literature linking crowdfunding and innovation appears in the European Journal of Innovation Management. The abstract gives the purpose: to identify, evaluate and synthesise earlier research on the intertwining of the two fields. It reports a meta-analysis of 150 articles from Scopus, analysed with VosViewer and the Bibliometrix package in R, and names three clusters: radical and incremental innovation, openness, and platform innovation. The introduction opens with pooling resources, which has let entrepreneurs start businesses and large companies launch products with less risk of go-to-market failure.", "The introduction argues that crowdfunding is not only a way to raise money but also a valid instrument to foster innovation. Choosing which innovation to develop and commercialise is usually made by a small group of experts, or by venture capitalists in a start-up. Users of technology, rather than manufacturers, create key innovations, and collective financing lets users act like venture capitalists. Crowdfunding spread for two reasons: it finances innovation at lower cost than traditional finance, and it tests projects outside the organisation. Earlier mappings covered single aspects, so the authors ask how the literature has evolved.", "Two more questions follow: which fields and research streams have emerged, and which future questions could develop the field. The method is a systematic review of work from 2010 to 2022, using co-citation analysis, keyword co-occurrence, thematic analysis and keyword analysis in VosViewer and Bibliometrix. The authors chose Scopus for its quality standards, its coverage of 1.7 billion cited references from 1970, and its business and management journals. The search ran in January 2022, combining crowdfunding terms with innovation, R&D, research and development and open innovation.", "Figure 1 is a PRISMA flow diagram. It starts with 2,544 articles retrieved by the database search. English language leaves 2,487. Two subject areas, business, management and accounting, and economics, econometrics and finance, leave 933. Peer-reviewed articles leave 888. Reading titles and abstracts leaves 410. The total included in the quantitative synthesis is 150. The text adds that the search was not restricted by date, that conference proceedings and books were excluded, and that unrelated and duplicate articles were removed. The section then introduces VosViewer for the citation and keyword networks."], "labels": ["Page 1109", "Page 1110", "Page 1111", "Page 1112"], "checks": [{"q": "How many articles does the PRISMA diagram start with, and how many does it end with?", "a": "It starts with 2,544 retrieved articles and ends with 150 studies included in the quantitative synthesis."}, {"q": "Which three research questions does the paper ask?", "a": "How the literature on crowdfunding and innovation has evolved over time, which fields and research streams have emerged, and which future research questions could develop the field."}], "audio": "audio/P11-02.mp3", "seconds": 200.8, "words": 383}, {"n": 3, "title": "The three tools, the publication trends and the first two clusters", "slides": [], "readings": "", "pages": "1113–1116", "paragraphs": ["Three tools carry the analysis. Co-citation rests on a point from Ziman: \"a scientific paper does not stand alone; it is embedded in the literature of the subject\". It can be run on authors, journals or articles, and, citing Akbari and colleagues, it is called the most popular relational technique in bibliometric studies. Keyword co-occurrence clusters words used most often together, sizing nodes by weight. The thematic map sorts themes by Callon's centrality, the strength of external ties, and density, the internal strength. The results open with 150 articles by 379 authors in 115 journals, averaging 31 citations each.", "Table 1 gives 2010 to 2022, 115 sources, 150 documents, 8,854 references, 464 author keywords, 379 authors and 22 single-authored documents, at 31 citations per document. Figure 2 plots total studies per year and a second line labelled TC/TS. Following Shneor and Vik, the text links the 2010 start to two platforms, Prosper for peer-to-peer lending in 2005 and Kickstarter for reward crowdfunding in 2009. Output in 2013 was five times the year before, and 2018 and 2019 were the strongest years with 64 articles, 32 of them in 2019. Ordanini et al. is the most cited, with 544 citations.", "Figure 3 is the co-citation network: three coloured clusters joined through one central paper by Mollick and Nanda. Cluster A is crowdfunding as a source of radical and incremental innovation. Chan and Parhankangas separate incremental innovativeness, a cumulative improvement of existing technology, knowledge and capabilities, from radical innovativeness, which is more drastic, unique and comprehensive. Their findings suggest that backers join campaigns they see as familiar and feasible, while campaigns that demand more effort to understand are riskier. The page also separates crowdfunding as finance for innovation from crowdfunding as the crowd's way into the innovation process.", "Managing information to the public is a strategic competence, and an open call can show whether an entrepreneur meets delivery deadlines. But feedback can overwhelm a manager and take unsustainable time, while ignoring it can backfire in negative postings. Crowdfunding's contribution to innovation thus goes beyond money, to the crowd's participation. Cluster A closes on green innovation, where a sustainability orientation can help raise funds. Cluster B opens on openness. Following Stanko and Henard, crowdfunding embodies open innovation; they find that open search depth helps product market performance, while breadth pushes a radical focus."], "labels": ["Page 1113", "Page 1114", "Page 1115", "Page 1116"], "checks": [{"q": "How do Chan and Parhankangas distinguish the two forms of innovativeness?", "a": "Incremental innovativeness is a cumulative improvement of existing technology, knowledge and capabilities; radical innovativeness is more drastic, unique and comprehensive."}, {"q": "What do Stanko and Henard find about open search depth and breadth?", "a": "Depth positively affects product market performance, while breadth induces a radical innovation focus."}], "audio": "audio/P11-03.mp3", "seconds": 214.8, "words": 411}, {"n": 4, "title": "Social capital, platform innovation, the keyword clusters and the thematic map", "slides": [], "readings": "", "pages": "1117–1120", "paragraphs": ["Cluster B turns to social capital, defined through Nahapiet and Ghoshal as the resources available through the network of relationships of an individual or social unit. Skirnevskyi et al. find that resources from earlier campaigns shape later ones, and that serial creators replace family and friends with the platform community to sustain success beyond one campaign. Disclosure is meant to limit adverse selection. Cluster C opens with platforms as intermediaries in a two-sided market, where project owners subsidise the platform and contributors are subsidised, and with Ordanini et al.'s experience investors, drawn by the novelty of the tool.", "The page adds that crowdfunders cannot always judge a project, so Parker notes that uninformed investors follow the informed few. Burtch et al. find that hiding information about earlier contributors lowers later contributions. Social media then enter: Vismara associates many friends on Facebook, Twitter or Instagram with success, and the page describes platforms as social network hubs. The keyword analysis follows, on articles with at least seven keyword occurrences, sorted into seven clusters. Crowdfunding and innovation are the largest nodes. The first cluster is crowdfunding and innovation through knowledge.", "Figure 4 is the keyword co-occurrence network, and Table 2 sets out the seven clusters with their items and topics. Cluster I is crowdfunding and innovation through knowledge, with fintech, patents and professional investors among its keywords. Cluster II is intellectual capital, cluster III technological innovation, with blockchain and mechanism design, cluster IV civic innovation, cluster V open innovation, cluster VI business innovation, and cluster VII crowdfunding, innovation and social media. The page adds that only keywords appearing at least three times were included.", "Figure 5 is the conceptual thematic map, with density on the vertical axis and centrality on the horizontal. Motor themes, high on both, are led by reward-based crowdfunding, which is tied to reducing information asymmetry and can act as a pre-test before commercialisation. Basic and transversal themes have low density and high centrality and include crowdfunding, fintech and equity crowdfunding, a tool for long-term capital spending on projects that need time. Emerging themes are weak on both, and finance sits isolated there. Niche themes have high density but low centrality, such as venture financing."], "labels": ["Page 1117", "Page 1118", "Page 1119", "Page 1120"], "checks": [{"q": "Which keyword cluster in Table 2 covers civic innovation?", "a": "Cluster IV, on crowdfunding and civic innovation."}, {"q": "Which theme leads the motor quadrant of the thematic map, and what does it do?", "a": "Reward-based crowdfunding, which is tied to reducing information asymmetry and can act as a pre-test before commercialisation."}], "audio": "audio/P11-04.mp3", "seconds": 185.8, "words": 386}, {"n": 5, "title": "The discussion and what the clusters mean for managers", "slides": [], "readings": "", "pages": "1121–1123", "paragraphs": ["The discussion answers the first question: research began in 2010 and grew until 2018 and 2019, the strongest years. The authors call this the first study to combine content analysis with bibliometric analysis on these two fields. The citation network yields the three clusters, and the page restates the first. Metrick and Yasuda had suggested that equity investors prefer extremely innovative ventures, but the crowdfunding audience is wider than professional investors. Incremental campaigns are more comprehensible and create more user value, while radical ones are riskier and attract less participation.", "The page finishes cluster B: external social capital matters early, internal social capital grows across the campaign. The third cluster follows, where social media spread the campaign, reduce uncertainty and even help predict success. It then lists the seven topics found by keyword analysis. The thematic map puts equity crowdfunding and innovation in the mainstream and leaves finance and signalling to be developed. A strategic diagram traces three sub-periods, 2010 to 2014, 2015 to 2018 and 2019 to 2022, where kick-starter and start-up disappear while open innovation arrives. An analysis of countries, authors and keywords finds China the largest contributor.", "The three clusters give crowdfunders and platform managers cues on using crowdfunding to stimulate innovation, and on how innovation attracts both sides of a platform. Cluster A helps entrepreneurs present a campaign: incremental innovativeness reads as more comprehensible, radical as riskier. Cluster B speaks to managers who want innovation with less risk than doing it all internally, and to social capital. For cluster C, the authors posit that links with social media could help project performance. The future research section reports 25 questions in Table 3. Financing innovation is hard because backers must be convinced and their uncertainty lowered."], "labels": ["Page 1121", "Page 1122", "Page 1123"], "checks": [{"q": "Why do incremental campaigns attract more participation than radical ones?", "a": "Incremental campaigns are perceived as more comprehensible and generate more user value, while radical ones are riskier to develop and attract less crowdfunder participation."}, {"q": "Which three sub-periods does the strategic diagram trace?", "a": "2010 to 2014, 2015 to 2018 and 2019 to 2022."}], "audio": "audio/P11-05.mp3", "seconds": 151.5, "words": 306}, {"n": 6, "title": "Twenty-five questions for future research", "slides": [], "readings": "", "pages": "1124–1126", "paragraphs": ["Table 3, over two pages, sets questions from earlier work beside proposed avenues. Cluster A asks how consumers react to incremental and radical innovativeness, how entrepreneurial orientation affects early fundraising, and whether crowdfunding raises innovation. Its avenues compare professional investors with crowdfunders, and look at start-ups, SMEs and MNEs, backer interaction and green projects. Cluster B asks about information quality, other meanings of radicalness, openness in small firms, kinds of updates and cross-national differences. Its avenues cover openness and market performance, disclosure and adverse selection, niche platforms and backer comments.", "The page returns to uncertainty. Platforms could profile users by their appetite for more or less innovative projects, and target them better. The page contrasts start-ups with SMEs and MNEs. Start-ups come for scarce resources. SMEs and MNEs may come to reduce uncertainty about aggregate demand and to de-risk a launch. The page also stresses the two-way flow of information: more backers bring more ideas to work with. That opens questions on managerial competences. The cluster C block closes the table, on platform innovation, influencer endorsement, blockchain and longitudinal work on success factors.", "The text asks which managerial competences a campaign needs; SMEs and MNEs are less studied than enthusiastic founders. Green innovation is hard to finance for three reasons: risky projects, backers' lack of technical knowledge, and consumers who are not ready. Since adoption speed and scale matter more than the innovation itself, the authors suggest research on subsidies. For cluster B, crowdfunding is a setting where technology opens firms to outside knowledge, linking initiators, pledgers, donors and platforms. Open questions include openness and market performance, disclosure, online communities and niche platforms. Cluster C begins with integration with social media."], "labels": ["Page 1124", "Page 1125", "Page 1126"], "checks": [{"q": "What three reasons does page 1126 give for the difficulty of financing green innovation?", "a": "Projects are seen as very risky, backers lack specific technical know
