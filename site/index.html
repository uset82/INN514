<meta charset="utf-8">
<title>INN514 Course Companion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap">
<style>
/* A quiet reading site: warm ivory page, a bookish serif for headings and reading,
   a small sans for the interface, one clay accent. Two doors on the front page are
   the only bold element; everything else is hairlines, space and one reading sheet. */
:root {
  --bg: #FAF9F5;            /* page */
  --surface: #FFFFFF;       /* reading sheet, doors, player */
  --surface-2: #F0EEE6;     /* hover, current chapter, chips, meter track */
  --ink: #141413;           /* text */
  --ink-2: #3D3D3A;         /* lede, bylines */
  --muted: #6B6A63;         /* meta, numbers */
  --line: #E5E2D8;          /* hairlines, borders, route line */
  --clay: #D06B4A;          /* fills only: progress, marks, active underline */
  --clay-ink: #B4532E;      /* links, focus ring */
  --on-clay: #FFFFFF;       /* text on the primary button */
  --btn: #B4532E;           /* primary and play button */
  --btn-hover: #9E4627;
  --glow: #F6E7DF;          /* paragraph being read */
  --glow-ink: #141413;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --s-1: .8125rem; --s0: 1rem; --s1: 1.25rem; --s2: 1.5625rem; --s3: 1.9375rem; --s4: 2.4375rem;
  --sp-1: .25rem; --sp-2: .5rem; --sp-3: .75rem; --sp-4: 1rem; --sp-5: 1.5rem; --sp-6: 2rem; --sp-7: 3rem; --sp-8: 4rem;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
  --header-h: 3.5rem;
  --player-h: 8.75rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #262624; --surface: #30302E; --surface-2: #3A3936; --ink: #F2F0E8; --ink-2: #D9D6CC;
    --muted: #A6A39A; --line: #45443F; --clay: #D97757; --clay-ink: #E08A6B; --on-clay: #1F1E1D;
    --btn: #D97757; --btn-hover: #E08A6B; --glow: #4A3529; --glow-ink: #F8EDE6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #262624; --surface: #30302E; --surface-2: #3A3936; --ink: #F2F0E8; --ink-2: #D9D6CC;
  --muted: #A6A39A; --line: #45443F; --clay: #D97757; --clay-ink: #E08A6B; --on-clay: #1F1E1D;
  --btn: #D97757; --btn-hover: #E08A6B; --glow: #4A3529; --glow-ink: #F8EDE6; color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: var(--s0); font-weight: 400; line-height: 1.5;
  padding-bottom: calc(var(--player-h) + env(safe-area-inset-bottom, 0px) + var(--sp-5));
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; font-family: var(--serif); font-weight: 500; }
p, dl, dt, dd, ul, ol { margin: 0; }
ul, ol { padding: 0; }
button { font: inherit; color: inherit; }
a { color: var(--clay-ink); text-underline-offset: 2px; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--clay-ink); outline-offset: 2px; border-radius: 6px; }
.wrap {
  max-width: 1080px; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.skip {
  position: fixed; top: var(--sp-2); left: var(--sp-4); z-index: 20;
  transform: translateY(-300%); background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--r-md);
  padding: var(--sp-3) var(--sp-4); font-weight: 500; text-decoration: none;
}
.skip:focus { transform: none; }

/* Top bar: always there, so a way back is always one tap away */
.topbar {
  position: sticky; top: 0; z-index: 6; height: var(--header-h);
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); height: 100%; }
.brand { font-family: var(--sans); font-size: .9375rem; font-weight: 600; letter-spacing: -.01em;
  color: var(--ink); text-decoration: none; }
.brand span { font-weight: 400; color: var(--muted); }
.mainnav { display: flex; gap: var(--sp-1); margin-left: auto; }   /* the links sit at the right, beside the theme button */
.mainnav a { position: relative; display: inline-flex; align-items: center; min-height: 2.75rem; padding: 0 var(--sp-3);
  border-radius: var(--r-sm); color: var(--muted); font-size: .9375rem; font-weight: 500;
  text-decoration: none; transition: background-color .15s; }
.mainnav a:hover { background: var(--surface-2); color: var(--ink); }
.mainnav a[aria-current="page"] { color: var(--ink); }
/* A straight underline: an inset shadow would follow the link's rounded corners. */
.mainnav a[aria-current="page"]::after { content: ""; position: absolute; left: var(--sp-3); right: var(--sp-3);
  bottom: 0; height: 2px; border-radius: 1px; background: var(--clay); }
.theme-btn { display: grid; place-items: center; width: 2.75rem; height: 2.75rem; border: 0; border-radius: var(--r-sm); background: none; color: var(--muted); cursor: pointer; }
.theme-btn:hover { background: var(--surface-2); color: var(--ink); }
.theme-btn svg { width: 1.25rem; height: 1.25rem; }
.i-moon { fill: currentColor; }
.i-sun { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.theme-btn.is-dark .i-moon { display: none; }
.theme-btn:not(.is-dark) .i-sun { display: none; }
.search-btn svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; width: 1.25rem; height: 1.25rem; }
.search-input { width: 100%; max-width: 36rem; height: 2.75rem; padding: 0 1rem; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font: inherit; font-size: 1rem; }
mark { background: var(--glow); color: var(--glow-ink); border-radius: 3px; padding: 0 .1em; }

/* Page heads: Classes, Papers, a class, a paper */
.page-head { display: grid; gap: var(--sp-3); max-width: 44rem; padding-block: var(--sp-6) var(--sp-5); }
.page-head h1 { font-size: clamp(1.75rem, 1.2rem + 2.4vw, 2.4375rem); line-height: 1.12; text-wrap: balance; }
.lede { font-family: var(--serif); font-size: 1.25rem; font-weight: 400; line-height: 1.55;
  color: var(--ink-2); max-width: 34em; }

/* Front page */
.home-hero { display: grid; gap: var(--sp-5); max-width: 44rem; padding-block: var(--sp-7) var(--sp-6); }
.home-hero .intro { display: grid; gap: var(--sp-2); }
.home-hero h1 { font-size: clamp(2.25rem, 1.4rem + 3.6vw, 3.25rem); font-weight: 500; line-height: 1.08;
  letter-spacing: -.015em; text-wrap: balance; max-width: 13em; }
.when-line { color: var(--muted); font-size: .9375rem; font-weight: 500; }
.resume-row { display: grid; gap: var(--sp-2); justify-items: start; }
.primary { display: inline-flex; align-items: center; gap: var(--sp-2); min-height: 2.75rem;
  padding: .55rem 1.15rem; border: 0; border-radius: 999px; background: var(--btn); color: var(--on-clay);
  font-family: var(--sans); font-size: .9375rem; font-weight: 500; cursor: pointer; transition: background-color .15s; }
.primary:hover { background: var(--btn-hover); }
.primary svg { width: 1rem; height: 1rem; fill: currentColor; }
.resume-line { color: var(--muted); font-family: var(--serif); font-size: 1.0625rem; line-height: 1.5; }

/* The two doors: the one bold element */
.doors { display: grid; gap: var(--sp-4); }
@media (min-width: 720px) { .doors { grid-template-columns: 1fr 1fr; gap: var(--sp-5); } }
.door { display: grid; gap: var(--sp-3); align-content: start; color: var(--ink); text-decoration: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: var(--sp-5); transition: border-color .15s; }
.door:hover { border-color: var(--clay); }
.door h2 { font-size: var(--s3); font-weight: 500; line-height: 1.1; }
.door p { font-family: var(--serif); font-size: 1.0625rem; line-height: 1.55; color: var(--ink-2); }
.door .stats { color: var(--muted); font-family: var(--sans); font-size: var(--s-1);
  font-variant-numeric: tabular-nums; }
.door .more { color: var(--clay-ink); font-size: .9375rem; font-weight: 500; text-decoration: underline;
  text-underline-offset: 3px; }
.door:hover .more { text-decoration-thickness: 2px; }
.meter { display: block; height: 4px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.meter::after { content: ""; display: block; height: 100%; width: calc(var(--p, 0) * 100%);
  background: var(--clay); border-radius: 999px; transition: width .4s ease; }

/* Front page sections */
.home-section { display: grid; gap: var(--sp-4); max-width: 44rem; margin-top: var(--sp-7); }
@media (min-width: 720px) { .home-section { margin-top: var(--sp-8); } }
.home-section h2, .next h2 { font-size: var(--s2); font-weight: 500; line-height: 1.2; }
.home-section h2.small { font-size: var(--s0); }
.about-text { font-family: var(--serif); font-size: 1.125rem; line-height: 1.7; max-width: 65ch; }
.howto { display: grid; gap: var(--sp-4); }
.howto > div { display: grid; gap: var(--sp-1); }
.howto dt { font-family: var(--sans); font-size: var(--s0); font-weight: 600; }
.howto dd { font-family: var(--serif); font-size: 1.0625rem; line-height: 1.6; color: var(--ink-2); }
.note { color: var(--muted); font-size: var(--s-1); line-height: 1.45; max-width: 62ch; }

/* Class and paper lists: one row each, a hairline between, the whole row the link */
.list { list-style: none; }
.row { position: relative; display: grid; grid-template-columns: 3rem minmax(0, 1fr); column-gap: var(--sp-3);
  padding: .9rem .75rem; border-radius: var(--r-md); transition: background-color .15s; }
/* The hairline is its own element, so the row's rounded hover corners do not bend it. */
.row + .row::before { content: ""; position: absolute; top: 0; left: .75rem; right: .75rem; height: 1px;
  background: var(--line); }
.row:hover { background: var(--surface-2); }
.row .num { font-family: var(--serif); font-size: var(--s2); font-weight: 500; line-height: 1.15;
  color: var(--muted); font-variant-numeric: tabular-nums; }
.row-title { display: block; font-family: var(--serif); font-size: var(--s1); font-weight: 500; line-height: 1.25;
  color: var(--ink); text-decoration: none; text-wrap: balance; }
a.row-title::after { content: ""; position: absolute; inset: 0; border-radius: var(--r-md); }
a.row-title:hover { text-decoration: underline; text-underline-offset: 3px; }
.row-teacher { color: var(--ink-2); font-size: .9375rem; line-height: 1.45; margin-top: var(--sp-1); }
.row-note { color: var(--muted); font-size: var(--s-1); line-height: 1.45; margin-top: var(--sp-1); max-width: 42em; }
.row .meta { color: var(--muted); font-size: var(--s-1); line-height: 1.45; font-variant-numeric: tabular-nums;
  margin-top: var(--sp-1); }
.row .meter { height: 3px; max-width: 12rem; margin-top: var(--sp-2); display: none; }
.row.heard .meter { display: block; }
.row.soon .num, .row.soon .row-title { color: var(--muted); }
.row.session { cursor: default; }
.row.session .num, .row.session .row-title { color: var(--muted); }
.row.session:hover { background: none; }
.row .go { color: var(--clay-ink); font-size: var(--s-1); font-weight: 500; text-decoration: underline;
  text-underline-offset: 2px; }

/* Papers: the same rows, with the paper number in the first column */
.list.papers .row { grid-template-columns: 4.75rem minmax(0, 1fr); }
.paper-no { padding-top: .2rem; color: var(--muted); font-family: var(--sans); font-size: var(--s-1);
  font-weight: 500; font-variant-numeric: tabular-nums; }
.list.papers .row-title { font-size: 1.125rem; }

/* Papers page: one group per class */
.group + .group { margin-top: var(--sp-7); }
.group h2 { font-family: var(--sans); font-size: var(--s0); font-weight: 600; line-height: 1.4; }
.group h2 a { color: var(--ink); text-decoration: none; }
.group h2 a:hover { text-decoration: underline; text-underline-offset: 3px; }
.group-teacher { color: var(--muted); font-size: var(--s-1); margin-top: var(--sp-1); }
.group .list { margin-top: var(--sp-2); }

/* Breadcrumb */
.crumbs { display: flex; align-items: center; gap: var(--sp-2); padding-block: var(--sp-4) 0;
  font-size: var(--s-1); font-weight: 500; }
.crumbs a { color: var(--clay-ink); text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.crumbs .sep, .crumbs span { color: var(--muted); }
.lec-top { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
.pager { display: flex; gap: var(--sp-2); padding-top: var(--sp-4); }
.pager-btn { display: inline-flex; align-items: center; gap: var(--sp-1); min-height: 2.75rem; padding: 0 .9rem; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); font-size: var(--s-1); font-weight: 500; text-decoration: none; transition: background-color .15s; }
.pager-btn:hover { background: var(--surface-2); }
.pager-btn svg { width: 1rem; height: 1rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* A class or a paper: the header lines */
.lec-head { display: grid; gap: var(--sp-3); max-width: 44rem; padding-block: var(--sp-4) var(--sp-6); }
.lec-head h1 { font-size: clamp(1.75rem, 1.2rem + 2.4vw, 2.4375rem); line-height: 1.12; text-wrap: balance; }
.when { color: var(--muted); font-size: var(--s-1); line-height: 1.45; font-variant-numeric: tabular-nums; }
.when a { color: var(--clay-ink); text-decoration: none; }
.when a:hover { text-decoration: underline; }
.by { color: var(--ink-2); font-size: .9375rem; line-height: 1.55; }
.by a { color: var(--clay-ink); }
.lec-head .primary { justify-self: start; margin-top: var(--sp-2); }
.src a { color: var(--clay-ink); }
.pg { margin: var(--sp-5) 0 var(--sp-2); font-family: var(--sans); font-size: var(--s-1); font-weight: 600;
  color: var(--clay-ink); font-variant-numeric: tabular-nums; scroll-margin-top: calc(var(--header-h) + 1rem); }
.src + .listen + .pg { margin-top: var(--sp-1); }

/* A class or a paper: chapters beside one reading sheet */
.lec-body { display: grid; gap: var(--sp-6); }
@media (min-width: 860px) {
  .lec-body { grid-template-columns: 17rem minmax(0, 1fr); align-items: start; }
  .side { position: sticky; top: calc(var(--header-h) + var(--sp-4));
    max-height: calc(100vh - var(--header-h) - var(--player-h) - 2rem); overflow: auto; }
}
.side h2 { font-family: var(--sans); font-size: var(--s-1); font-weight: 600; color: var(--muted);
  margin-bottom: var(--sp-2); padding-inline: .6rem; }
/* The chapter route: one line, a mark per chapter, the clay fill as you listen */
.route { list-style: none; }
.stop { position: relative; display: grid; grid-template-columns: 1.25rem minmax(0, 1fr);
  column-gap: var(--sp-2); }
.chapters .stop { grid-template-columns: 1.25rem minmax(0, 1fr); column-gap: var(--sp-2); }
.chapters .stop::before { content: ""; position: absolute; left: .625rem; top: 0; bottom: 0; width: 1px;
  background: var(--line); transform: translateX(-.5px); }
.chapters .stop:first-child::before { top: 1.5rem; }
.chapters .stop:last-child::before { bottom: calc(100% - 1.5rem); }
/* The fill runs from this chapter's mark (centre 1.475rem down) to the next chapter's mark. */
.chapters .fill { position: absolute; left: calc(.625rem - 2px); top: 1.475rem; width: 4px; border-radius: 999px;
  height: calc(var(--p, 0) * 100%); background: var(--clay); transition: height .4s ease; }
.chapters .stop:last-child .fill { display: none; }
.mark { grid-column: 1; grid-row: 1; justify-self: center; margin-top: 1.1rem; width: .75rem; height: .75rem;
  border-radius: 50%; background: var(--bg); border: 2px solid var(--muted); position: relative; z-index: 1; }
.stop.done .mark { background: var(--clay); border-color: var(--clay); }
.stop.now .mark { background: var(--clay); border-color: var(--ink); }
.chapters .body { grid-column: 2; display: grid; grid-template-columns: 1.25rem minmax(0, 1fr) auto;
  column-gap: var(--sp-2); align-items: baseline; width: 100%; min-height: 2.75rem; text-align: left;
  padding: .55rem .6rem; border: 0; border-radius: var(--r-md); background: none; cursor: pointer;
  transition: background-color .15s; }
.chapters .body:hover, .chapters .now .body { background: var(--surface-2); }
.chapters .num { color: var(--muted); font-size: var(--s-1); font-weight: 500; font-variant-numeric: tabular-nums; }
.chapters .title { min-width: 0; font-size: .9375rem; line-height: 1.35; }
.chapters .now .title { font-weight: 600; }
.chapters .dur { color: var(--muted); font-size: var(--s-1); font-variant-numeric: tabular-nums; }

.sheet { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: var(--sp-6) clamp(1rem, 4.5vw, 2.75rem); }
.chapter { scroll-margin-top: calc(var(--header-h) + 1rem); }
.chapter + .chapter { margin-top: var(--sp-6); padding-top: var(--sp-6); border-top: 1px solid var(--line); }
.chapter h2 { display: flex; gap: var(--sp-3); align-items: baseline; margin-bottom: var(--sp-2);
  font-size: var(--s2); font-weight: 600; line-height: 1.15; text-wrap: balance; }
.chno { color: var(--clay-ink); font-variant-numeric: tabular-nums; }
.src { color: var(--muted); font-size: var(--s-1); line-height: 1.45; margin-bottom: var(--sp-3); }
.listen { display: inline-flex; align-items: center; gap: var(--sp-2); min-height: 2.75rem;
  margin-bottom: var(--sp-4); padding: .4rem 1rem; border: 1px solid var(--line); border-radius: 999px;
  background: transparent; color: var(--ink); font-size: var(--s-1); font-weight: 500; cursor: pointer;
  transition: background-color .15s; }
.listen svg { width: .8rem; height: .8rem; fill: var(--clay-ink); }
.listen:hover { background: var(--surface-2); }
.prose { font-family: var(--serif); font-size: 1.125rem; line-height: 1.7; max-width: 65ch;
  margin: 0 -.45rem var(--sp-4); padding: .1rem .45rem; border-radius: var(--r-sm);
  transition: background-color .25s; }
.prose.now { background: var(--glow); color: var(--glow-ink); }
details.check { margin-top: var(--sp-5); border: 1px solid var(--line); border-radius: var(--r-md);
  padding: var(--sp-3) var(--sp-4); }
details.check > summary { cursor: pointer; color: var(--clay-ink); font-size: .9375rem; font-weight: 500; }
.qa { display: grid; gap: var(--sp-4); margin-top: var(--sp-3); }
.qa .q { font-size: .9375rem; font-weight: 600; }
.qa details summary { cursor: pointer; color: var(--muted); font-size: var(--s-1); }
.qa details p { margin-top: var(--sp-2); font-family: var(--serif); font-size: 1.0625rem; line-height: 1.6;
  max-width: 62ch; }

/* Where next */
.next { display: grid; gap: var(--sp-4); max-width: 44rem; margin-top: var(--sp-7); }
.next ul { list-style: none; display: grid; gap: var(--sp-3); }
.next li { display: grid; gap: var(--sp-1); }
.next .label { color: var(--muted); font-size: var(--s-1); line-height: 1.45; }
.next a { font-size: .9375rem; font-weight: 500; line-height: 1.5; }
.next .links { font-size: .9375rem; font-weight: 500; line-height: 1.5; }

.soon-note { max-width: 44rem; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: var(--sp-5); color: var(--muted); }

/* Player, docked at the bottom; its title leads back to what is playing */
.player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--surface);
  border-top: 1px solid var(--line);
  padding-bottom: calc(var(--sp-2) + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.player .in { max-width: 1080px; margin-inline: auto; display: grid; gap: var(--sp-2); padding-top: var(--sp-2); }
.row1 { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
.now-title { flex: 1; min-width: 0; display: block; color: var(--ink); font-size: .9375rem; font-weight: 500;
  text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now-title:hover { text-decoration: underline; text-underline-offset: 3px; }
.chip { flex: none; height: 2rem; padding: 0 .7rem; border: 1px solid var(--line); border-radius: 999px;
  background: none; color: var(--ink); font-size: var(--s-1); font-weight: 500; cursor: pointer;

to 4 are about the seminar presentations, so we skip them. Slide 7 gives the plan of the lecture in five parts: crowdfunding, some art, responsible innovation, putting things together, and final considerations. Slide 9 shows the three readings, by Bargoni and colleagues, by Quero and Ventura, and by Demattos Guimarães and colleagues.", "Slide 10 started a live class poll about crowdfunding. Before you go on, pause and ask yourself what you already know about crowdfunding.", "Slides 11 and 12 give three definitions. Crowdfunding is the co-thinking of micro-investors who provide small amounts of money to support ideas. It is the pooling of small financial contributions from a potentially large pool of interested backers. And it is community-enabled financing, usually through online platforms.", "Slide 13 cites Shneor and colleagues, from 2020. Crowdfunding has two main logics and four main models. Under the logic of investment are the equity model and the lending model. Under the logic of non-investment are the reward-based model and the donation model.", "Slide 14 shows a figure by the lecturer, based on the Crowdcreator.eu website. Its centre reads: crowdfunding beyond raising funds. Around it are seven roles. Pre-selling can change the culture sector's chain of production, distribution and consumption. Crowdfunding can test the market and deal with uncertain demand. It can give proof of concept, from legitimacy to revealing demand. It allows community engagement, from product feedback to co-creation. It builds community, in line with the social networks of the culture sector. It makes room for socially engaged arts and collective mobilisation. And it supports crowdsourcing and cultural commons. Two arrows frame the circle. One runs from new modes of economy towards market aspects, and the other from market aspects towards intangible dimensions."], "checks": [{"q": "Into which two main logics does slide 13 divide crowdfunding?", "a": "The logic of investment and the logic of non-investment."}, {"q": "What are the four main crowdfunding models listed on slide 13?", "a": "Equity and lending under the logic of investment; reward-based and donation under the logic of non-investment."}], "audio": "audio/B1-01.mp3", "seconds": 164.7, "words": 345}, {"n": 2, "title": "The culture sector and art thinking", "slides": [15, 16, 17, 18, 19, 20], "readings": "none new", "paragraphs": ["Slide 15 opens the second part, on art and the culture sector.", "Slide 16 shows two arrows pointing in opposite directions. One points towards the anthropological sense of culture. The other points towards culture that is driven by technology and innovation. Between them sit two overlapping circles: the culture sector, and the cultural-creative industries. The circle of the cultural-creative industries reaches further towards the technology side.", "Slide 17 gives a snapshot of the culture sector with two models. On the right is Throsby's concentric circles model. Core cultural expression sits at the centre: literature, music, performance and visual arts. Around it come other core creative industries, such as cinema, museums and photography. Next come wider cultural industries, such as publishing, recording and video games. The outer ring holds related industries, such as fashion, design and architecture.", "On the left are four cultural policy paradigms, from Bonet and Négrier: excellence, cultural democratization, cultural democracy, and the creative or cultural economy. Their overlaps carry labels such as excellence for all, star system and prosumer. The label CF, for crowdfunding, sits where cultural democratization, cultural democracy and the creative economy overlap.", "Slides 18 and 19 present the Art Thinking method, taken from the Art Thinking website. Slide 18 shows how the website describes it: an agile method to create the improbable with certainty, using the artist's mindset, with three steps and six practices. Slide 19 shows six steps in a cycle. Donate means being involved, sharing and giving without knowing what you can gain. Deviate means stealing ideas, objects or symbols from one context to use them in another. Destroy means challenging the status quo and your own work. Drift means doing things without knowing exactly where you are going, and finding new partners. Dialogue means discussing to learn, understand and change your creation. Display means showing your work to an audience. Between the steps, the figure places three headings: make, criticize and be exposed.", "Slide 20 shows a quote over a collage of images: \"Every act of creation is first an act of destruction\". The slide does not say who said it."], "checks": [{"q": "Where does crowdfunding sit in the cultural policy diagram on slide 17?", "a": "Where cultural democratization, cultural democracy and the creative or cultural economy overlap."}, {"q": "What are the six steps of the Art Thinking method on slide 19?", "a": "Donate, deviate, destroy, drift, dialogue and display, with the headings make, criticize and be exposed placed between them."}], "audio": "audio/B1-02.mp3", "seconds": 169.7, "words": 358}, {"n": 3, "title": "Responsible research and innovation", "slides": [21, 22, 23, 24, 25], "readings": "none new", "paragraphs": ["Slide 21 opens the third part, on responsible innovation.", "Slide 22 started a second class poll, this time on responsible innovation. Before you go on, ask yourself what responsible innovation means to you.", "Slide 23 quotes Helga Nowotny, from 2005, and adds the word responsible in brackets before innovation. Innovation, the quote says, is the collective bet on a common, fragile future. Neither science nor society knows the secret of how to cope with its uncertainties. It has to be done in some sort of alliance, with a sense of direction that is shared.", "Slide 24 quotes Stilgoe and colleagues, from 2013. Responsible research and innovation, or RRI, is about taking care of the future through collective stewardship of science and innovation in the present. The slide lists four dimensions of RRI: anticipation, reflexivity, inclusion and responsiveness. In our own words, not the slide's: anticipation means thinking ahead about possible futures, reflexivity means questioning your own assumptions, inclusion means bringing more voices in, and responsiveness means being ready to change course.", "Slide 25 has the title: RRI has the word research. It quotes Grunwald, from 2011. Responsibility is assigned in concrete social and political spaces, which involve and affect concrete actors. Often, explicit reflection on responsibility, and its attribution, is meant to influence how decisions are governed in that field."], "checks": [{"q": "According to Stilgoe and colleagues on slide 24, what are the four dimensions of responsible research and innovation?", "a": "Anticipation, reflexivity, inclusion and responsiveness."}, {"q": "How does the Nowotny quote on slide 23 describe innovation?", "a": "As a collective bet on a common, fragile future, which has to be done in an alliance with a shared sense of direction."}], "audio": "audio/B1-03.mp3", "seconds": 111.3, "words": 226}, {"n": 4, "title": "Putting the frameworks together: The Equilibrist Hope", "slides": [26, 27, 28, 29, 30, 31], "readings": "Demattos Guimarães et al. 2024, p. 10", "paragraphs": ["Slide 26 opens the fourth part, which puts things together.", "Slide 27 shows a figure adapted from Jakobsen and colleagues, from 2019. Responsible innovation sits in the centre of three linked circles: materiality, discourse and organization. A dashed outer circle is labelled territoriality. Each circle links to a box. Materiality links to the crowdfunding platform. Discourse links to a collection of narratives. Organization links to the culture sector's funding and financing ecosystem, and that box ends with a question mark. Beside the figure, the slide quotes Grunwald, from 2011: researchers, rather than mere observers, can be interveners.", "Slide 28 is about storytelling. It sets arts and culture beside a lifelong funding and financing struggle, and beside digitalization and platformization. It shows the logo of ArtistShare, a crowdfunding platform. Citing Handke and Dalla Chiesa, from 2021, it places the tension between art and commerce at the heart of cultural-creative crowdfunding, or CCCF. And it asks: is crowdfunding really an innovation for the culture sector? The slide leaves the question open.", "On page 10 of their 2024 article, Demattos Guimarães and colleagues write that cultural-creative crowdfunding all started with ArtistShare, which became a blueprint for many later platforms.", "Slide 29 presents a research project called The Equilibrist Hope: perspectives and prospectives on cultural-creative crowdfunding. It describes itself as a theory development endeavour. Its research gap is the need to understand CCCF in a more nuanced way, aligned with the dynamics of the culture sector. Its research question is: how can crowdfunding, specifically CCCF, be understood as a co-creation tool of responsible innovation amid the diverse culture sector?", "Slide 30 names the three fields the project brings together. The first is alternative finance, particularly crowdfunding and specifically CCCF. The second is the complex, diverse and multidisciplinary culture sector, with its cultural and creative industries. The third is responsible research and innovation.", "Slide 31 shows the approach as a diagram. Two large circles overlap. The left circle holds the lens, or narratives, of the culture sector: cultural policy, narratives from cultural economics with a market perspective, and counter-narratives of a holistic, intangible culture sector. The right circle holds the many theory domains of crowdfunding: narratives from general finance and from alternative finance, and counter-narratives of other economies, with symbolic and social innovation. CCCF sits where the two circles overlap. From there, an arrow points up to cross-industry innovation in the wave of digitalization. Below, the figure of crowdfunding beyond raising funds from chapter 1 appears again. The whole is framed as a universe of contemplation, seen through the lens of RRI."], "checks": [{"q": "On slide 27, what do materiality, discourse and organization link to?", "a": "Materiality to the crowdfunding platform, discourse to a collection of narratives, and organization to the culture sector's funding and financing ecosystem, which the slide marks with a question mark."}, {"q": "What question does slide 28 ask about crowdfunding in the culture sector?", "a": "Is crowdfunding really an innovation for the culture sector?"}], "audio": "audio/B1-04.mp3", "seconds": 213.6, "words": 436}, {"n": 5, "title": "Cultural-creative crowdfunding and innovation research", "slides": [32, 33, 34, 35, 36], "readings": "Bargoni et al. 2024, p. 1120", "paragraphs": ["Slide 32 defines cultural-creative crowdfunding. It was pioneered by artists. It lies where alternative or entrepreneurial finance meets the culture sector, and it is a promising channel of resources for cultural-creative productions. In short, the slide defines it as a way of financing projects, initiatives or ventures in the culture sector and its creative industries, by asking a crowd or community of supporters for contributions and support through online platforms.", "Slide 33 quotes Korsgaard and colleagues, from 2016. At the local level, depth and complexity are added to the entrepreneurial function. This opens the possibility of more sensitivity to the creative recombination of resources, to socio-spatial embeddedness, and to the many values sought and realised in entrepreneurial processes.", "Slide 34 lists five themes: complexity and duality, labour conditions, democratic aspects, horizontality and the characteristics of social network systems, and the co-creation of values.", "Slide 35 shows a conceptual thematic map from the review by Bargoni and colleagues, from 2024. The map has two axes: development degree, or density, and relevance degree, or centrality. Together they divide it into four quadrants. On page 1120, the authors explain each one. Motor themes have high density and high centrality. The main one is reward-based crowdfunding, linked mainly to reducing information asymmetry. It can boost product innovation by acting as a pre-test before a product is commercialised. Basic and transversal themes have low density and high centrality. They include crowdfunding, fintech and equity crowdfunding. Equity crowdfunding is a major tool for long-term capital spending on innovative projects. Emerging themes have low density and low centrality; here, finance stands isolated. Niche themes, with high density and low centrality, include venture financing.", "Slide 36 repeats the three fields named in chapter 4: alternative finance, the culture sector, and responsible research and innovation."], "checks": [{"q": "According to Bargoni and colleagues on page 1120, what is the main motor theme?", "a": "Reward-based crowdfunding, linked mainly to reducing information asymmetry and acting as a pre-test before commercialisation."}, {"q": "What are the four quadrants of the thematic map on slide 35?", "a": "Motor themes, basic and transversal themes, emerging themes, and niche themes."}], "audio": "audio/B1-05.mp3", "seconds": 154.7, "words": 303}, {"n": 6, "title": "Value co-creation and the Mola case", "slides": [37, 38, 39, 40, 41], "readings": "Quero & Ventura 2019, pp. 53, 60", "paragraphs": ["Slide 37 looks at more than raising money: the role of crowdfunding in developing cultural projects.", "Slide 38 shows a figure credited to the 2019 article by Quero and Ventura. Seven circles surround a star: co-ideation, co-evaluation of ideas, co-design, co-testing, co-launch, co-financing and co-consumption. A dashed line labelled co-production encloses part of the figure.", "The article explains where such categories come from. On page 53, Quero and Ventura describe the \"Five Co's\" model of Russo and Mele, from 2012: co-ideation, co-evaluation of ideas, co-design, co-test and co-launch. Quero and Ventura, in 2015, added two categories for crowdfunding: co-investment and co-consumption. On page 60, the article lists eight types of value co-creation, adding co-authoring, and frames them as value proposition categories. Notice two differences from the slide. The slide says co-financing where the article says co-investment, and the slide adds co-production but not co-authoring.", "Slide 39 announces a case. Slides 40 and 41 show the fourth Mola structural kit on Kickstarter. The campaign page describes it as an intuitive hands-on tool to simulate how real-world structures behave, now with origami and curved bars to build arches and shells. It shows that 508 backers pledged 160,933 dollars to help bring the project to life. The lecture shows this case right after the co-creation figure."], "checks": [{"q": "Which five categories made up the \"Five Co's\" model of Russo and Mele, as described on page 53?", "a": "Co-ideation, co-evaluation of ideas, co-design, co-test and co-launch."}, {"q": "How does the figure on slide 38 differ from the categories on page 60 of the article?", "a": "The slide says co-financing where the article says co-investment, and it adds co-production but not co-authoring."}], "audio": "audio/B1-06.mp3", "seconds": 114.8, "words": 221}, {"n": 7, "title": "The Norwegian market and the platform puzzle", "slides": [42, 43, 44, 45], "readings": "Demattos Guimarães et al. 2024, pp. 8, 10", "paragraphs": ["Slide 42, titled some reflection, shows a chart of crowdfunding values in Norway from 2012 to 2020, in million Norwegian kroner. Rotem Shneor prepared it for the Norwegian Crowdfunding Association. The chart covers all crowdfunding in Norway, not only culture, split by model: reward, donation, equity, and peer-to-peer lending to businesses, consumers and property. The total grew from 0.77 million kroner in 2012 to 892 million in 2020.", "Slide 43 is called the CCCF puzzle: between platforms, business models and practices. It asks four questions. Is the culture sector exploring and conceptualising them all? Or is there some oversight, or underused channels that lack classification? Is an expanded understanding missing, together with a change of mindset? And is a clearer distinction needed between generalist and specialised platforms? The slide leaves them open.", "Slide 44 has two diagrams. On the left, from Dalla Chiesa and Rykkja, from 2024, cultural-creative crowdfunding platforms form a digital middleground between a new upper ground and the crowd, with arrows running both ways. On the right, adapted from Bonet and Négrier, from 2018, the four cultural policy circles from chapter 2 appear again, and CCCF sits in the middle, where their circles meet.", "Slide 45 shows a figure from the 2024 article by Demattos Guimarães and colleagues. On pages 8 and 10, the article reports that the study mapped 89 crowdfunding platforms in Europe and Latin America. The figure places CCCF where crowdfunding and the culture sector intersect. It then sorts the platforms in two ways. By institutional structure, they are for-profit, non-profit, or on a partnership spectrum. By relational form of practice, they include crowd stores, producer agents or crowd publishers, alternative income through subscriptions, art market investment, collective mobilisation, and white-label co-financing."], "checks": [{"q": "According to the chart on slide 42, how much did crowdfunding in Norway total in 2012 and in 2020?", "a": "0.77 million Norwegian kroner in 2012 and 892 million in 2020, across all models, not only culture."}, {"q": "How do Dalla Chiesa and Rykkja position crowdfunding platforms on slide 44?", "a": "As a digital middleground between a new upper ground and the crowd."}], "audio": "audio/B1-07.mp3", "seconds": 148.6, "words": 297}, {"n": 8, "title": "Final considerations and the exam", "slides": [46, 47, 48, 49, 50], "readings": "none new", "paragraphs": ["Slide 46 opens the final considerations.", "Slide 47 draws two conclusions. Cultural-creative crowdfunding is a chameleon tool of diverse practices, aligned with how the culture sector and its creative industries work. And it calls for a multi-angle perspective, about the co-construction of a broader perception of values.", "Slide 48 lists the references for the lecture. Slides 49 and 50 close with time for questions and a thank you.", "How does this bonus lecture relate to the exam? Crowdfunding was not on the December 2024 or the June 2025 exam. But Question 2 in December 2024 asked how agency in innovation systems can promote or inhibit sustainable transformation. Here is an example of our own, not from the lecture: crowdfunding communities, where creators and backers act together, could be one example of agency in such an answer. If you use it, link it to the course's theories of agency and innovation systems, and stay with what the readings show."], "checks": [{"q": "How does slide 47 describe cultural-creative crowdfunding?", "a": "As a chameleon tool of diverse practices aligned with the culture sector, which calls for a multi-angle perspective on the co-construction of a broader perception of values."}, {"q": "What did Question 2 of the December 2024 exam ask?", "a": "How agency in innovation systems can promote or inhibit sustainable transformation."}], "audio": "audio/B1-08.mp3", "seconds": 75.8, "words": 165}], "seconds": 1153.2}, "P01": {"id": "P01", "kind": "reading", "title": "Reading 1: The evolution of Norway's national innovation system", "session": "Fagerberg, Mowery & Verspagen 2009", "lecturer": "Fagerberg, Mowery & Verspagen", "deck": "Science and Public Policy 36(6)", "authors": "Fagerberg, Mowery & Verspagen", "year": 2009, "source": "Science and Public Policy 36(6)", "lectures": ["T1"], "chapters": [{"n": 1, "title": "The paper in brief", "slides": [], "readings": "", "pages": "the whole paper", "paragraphs": ["This paper studies how science, technology and innovation policy evolved together with the industrial structure of Norway, a small, open, resource-based economy. Norway combines high growth in productivity and income with comparatively low investment in research and development. The authors ask how that is possible. Previous work on national innovation systems, they note, gave little attention to institutions and politics, perhaps because it often examined snapshots at one point in time.", "The paper relies on several key concepts. On page 431, the authors adopt a broad definition of a national innovation system, tracing the concept to Freeman, Lundvall and Nelson. This broad view includes all learning and innovation activities across the economy, not only universities and research departments. The reason is that much learning happens outside organizations created for innovation. On the same page they introduce path dependency, citing Arthur: historical processes favour some solutions while constraining others. On page 433, they extend this to institutions, citing North's description of institutions as \"rules of the game\". These are costly to establish but make economic interaction much easier once adopted. On page 434, they discuss Dutch disease, where currency appreciation after resource discoveries brings de-industrialization. On page 437, they use absorptive capacity, from Cohen and Levinthal: the ability to identify, absorb and exploit new knowledge. On page 440, they describe localized search, following Nelson and Winter.", "The method combines an evolutionary framework with historical analysis and comparative statistics. Long-term trends come from the GGDC Total Economy Data Base and Statistics Norway. Present-day comparisons use OECD and Eurostat data, including the Community Innovation Survey. The authors also adjust these measures for differences in industrial specialization.", "The findings start with research spending. Norway's low research intensity is partly explained by its specialization in resource-based sectors. Once industrial structure is accounted for, Norwegian firms perform as much business research as firms in the same sectors abroad in five of six country comparisons. Sweden is the exception. Innovation survey data show Norwegian firms scoring high on cooperation in innovation and on interaction with customers. Norway, like its Nordic neighbours, also has a highly educated population and high computer adoption. The authors read these indicators as an important strength in knowledge diffusion and cooperation. They also show that the post-war modernizers failed to make Norway a high-tech leader, but the competences they built produced payoffs in oil and gas.", "The paper contributes an evolutionary account of how industries, institutions and politics co-evolve. The authors also name what they cannot pursue here. One question is what Norway's income would have been without oil and gas. Another is which social, cultural and political features lie behind the system's adaptability, which they leave to future research. They end with a warning against complacency. Rapid growth from offshore oil and gas is approaching its end, and so is the era of cheap hydroelectric power. Raising the share of all firms active in innovation is, they argue, a natural target for policy.", "This reading belongs to Lecture 1: Innovation as systemic and sustainable transformation. There it explains the Norwegian paradox and why innovation is better understood as an interactive system. The broad definition of an innovation system, and the role of institutions, connect to the December 2024 exam. Its Question 1 asks what you understand by innovation system, sustainable transformation, agency and institutions. The June 2025 exam's Question 2 asks in what way a regional innovation system can promote or inhibit industrial restructuring. Here is an example of our own, not from the paper: an established system can support renewal by adapting its engineering skills to new energy, or slow it if resources stay locked in old production. The paper's nearest point is that competences built for post-war computing later produced payoffs in the oil and gas industry."], "labels": [null, null, null, null, null, null], "checks": [{"q": "What is the Norwegian paradox examined in this paper?", "a": "Norway combines high income and productivity growth with comparatively low spending on research and development."}, {"q": "Why do the authors use a broad rather than narrow definition of an innovation system?", "a": "Because much learning and innovation happens outside universities and research departments, across the whole economy."}], "audio": "audio/P01-01.mp3", "seconds": 296.9, "words": 633}, {"n": 2, "title": "The national innovation system and theoretical perspectives", "slides": [], "readings": "", "pages": "431–434", "paragraphs": ["The authors introduce their analysis of the co-evolution of policy and industrial structure in Norway. They trace the national innovation system concept to Freeman (1987), Lundvall (1992) and Nelson (1993). The authors argue that national systems develop as historical, co-evolutionary processes between firms and public research infrastructure, generating path dependencies. They choose a broad definition of the innovation system rather than a narrow one focused only on laboratories and universities. This choice matters because economic benefits come primarily from applying knowledge to production.", "Page 432 explains that broad perspectives are vital for small countries whose domestic research is dwarfed by global knowledge pools. Much innovation occurs outside specialized organizations. The authors outline evolutionary theory based on variety creation, adaptation, selection and retention. Citing Pavitt and Malerba, they observe that industries differ sharply in how they innovate. While biotechnology relies heavily on codified science and patents, industries such as shipbuilding and construction rely on in-house learning and interaction with customers. The relationship between sectoral and national systems is therefore co-evolutionary.", "Page 433 examines path dependency in institutions and politics. Citing North, the authors explain that institutions, the \"rules of the game\", are costly to establish but bring scale advantages once adopted, so they can be sources of path dependency in their own right. Turning to comparative history, they cite Maddison: in 1870 Norway's gross domestic product per capita was only three-quarters of the Western European average, and by 2001 it was one quarter higher. This happened despite a small population of 4.6 million, low population density and no major high-technology firms.", "Page 434 explains how offshore petroleum exploitation transformed Norway after the 1960s and 1970s. Unlike the Netherlands, where energy exports brought Dutch disease and manufacturing decline, Norway used supportive policies to build domestic suppliers in shipbuilding, engineering and services. Figure 1 shows Norwegian economic growth and crude oil and natural gas production from 1950 to 2007. Oil rents explain roughly half of Norway's income advantage over Western Europe. Meanwhile, traditional resource sectors based on hydroelectric power, mining and the sea remain vital regional employers."], "labels": ["Page 431", "Page 432", "Page 433", "Page 434"], "checks": [{"q": "Why do the authors prefer a broad definition of an innovation system?", "a": "Because economic gains come from applying knowledge across all sectors, not just creating new technologies in laboratories."}, {"q": "How did Norway's experience with oil discoveries differ from the Dutch disease?", "a": "Norwegian public policy helped domestic manufacturing and engineering firms supply the petroleum sector instead of suffering de-industrialization."}], "audio": "audio/P01-02.mp3", "seconds": 189.3, "words": 361}, {"n": 3, "title": "Norway in comparative perspective and the innovation paradox", "slides": [], "readings": "", "pages": "435–438", "paragraphs": ["Page 435 examines Norway's pattern of specialization. Figure 2 shows the five leading areas of Norwegian specialization in 2002: oil, gas and mining, fish, ships and oil rigs, water transport, and basic metals. Norway pioneered fish-farming and adapted shipbuilding to offshore energy. Annual labor productivity growth has averaged over 2.5% since 1975. Yet research spending stands at 1.6% of gross domestic product, in the lower half of European comparisons. The authors ask whether this low research intensity reflects Norway's distinctive sectoral specialization.", "Page 436 compares business research spending across Europe using actual and structurally adjusted figures. In Figure 4, the authors reweight Norwegian research spending by the industrial structures of partner countries. The results show that in five of six comparisons, Norwegian firms perform as much business research as foreign firms in the same sectors. Only Sweden, one of the world's most research-intensive economies, remains ahead. Figure 3 shows research spending as a percentage of gross domestic product in 2004, confirming that government funding accounts for a comparatively large share in Norway.", "Page 437 turns to the Community Innovation Survey. Figure 5 shows that Norway's share of innovative firms is lower than in other high-income countries of Northern Europe, particularly Sweden and Germany. Unlike research spending, this gap does not appear to depend on industrial structure. However, Norwegian firms score high on cooperation in innovation and on interaction with customers. Drawing on Cohen and Levinthal, the authors measure absorptive capacity through education and technology adoption. Norway and its Nordic neighbours have high shares of tertiary graduates and the highest European rates of personal computer adoption.", "Page 438 synthesizes the paradox of the contemporary Norwegian innovation system. Figures 6 and 7 show that Norwegian firms rank near the top in collaborative arrangements and customer interaction. The authors conclude that an important strength of Norway's system lies in knowledge diffusion and cooperation in innovation, qualities missed by conventional indicators. While productivity and income growth have been strong since 1970, recorded research spending and innovation shares remain modest. To resolve these contradictory indicators, the authors introduce a historical analysis of how Norwegian sectors, institutions and policies co-evolved over time."], "labels": ["Page 435", "Page 436", "Page 437", "Page 438"], "checks": [{"q": "What happens when Norwegian business research spending is adjusted for industrial structure?", "a": "In five out of six comparisons with European countries, Norwegian firms perform as much research as foreign firms in the same sectors."}, {"q": "What important strength of the Norwegian innovation system do standard research indicators miss?", "a": "Strong performance in knowledge diffusion, collaborative innovation arrangements, and close interaction with customers."}], "audio": "audio/P01-03.mp3", "seconds": 192.7, "words": 374}, {"n": 4, "title": "Historical co-evolution of sectors and policies", "slides": [], "readings": "", "pages": "439–441", "paragraphs": ["Page 439 traces three distinct industrial development paths identified by Wicken. The earliest was a small-scale decentralized path dominated by small firms investing little in formal research. Beginning in the late 19th century, a large-scale centralized path expanded through capital-intensive electrochemical and electrometallurgical industries powered by hydroelectricity. After the Second World War, policy-makers known as modernizers promoted a knowledge-intensive network-based path centered on information technology. These three paths coexisted rather than replacing one another, creating a diverse ecology of innovation systems illustrated by aluminium, fish-farming and information technology.", "Norway founded its technical university in 1910, nearly a century after Sweden. Firms relied on localized search, drawing on other firms and research institutes, and invested in their own research only when that failed. Box 1 describes the post-war modernizers, with the industrial research council and the defence research establishment, both founded in 1946, at their centre. Their programmes produced inventions such as the SIMULA language and the GSM system. In the 1980s the decline of minicomputers, a more liberal policy stance, deregulation and global competition undermined the strategy, but its competences produced payoffs in oil and gas.", "Page 441 illustrates major innovations achieved without large corporate research laboratories. Hydroelectric development grew from new combinations by entrepreneurs such as Sam Eyde, offshore petroleum created CONDEEP concrete platforms, and fish-farming mastered disease control. The authors stress that institutions and politics shaped these trajectories. The outcome of interwar political struggles sustained small decentralized firms, giving Norwegian aquaculture a heterogeneous mix of family farms alongside large firms, unlike Scotland where large corporations dominate. Furthermore, early 20th century concession laws governing waterfalls provided the regulatory model for national control of offshore oil and gas decades later."], "labels": ["Page 439", "Page 440", "Page 441"], "checks": [{"q": "What happened to the technical competences built up by the modernizers in computer technology?", "a": "Although commercial mass-market computer production failed in Norway, the capabilities transferred into the expanding offshore petroleum sector."}, {"q": "How did early regulations on hydroelectric power affect Norwegian offshore oil?", "a": "The early concession laws created a legal precedent for national control that guided petroleum regulation decades later."}], "audio": "audio/P01-04.mp3", "seconds": 156.9, "words": 294}, {"n": 5, "title": "Conclusions and the reference list", "slides": [], "readings": "", "pages": "442–444", "paragraphs": ["Page 442 revisits the paradox through three themes: innovation, path dependency and policy. The system's adaptability appears to be one of the important factors behind Norway's success. Path dependency kept innovation in resource-based sectors that stayed dynamic, and it is, the authors argue, as much a political and institutional phenomenon as an economic one. The authors warn against complacency: rapid growth from offshore oil and gas is approaching its end, and so is cheap hydroelectricity. Raising the share of all firms active in innovation is a natural target for policy.", "Page 443 completes the endnotes before the reference list begins. Note 9 compares Norway's research intensity with other resource-abundant economies like Australia and Canada. Note 11 contrasts Norway with Sweden, citing Katzenstein. Note 12 cites Niosi describing the Norwegian innovation system as diffusion-oriented. Note 14 discusses the government white paper on innovation from 2008, and Note 15 warns that the share of Norwegian firms reporting active innovation declined in the early 2000s. The reference list begins halfway down the page.", "This page is the reference list."], "labels": ["Page 442", "Page 443", "Page 444"], "checks": [{"q": "Why do the authors argue against complacency regarding Norway's economic future?", "a": "Because rapid growth from offshore petroleum is ending and cheap hydroelectric power has concluded, requiring broader innovation across all firms."}], "audio": "audio/P01-05.mp3", "seconds": 97.4, "words": 189}], "seconds": 933.2}, "P02": {"id": "P02", "kind": "reading", "title": "Reading 2: The trinity of innovation: actors, ideas and objects in innovation practice", "session": "Fløysand, Jakobsen & Hidle 2013", "lecturer": "Fløysand, Jakobsen & Hidle", "deck": "Conference paper, 5th Nordic Geographers' Meeting, Reykjavík (paper in preparation, do not quote)", "authors": "Fløysand, Jakobsen & Hidle", "year": 2013, "source": "Conference paper, 5th Nordic Geographers' Meeting, Reykjavík (paper in preparation, do not quote)", "lectures": ["T1"], "chapters": [{"n": 1, "title": "The paper in brief", "slides": [], "readings": "", "pages": "the whole paper", "paragraphs": ["This paper investigates how innovation can be conceptualized as an interplay between discursive ideas, material objects and practical social action. The authors address the tension between generic models and context-specific studies in innovation research. They ask whether one analytical model can capture both what all innovation processes share and what is specific to each context in which innovation happens. This question matters because previous research shifted from measuring physical patents and products toward analyzing social networks and institutions, pushing materiality into the background.", "The paper relies on several key concepts. On page 2 and page 9, the authors draw on actor-network theory from Latour, adopting the concept of actants to grant agency to non-human entities such as technologies, tools and natural objects alongside human individuals and organizations. On page 3 and page 8, they build on critical realism from Sayer, separating abstract necessary relations from place-specific contingent relations. On page 9, they borrow the trinity concept from Schwarz and Thompson, who defined technological development as patterns of people organizing, patterns of material things and patterns of ideas. On page 10, they operationalize this as the pragmatic innovation complex, where companies as actors use tools as objects to solve tasks as ideas. On page 11, they use the cultural economy concept of Amin and Thrift to show how contingent regulations, history and localization shape these relations.", "The paper uses a conceptual and methodological approach. The authors combine the epistemology of critical realism with actor-network theory and review historical shifts in innovation theory, from early diffusion models to regional innovation systems. To illustrate their framework, they analyze the governing imperatives of commercial innovation within capitalist market economies.", "The authors argue that innovation is neither purely material nor purely discursive. Instead, innovation emerges through practical interplay within heterogeneous networks of actants. In capitalist economies, profit maximization and productivity act as necessary relations. However, other interests also count. Shifting alliances of stakeholders, such as public authorities and environmental organizations, can influence innovation from case to case. For some of them, reducing carbon dioxide emissions or contributing to green growth may matter, and outcomes can be decided where public and market interests meet.", "The paper contributes an analytical model that bridges nomothetic generalization and ideographic context. As for limits, the authors state that they do not intend to conduct a normative evaluation of innovation functionality. They also emphasize that interactions between humans, technologies and ideas cannot be investigated through necessary relationships alone, requiring qualitative investigation of contingent conditions.", "This reading belongs to Lecture 1: Innovation as systemic and sustainable transformation. In the course, it provides the teams, tools and tasks model that explains how innovation operates as a practical system. In our own reading, the distinction between necessary and contingent relations can help with Question 1 of the December 2024 exam, which asks what you understand by innovation system, sustainable transformation, agency and institutions. It can also help with Question 1 of the June 2025 exam, which asks what you understand by a regional innovation system, institutional work and sustainability. Here is an example of our own, not from the paper: a solar energy project requires hardware components, engineering teams and policy goals to align, but local planning regulations and community priorities decide whether the installation proceeds. The paper's nearest point, on page 13, is that reducing carbon dioxide emissions or contributing to green growth may matter to public authorities and environmental organizations."], "labels": [null, null, null, null, null, null], "checks": [{"q": "What three elements form the trinity of innovation in this paper?", "a": "Actors, ideas and objects, operationalized as companies, tasks and tools."}, {"q": "What distinction from critical realism do the authors use to combine generic and context-specific features?", "a": "The distinction between necessary relations, which are abstract fundamental properties, and contingent relations, which depend on context."}], "audio": "audio/P02-01.mp3", "seconds": 269.1, "words": 574}, {"n": 2, "title": "From materiality to idea and practice", "slides": [], "readings": "", "pages": "1–5", "paragraphs": ["This page introduces a conference paper presented at the 5th Nordic Geographers Meeting held in Iceland in June 2013. The authors, Arnt Fløysand, Stig-Erik Jakobsen and Knut Hidle, represent the University of Bergen and Bergen University College. The paper examines the trinity of innovation, exploring relationships between actors, ideas and objects in innovation practice. The authors explicitly note that this draft is a paper in preparation and should not be quoted.", "Page 2 presents the research problem by exploring innovation as a discursive, material and practical phenomenon. The authors highlight a paradox in innovation studies between context-specific uniqueness and generic abstractions. To bridge ideographic and nomothetic approaches, they propose an analytical model that combines generic innovation properties with contextual specificities. Their epistemological framework builds on actor-network theory from Latour, which highlights interplays between ideas, materiality and practice, combined with realism from Sayer, which distinguishes between necessary and contingent relations.", "Page 3 establishes the theoretical foundation by integrating critical realism and actor-network theory. From Sayer, the authors adopt the distinction between abstract necessary relations and contingent, place-specific structures. From actor-network theory, they introduce the concept of actants to examine the social, material and immaterial dimensions of innovation. Reviewing the history of innovation, the authors note that the term is positively charged in Western culture, often linked to progress and breaking established paradigms, as discussed by Kuhn, Foucault and Shils.", "Page 4 traces the history and roots of the word. Godin shows that Plato and Aristotle valued imitation, which was seen as positive until the mid-eighteenth century. Godin also points to Nelson and Winter, who link a firm's innovation to its routines, and to Levitt, for whom imitation is often a survival strategy. The Latin root means to renew, or to change into something new. The authors conclude that the word's original meaning already refers to materiality, idea and practice. Early research, by contrast, counted patents and new products.", "Page 5 evaluates Hägerstrand's spatial diffusion model, noting that it demonstrated distance delays in information flows among farmers adopting cattle vaccination. However, early diffusion research treated innovation as an objective, measurable entity while neglecting ideas. Later scholars recognized innovation as a sociocultural process. Citing Polanyi, the authors note that the economy operates as an institutional process. Nelson and Winter incorporated organizational learning into evolutionary theory. Finally, systems of innovation perspectives emerged from Freeman, Nelson and Lundvall, emphasizing interactive learning among diverse actors."], "labels": ["Page 1", "Page 2", "Page 3", "Page 4", "Page 5"], "checks": [{"q": "Which two theoretical perspectives guide the analytical model developed in this chapter?", "a": "Actor-network theory from Latour and critical realism from Sayer."}, {"q": "What did Hägerstrand's classic study of innovation diffusion examine?", "a": "The spatial diffusion of cattle vaccination technology and the distance delays in information flow among farmers."}], "audio": "audio/P02-02.mp3", "seconds": 209.6, "words": 417}, {"n": 3, "title": "Systems, relational perspectives and actants", "slides": [], "readings": "", "pages": "6–9", "paragraphs": ["Page 6 examines the systems-of-innovation perspective developed by Lundvall and Cooke. Lundvall emphasized that innovation systems have open, situation-specific boundaries and generate unexpected outcomes. Policy makers embraced this framework because it provided a proactive role for governance and network steering, as analyzed by Kooiman and Klijn and Edelenbos. Putnam and colleagues highlighted social capital and trust as essential foundations for innovative socioeconomic systems. However, popular management manuals often detached these insights from local context, moving materiality to the background while focusing primarily on discourse.", "Page 7 traces the shift, in geography, from the distribution of innovation to place, and Bathelt and Glückler argue for the relational perspective: innovations grow from socially intertwined systems, and practice shapes a system in ways we cannot foresee. Right relations between industrial actors, research institutions and political functions are necessary but not sufficient, and practice can lock a system in. What counts is how actors practise relationships: values, role expectations and informal learning. The page closes by saying innovation escapes deconstruction and that relational dynamics are usually unpacked only implicitly.", "Page 8 synthesizes the core critique of existing innovation literature. While relational approaches represent progress, they still neglect how material things, ideas and social practice work together in innovation. To resolve this neglect, the authors turn to two epistemological frameworks. Actor-network theory from Latour restores material objects to the analysis of action. Critical realism, cited through Johnston and colleagues, separates necessary causal relations from contingent local configurations. The authors propose combining these insights into an integrated analytical model.", "Page 9 details the actor-network concept of actants, citing Latour. Following Latour, an actant is any entity that acts, or that others treat as acting: people and organizations, but also nature, art, technology and tools. In critical realism, Johnston and colleagues define realism through necessary causal powers realized under contingent conditions. To build their trinity model, the authors draw on Schwarz and Thompson, who defined technology development through patterns of people organizing, patterns of material things, and patterns of ideas or cultural biases."], "labels": ["Page 6", "Page 7", "Page 8", "Page 9"], "checks": [{"q": "How does actor-network theory define an actant on page 9?", "a": "Anything that acts, or that others treat as acting: people and organisations, but also nature, technology and tools."}, {"q": "What three patterns did Schwarz and Thompson identify in technology development?", "a": "Patterns of people, patterns of material things, and patterns of ideas."}], "audio": "audio/P02-03.mp3", "seconds": 178.1, "words": 351}, {"n": 4, "title": "The pragmatic innovation complex and analytical model", "slides": [], "readings": "", "pages": "10–13", "paragraphs": ["Page 10 outlines the pragmatic innovation complex illustrated in Figure 1. The authors define actors as technology producers, users, entrepreneurs and authorities; objects as landscapes, technology and tools; and ideas as knowledge, narratives and norms. In Figure 1, three elements form a practical triangle: company as actor, tools as objects, and tasks as ideas. Technique links company and tools; production links tools and tasks, including unintended outputs such as carbon dioxide emissions; and rationale links company and tasks through profit-maximizing goals in capitalist economies.", "Page 11 argues that the simple triangle is not enough on its own to understand wider innovation practice. Citing Latour, the authors observe that innovation lives in meetings, plans, regulations and experiments, mixed with other social agencies. Critical realism resolves this tension: the actor, object and idea relationships are the necessary properties of innovation, while contingent relationships give them their content. The contingent ones are cultural economy, history, governance and localization. Following Amin and Thrift, a cultural economy holds actors, objects and ideas together through rules, shared conventions, technologies and ways of working.", "Page 12 discusses Figure 2, which diagrams the governing imperative of innovation alongside necessary and contingent relations. In Figure 2, objects, actors and ideas form necessary relations, while cultural economy, history, governance and territorial localization form contingent relations. In capitalist economies, profit maximization and productivity serve as necessary governing imperatives. However, citing Polanyi, the authors note that anthropology reveals alternative economic arrangements based on delayed exchange. Sometimes, and perhaps more importantly for outcomes, different complexes of actors, objects and ideas reflect differing interests.", "Page 13 examines how stakeholder alliances shape innovation outcomes. Beyond traditional corporate stakeholders such as shareholders, customers, employees and suppliers, innovation involves public authorities, universities, local communities and non-governmental organizations. For public authorities and environmental groups, innovation can target sustainability challenges by reducing carbon dioxide emissions and promoting green growth. Dominant narratives determine what society considers beneficial innovation practice. Citing necessary and contingent relationships, the authors conclude that qualitative methods such as participatory observation and thick description are essential to study innovation practice."], "labels": ["Page 10", "Page 11", "Page 12", "Page 13"], "checks": [{"q": "What three elements form the triangle in Figure 1 on page 10?", "a": "Company as actor, tools as objects, and tasks as ideas."}, {"q": "Which four contingent factors shape necessary innovation relations in Figure 2 on page 12?", "a": "Cultural economy, history, governance, and localization."}], "audio": "audio/P02-04.mp3", "seconds": 197.3, "words": 360}, {"n": 5, "title": "Conclusions and the reference list", "slides": [], "readings": "", "pages": "14–17", "paragraphs": ["Page 14 concludes that innovation has discursive, material and practical dimensions. Innovation studies have moved from counting patents and products to analysing learning in regional innovation systems. That shift is welcome, the authors say, but the material foundation of innovation must not be forgotten. They combine the actant of actor-network theory with critical realism's split between necessary and contingent relations, so that innovation appears as firms using tools to solve tasks. Cultural economy, history, governance and local territory shape that practice.", "The conclusion ends with what the model offers. It lets researchers treat innovation as arising from a system that links ideas, practice and materiality. This can be done, the authors add, without ignoring the cultural, economic and political settings that innovations belong to. With that, the paper's argument is complete, and the reference list begins further down the same page.", "These pages are the rest of the reference list."], "labels": ["Page 14", "Page 15", "Pages 16-17"], "checks": [{"q": "What main conclusion do the authors draw about innovation studies on page 14?", "a": "While process-oriented and relational approaches are welcome, the material foundation of innovation must not be forgotten."}], "audio": "audio/P02-05.mp3", "seconds": 80.1, "words": 163}], "seconds": 934.2}, "P03": {"id": "P03", "kind": "reading", "title": "Reading 3: Institutional work, regional key actors, and green industrial restructuring", "session": "Fløysand et al. 2022", "lecturer": "Fløysand et al.", "deck": "Norsk Geografisk Tidsskrift – Norwegian Journal of Geography 76(1)", "authors": "Fløysand et al.", "year": 2022, "source": "Norsk Geografisk Tidsskrift – Norwegian Journal of Geography 76(1)", "lectures": ["T2", "T3"], "chapters": [{"n": 1, "title": "The paper in brief", "slides": [], "readings": "", "pages": "the whole paper", "paragraphs": ["This paper investigates how regional key actors use institutional work to enable or constrain green industrial restructuring in petroleum-dependent regional innovation systems. The cases are Hordaland and Rogaland, two adjacent regions in Western Norway (page 15). While evolutionary economic geography has studied agency in regional path development, it struggles to explain recursive dynamics between actors and institutions. Changing strong path dependency requires altering institutions, but regional trajectories carry cemented institutional logics that resist change.", "The authors combine evolutionary economic geography with institutional work. On page 15, they define institutional work, citing Lawrence and colleagues, as physical and mental efforts aimed at affecting an institution or set of institutions. On page 16, they define institutions, citing North, as formal and informal rules, and a regional innovation system, citing Cooke, as interacting subsystems of knowledge generation and exploitation. Systems can be diversified or specialized, following Isaksen and Trippl, and interactive networking or dirigiste, following Stuck and colleagues. On pages 15 and 18, they define institutional logics as practice patterns and social prescriptions directing legitimate practice, following Thornton and Almandoz. On page 17, they adopt Bækkelund's distinction between change agency and reproductive agency.", "The study uses a mixed-methods design. The authors modelled related variety from 2004 to 2016 across regional employment data using Shannon's entropy measure, following Frenken and colleagues. They also interviewed 24 regional key stakeholders, adding names by snowball sampling. Adding earlier sector studies, the research draws on 35 face-to-face interviews, applying the principle of saturation, following Bowen.", "The main finding is that despite shared positive visions for green restructuring, institutional work and institutional logics legitimize a green shift in Hordaland and delegitimize it in Rogaland. In Hordaland, which hosts a thick, diversified and interactive networking system, regional actors exercised change agency through collective leadership. They built on reproductive agency that supported clustering. Hordaland now hosts five of Norway's fifteen National Centres of Expertise and one of its three Global Centres (page 24), and networking across clusters produced projects such as AquaCloud. When oil prices fell and salmon prices rose in 2014–2017, a crossover programme was set up, and an intermediary says forty to fifty oil and gas firms now also supply ocean fish farming (page 23). In Rogaland, a thick, specialized and dirigiste system reinforced reproductive agency rooted in historical individual strategic leadership, linked to former Stavanger mayor Arne Rettedal. Stakeholders describe a recurring lock-in cycle: when oil prices recover after a recession, low costs bring high profit margins, and the petroleum sector bounces back (page 24).", "The paper challenges studies that explain restructuring as the outcome of intended, successful agency: institutional work can also lead to continuation. Work aimed at a green shift can unintentionally sustain oil and gas (page 25). A thick, diversified system is a potential advantage, not a sufficient precondition. As limits, the regions differ in industrial history, with maritime and salmon farming more prevalent in Hordaland (page 25), and more dialogue with interviewees might have increased validity (page 19).", "This reading belongs to Lecture 2: Regional innovation systems and sustainable transformation, and Lecture 3: Institutional work in the regional innovation systems of Hordaland and Rogaland. The two lectures link it to Question 1 of the June 2025 exam, on regional innovation systems, institutional work and sustainability. In our own reading, it also helps with Question 2 of that exam, on how a regional innovation system can promote or inhibit industrial restructuring. Here is an example of our own, not from the paper: an established regional system can support industrial restructuring when diverse sectors collaborate across clusters to share clean technologies. However, it can also hinder change when high earnings in a dominant extractive industry pull resources back into traditional production. The paper's nearest real points are the oil and gas firms in Hordaland that now also supply fish farming, and Rogaland's cycle in which recovering oil prices bring high margins back to petroleum."], "labels": [null, null, null, null, null, null], "checks": [{"q": "What is the main finding regarding how institutional work affects green restructuring in Hordaland and Rogaland?", "a": "Despite shared positive visions, institutional work and institutional logics legitimize green restructuring in Hordaland through collective leadership and cross-clustering, while delegitimizing it in Rogaland, where individual leadership and a petroleum sector that bounces back as oil prices recover keep the region in oil and gas."}, {"q": "How do the authors define institutional work
