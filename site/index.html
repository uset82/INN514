ledge about the benefits, and consumers are not ready to adopt the innovation."}, {"q": "What does the cluster A block of Table 3 propose comparing?", "a": "The ability of professional investors and crowdfunders to select the most promising projects, and the antecedents of preferring radical over incremental innovation."}], "audio": "audio/P11-06.mp3", "seconds": 157.0, "words": 294}, {"n": 7, "title": "The limitations and the reference list", "slides": [], "readings": "", "pages": "1127–1133", "paragraphs": ["The page closes cluster C with influencer endorsement, which reaches large audiences and, through self-image congruence, raises willingness to fund. Blockchain appears as a way to secure data management in equity crowdfunding, and as a tool policy makers could use for traceability. The limitations follow. Scopus was the only source, so work indexed elsewhere, such as Web of Science, may be missing, and articles in other languages were left out; future work could add Spanish, Italian and French. Despite these limits, the authors say the analysis offers an overall view and a research agenda. The reference list then begins.", "These pages are the reference list.", "This page holds the notes on the four authors and the reprint details."], "labels": ["Page 1127", "Pages 1128-1132", "Page 1133"], "checks": [{"q": "Which two limitations does the paper name?", "a": "Scopus as the only database, and the exclusion of articles not written in English."}], "audio": "audio/P11-07.mp3", "seconds": 68.2, "words": 132}], "seconds": 1292.9}, "P12": {"id": "P12", "kind": "reading", "title": "Reading 12: The relational forms of cultural-creative crowdfunding: a typology of practices through mapping platforms in Europe and Latin America", "session": "Demattos Guimarães, Maehle & Bonet 2024", "lecturer": "Demattos Guimarães, Maehle & Bonet", "deck": "Poetics 105", "authors": "Demattos Guimarães, Maehle & Bonet", "year": 2024, "source": "Poetics 105", "lectures": ["B1"], "chapters": [{"n": 1, "title": "The paper in brief", "slides": [], "readings": "", "pages": "the whole paper", "paragraphs": ["The paper asks how cultural-creative crowdfunding has evolved and which models and channels platforms have developed under that umbrella. It matters because the literature is embryonic: the sectoral side of crowdfunding is under-explored, and that there is a gap in understanding and defining cultural-creative platforms (page 2). Their aim is a broader typology of CCCF practices. Their main assumption is that CCCF is a set of diverse practices under the wider crowdfunding umbrella (page 3).", "On page 2, CCCF is financing projects in the culture sector and its cultural-creative industries by asking a crowd for contributions through online platforms. On page 4 the authors take four cultural policy paradigms from Bonet and Négrier: excellence, cultural democratization, cultural democracy and the cultural or creative economy. They place CCCF where all four meet, as a provocation about digitalization and platformization, not a claim that crowdfunding should lead cultural policy. The puzzle has three points. Does the sector lack an expanded understanding and a mindset shift? Are all platform models being explored? And do generalist and specialised platforms need a clearer distinction?", "The method is inductive. The authors combine tracking and trawling, a digital method from Whiting and Prichard, with two Delphi panels. They met in Gdansk and Bloomington in 2023, with about ten and fifteen participants (page 6). They coded each platform on six dimensions: country, geographical scope, business model, focus, institutional structure and foundation year (page 8). The database holds 89 platforms, 79 European and 10 Latin American (page 8).", "Table 1 shows 67 of the 89 platforms founded between 2009 and 2015. It shows 51 with a hybrid business model against 38 with a single one, and 35 for-profit, 29 on a partnership spectrum and 20 non-profit (page 9). Each panel reached consensus, but the two differed (page 8). The cultural economists treated crowdfunding as an external tool and understood it more narrowly, while the alternative finance experts argued over specialised and generalist platforms. Both discussions, the authors say, validate the puzzle (pages 8 and 10). In Latin America no platform serves a single sector, and all have a national scope except Idea.me, which is regional. European platforms are more often regional (page 12). The main output, Figure 3, is a typology running from institutional structure to practices such as Crowd Store, producer agents, subscription as alternative income, art market investment, white-label co-financing and collective mobilisation (pages 11 and 12). A strict clustering proved ineffective, so the typology is a diagram, and the mapping confirms the main assumption (page 12).", "The authors call the typology their main contribution, and say it speaks to cultural economics, media studies and cultural policy research (page 13). They name two limits. The study relies on what platforms display, and that information is inconsistent (page 8). The choice of two expert fields may also miss the broader perspective of cultural studies (page 6). The mapping leaves out US platforms such as Kickstarter, and the authors invite a similar North American study (page 10).", "The paper is the reading for the bonus lecture, The art of crowdfunding. The lecture uses pages 8 and 10 for the count of 89 platforms and for the two ways of sorting them, by institutional structure and by relational form of practice. It notes that crowdfunding was not on the December 2024 or the June 2025 exam. Our Bonus lecture page suggests, as an example of our own rather than the lecturer's, that crowdfunding communities could be one form of agency for Question 2 of December 2024. The paper's nearest point, on page 13, is that cultural policy can benefit from taking agency in shaping CCCF. Here is an example of our own, not from the paper or the lecture. A funding channel that lets many small backers decide together which cultural projects go ahead can be read as agency that moves resources away from established gatekeepers."], "labels": [null, null, null, null, null, null], "checks": [{"q": "How many platforms did the study map, and on which dimensions did it code them?", "a": "89, coded on country, geographical scope, business model, focus, institutional structure and foundation year."}, {"q": "What are the three points of the CCCF puzzle?", "a": "Whether the sector lacks an expanded understanding and a mindset shift, whether all platform models are being explored, and whether generalist and specialised platforms need a clearer distinction."}], "audio": "audio/P12-01.mp3", "seconds": 300.0, "words": 652}, {"n": 2, "title": "The gap, the CCCF concept, the platforms and the policy paradigms", "slides": [], "readings": "", "pages": "1–4", "paragraphs": ["This article in Poetics maps crowdfunding platforms for cultural and creative projects across Europe and Latin America to build a typology of cultural-creative crowdfunding, or CCCF. Demattos Guimarães and Maehle work at HVL Business School in Bergen, and Bonet at the University of Barcelona. The abstract says the practice is not new, since busking and patronage are old, but the platform as intermediary is. It combines tracking and trawling, Delphi panels and categoric analysis, and claims to be among the first CCCF typologies. The introduction names ArtistShare, launched by artists in 2003, as one of the first platforms.", "The introduction sets out the gap: the sectoral side of crowdfunding is under-explored, with a gap in understanding and defining cultural-creative platforms and their relational forms. Institutional structure is the network of components that makes a particular arrangement; structural-relational dynamics is the interplay between that structure and the relations among the people in it. Section 2 defines CCCF as financing projects in the culture sector and its cultural-creative industries by asking a crowd for contributions through online platforms. Platforms follow two logics: investment, with equity and lending, and non-investment, with reward and donation.", "Hundreds of platforms are active, split between generalists and those dedicated to one sector. Following Lacan and Desmet, a platform should be more than an intermediary: a place of social connection, which matters in a sector built on collective work. Cicchiello et al. found that few European platforms specialise in culture and that success is higher on generalist platforms. Siciliano warns that under platformization both intermediaries and producers appear subordinate to infrastructure. Crowdfunding, in Dalla Chiesa's words, is a chameleon tool. Accordingly, the authors assume that CCCF is a set of diverse practices under the wider crowdfunding umbrella.", "Section 2.2 sets out the sector. The authors describe a diverse, horizontal market with unique and intangible characteristics, held together by relational structures of connectedness and interplay. Following Bonet and Négrier, they present four cultural policy paradigms that emerged at different times and now coexist: excellence, cultural democratization, cultural democracy, and the cultural or creative economy. Where they overlap sit excellence for all, the star system and the prosumer. The authors place CCCF at the centre of all four as a provocation, stressing that the centrality is about digitalization and platformization, not a claim that crowdfunding should lead cultural policy."], "labels": ["Page 1", "Page 2", "Page 3", "Page 4"], "checks": [{"q": "What are the four cultural policy paradigms the authors take from Bonet and Négrier?", "a": "Excellence, cultural democratization, cultural democracy, and the cultural or creative economy."}, {"q": "What do the authors say the central place of CCCF in that diagram means?", "a": "They call it a provocation and stress that the centrality is about digitalization and platformization, not a claim that crowdfunding should lead cultural policy."}], "audio": "audio/P12-02.mp3", "seconds": 194.3, "words": 410}, {"n": 3, "title": "The puzzle, the two Delphi panels and the platform database", "slides": [], "readings": "", "pages": "5–8", "paragraphs": ["The section turns to the CCCF puzzle. They note a conflict: artists do not always see themselves as entrepreneurs, and the tension between commercial and artistic values helps explain why cultural campaigns are mostly reward- and donation-based. Following Hoffmann et al., they call this mix artrepreneurship. Earlier work usually studies one platform, or success rates and business models. They draw three questions: whether the sector lacks an expanded understanding and a mindset shift, whether all platform models are being explored, and whether generalist and specialised platforms need a clearer distinction. Figure 1 shows the four circles meeting at CCCF.", "The puzzle ends with the sector's old problems: demand uncertainty, information asymmetry, and the split between excellence and popular commercial work. Cultural campaigns usually draw most contributions from the creator's own network, which the authors link to the Bourdieusian account of distinction and habitus. The method is inductive: tracking and trawling plus two Delphi panels, used to validate the puzzle. Choosing crowdfunding and cultural economics experts, they admit, may miss the wider view of cultural studies. The panels met in Gdansk on 31 May 2023, with about ten participants, and in Bloomington on 27 June 2023, with about fifteen.", "Figure 2 draws the research design as a loop from the puzzle to the typology. Section 3.2 explains the database. For Europe the authors started from a portal on crowdfunding in the cultural and creative industries and checked it against the CrowdSpace site. They visited over 160 platform websites native to Europe, so Kickstarter and other American platforms are out; for Latin America there was no list, so they built one by searching and snowballing. From August to November 2023 they examined around 200 websites and excluded more than 50, mostly broken sites or blogs with no funding mechanism.", "The final database holds 89 platforms, 79 European and 10 Latin American, mostly Brazilian. The authors admit they rely on what platforms display, which is inconsistent. They coded six dimensions: native country, geographical scope, business models, focus, institutional structure and foundation year. In the findings, each Delphi panel reached consensus, but the two differed. The cultural economists saw crowdfunding as just an external tool, understood narrowly as reward or donation. Their reasoning about artists' choices, the authors say, partly validates the puzzle, since agents lack a nuanced grasp of CCCF's forms. The finance experts debated specialised against generalist platforms."], "labels": ["Page 5", "Page 6", "Page 7", "Page 8"], "checks": [{"q": "How did the two Delphi panels differ?", "a": "Each reached consensus internally, but the cultural economists saw crowdfunding narrowly, as an external tool, while the alternative finance experts debated specialised against generalist platforms."}, {"q": "How many platforms are in the final database, and how are they split between the two regions?", "a": "89 in all, 79 European and 10 Latin American."}], "audio": "audio/P12-03.mp3", "seconds": 198.7, "words": 416}, {"n": 4, "title": "What the mapping found: the table, the panels and Figure 3", "slides": [], "readings": "", "pages": "9–12", "paragraphs": ["Table 1 ties each part of the puzzle to a dimension and counts the platforms. By period, 10 platforms started before 2009, 67 between 2009 and 2015, and 8 after 2015. By business model, 38 are pure and 51 hybrid; among the pure ones, 12 are donation, 12 reward or pre-order, 6 subscription and 8 other. By institutional structure, 20 are non-profit, 29 sit on a partnership spectrum and 35 are for-profit. By focus, 27 are specialised, 4 culture-specialised, 18 cultural-industry generalists, 15 socio-generalists and 21 generalists. By scope, 5 are local, 34 regional, 24 national and 26 global.", "The finance experts saw great potential that the culture sector has not fully explored, and both panels agreed a puzzle exists. The mapping shows a volatile market. It began with ArtistShare, a blueprint for later platforms. The text says eight platforms launched before 2009 and ten after 2015, the reverse of Table 1, and more disappeared. More than 57 per cent are hybrid, most often reward with donation. Six are subscription only; the authors suggest that subscription, usually counted as donation, gives creators alternative income. Ten offer investment logic, such as Kanvas.ai, and twelve allow match-funding.", "Of the institutional structures, 29 platforms are public-private partnerships, 35 are for-profit, living on fees or a share of sales, and 20 are non-profit. For-profit streams include CrowdPublisher, in publishing, music and games, and Crowd Store, crowdfunding as market test and pre-sale. Non-profit cases include the municipal Tilburgvoorcultuur and the Catalan-supported Axeta. On focus, 27 platforms specialise, mostly in music and publishing, and 21 are generalist. Figure 3, the main output, shows the 89 platforms in the three structures and branches into practices, from Crowd Store and producer agents to subscription income, art market investment, white-label co-financing and collective mobilisation.", "No strong link appears between focus and institutional structure, so the puzzle persists. Latin America has no single-sector platform; its platforms are national, except the regional Idea.me, and their pattern could indicate an ecosystem built on collaboration. European platforms are more often regional, such as Wemakeit, and some from the UK reach globally. The authors say this confirms their main assumption: CCCF is a set of diverse practices. Since a strict clustering proved ineffective, Section 4.3 presents the typology visually, with practices such as producer agents, Crowd Store, subscription, art market and collective mobilisation."], "labels": ["Page 9", "Page 10", "Page 11", "Page 12"], "checks": [{"q": "What three institutional structures does the paper distinguish, and how many platforms fall in each?", "a": "Non-profit with 20, a partnership spectrum with 29, and for-profit with 35."}, {"q": "How do Latin American and European platforms differ in geographical scope?", "a": "Latin American platforms are national except Idea.me, which is regional; European platforms are more often regional, and some from the UK reach globally."}], "audio": "audio/P12-04.mp3", "seconds": 213.3, "words": 410}, {"n": 5, "title": "The discussion, the conclusions and the reference list", "slides": [], "readings": "", "pages": "13–15", "paragraphs": ["The section ends by arguing that a clear systematisation of these relational forms can help CCCF join the culture sector's funding ecosystem. The authors say they go beyond crowdfunding as a single function of raising money, and name the puzzle's three tensions: commercial against aesthetic or moral values, donation against investment or income, and broad audience against niche preferences. They claim contributions to cultural economics, media studies and cultural policy research. Cultural policy, they add, can benefit from taking agency in shaping CCCF's development, and they recommend a closer look at match-funding.", "The page gives the competing-interest declaration and a note on the supplementary material, then the reference list begins.", "This page continues the reference list."], "labels": ["Page 13", "Page 14", "Page 15"], "checks": [{"q": "What three tensions does the paper say the puzzle contains, and what does it recommend policy look at?", "a": "Commercial against aesthetic or moral values, donation against investment or income, and broad audience against niche preferences; it recommends a closer look at match-funding."}], "audio": "audio/P12-05.mp3", "seconds": 64.6, "words": 132}], "seconds": 970.9}, "P13": {"id": "P13", "kind": "reading", "title": "Reading 13: Value proposition as a framework for value cocreation in crowdfunding ecosystems", "session": "Quero & Ventura 2019", "lecturer": "Quero & Ventura", "deck": "Marketing Theory 19(1)", "authors": "Quero & Ventura", "year": 2019, "source": "Marketing Theory 19(1)", "lectures": ["B1"], "chapters": [{"n": 1, "title": "The paper in brief", "slides": [], "readings": "", "pages": "the whole paper", "paragraphs": ["Quero and Ventura ask whether the ecosystem approach is needed to understand crowdfunding. Their own, broader definition (page 48) makes crowdfunding a business model in which actors cocreate value to carry one actor's proposal forward, by raising money and by other means. They place the argument in service-dominant logic. Their stated aim is to add to two of its foundational premises, FP 7 and FP 10, by showing that the ecosystem approach is required. Three propositions guide the study (page 48). Crowdfunding can be considered a service ecosystem; the Eight Co's model shows the eight ways value propositions are cocreated; and the value proposition approach is a useful tool for analysing cocreation at each level of the ecosystem.", "The vocabulary comes from marketing theory. On page 51 the authors adapt Frow and Payne's five-step planning framework, replacing stakeholder with actor. Its steps are to identify actors, determine core values, facilitate dialogue, identify cocreation opportunities, and cocreate value propositions. On page 52 they adopt Frow and colleagues' definition of a value proposition: a mechanism that adjusts as actors negotiate how resources are shared inside a service ecosystem. On page 53 they assemble the Eight Co's model. Russo and Mele supply five categories, Quero and Ventura had added co-investment and co-consumption for crowdfunding, and Kumar's co-authorship makes eight. On page 55 the paper divides the ecosystem into three levels, following Chandler and Vargo: a micro level of direct exchange between two parties, a meso level where exchange runs through a third party, and a macro level of networks.", "The evidence is a qualitative multiple case study of the two most representative Spanish platforms by funds raised: Verkami, for arts and design only, and Lánzanos, for all kinds of projects. The scope is the cultural sector. The authors followed five crowdfunding communities from January to April 2014 and interviewed both platform directors.", "The two directors agreed on an eighth actor that the literature had not listed, public institutions. Both also agreed that crowdfunding can be considered an ecosystem, which supports the first proposition. Across the three levels the authors find eight forms of cocreation, framed as six value proposition metaphors, among them the promise, the proposal and the invitation to play. At the macro level, associations and public institutions bring institutionalisation, which the authors suggest could be a conflictual form of cocreation (page 58).", "The authors offer a crowdfunding ecosystem model for arts managers. They say it provides not only a way of raising money but also a way of strengthening bonds with customers and other stakeholders, and that the results confirm their three propositions. They call the crowdfunding ecosystem a significant contribution to the theories of ecosystems (page 59). The sampling design could be improved by broadening the kinds of cultural project and by adding projects from other countries. Checking the model outside the cultural setting would also be interesting.", "The companion lecture is the bonus lecture, The art of crowdfunding, which uses this paper in its chapter on value co-creation. There, slide 38 reproduces a figure credited to Quero and Ventura. The lecture sets the slide's circles against the paper's own list, noting two differences: the slide says co-financing where the paper says co-investment, and the slide adds co-production but not co-authoring. The lecture also records that crowdfunding was not on the December 2024 or the June 2025 exam. Its note on December 2024's Question 2, on how agency in innovation systems can promote or inhibit sustainable transformation, marks the crowdfunding example as one of ours rather than the lecturer's. The paper touches sustainability only in passing: it says the participatory model supports sustainability and continuous change (page 48), and it calls for research on how sustainable ecosystems emerge (page 60). What it can give such an answer is a precise cast of actors and a vocabulary for what passes between them."], "labels": [null, null, null, null, null, null], "checks": [{"q": "What does the paper mean by a value proposition, and where does that definition come from?", "a": "A mechanism that adjusts as actors negotiate how resources are shared inside a service ecosystem, a definition the authors adopt from Frow and colleagues on page 52."}, {"q": "Which actor did the study add to the literature's list, and what did the directors agree about the ecosystem?", "a": "Public institutions. Both directors agreed that crowdfunding can be considered an ecosystem, which supports the first proposition."}], "audio": "audio/P13-01.mp3", "seconds": 285.1, "words": 647}, {"n": 2, "title": "The aim, the three propositions and the actors of crowdfunding", "slides": [], "readings": "", "pages": "47–50", "paragraphs": ["The article appears in Marketing Theory, and both authors, Quero and Ventura, work at the University of Malaga. The abstract gives the aim: to explore whether the ecosystem approach is required to understand the new service model of crowdfunding. It says the value proposition approach offers a different interpretation for each of the eight levels of value cocreation in a service ecosystem. The study compares the two most representative platforms in Spain, Verkami and Lánzanos, by the funds they raise, and the abstract itself names the sampling design as a weakness.", "The introduction notes the turn in marketing towards value creation as interactive and networked; quoting Karpen and colleagues, superior value co-creation replaces superior value provision as the cornerstone of strategy. In crowdfunding, a new business model, actors work at the frontier between buying, selling and investing. Its participatory model, they add, supports sustainability and continuous change. Little is known about how actors' roles change, so three propositions follow: crowdfunding can be considered a service ecosystem; the Eight Co's model shows how value propositions are cocreated; and the value proposition approach is a useful tool at each level.", "The page ties the propositions to service-dominant logic, naming FP 7 and FP 10 and Karpen and colleagues' idea of an individuated interaction capability. It reads crowdfunding as a new generation of service ecosystem, following Wieland and colleagues, and says the findings may travel to other business models. A map of the six sections follows. The section on the phenomenon begins here, with the literature's definitions: Ordiani and colleagues call crowdfunding an initiative that collects small and medium investments from a crowd, and Schwienbacher and Larralde describe it as financing by a group of individuals instead of professional parties.", "Ramos sorts crowdfunding platforms into four kinds: equity, lending, rewards and donation. Market figures follow. Forbes, writing in 2012, divides the world market of 2014 into donations, loans, equity and rewards. In Spain, investment doubled in 2013, reaching 19.1 million euros. Belleflamme and colleagues then separate projects by what participants want, a product or a financial return. Ordiani and colleagues name three kinds of actor. The page closes on an actor the literature has not yet treated, the crowdfunding association, and on the lobbying role it takes as governments begin to legislate."], "labels": ["Page 47", "Page 48", "Page 49", "Page 50"], "checks": [{"q": "Which four kinds of platform does Ramos distinguish?", "a": "Equity-based, lending-based, rewards-based and donation-based platforms."}, {"q": "Which actor does the paper say the literature has not yet treated, and what does it do?", "a": "The crowdfunding association, which lobbies governments as they begin to regulate the market."}], "audio": "audio/P13-02.mp3", "seconds": 184.9, "words": 399}, {"n": 3, "title": "The planning framework, the Eight Co's and the two Spanish platforms", "slides": [], "readings": "", "pages": "51–54", "paragraphs": ["The page takes a five-step planning framework from Frow and Payne and rewrites it for crowdfunding, replacing stakeholder with actor. Four steps are set out here. First, identify the actors. Second, determine core values, which Gummesson calls balanced centricity. Third, facilitate dialogue and knowledge sharing, which Lusch and colleagues call a mega-competency. Fourth, identify opportunities for cocreation. The authors warn that the actors are likely to change as crowdfunding evolves. Each one stays only while it can offer and receive value. Table 1 lists the seven actors the literature recognises, with the sources for each.", "The fifth step, the cocreation of value propositions, closes the framework. The authors compare the lists of cocreation categories already on offer. They adopt Frow and colleagues' definition of a value proposition, a mechanism for negotiating how resources are shared. The section that follows argues that cocreation is the basis of any value proposition. It quotes Vargo and Lusch on networks as the venue where value is created. Figure 1 draws the framework as a loop of five circles: identify actors, determine core values, facilitate dialogue and knowledge sharing, identify opportunities, and cocreate value propositions.", "The page gathers definitions of value cocreation and then builds the model of eight categories that the rest of the paper uses. Russo and Mele's five categories are co-ideation, co-evaluation of ideas, co-design, co-test and co-launch. Quero and Ventura had already added co-investment and co-consumption for crowdfunding. Kumar's co-authorship makes an eighth, taken from research collaboration but applied here because actors switch roles easily. The methodology section opens: a qualitative case study, following Yin, limited to the cultural sector, with two platforms chosen by purposive sampling: Verkami, for arts and design only, and Lánzanos, for all kinds of projects.", "The page carries Verkami's figures and the study's own numbers. Verkami accounts for 70% of cultural crowdfunding projects. It financed 953 projects in 2013, 61% more than the year before, and raised almost 5 million euros, 89% more. It had 122,000 financing customers, with a success rate of 70%. The method is described below the figure: a netnographic study of five communities over 4 months, following Kozinets, and semi-structured interviews with each platform director, coded in ATLAS.ti. Figure 2 shows the platforms and the communities feeding one case study."], "labels": ["Page 51", "Page 52", "Page 53", "Page 54"], "checks": [{"q": "What are the five steps of the framework, and what did the authors change in it?", "a": "Identify the actors; determine core values; facilitate dialogue and knowledge sharing; identify value cocreation opportunities; cocreate value propositions. They replaced the framework's stakeholder with actor."}, {"q": "How was the Eight Co's model assembled?", "a": "From Russo and Mele's Five Co's, two categories Quero and Ventura added for crowdfunding, co-investment and co-consumption, and Kumar's co-authorship."}], "audio": "audio/P13-03.mp3", "seconds": 198.8, "words": 399}, {"n": 4, "title": "The results, the three levels and the discussion", "slides": [], "readings": "", "pages": "55–59", "paragraphs": ["The results open by testing the literature's list against what the two directors said. Both added an actor the literature had missed, public institutions, and the Lánzanos director explained the need for regulation. Table 2 then gives each actor's actions and intentions, running from the creative core to public institutions. On the first proposition the directors were explicit: one said every actor is equally important, and the other agreed with the idea of an ecosystem. The page then sets up three levels, following Frow and colleagues' categories and Chandler and Vargo, and begins with the micro level.", "At the micro level, the creative core seeks money from the platform or from financing customers and offers rewards. A film on Verkami asks 10 euros for a T-shirt and 800 for a credit in the film. On rewards-based platforms the dominant value proposition is the promise. Yet El Cosmonauta, the first crowdfunded film in Spain, received cameras, microphones and artists' services. The most common forms of cocreation here are co-evaluation, co-testing, co-investing and co-consumption, and the Lánzanos director says 40 to 50% of projects change during a campaign. Figure 3 places the eight actors across the three levels.", "A second value proposition appears at the micro level, the proposal, though the Verkami director says cultural projects do not change much. The page then moves to the meso level, where exchange runs through a third party and the expert has a role. The value proposition here is an invitation to play, and the example is Heroquest 25, the rewards-based project that raised the most in Spain, at 680.037 euros, where the director says customers were collaborators. Figure 4 sets the metaphors against the three levels and lists the eight forms of cocreation at each.", "The meso level closes with the second metaphor, building bridges, which does not always happen. The macro level is a network where dyads and triads work at once. Two new actors appear there: the associations, which lobby, and public institutions. Following Edvardsson and colleagues, platforms and their associations represent institutionalisation, and in Laamanen and Skalen's sense these relationships could be a conflictual form of cocreation. Two metaphors follow, the wild card and the journey to a destination, tied to what the directors said about equality and emotional links. The discussion opens: crowdfunding can be considered a service ecosystem.", "The discussion tests the ecosystem claim against three conditions from Chandler and Vargo, Lusch and colleagues, and Frow and Payne: service offerings are coproduced, a service offering is exchanged, and value is cocreated. All three, the authors say, are present, and the approach can apply to other ecosystems. They call the crowdfunding ecosystem a significant contribution to the theories of ecosystems. Practitioners should find all the actors, specify the types of cocreation through the Eight Co's, and identify value proposition strategies. For scholars, the results confirm the three propositions, building on FP 7 and FP 10."], "labels": ["Page 55", "Page 56", "Page 57", "Page 58", "Page 59"], "checks": [{"q": "How does the paper describe the micro and the meso levels?", "a": "The micro level is a direct exchange between two parties, the classic dyad. The meso level is an indirect exchange through a triad, which gives the expert a role."}, {"q": "What three conditions does the paper say a network must meet to count as an ecosystem, and does crowdfunding meet them?", "a": "Service offerings are coproduced, a service offering is exchanged, and value is cocreated. The paper says all three are present."}], "audio": "audio/P13-04.mp3", "seconds": 228.7, "words": 505}, {"n": 5, "title": "The conclusion and the reference list", "slides": [], "readings": "", "pages": "60–63", "paragraphs": ["The authors would like work on the kinds of value created, the practices behind them, and the factors behind the emergence of sustainable ecosystems. They say the sampling could be broadened to other kinds of cultural project and other countries, and that checking the model outside the cultural setting would be interesting. The conclusion restates the finding: the cultural crowdfunding context in Spain acts as a service ecosystem, where eight kinds of actor cocreate eight types of value, framed as six metaphors. The list of actors that follows names seven. The reference list begins on this page.", "These three pages are the reference list. The last entry on page 63 is followed by short biographies of the two authors."], "labels": ["Page 60", "Pages 61-63"], "checks": [{"q": "What does the paper conclude, and what does it say about its sample?", "a": "That the cultural crowdfunding context in Spain acts as a service ecosystem, where eight kinds of actor cocreate eight types of value. The authors say the sampling design could be improved by adding projects from other countries."}, {"q": "What follows the last reference entry on page 63?", "a": "Short biographies of the two authors."}], "audio": "audio/P13-05.mp3", "seconds": 57.5, "words": 131}], "seconds": 955.0}, "P14": {"id": "P14", "kind": "reading", "title": "Reading 14: Change agency and reproductive agency in the course of industrial path evolution", "session": "Bækkelund 2021", "lecturer": "Bækkelund", "deck": "Regional Studies 55(4)", "authors": "Bækkelund", "year": 2021, "source": "Regional Studies 55(4)", "lectures": ["T5"], "chapters": [{"n": 1, "title": "The paper in brief", "slides": [], "readings": "", "pages": "the whole paper", "paragraphs": ["Research on regional industry paths has mostly looked at agency in path creation, so radical change agency has moved to the centre. Bækkelund argues that reproductive agency remains under-conceptualized. It is often read as a source of lock-in or obstruction, while its other roles have scarcely been studied (page 757). The paper therefore introduces a distinction between change agency and reproductive agency, and follows both across the whole life of a path. Its research question is: how do change and reproductive agency vary in the course of path evolution?", "Two definitions carry the argument. An industry path is a distinct type of economic activity that gathers enough critical mass to produce self-reinforcing effects, a definition the author takes from Fredin and colleagues on page 758. Agency, in the words of Sotarauta and Suvinen, is action or intervention by an actor to produce a particular effect. From Grillitsch and Sotarauta the paper takes three types of change agency: Schumpeterian entrepreneurship, institutional entrepreneurship and place-based leadership. It then builds a counter-category for each. Replicative entrepreneurship, institutional work and maintenance leadership form the reproductive end of a range, with change leadership on the change side (page 759). The framework follows Martin's path-as-process model and is summarised in Figure 1 on page 760.", "The evidence comes from tourism in three villages in Western Norway: Flåm, Odda and Sogndal. They share formal institutions and landscape, as all three lie at the end of a fjord branch, yet their tourism sectors developed very differently. The design therefore follows the logic of most similar cases with different outcomes. Bækkelund traced each path backwards from the present, using interviews and secondary sources in two rounds. There are 29 interviews in all, including nine background interviews and three follow-ups in August 2020 (page 761).", "In all three cases, reproductive agency is stronger in the preformation phase and in path development, and change agency is stronger in path creation (page 765). The shift into path creation can often be traced to a critical juncture, which in two of the cases was triggered by a problematic situation. The author adds that a critical juncture also needs an opportunity space. Local actors were key in starting each new path, while non-local actors contributed resources not available locally. Flåm shows that public actors can enact Schumpeterian entrepreneurship, and Sogndal shows one person's initiative turning place-based leadership from maintenance towards change. The cases also differ: Flåm has shown more change agency than the other two.", "The paper's contribution is to give reproductive agency its own categories. It concludes that change agency is key to path creation, while reproductive agency is necessary for the path to develop. New paths cannot be explained by local agency or exogenous shocks alone, but by a mix of local and exogenous developments (page 766). The author names the limits too. All three cases come from rural tourism, which has peculiarities of its own, so the argument should be investigated in other regions and industries. The multiscalarity of agency also needs to be explored beyond the local and non-local distinction.", "The paper is a core reading for Lecture 5, Agency and innovation systems in change. Its distinction between change and reproductive agency, and between local and non-local actors, gives you precise terms for Question 1 of the December 2024 exam, which asks what you understand by agency. Question 2 of that exam asks how agency in innovation systems can promote or inhibit sustainable transformation. Here is an example of our own, not from the paper: the framework lets you ask which actors push a green path forward and which keep an old path going. The paper's nearest link is Flåm, where local actors invest in green technology while working to shape new environmental rules."], "labels": [null, null, null, null, null, null], "checks": [{"q": "What question does the paper set out to answer?", "a": "How do change and reproductive agency vary in the course of path evolution?"}, {"q": "Which three villages are the cases?", "a": "Flåm, Odda and Sogndal, three tourism villages in Western Norway."}], "audio": "audio/P14-01.mp3", "seconds": 278.1, "words": 630}, {"n": 2, "title": "Why the paper adds a second kind of agency", "slides": [], "readings": "", "pages": "cover, 757–759", "paragraphs": ["The publisher's cover sheet gives the citation: Bækkelund, Regional Studies 55(4), pages 757 to 768, published online on 15 March 2021.", "The article opens by naming its problem. Evolutionary economic geography has turned to agency, but mostly to change agency in path creation and diversification. Reproductive agency is under-conceptualized and often read as lock-in or obstruction. Bækkelund asks how change and reproductive agency vary in the course of path evolution. The cases are tourism in Flåm, Odda and Sogndal, villages by the Sognefjord and the Hardangerfjord. Tourism suits the question because it is networked and involves many different actors. The abstract states the finding: both kinds of agency matter for industry path development.", "The theoretical section starts from path dependence. Garud and Karnøe first challenged its focus on structure with the idea of path creation, and Martin made the model processual. The paper defines an industry path as a distinct economic activity that reaches enough critical mass to become self-reinforcing, following Fredin and colleagues. Agency, borrowed from Sotarauta and Suvinen, is action by an actor to produce a particular effect. Change usually comes from several actors, and an actor's network is part of its agency. From Grillitsch and Sotarauta comes the trinity of change agency: Schumpeterian entrepreneurship, institutional entrepreneurship and place-based leadership.", "Here the paper builds the reproductive half of the model. Replicative entrepreneurship, from Baumol, covers the many new firms that resemble existing ones. Institutional work, following Lawrence and colleagues, includes efforts that maintain existing institutions. From place-based leadership the paper derives a pair: change leadership and maintenance leadership. Together these form a range from change agency to reproductive agency. The paper adds a distinction between local and non-local actors, since non-local actors may hold placeless power. In the preformation phase, reproductive agency prevails, but it can also build the networks and capabilities that later change needs."], "labels": ["Cover", "Page 757", "Page 758", "Page 759"], "checks": [{"q": "Why does the author say reproductive agency needs more work?", "a": "Because it remains under-conceptualized and is often read only as lock-in or obstruction, while its other roles have scarcely been studied."}, {"q": "Which three categories form the reproductive end of the range?", "a": "Replicative entrepreneurship, institutional work and maintenance leadership."}], "audio": "audio/P14-02.mp3", "seconds": 165.5, "words": 326}, {"n": 3, "title": "Phases of a path, and how they were traced", "slides": [], "readings": "", "pages": "760–762", "paragraphs": ["The paper defines a critical juncture with Capoccia and Kelemen: a period in which agents' choices are much more likely to affect the outcome. A juncture needs an opportunity space and events that call for agency, such as a problematic situation that pushes actors out of routine. Path creation requires Schumpeterian entrepreneurship combined with wider change. The move into path development is gradual, because those who created the path gain vested interests. Figure 1 sums up the model: preformation, a critical juncture, path creation, then path development, which leads either to a stable state or to a dynamic path.", "Too much reproductive agency is likely to lead to lock-in, while a better mix with change agency keeps a path dynamic. The method section explains how each path was traced backwards from the present, using interviews and secondary sources in two rounds. There are 29 interviews, including nine background interviews and three follow-ups in August 2020. The villages share institutions and landscape but saw very different tourism, so the design compares most similar cases with different outcomes. Sogndal has about 4000 inhabitants, Odda about 7000, and Flåm about 400 inhabitants but about a million visitors a year.", "Figure 2 maps the three villages and also marks Bergen. In Sogndal, new football stadium requirements led to a stadium on the campus plot. This began a new era of local collaboration and maintenance leadership, which some informants call the Sogndal model. In 2008 the same networks backed a mountain sport festival, and one person's initiative turned place-based leadership from maintenance towards change. The festival built the valley's reputation for snow. Applicant numbers to the university college then grew faster than the national average, and one board member does not think that was a coincidence."], "labels": ["Page 760", "Page 761", "Page 762"], "checks": [{"q": "What does Figure 1 place between preformation and path creation?", "a": "A critical juncture, which needs an opportunity space and events that call for agency."}, {"q": "How many interviews does the study rest on?", "a": "29 interviews, including nine background interviews and three follow-ups in August 2020."}], "audio": "audio/P14-03.mp3", "seconds": 138.2, "words": 308}, {"n": 4, "title": "Three villages, three tourism paths", "slides": [], "readings": "", "pages": "763–765", "paragraphs": ["Odda was once Norway's top tourist destination and became an industrial town after its first smelting plant opened in 1908. The smelter closed in 2003 with the loss of 200 jobs, a critical juncture, but a dispute over the old plant held back a response. The new path came from a hotel co-owner and the regional marketing organization, who both picked the Trolltunga rock formation. Visitors grew from 1000 in 2009 to 50,000 in 2015. Growth pains followed, with 40 mountain rescues in 2016, and the shared solutions show change agency helping to reproduce a path.", "In Odda, replicative entrepreneurship followed, and visitor numbers stabilized by 2019. Flåm's tourism rests on a railway built in 1941, but its path starts with the risk of closure. In 1997 the state railway decided to end operations. The mayor and the tourism secretary answered with a tourism business model. The railway joined on condition that the municipality buy the infrastructure and build a cruise terminal, which hydroelectric income made possible. The deal combined institutional and Schumpeterian entrepreneurship. Replicative entrepreneurship marked the development phase, and in 2018 Parliament decided that the world heritage fjords must be zero emission by 2026.", "The discussion draws the three cases together. The shift from reproductive to change agency can often be traced to a critical juncture, and in two of the cases a problematic situation triggered it. Local actors were key in starting each new path, while non-local actors supplied resources not available locally. Public actors can also enact Schumpeterian entrepreneurship, as Flåm shows, and one actor may take several roles. The move back towards reproductive agency is gradual, because those who built the path gain vested interests. Flåm has shown more change agency than the other two cases."], "labels": ["Page 763", "Page 764", "Page 765"], "checks": [{"q": "What did the state railway require of the municipality in Flåm?", "a": "That it buy the railway infrastructure and build a cruise terminal in Flåm."}, {"q": "What did the Trolltunga rock formation do for Odda?", "a": "It became the focus of a new hiking tourism path, and visitors grew from 1000 in 2009 to 50,000 in 2015."}], "audio": "audio/P14-04.mp3", "seconds": 145.1, "words": 304}, {"n": 5, "title": "Conclusions and the reference list", "slides": [], "readings": "", "pages": "766–768", "paragraphs": ["The conclusions look ahead and sum up. In Flåm, local actors invest in green technology while doing institutional work to shape the new environmental rules, so the path seems to continue as a dynamic process. The paper states its contribution: change agency is key to path creation, and reproductive agency is necessary for the path to develop. New paths come from a mix of local agency and exogenous developments, not from either alone. The limits are that all the cases come from rural tourism, and that the multiscalarity of agency needs more work.", "These pages are the reference list."], "labels": ["Page 766", "Pages 767-768"], "checks": [{"q": "What does the paper give as its main contribution?", "a": "Categories of its own for reproductive agency, and the conclusion that change agency is key to path creation while reproductive agency is necessary for the path to develop."}], "audio": "audio/P14-05.mp3", "seconds": 53.7, "words": 110}], "seconds": 780.6}, "P15": {"id": "P15", "kind": "reading", "title": "Reading 15: Bricolage versus breakthrough: distributed and embedded agency in technology entrepreneurship", "session": "Garud & Karnøe 2003", "lecturer": "Garud & Karnøe", "deck": "Research Policy 32", "authors": "Garud & Karnøe", "year": 2003, "source": "Research Policy 32", "lectures": ["T5"], "chapters": [{"n": 1, "title": "The paper in brief", "slides": [], "readings": "", "pages": "the whole paper", "paragraphs": ["Most work on entrepreneurship puts agency in a few exceptional individuals, either because of the traits they possess or because they are heroic figures who overcome the odds. Garud and Karnøe argue instead that technology entrepreneurship is a process distributed across many actors. Their question is how one group of actors deploying modest resources could prevail over another group deploying far superior resources. Wind power is the case. American actors had money and scientific backing, while Danish actors had little of either, yet Danish firms became the world leaders in the market.", "Two concepts carry the argument. Agency is distributed, meaning that the inputs shaping a technology come from actors in different domains, each with its own frame of reference (page 280). It is also embedded, because the accumulating path begins to enable and constrain the actors who built it (page 281). The authors then add a pair of labels. Bricolage, a term they take from Levi-Strauss, means resourcefulness and improvisation, and it describes the Danish approach of co-shaping a path through modest but steady gains (pages 278 and 279). Breakthrough means an attempt at dramatic outcomes, and it describes the American approach. Figure 2 on page 279 places the technological artifact at the centre, linked by embedding processes to regulation, evaluation, design and production, and use.", "The evidence is a comparative historical account of the two paths. The authors trace the Danish one from Juul's design in the 1950s through Riisager, Jorgensen and Vestas. The American one runs from Jacobs's small machines and Putnam's giant turbine to the firms that entered after 1974. They follow the same four domains in each country and set the differences out in Table 1 on page 284.", "The findings are stated as suggestions. The authors suggest that a high-tech breakthrough approach may carry inherent disadvantages, because it can stifle the micro-learning that mutual co-shaping needs. In the United States, actors designed for aerodynamic efficiency rather than long-term reliability, treated early failures as start-up difficulties, and replaced broken components instead of analysing them. In Denmark, actors learned from many installation sites, from the shop floor and from comparative tests, and scaled up in many small steps. The authors conclude that actors in the United States may have failed not despite but because of their pursuit of a breakthrough (page 296).", "The contribution is the pair of concepts and the claim that agency is both distributed and embedded. The authors say the study offers additional insights into the potential weaknesses of a breakthrough approach. They also suggest that bricolage preserves emergent properties, and that it may be valuable where actors, artifacts and rules interact in complex, non-linear ways. Such processes may also help in fast-moving environments where competencies, preferences and rules emerge together, and for that, the authors add, actors need a diversity of linkages.", "The paper is a core reading for Lecture 5, Agency and innovation systems in change, where it supplies the contrast between heroic and distributed agency and the two wind turbine cases. For the December 2024 exam, Question 2 asked how agency in innovation systems can promote or inhibit sustainable transformation. Here is an example of our own, not from the paper: the distinction lets you ask whether a green technology is pushed by a few planners or built through many small adjustments. The paper does not use the idea of sustainable transformation, and its nearest point is the account of Danish actors improving turbines step by step while American actors pursued a breakthrough."], "labels": [null, null, null, null, null, null], "checks": [{"q": "What question does the paper ask?", "a": "How a group of actors deploying modest resources could prevail over another group deploying far superior resources, in the emergence of wind turbines in Denmark and the United States."}, {"q": "What do the authors mean by bricolage?", "a": "Resourcefulness and improvisation on the part of involved actors, and co-shaping of the emerging path through modest but steady gains."}], "audio": "audio/P15-01.mp3", "seconds": 254.1, "words": 589}, {"n": 2, "title": "Why agency is distributed, and why it is embedded", "slides": [], "readings": "", "pages": "277–281", "paragraphs": ["The paper opens by rejecting the idea that entrepreneurial agency belongs to a few heroic individuals. The authors note that the entrepreneurship literature usually credits success or failure to specific individuals. Against that, they argue that technology entrepreneurship is a larger process built on the efforts of many. The skills and resources that take an idea to commercial use have to be drawn from actors in several domains. They cite Hayek's point that each distributed actor holds incomplete and often contradictory knowledge. The abstract states the aim: agency is distributed, and also embedded.", "Figure 1 traces global market shares from 1982 to 2000. The US share falls steeply to a small part by 1986, while the Danish share climbs to a large majority and later settles at about half. The authors ask how modestly resourced actors could prevail over far better funded rivals. Their answer: inputs from many actors generate a momentum that enables and constrains those actors. Vestas, the market leader, held 18% of the market. The authors call the Danish approach bricolage, after Levi-Strauss: resourcefulness and improvisation.", "The authors set the two approaches against each other. Danish actors co-shaped the path and sought modest but steady gains, while American actors wanted dramatic outcomes and a design that would leap-frog the Danish initiative. A pioneer of the American path, Stoddard, is quoted admitting that they trusted their engineering tools too much. The paper then turns to theory. Work on the social construction of technological systems shows that a technology's emergence cannot be attributed to any one actor. Figure 2 shows the artifact at the centre, linked by embedding processes to regulation, evaluation, design and production, and use.", "Each domain brings its own frame of reference. Producers act on their beliefs about design, users on the meanings they attach to a product, evaluators on tests and standards, and regulators on what will steer a technology. The set of actors is not stable, and involvement varies in depth. In cochlear implants, basic scientists were involved long before commercial developers. No extra data can remove the interpretive asymmetry between actors, so technology entrepreneurship is a collective creation. They then set out how involvement embeds: learning by doing, by using and by testing.", "A path emerges where several learning processes meet, and it accumulates artifacts, tools, practices, rules and knowledge. Actors are shaped by the inputs they contributed, so entrepreneurship becomes what the authors call mindful deviation: deviate too far and others push back, deviate too little and nothing gathers momentum. Cochlear implants show that alternative paths are possible, with different designs, tests, users and rules. The summary states three facets: technology entrepreneurship creates rather than discovers, its actors are embedded, and the embedding differs by path. Denmark improved a low-tech approach; the US pursued a sophisticated high-tech one."], "labels": ["Page 277", "Page 278", "Page 279", "Page 280", "Page 281"], "checks": [{"q": "What does distributed agency mean in this paper?", "a": "That the inputs shaping a technology come from actors in different domains, each with its own frame of reference, so no single individual can be credited with its emergence."}, {"q": "Why is agency also described as embedded?", "a": "Because the accumulating artifacts, tools, practices, rules and knowledge begin to enable and constrain the actors who generated them."}], "audio": "audio/P15-02.mp3", "seconds": 229.4, "words": 487}, {"n": 3, "title": "Two wind turbine paths begin", "slides": [], "readings": "", "pages": "282–285", "paragraphs": ["Riisager, a carpenter, rebuilt Juul's 1950s design with wood and lorry gears. Jorgensen, a mechanic, added an active yaw, and Vestas licensed the design in 1979. By 1980 there were nine other Danish firms besides Vestas, and the top three held 63% of the Danish market. Rather than design-intensive research, they used simple heuristics and trial and error, learning from each other at Windmeetings from 1976. Owner-users formed their association in 1978, and manufacturers built in a double brake system. The test station, set up that year, learned from the industry it served.", "Each actor entered at a different moment: the energy crisis of 1974 brought in policy actors, investment losses brought in users, and the need for certification brought in the test station. Their inputs then enabled and constrained one another. The American path starts differently. Jacobs built small battery machines for farmers in the late 1920s, and Putnam built a giant grid-connected turbine between 1934 and 1945. Putnam's design shaped a top-down national programme, and that linear, breakthrough-minded approach spilled into the small firms. Stoddard rejected Juul's design as too simplistic. About 20 other firms became active between 1974 and 1986.", "Table 1 compares the two paths across four groups of actors. For designers and producers it contrasts experience-based heuristics and reliability against engineering science and efficiency. For users it contrasts direct learning from many with indirect learning from few. For evaluators it contrasts co-development against selection. For regulators it contrasts strategic steering with opportunities created and abruptly closed. The page adds that the American Wind Energy Association's key purpose was to lobby Congress on emerging wind and renewable energy legislation, and that subsidies and tax credits produced California's wind gold rush. Section 4 names the two patterns bricolage and breakthrough.", "Danish actors began from a low-tech design and scaled up in small steps, developing the product between them; American actors began high-tech and took large steps. Rosenberg's definition of technology, as knowledge of techniques and designs that work even when one cannot explain why, fits the early Danish firms. Each had skilled workers, technicians and a few practical engineers, who saw turbines as problems like agricultural machinery. Without aerodynamic theory they learned by redesigning components that failed, sometimes by throwing metal at the problem. The heavy, slow design unintentionally reduced design risk, because internal weight overshadowed aerodynamic loads."], "labels": ["Page 282", "Page 283", "Page 284", "Page 285"], "checks": [{"q": "How did the Danish and American paths begin differently?", "a": "Denmark began from Juul's design, rebuilt with wood and lorry gears; the United States began from Jacobs's small battery machines and Putnam's giant grid-connected turbine."}, {"q": "What was the key purpose of the American Wind Energy Association?", "a": "To lobby Congress on emerging wind and renewable energy legislation."}], "audio": "audio/P15-03.mp3", "seconds": 201.7, "words": 406}, {"n": 4, "title": "Design, users and the test station: where the paths diverge", "slides": [], "readings": "", "pages": "286–290", "paragraphs": ["Figure 3 shows Bonus in Denmark scaling up in many small steps and USWindpower in far fewer. American engineers worked from engineering science, following what the authors call a linear model of discovery. The Department of Energy's programme managers expected light, high-tech machines to leap-frog the sturdier Danish ones. Indeed, US engineers designed for aerodynamic efficiency rather than long-term reliability. Most adopted an aerospace framing, but much aerospace knowledge proved not only inapplicable to wind turbines but misleading, and it contributed to their low reliability.", "Figure 4 contrasts the two pictures of the wind that American actors worked with: a steady wind model from 1975 and a turbulent one from 1985. Separating design from production fitted the mass production ethos and insulated designers from the field. Relations with suppliers were one-time, short-term contracts, and engineers were discouraged from talking to peers. Scale-ups jumped from 25-100 kW to 300 kW in one move, so firms met many novel problems at once and could not learn from them systematically. At USWindPower, new product development stood still between 1983 and 1987.", "In Denmark turbines went to individuals and cooperatives, and do-it-yourself owners organised wind meetings several times a year. A few hundred machines were installed by the early 1980s, and their dispersal gave producers many places to learn. The owners' association won a fail-safe brake and, from 1980, published monthly reliability and performance figures. In the US, producers went for centralised wind farms in California instead. Ownership was separated from use, so feedback came back dampened and delayed. Danish firms then hit trouble in California around 1987, and two of the largest went bankrupt.", "Reduced feedback hurt during California's boom and bust. New firms rushed in, and producers learnt little. Their aerospace framing left them blind to other possibilities, so they treated failures as start-up difficulties and replaced broken components instead of analysing them. Stoddard said the only feedback they got came from lawyers and lawsuits. Test centres, the authors add, generate common standards and knowledge. In Denmark the test station began in 1978 on the initiative of engineers, with a practical orientation, and the industry itself shaped its research agenda. In 1979 a government act made approval compulsory.", "A government act added a subsidy for buyers covering 30% of a turbine's cost, with an approval system to stop the money being wasted. Firms had no choice but to deal with the test station, which did not yet know what the criteria should be. Its engineers worked with producers and users, and the criteria grew out of users' safety demands and the housing ministry's experience with structural stress. Between 1981 and 1984 the performance of 55 kW machines improved by more than 50%. In the US the laboratory never built such trust."], "labels": ["Page 286", "Page 287", "Page 288", "Page 289", "Page 290"], "checks": [{"q": "Why did the aerospace framing hurt American turbines?", "a": "Much aerospace knowledge proved not only inapplicable to wind turbines but misleading, and it contributed to their low reliability."}, {"q": "What did the Danish approval system require of firms?", "a": "That their turbines be certified through the test station, with a subsidy of 30% of the cost paid to buyers."}], "audio": "audio/P15-04.mp3", "seconds": 230.0, "words": 481}, {"n": 5, "title": "The test centre, the regulators, and the two approaches compared", "slides": [], "readings": "", "pages": "291–295", "paragraphs": ["Figure 5 sets out the linear model that guided the American test centre. Research needs feed basic science and advanced components work, which build a technology base that is then handed to industry. The authors say this technology-push approach shaped how the laboratory's researchers dealt with firms. Both versions of the laboratory had research in their name but not testing, and it avoided systematic testing of commercial turbines. Instead it tried to push the industry towards a revolutionary design. In 1993 its head, Robert Thresher, said they were betting that the light, cost-effective turbine would win the race.", "A Danish model came out every two years, while the American laboratory took two to three years to develop blades alone; one firm said it built its own rather than wait. Testing was patchy: reports came late, machines tested were small and old, and in 1992 the largest at the site was a 20 kW machine. After visiting the Danish test station in 1992, Thresher admitted the work at his own site had become irrelevant. Stoddard counted twelve of the 25 most important papers on turbine design as coming from the Danish station, against five from the American laboratory.", "In Denmark a committee set up after the 1974 energy crisis concluded that wind power was viable. A second crisis in 1979 brought a 30% investment subsidy for certified turbines, later raised to 50%. Installations rose from 8 MW in 1984 to 25 MW in 1985. Regulators modulated growth, cutting direct investment subsidies in steps from 30% in 1979 to none in 1989. In the US, the state spent 486 million dollars on research between 1974 and 1992 without producing a viable turbine, while tax credits and PURPA did more.", "The California boom ended abruptly. 12,000 turbines went in between 1981 and 1986, and the 1100 MW installed was 95% of the world total, but the incentive structure kept investors away from the machines. Vestas's managing director said most American investors never saw a turbine. When tax credits were not extended beyond 1985, firms went bankrupt and lawsuits multiplied. The authors call the policy on-off. Section 5 then sets the two approaches side by side: Danish producers scaled up a heavy, low-speed design while American producers aimed for a light, high-speed one.", "Danish actors were hands-on with the technology and with each other, while in the US formal models stood between actors and artifacts, producing a hands-off quality. In Denmark the coupling of learning processes reinforced the path. Learning from many sites and from the shop floor fed the scale-ups, and comparative tests accumulated knowledge across firms. There were no grand plans; distributed actors created a virtuous learning circle. Boundaries blurred between design and production, planning and execution, rule making and rule following. In the US, mutual co-shaping was much weaker, and involvement was episodic."], "labels": ["Page 291", "Page 292", "Page 293", "Page 294", "Page 295"], "checks": [{"q": "Why did the Danish test station matter for the industry?", "a": "It tested machines of different vintages, and its criteria grew out of users' safety demands and the housing ministry's experience, so standards co-evolved with the technology."}, {"q": "How did the two countries' regulators behave differently?", "a": "Denmark steered, adjusting subsidies in steps from 30% in 1979 to nothing in 1989, while the US created opportunities and then abruptly closed them."}], "audio": "audio/P15-05.mp3", "seconds": 232.9, "words": 494}, {"n": 6, "title": "What the comparison shows, and the reference list", "slides": [], "readings": "", "pages": "296–300", "paragraphs": ["The authors say their study offers insight into the potential weaknesses of a breakthrough approach. Such an approach can alienate those with vested interests, dampen the learning co-shaping needs, and leave firms without knowledge to recover. In the US, turbines kept failing. A new programme to design the best turbine repeated the old recipe, so a vicious circle set in. The conclusion restates the argument: agency is distributed and embedded, and a path accumulates artifacts, tools, practices, rules and knowledge. The authors suggest that American actors may have failed not despite but because of their pursuit of a breakthrough.", "The acknowledgements begin by calling the work a fully collaborative project. They credit a grant from the Center for Interdisciplinary Studies in Technology Management in Denmark and feedback from conferences in Atlanta, Stanford and Helsinki. The authors thank named colleagues for their comments, and many people from the Danish and American wind turbine paths who helped them. The reference list then begins on the same page.", "These pages are the reference list."], "labels": ["Page 296", "Page 297", "Pages 298-300"], "checks": [{"q": "What do the authors conclude about the American pursuit of a breakthrough?", "a": "That actors in the United States may have failed not despite but because of it, since it can stifle the micro-learning that mutual co-shaping needs."}], "audio": "audio/P15-06.mp3", "seconds": 87.9, "words": 187}], "seconds": 1236.0}, "P16": {"id": "P16", "kind": "reading", "title": "Reading 16: Paving the way for new regional industrial paths: actors and modes of change in Scania's games industry", "session": "Miörner & Trippl 2017", "lecturer": "Miörner & Trippl", "deck": "European Planning Studies 25(3)", "authors": "Miörner & Trippl", "year": 2017, "source": "European Planning Studies 25(3)", "lectures": ["T5"], "chapters": [{"n": 1, "title": "The paper in brief", "slides": [], "readings": "", "pages": "the whole paper", "paragraphs": ["Regions do not start new industries on empty ground. The authors begin from work showing that new industrial paths grow out of what a region already has: its firms, its universities, its support agencies and its rules. That work describes a regional environment as either enabling or constraining for a new industry. Miörner and Trippl argue that this picture is too static. Their question is how a constraining environment can be turned into an enabling one, and what role key actors play in that change (page 482).", "The central concept is the regional environment, which includes not only pre-existing industrial structures but also the organizational and institutional support arrangements built up over time (page 481). Their second concept is a set of modes of change. Layering adds new elements to the support structure, such as a new policy instrument or a new organization. Adaptation changes or reorients existing institutions and organizations. Novel application uses existing structures in new, and possibly unforeseen, ways (pages 486-487). The authors link each mode to the power an actor holds, and they adopt Sotarauta and Mustikkamäki's three forms of power: interpretative, network and institutional (page 486).", "The evidence is a case study of the digital games industry in Scania, the southernmost county of Sweden, where the industry is clustered in Malmö (pages 481, 488). The authors combine document studies with 13 in-depth interviews of 60 to 90 minutes, carried out between October and December 2015. Seven interviews were with founders and chief executives of firms, two with the public sector, one with the education system and three with industry experts. Interviewees were found by snowballing (page 488).", "The findings are stated as suggestions. The authors suggest that a more enabling environment for the digital games industry came about through multi-scalar processes and through combinations of modes of change used by a few key individuals (page 481). They follow three new elements in the regional support structure: the Nordic Game Conference, the Game Assembly and Game City (page 490). A small number of people created each, drawing on resources and knowledge from other places and levels (pages 491-493). The authors also find that an actor's degree of power shaped which mode that actor used. Actors with a high degree of power can engage in layering. Actors without it can only adapt existing elements or use them in new ways (page 494).", "The contribution is the typology and the dynamic view of the regional environment. The authors also stress that the key actors in their case were \"by no means\" heroic individuals, and that change relied on bringing other actors in (page 494). The findings rest on one case, and the authors do not claim that they can be generalized to other regions and paths (page 495). They also say there is no inherent hierarchy between the modes: a novel application of existing structures could be as beneficial as adding new ones (page 495).", "The paper is a core reading for Lecture 5, Agency and innovation systems in change, where it supplies the Scania games industry case. The lecture uses page 491 to show one actor exercising several kinds of agency at once. This is the private entrepreneur who ran the Nordic Game Programme and helped create the conference. For the June 2025 exam, Question 2 asked in what way a regional innovation system can promote or inhibit industrial restructuring, with examples. The paper speaks to both halves, listing what held the new industry back in Scania (pages 489-490) and how a few actors changed the support structure (pages 490-493). Here is an example of our own, not from the paper: a region can fund advice centres for manufacturing and still leave a new software industry without anyone who understands its business."], "labels": [null, null, null, null, null, null], "checks": [{"q": "What two questions does the paper set out to answer?", "a": "How a regional environment can be turned into one that enables new industrial path development, and by what modes key actors change that environment."}, {"q": "What three modes of change does the paper distinguish?", "a": "Layering, which adds new elements to the support structure; adaptation, which changes or reorients existing institutions and organizations; and novel application, which uses existing structures in new ways."}], "audio": "audio/P16-01.mp3", "seconds": 282.6, "words": 631}, {"n": 2, "title": "Why a constraining region can be turned into an enabling one", "slides": [], "readings": "", "pages": "cover, 481–484", "paragraphs": ["This is the publisher's cover sheet: the article's title, authors and journal details, with the note that it was published online on 22 July 2016.", "Work on regional environments has shown how pre-existing industrial structures, knowledge organizations, support structures and institutional configurations enable or constrain new path development. The authors call that view too static, and ask how a constraining environment can be turned into an enabling one. They offer a typology of modes key actors use to manipulate support structures, and apply it to the digital games industry in Scania. The introduction adds that path creation is no longer explained only by shocks and chance. The environment also holds support arrangements built up over time, not only industrial structures.", "The authors argue that calling an environment enabling or constraining leaves the relationship static. New paths often need a major reconfiguration of support structures, and the role of actors of change is poorly understood. The literature has concentrated on private actors forming firms, and only recently on public actors. The authors set two questions: how a regional environment can be turned into one that enables new path development, and by what modes key actors change it. They also ask how the power an actor holds relates to the mode used. The page ends by outlining the paper.", "The authors review work that has moved past the older account of path creation as a product of shocks and accidents. Neffke and colleagues said new paths do not start from scratch but are rooted in a region's historical economic structure, and Martin stressed inherited resources and skills. The regional innovation system literature adds networks and support structures. Isaksen and Trippl classify such systems by organizational thickness and specialization. Thick and diversified systems are described as excellent ground for new industries, yet even these may hold constraining factors.", "Constraints, the authors argue, can sit in the private sector, the public support structure or the institutional setting. Capital providers may lack experience of the new industry, so seed funding is hard to find. Public support may be adapted to existing industries, and education may be too generic, leaving a skills mismatch. Networking between firms may go unsupported. Institutions change slowly, political lock-in can favour established players, and competing paths take the policy attention. Little is known about how actors make an environment enabling, so the authors turn to Simmie, for whom knowledgeable agents create new pathways."], "labels": ["Cover", "Page 481", "Page 482", "Page 483", "Page 484"], "checks": [{"q": "What did Neffke and colleagues mean when they said new paths do not start from scratch?", "a": "That new paths are strongly rooted in the historical economic structure of a region, rather than beginning on empty ground."}, {"q": "Where can constraining factors sit, according to the authors?", "a": "In the private sector, in the public support structure and in the institutional setting of the regional innovation system."}], "audio": "audio/P16-02.mp3", "seconds": 193.8, "words": 424}, {"n": 3, "title": "Key actors, three forms of power and three modes of change", "slides": [], "readings": "", "pages": "485–487", "paragraphs": ["The authors summarise several strands of work. Simmie's agents can be inventors or innovators, and they must overcome the economic selection environment, technological paradigms, institutional hysteresis and technological regimes. Simmie and colleagues later applied the framework to wind energy in Great Britain and Germany. Dawley shows regional and non-regional actors shaping Scotland's wind industry, and Sydow and colleagues show actors in a Berlin-Brandenburg optics cluster planning deliberately for positive lock-in. DiMaggio introduced institutional entrepreneurs; Battilana and colleagues call them change agents. Sotarauta and Mustikkamäki then distinguish three forms of power.", "Following Sotarauta and Mustikkamäki, the authors set out three forms of power. Interpretative power is the ability to create a new vocabulary and lead sense making. Network power is the ability to remove obstacles to communication, information flows and collaboration. Institutional power is the power to act, decide, create formal institutions and direct resources. Weik separates institutional entrepreneurs who create, remove or change institutions. Policy entrepreneurs invest their own resources to seek future returns by changing policy. The typology of modes departs from Mahoney and Thelen's work on institutional change, as Martin applied it to regions.", "The page explains the three modes. Layering adds new elements, and is most likely from actors with a high degree of power, such as public actors creating policy instruments. Adaptation changes or reorients existing institutions and organizations, and is used by actors who lack the power to create new ones. Novel application changes the impact of existing elements by using them in new and possibly unforeseen ways, which needs interpretative power and knowledge more than institutional power. Table 1 sets this out in three rows: high power and layering, medium power and
