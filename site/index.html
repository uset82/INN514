 prepares the rollout, through testing, information and guidance. Expert, user and stakeholder forums sit alongside the project.", "Slide 39 highlights broad social benefits: digital identity for all citizens, streamlined public services, strengthened privacy, smooth cross-border interaction, and new commercial opportunities.", "Slide 40 applies the TIS functions to the digital wallet, mostly as open questions:", "Entrepreneurial activity: is there commercial interest in building the ecosystem and its services? The slide notes this is not the first wallet.", "Knowledge development: knowledge of technology, regulation, business models, organisation, universal design, public administration and coordination.", "Knowledge diffusion: networks across public, private and voluntary actors, countries and markets.", "Direction: the European Union regulation, privacy, the union taking on the big platforms, and its four pillars.", "Resource mobilisation: public and private cooperation, and paying for the phase of use, not only for issuing wallets.", "Market formation: how can a market be created, and is there interest in developing services?", "Legitimacy: how can use be secured, given questions of acceptance, fear that big brother is watching, and public money?", "Slide 41 summarises the lecture. Technology development is not only about technology, and technology is also socially constructed. The wallet brings many choices, shaped by European rules on privacy and on systems working together, in one of the most digitalised societies in the world. Every TIS category matters for introducing it. The work calls for understanding whole systems, coordinating, and working outside one's own core field. Technology has both hard and soft sides.", "Slide 42 shows a figure of path dependence from Sydow and colleagues, from 2009. In phase one, there is a wide range of options. After a critical juncture, phase two begins: an emerging path appears, and the range of available options narrows. At lock-in, phase three begins, and the path runs straight on, with almost no other options left. Here is a lesson of our own from the figure, not from the lecture: it is easier to shape a technology while its path is still forming than after lock-in.", "Slide 43 shows Digdir's closing contact information, listing offices in Brønnøysund, Leikanger, and Oslo.", "Here is an exam tip. In December 2024, Question 3 asked: \"how technologies in innovation systems can promote or inhibit sustainable transformation\". In June 2025, Question 3 asked: \"how technological innovation systems can be guided to promote sustainable transformation\".", "You can structure your answer using the seven TIS functions from Hekkert and colleagues (2007) and the insights from Steen and colleagues (2024). Technologies promote transformation when strong knowledge development, clear guidance of the search, and entrepreneurial experimentation generate momentum. However, transformation is inhibited when systemic weaknesses emerge, such as immature market formation, inadequate resources, or resistance from locked-in sociotechnical configurations. To guide a TIS, find the weak functions and aim policy at them."], "checks": [{"q": "How does the Sydow et al. (2009) model on slide 42 explain path dependence?", "a": "It shows development moving from open options in Phase 1, through a critical juncture into narrowing choices in Phase 2, leading to lock-in in Phase 3."}, {"q": "How can policymakers use the TIS functional framework to guide sustainable transformation?", "a": "By identifying which of the seven functions are weak (such as market formation or resource provision) and implementing targeted policy measures to unblock them (Hekkert et al. 2007; Steen et al. 2024)."}], "audio": "audio/T6-07.mp3", "seconds": 283.9, "words": 567}], "seconds": 1440.2}, "T8": {"id": "T8", "title": "Lecture 9: Summary and exam preparation", "session": "Kursplan 2026, session 9 (2 November)", "lecturer": "Arnt Fløysand", "deck": "Forelesning 8 Fløysand Oppsummering.pdf (H2025, 43 slides)", "chapters": [{"n": 1, "title": "Course aims, structure and the reading list", "slides": [1, 2, 3, 4], "readings": "none new", "paragraphs": ["This lecture sums up INN514, Innovation Systems and Sustainable Transformation, and prepares you for the exam. Arnt Fløysand gives it.", "Slide 2 restates the aims of the course. The course builds on INN500. It stresses that innovation results from interaction between different actors, natural resources and technologies. It introduces three system perspectives: territorial innovation systems, entrepreneurial ecosystems and technological innovation systems. The goal is to discuss the theories and relate them to examples, in lectures, guest lectures and seminars where students present articles. The slide ends with the exam, which chapter 6 covers.", "Slide 3 lists the sessions of the semester when these slides were made. Be careful with the numbers. The slides use that older order, while this companion follows the 2026 course plan. On the slides, entrepreneurial ecosystems is Lecture 3, technological innovation systems is Lecture 4, institutional work is Lecture 5 and agency is Lecture 6. In this companion they are Lectures 4, 6, 3 and 5. Crowdfunding, the slides' Lecture 7, is our bonus lecture. Lectures 1 and 2 match. From here on, we use the companion's numbers. The reading for this summary is the article by Njøs and colleagues, which chapter 4 uses.", "Slide 4 notes that several articles on the reading list are relevant to more than one lecture, and suggests reading them in the order listed."], "checks": [{"q": "According to slide 2, what does innovation result from?", "a": "Interaction between different actors, natural resources and technologies."}, {"q": "How does the course connect theory and practice?", "a": "It asks you to discuss the theories and relate them to examples, through lectures, guest lectures and seminars where students present articles."}], "audio": "audio/T8-01.mp3", "seconds": 112.2, "words": 232}, {"n": 2, "title": "Innovation as systemic", "slides": [5, 6, 7, 8], "readings": "none new", "paragraphs": ["Slide 5 quotes two definitions of innovation systems by Markard and Truffer, from 2008. First, they are networks of actors and institutions that develop, spread and use innovations. Second, they are a set of organisations and institutions and the relationships between them.", "The slide then explains each part: Organisations are the actors. Institutions are formal laws and rules, and informal norms, perceptions and routines for ways of doing. The relationships between organisations and institutions are the links and networks.", "Slide 6 lists the system perspectives of the course: Territorial innovation systems, at national, regional and global level, put geographical embedding at the centre. Entrepreneurial ecosystems put the entrepreneur and the entrepreneur's context at the centre. Technological innovation systems put technologies and policy instruments at the centre.", "Slide 7 says that these perspectives understand a system differently, but share some ideas. All see innovation as interactive. A system structures innovation practice, which is what path dependence means. Yet systems also contain agency: organisations and actors who act. So there is room to change a system, through path renewal or by setting up new paths. One example is institutional work that changes relationships and meaning-making, to stimulate sustainable transformation.", "Slide 8 repeats that territorial innovation systems focus on geographical embedding."], "checks": [{"q": "How do Markard and Truffer describe an innovation system, as quoted on slide 5?", "a": "As networks of actors and institutions that develop, spread and use innovations, or as a set of organisations and institutions and the relationships between them."}, {"q": "What balance between structure and action do the perspectives share, according to slide 7?", "a": "Systems structure innovation practice through path dependence, but agency leaves room for change through path renewal and new paths."}], "audio": "audio/T8-02.mp3", "seconds": 106.8, "words": 213}, {"n": 3, "title": "National, regional and global innovation systems", "slides": [9, 10, 11, 12, 13, 14, 15, 16, 17], "readings": "Fagerberg et al. 2009, pp. 437, 438", "paragraphs": ["Slide 9 recaps national innovation systems from Lecture 1. Each nation-state has its own formal and informal institutions, its own R&D profile, natural resources and industrial history. Together these give countries different capacity to innovate.", "Slide 10 returns to the Norwegian paradox. Norway has high productivity and value creation, but relatively low R&D intensity. The slide quotes Fagerberg and colleagues, from 2009, on pages 437 and 438. They see an important strength of the Norwegian system in its strong performance in knowledge diffusion and cooperation in innovation. The lecture explains this by an economy based on natural resources and shaped by concession and industrial policies. In the oil and gas industry, specialised knowledge, skills and suppliers innovated through interactive processes. These combine science-based learning, called STI, with learning by doing, using and interacting, called DUI.", "Slide 11 moves to regional innovation systems from Lecture 2. A regional innovation system is the infrastructure, network dynamics and institutional conditions that hinder or promote innovation in a region. Hard factors include natural resources, specialised labour, suppliers and knowledge organisations. Soft factors include networks, institutions, tacit knowledge and local buzz.", "Slides 12 and 13 describe the three subsystems of a regional innovation system. Slide 13 cites Tödtling and Trippl, from 2005, and Isaksen and Trippl, from 2017. First, the production subsystem consists of firms and industries, often organised in clusters. Second, the knowledge subsystem consists of research and education organisations. Third, the support subsystem includes cluster organisations, incubators and political governance bodies. Knowledge flows and learning go on within and between the subsystems. Formal and informal rules stimulate or hinder innovation.", "Slide 14 looks at the production subsystem. A cluster, in the sense of Michael Porter, brings together similar firms, specialised suppliers, service providers and related industries. The slide states that firms in regional clusters are more innovative than firms outside them. Clusters involve shared tacit knowledge, competition, collaboration and workers moving between firms.", "Slide 15 turns to the knowledge subsystem. Universities have three missions: education, research, and contributing to economic and social development. Today, rather than assuming research helps automatically, the focus is on how universities work with the world around them.", "Slide 16 gives an example of the support subsystem: the Section for Innovation Studies at HVL, where the lecturer works. It researches how innovation happens and how research can give it a desired direction. Its projects include RRI2scale with Vestland County Council, the hydrogen research centre HyValue, and AQUABALANCE with the fish-farming industry.", "Slide 17 addresses global innovation systems. Globalisation means studying global innovation networks that link national and regional systems. The key system elements are knowledge, new markets, capital and legitimacy. Parts of these elements are found in different places. Structural coupling is about how far, and in what way, the subsystems are linked."], "checks": [{"q": "What are the three subsystems of a regional innovation system on slides 12 and 13?", "a": "The production subsystem of firms and clusters, the knowledge subsystem of research and education organisations, and the support subsystem of cluster organisations, incubators and political governance bodies."}, {"q": "What is structural coupling, according to slide 17?", "a": "How far, and in what way, the subsystems that hold the key system elements, such as knowledge, markets, capital and legitimacy, in different places are linked."}], "audio": "audio/T8-03.mp3", "seconds": 246.1, "words": 472}, {"n": 4, "title": "Entrepreneurial ecosystems and technological systems", "slides": [18, 19, 20, 21, 22, 23, 24, 25], "readings": "Njøs et al. 2020, pp. 266, 268", "paragraphs": ["Slide 18 recaps entrepreneurial ecosystems from Lecture 4. An entrepreneurial ecosystem is a framework that links entrepreneurship to networks whose dynamics matter for entrepreneurial activity. The framework stresses communities of practice.", "Slide 19 shows entrepreneurs at the centre of overlapping contexts: organisational, institutional and policy, social, and industry and technology. Slide 20 says that the explanation runs from agency to structure. The most important factors come from the entrepreneurs themselves, through knowledge sharing and learning in their community of practice. An ecosystem must grow from the bottom up; nobody can create one by decision. Politicians can support the entrepreneurial community. But without leadership and commitment from that community, measures have limited effect.", "Slide 21 turns to technological innovation systems, Lecture 6. The slide defines a technological innovation system, or TIS, as a network of actors in a bounded technology field. They interact within a specific institutional infrastructure, to create, spread and use a technology. The slide names three elements: actors, networks, and institutions such as laws, rules and norms. It then quotes van Alphen and colleagues, from 2011. Actors range from individuals and firms to universities and public agencies, and institutions include laws, policy targets and social norms.", "Slide 22 links back to Lecture 1, repeating its figure of teams, tools and tasks. Technology cannot be understood in isolation from the social system it is part of. Slide 23 quotes Hanson and colleagues, from 2011. Technology development is a process of including firms, knowledge organisations, financial institutions, public agencies and others in developing, producing and using the new technology.", "Slide 24 opens by saying that technical change alone is not enough. Socio-cultural and political conditions help decide which changes start, and whether they are implemented. The slide then lists the seven functions of a TIS: entrepreneurial activity, knowledge development, knowledge diffusion through networks, guidance of the search, market formation, resource mobilisation and legitimacy. The approach combines innovation system research with transition studies, and looks for drivers and barriers for new green technology. The slide names two examples: carbon capture and storage, and maritime battery technology.", "These are the two cases in this lecture's reading, by Njøs and colleagues, from 2020. On page 266, the authors argue that neither territorial dynamics nor technological characteristics alone explain path creation. What matters is how the two connect. On page 268, they adopt a definition by MacKinnon and colleagues. Path creation is the emergence of new development trajectories in a region, based on the growth of new industrial sectors, products, techniques or forms of organisation.", "Slide 25 sums up the course in a table of focus, example and readings. Entrepreneurial ecosystems focus on conditions for entrepreneurship, on agency, and on the founder community. The example is UiB and Marineholmen. The reading is Spigel and Harrison, which the slide dates 2017, though the article on your reading list is from 2018. National innovation systems focus on national conditions, where knowledge policy and industrial policy are central. The example is Norway, with Fagerberg and colleagues. Regional innovation systems focus on the three regional subsystems. The example is Hordaland and Rogaland, with Fløysand and colleagues, from 2022, in Lectures 2 and 3. Technological innovation systems focus on the transition to a new technology, as a function of the seven functions. The column also names the multi-level perspective. The examples are carbon capture and storage, electric cars, wind power and hydrogen. The readings are Njøs and colleagues, and Hekkert and colleagues, from 2007."], "checks": [{"q": "Why does the explanation in entrepreneurial ecosystems run from agency to structure, according to slide 20?", "a": "Because ecosystems grow bottom-up from the founders' shared learning and leadership; politicians can support the community, but nobody can create an ecosystem by decision."}, {"q": "How does the table on slide 25 tell the perspectives apart?", "a": "By analytical focus: surrounding conditions and founder communities for entrepreneurial ecosystems; national conditions, knowledge policy and industrial policy for national systems; the three regional subsystems for regional systems; and the seven functions behind a technology transition for TIS."}], "audio": "audio/T8-04.mp3", "seconds": 291.7, "words": 582}, {"n": 5, "title": "Sustainable transformation and institutional work", "slides": [26, 27, 28, 29, 30, 31, 32], "readings": "Fløysand et al. 2022, p. 17", "paragraphs": ["Slide 26 notes that the system perspectives in the course have paid less attention to sustainable transformation. One question is how systems can contribute to green industrial restructuring. On page 17, Fløysand and colleagues, from 2022, define it with a phrase from UNEP. It means processes of change that reduce carbon emissions and pollution, enhance energy and resource efficiency, and prevent the loss of biodiversity and ecosystem services.", "The slide also compares the state's role. In entrepreneurial ecosystems, it coordinates rather than steers. In territorial systems, it actively supports knowledge development, the regional subsystems and internationalisation. In technological systems, policy at all levels must remove obstacles to the desired transition.", "Slide 27 presents Schlaile and colleagues. The slide dates their article 2019, but the article on your reading list is from 2017. They argue that supporting innovation in itself is not enough. Innovation systems need a direction to solve the challenges of society. A quote on the slide calls for more research on directionality, legitimacy, responsibility, and how these relate. The slide explains the word normative with a dictionary definition: it sets how something ought to be. Separately, it says that technical solutions alone cannot reach sustainability goals. Economic, institutional, cultural and organisational conditions must change too.", "Slide 28 is about direction. Defining targeted missions for society is a political act, as Janssen and colleagues noted in 2021. The slide asks: who wins and who loses from the innovations? Innovations can lead to conflict, power struggles and loss of biodiversity. So the slide calls for a balance: broad involvement, but with a clear direction and concrete goals.", "Slide 29 is about transformative innovation policy. It gives three definitions from the UN, from 2023. Economic sustainability is the efficient use and fair distribution of resources. Social sustainability is the well-being, equity and inclusion of communities. Environmental sustainability means using nature without harming it beyond its capacity to regenerate. They matter: Question 1 of the June 2025 exam asked what you understand by sustainability.", "Slides 30 and 31 return to institutional work in Hordaland and Rogaland, from Lecture 3. Slide 30 quotes Lawrence and colleagues, from 2011. Institutional work is physical and mental effort aimed at affecting an institution or a set of institutions. It can maintain, change or create institutions, both formal rules and informal ways of doing. The slide borrows a phrase from North, from 1990, to place these in social, political and economic relation /* Where next: the way on from a class or a paper. */
function whereNext(c, reading) {
  const items = [];
  if (reading) {
    const first = cat(c.lectures[0]);
    const others = first ? (first.readings || []).map(rcat).filter((r) => r && r.id !== c.id && r.ready) : [];
    if (others.length) items.push(`<li><span class="label">Other papers for ${esc(classWord(first))}:</span> <span class="links">${others
      .map((r) => `<a href="#${r.id}">${esc(className(r))}, ${esc(r.title)}</a>`).join(", ")}</span></li>`);
    if (first) items.push(`<li><a href="#${first.id}">${esc(className(first))}: ${esc(first.title)}</a></li>`);
    const prv = neighbour(c.id, -1), nxt = neighbour(c.id, 1);
    if (prv) { const p = entry(prv); items.push(`<li><span class="label">Previous paper:</span> <a href="#${p.id}">${esc(className(p))}, ${esc(p.title)}</a></li>`); }
    if (nxt) { const p = entry(nxt); items.push(`<li><span class="label">Next paper:</span> <a href="#${p.id}">${esc(className(p))}, ${esc(p.title)}</a></li>`); }
    else if (SERIES.papers.length > 1) { const p = entry(SERIES.papers[0]); items.push(`<li><span class="label">Back to the first paper:</span> <a href="#${p.id}">${esc(className(p))}, ${esc(p.title)}</a></li>`); }
    items.push(`<li><a href="#papers">All papers</a></li>`);
  } else {
    const papers = (c.readings || []).map(rcat).filter((r) => r && r.ready);
    if (papers.length) items.push(`<li><span class="label">Papers for this class:</span> <span class="links">${papers
      .map((r) => `<a href="#${r.id}">${esc(className(r))}, ${esc(r.title)}</a>`).join(", ")}</span></li>`);
    const prv = neighbour(c.id, -1), nxt = neighbour(c.id, 1);
    if (prv) { const p = entry(prv); items.push(`<li><span class="label">Previous class:</span> <a href="#${p.id}">${esc(className(p))}, ${esc(p.title)}</a></li>`); }
    if (nxt) { const p = entry(nxt); items.push(`<li><span class="label">Next class:</span> <a href="#${p.id}">${esc(className(p))}, ${esc(p.title)}</a></li>`); }
    else if (SERIES.classes.length > 1) { const p = entry(SERIES.classes[0]); items.push(`<li><span class="label">Back to the first class:</span> <a href="#${p.id}">${esc(className(p))}, ${esc(p.title)}</a></li>`); }
    items.push(`<li><a href="#classes">All classes</a></li>`);
  }
  return `<section class="next" aria-labelledby="next-h"><h2 id="next-h">Where next</h2><ul>${items.join("")}</ul></section>`;
}

function refreshProgress() {
  view.querySelectorAll(".row[data-id]").forEach((li) => {
    const id = li.dataset.id, L = DATA.lectures[id];
    if (!L) return;
    const frac = doneSet(id).size / L.chapters.length;
    li.style.setProperty("--p", frac);
    li.classList.toggle("heard", frac > 0);
    const info = li.querySelector("[data-info]");
    if (info) info.textContent = rcat(id) ? paperInfo(rcat(id)) : classInfo(cat(id));
  });
  view.querySelectorAll(".door").forEach((d) => {
    const t = totals(d.dataset.door === "classes" ? DATA.catalog.map((c) => c.id) : READINGS.map((r) => r.id));
    d.style.setProperty("--p", t.chapters ? t.heard / t.chapters : 0);
    const info = d.querySelector("[data-door-info]");
    if (info) info.textContent = t.heard ? `${t.heard} of ${t.chapters} chapters heard` : "No chapters heard yet";
  });
  if (viewId) {
    const s = doneSet(viewId);
    view.querySelectorAll(".chapters .stop").forEach((li) => {
      const i = +li.dataset.i;
      li.style.setProperty("--p", s.has(i) ? 1 : 0);
      li.classList.toggle("done", s.has(i));
      const now = !!pl && pl.id === viewId && i === plIdx;
      li.classList.toggle("now", now);
      li.querySelector(".body").toggleAttribute("aria-current", now);
    });
  }
}

/* ---------- player ---------- */
function paragraphStarts(ch) {
  const titleWords = ("Chapter " + ch.n + ". " + ch.title).split(/\s+/).length;
  // A reading's page summaries are spoken after their label ("Page 431."), so count it too.
  const words = ch.paragraphs.map((p, k) => p.split(/\s+/).length + (ch.labels && ch.labels[k] ? ch.labels[k].split(/\s+/).length : 0));
  const total = titleWords + words.reduce((a, b) => a + b, 0);
  let acc = titleWords;
  return words.map((w) => { const s = acc / total; acc += w; return s; });
}
function loadChapter(id, i, startAt) {
  const L = DATA.lectures[id];
  if (!L) return;
  pl = L; plIdx = Math.max(0, Math.min(i, L.chapters.length - 1));
  const ch = L.chapters[plIdx];
  ch._starts = ch._starts || paragraphStarts(ch);
  audio.src = ch.audio;
  audio.dataset.startAt = startAt || 0;
  $("nowTitle").href = "#" + id;
  $("nowTitle").textContent = `${className(entry(id))}, chapter ${ch.n}: ${ch.title}`;
  markParagraph(-1);
  refreshProgress();
  if ("mediaSession" in navigator) {
    try { navigator.mediaSession.metadata = new MediaMetadata({ title: `${ch.n}. ${ch.title}`, artist: "INN514 Course Companion", album: L.title }); } catch (e) {}
  }
}
function play(id, i, scroll) {
  loadChapter(id, i, 0);
  audio.play().catch(() => {});
  if (scroll && viewId === id) { const el = $("ch-" + plIdx); if (el) el.scrollIntoView({ behavior: smooth(), block: "start" }); }
}
function resume(pos) {
  loadChapter(pos.lecture, pos.chapter, pos.time);
  audio.play().catch(() => {});
}

let lastPara = -1;
function markParagraph(k) {
  if (k === lastPara) return;
  lastPara = k;
  view.querySelectorAll("p.prose.now").forEach((p) => p.classList.remove("now"));
  if (k < 0 || !pl || viewId !== pl.id) return;
  const p = view.querySelector(`#ch-${plIdx} p.prose[data-k="${k}"]`);
  if (!p) return;
  p.classList.add("now");
  if (follow && !audio.paused) p.scrollIntoView({ behavior: smooth(), block: "center" });
}

audio.addEventListener("loadedmetadata", () => {
  const t = +audio.dataset.startAt || 0;
  if (t > 0 && t < audio.duration - 2) audio.currentTime = t;
  audio.playbackRate = RATES[rateIdx];
  $("tDur").textContent = fmt(audio.duration);
});
let seeking = false;
audio.addEventListener("timeupdate", () => {
  const d = audio.duration || 1, t = audio.currentTime;
  $("tCur").textContent = fmt(t);
  if (!seeking) $("seek").value = Math.round((t / d) * 1000);
  if (!pl) return;
  const ch = pl.chapters[plIdx];
  if (ch && ch._starts) { const f = t / d; let k = -1; ch._starts.forEach((s, idx) => { if (f >= s) k = idx; }); markParagraph(k); }
  if (audio.duration && t / d >= 0.9) markDone(pl.id, plIdx);
  store.pos = { lecture: pl.id, chapter: plIdx, time: Math.floor(t) }; save();
});
audio.addEventListener("play", () => { $("playIcon").innerHTML = PAUSE; gbMoveTo(gbPos); });
audio.addEventListener("pause", () => { $("playIcon").innerHTML = PLAY; gbMoveTo(gbPos); });
audio.addEventListener("ended", () => {
  if (!pl) return;
  markDone(pl.id, plIdx);
  if (plIdx < pl.chapters.length - 1) return play(pl.id, plIdx + 1, false);
  const nxt = autoplay ? neighbour(pl.id, 1) : null;
  if (nxt) return goOn(nxt, 0);
  $("playIcon").innerHTML = PLAY; markParagraph(-1);
});
$("seek").addEventListener("input", () => { seeking = true; $("tCur").textContent = fmt((audio.duration || 0) * $("seek").value / 1000); });
$("seek").addEventListener("change", () => { if (audio.duration) audio.currentTime = audio.duration * $("seek").value / 1000; seeking = false; });
$("play").onclick = () => {
  if (!pl) { const first = viewId && DATA.lectures[viewId] ? viewId : DATA.catalog.find((c) => c.ready).id; return play(first, 0, true); }
  audio.paused ? audio.play().catch(() => {}) : audio.pause();
};
$("back").onclick = () => { audio.currentTime = Math.max(0, audio.currentTime - 15); };
$("fwd").onclick = () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 30); };
$("prev").onclick = () => {
  if (!pl) return;
  if (audio.currentTime > 5) audio.currentTime = 0;
  else if (plIdx > 0) play(pl.id, plIdx - 1, true);
  else { const p = neighbour(pl.id, -1); if (p) goOn(p, DATA.lectures[p].chapters.length - 1); }
};
$("next").onclick = () => {
  if (!pl) return;
  if (plIdx < pl.chapters.length - 1) play(pl.id, plIdx + 1, true);
  else { const n = neighbour(pl.id, 1); if (n) goOn(n, 0); }
};
$("rate").onclick = () => {
  rateIdx = (rateIdx + 1) % RATES.length; audio.playbackRate = RATES[rateIdx];
  $("rate").textContent = RATES[rateIdx] + "×"; store.rate = RATES[rateIdx]; save();
};
$("rate").textContent = RATES[rateIdx] + "×";
$("follow").onclick = () => { follow = !follow; $("follow").setAttribute("aria-pressed", String(follow)); };
$("auto").setAttribute("aria-pressed", String(autoplay));
$("auto").onclick = () => { autoplay = !autoplay; $("auto").setAttribute("aria-pressed", String(autoplay)); store.autoplay = autoplay; save(); };
if ("mediaSession" in navigator) {
  const h = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) {} };
  h("play", () => audio.play()); h("pause", () => audio.pause());
  h("seekbackward", () => $("back").onclick()); h("seekforward", () => $("fwd").onclick());
  h("previoustrack", () => $("prev").onclick()); h("nexttrack", () => $("next").onclick());
}

/* ---------- routing: #home, #classes, #papers, a class id (#T1) or a paper id (#P01) ---------- */
function setNav(id) {
  const onClasses = id === "classes" || !!cat(id);
  const onPapers = id === "papers" || !!rcat(id);
  document.querySelectorAll(".mainnav a").forEach((a) => {
    const on = (a.dataset.nav === "classes" && onClasses) || (a.dataset.nav === "papers" && onPapers);
    if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}
function route() {
  const id = location.hash.slice(1);
  if (id === "classes") renderClasses();
  else if (id === "papers") renderPapers();
  else if (id === "search") renderSearch();
  else if (entry(id)) renderLecture(id);
  else renderHome();               // "", "home", "route" and anything unknown
  setNav(id);
  const target = (pendingPage && document.getElementById("page-" + pendingPage))
    || (pendingChapter !== null && document.getElementById("ch-" + pendingChapter));
  pendingPage = null; pendingChapter = null;
  if (target) target.scrollIntoView({ block: "start" }); else window.scrollTo(0, 0);
}
// The skip link moves focus into the view without touching the hash, which is the route.
document.querySelector(".skip").addEventListener("click", (e) => {
  e.preventDefault(); view.focus(); view.scrollIntoView({ behavior: smooth(), block: "start" });
});
// A link to a page of a reading ("pp. 437") opens the reading and scrolls to that page.
view.addEventListener("click", (e) => {
  const a = e.target.closest("a[data-page]");
  if (a) pendingPage = a.dataset.page;
  const c = e.target.closest("a[data-chapter]");
  if (c) pendingChapter = +c.dataset.chapter;

    + (picks.length ? "\n\n" + picks.map((p) => chapterBlock(p.id, chapterIndexOf(p.id, p.chapter))).join("\n\n") : "");
}
function searchHits(q) {             // up to 3 chapters the local search is sure about

}
function mergePicks(picks, hits) {   // the model's picks first, then the search's, at most 4
  const out = [];

  return out;

/* A4: the device voice. The queue speaks each sentence as it arrives; text is only the backup. */

function pickVoice(lang) {
  const pre = lang.slice(0, 2).toLowerCase();
  const match = speechSynthesis.getVoices().filter((v) => (v.lang || "").toLowerCase().replace("_", "-").startsWith(pre));
  return match.find((v) => /Natural|Neural|Google|Microsoft/.test(v.name)) || match[0] || null;
}
function voiceFor(lang) {
  if (!("speechSynthesis" in window)) return Promise.resolve(null);
  const choose = () => pickVoice(lang) || (speechSynthesis.getVoices().length ? "default" : null);
  if (speechSynthesis.getVoices().length) return Promise.resolve(choose());
  return new Promise((res) => {
    const t = setTimeout(() => res(choose()), 1000);
    speechSynthesis.addEventListener("voiceschanged", () => { clearTimeout(t); res(choose()); }, { once: true });

    onStart();

    orb.classList.add("pulse");

let orbAudio = null;             // the orb's own audio element (server mode, A6)
const SERVER_ASK_NOTE = "Answers are written by a free AI model from this chapter's text and read aloud by an AI voice. Don't type personal details.";
const DEVICE_ASK_NOTE = "Answers are written by AI from this chapter's text and read aloud by your device.";
let serverPass = null;
let passNeeded = true;           // server mode: false when the server has no passcode set

function forgetServerPass() {

function stopAsk(panel) {

let openAsk = null;              // the one panel that is open, if any
function wirePass(panel, resend) {   // the passcode row wiring, moved unchanged from askToggle (H1)
  const passRow = panel.querySelector(".ask-pass"), passInput = passRow.querySelector("input");
  const submitPass = () => {

function claudeError(panel, e) {   // the error table from askSend's catch, moved unchanged (H1)
  gbErrorUntil = performance.now() + 2500;
  const status = panel.querySelector(".ask-status");
  const code = e && e.code;
  if (code === "not_granted" || code === "sampling_disabled" || code === "not_declared" || code === "capability_disabled" || code === "capability_removed") {
    document.body.classList.remove("can-ask");
    status.textContent = "Asking isn't available here.";
  } else if (code === "rate_limited") status.textContent = "Too many questions right now. Try again in a minute.";
  else if (code === "session_expired") status.textContent = "Sign in again, then ask.";
  else if (code === "refused") status.textContent = "That question couldn't be answered. Try asking it another way.";
  else if (code === "prompt_too_large" || code === "empty_completion") status.textContent = "That was too much at once. Try a shorter question.";
  else status.textContent = "The answer was interrupted. Ask again.";   // upstream_error and anything else; what was spoken stays spoken
}
function streamClaudeAnswer(panel, turns, lang, cache, onDone) {

    panel.querySelector(".gb-words").textContent = "This device has no voice, so the answer is only written.\n" + buf;
    panel.querySelector(".gb-hello").hidden = true;

    if (panel._ask !== st || st.ctl !== ctl || failed || voice === undefined) return;
    if (!voice) { show(); if (settled) clearBusy(); return; }

      const s = queued.shift();
      speaking++;
      speakSentence(panel, s, voice, lang, () => { onstart(); caption(panel, s); }, () => { if (!--speaking) clearBusy(); });
    }
    if (settled && pending) {
      const s = pending; pending = "";
      speaking++;

    }
    if (settled && !speaking) clearBusy();
  };

  const chooseVoice = (sample) => {        // judged from the answer's first sentence, so a Spanish answer gets a Spanish voice
    if (choosing) return;

    modelTier: "default",

function askSend(id, i, panel, question, isChip) {
  if (askMode === "server") { askSendServer(id, i, panel, question, isChip); return; }
  if (askMode !== "claude" || !sampleFn) return;
  const st = panel._ask;
  const turns = [{ role: "user", content: chapterContext(id, i) }, ...st.hist, { role: "user", content: question }];
  streamClaudeAnswer(panel, turns, askLang(question, isChip), isChip && st.first ? undefined : false, (buf) => {
    st.hist.push({ role: "user", content: question }, { role: "assistant", content: buf });
    st.hist = st.hist.slice(-6);   // the conversation keeps at most the last 6 turns
    st.first = false;
  });

/* A6: the same panel using the course server and its AI voices. */
function serverSetBusy(panel, txt) {
  const st = panel._ask;
  if (!st) return;
  const status = panel.querySelector(".ask-status");
  if (st.busy !== txt) {
    st.busy = txt;
    status.textContent = txt;
    if (txt) {
      const b = document.createElement("button");
      b.className = "ask-stop"; b.type = "button"; b.textContent = "Stop";
      b.onclick = () => stopAsk(panel);
      status.appendChild(document.createTextNode(" "));
      status.appendChild(b);
    }
  }
  panel.querySelector(".orb").classList.toggle("thinking", txt === "Thinking…");
}
function serverClearBusy(panel) {
  if (panel._ask) panel._ask.busy = "";
  panel.querySelector(".ask-status").textContent = "";
  panel.querySelector(".orb").classList.remove("thinking");
}
function serverShowText(panel, text) {
  panel.querySelector(".gb-words").textContent = "This device has no voice, so the answer is only written.\n" + text;
  panel.querySelector(".gb-hello").hidden = true;
}
function serverError(panel, e) {
  gbErrorUntil = performance.now() + 2500;
  const status = panel.querySelector(".ask-status");
  if (panel._ask) panel._ask.busy = "";
  panel.querySelector(".orb").classList.remove("thinking");
  if (e && e.status === 401) {
    forgetServerPass();
    const row = panel.querySelector(".ask-pass");
    row.hidden = false;

  else if (e && e.status === 400) status.textContent = "That was too much at once. Try a shorter question.";

async function askServer(id, i, question) {
  const panel = openAsk, st = panel && panel._ask;
  if (!st || !st.ctl) throw new Error("The answer was interrupted.");
  const r = await fetch("/api/ask", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Grokbot-Passcode": serverPass },
    body: JSON.stringify({ id, chapter: i, question, history: st.hist }),
    signal: st.ctl.signal,
  });
  if (!r.ok) { const e = new Error("Ask failed"); e.status = r.status; throw e; }
  const out = await r.json();
  if (!out || typeof out.text !== "string" || !out.text.trim()) throw new Error("Empty answer");

}
function playOrbBlob(panel, blob, ctl) {
  return new Promise((resolve, reject) => {
    if (!orbAudio) orbAudio = new Audio();
    const a = orbAudio, url = URL.createObjectURL(blob);
    let settled = false;
    const finish = (e) => {
      if (settled) return;
      settled = true;
      a.onended = a.onerror = a.onpause = a.onplaying = null;
      URL.revokeObjectURL(url);
      if (e) reject(e); else resolve();
    };
    a.onended = () => finish();
    a.onerror = () => finish(new Error("Audio playback failed"));
    a.onpause = () => { if (ctl.signal.aborted) finish(); };
    a.onplaying = () => audio.pause();
    a.src = url;
    const playing = a.play();
    if (playing && playing.catch) playing.catch(finish);
  });
}
function serverDevicePart(panel, text, voice, lang, ctl) {
  return new Promise((resolve) => {
    const done = () => resolve();
    ctl.signal.addEventListener("abort", done, { once: true });
    speakSentence(panel, text, voice, lang, () => { audio.pause(); serverSetBusy(panel, "Speaking…"); caption(panel, text); }, done);
  });
}
async function speakServerAnswer(panel, text, lang, ctl) {   // moved unchanged from askSendServer (H1)

  st.lastBlobs = [];
  const first = text.match(/^([\s\S]+?[.!?])(?:\s+([\s\S]+))?$/);
  const parts = first && first[2] ? [first[1], first[2]] : [text];
  const fetchPart = (part) => {
    const p = fetch("/api/speak", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Grokbot-Passcode": serverPass },
      body: JSON.stringify({ text: part, lang }),
      signal: ctl.signal,
    }).then((r) => { if (!r.ok) { const e = new Error("Speak failed"); e.status = r.status; throw e; } return r.blob(); });

        serverSetBusy(panel, "Speaking…");
        caption(panel, part);
        await playOrbBlob(panel, blob, ctl);

      if (e && e.status === 401) { serverError(panel, e); return; }

        st.pending = null;

function speakAll(panel, text, lang) {   // reads the words again with the device voice; no captions
  const st = panel._ask;
  stopAsk(panel);
  const ctl = new AbortController();
  st.ctl = ctl;
  const parts = text.split(/(?<=[.!?])\s+/).filter((s) => s.trim());
  voiceFor(lang).then((voice) => {
    if (!voice || ctl.signal.aborted || panel._ask !== st) return;
    let left = parts.length;
    serverSetBusy(panel, "Speaking…");
    for (const s of parts) speakSentence(panel, s, voice, lang, () => audio.pause(),
      () => { if (!--left && !ctl.signal.aborted && panel._ask === st) serverClearBusy(panel); });
  });

async function replayBlobs(panel, blobs) {   // server mode: the AI voice's MP3s again, no new /api/speak call
  const st = panel._ask;
  stopAsk(panel);
  const ctl = new AbortController();
  st.ctl = ctl;
  serverSetBusy(panel, "Speaking…");
  for (const b of blobs) {
    if (ctl.signal.aborted || panel._ask !== st) return;
    try { await playOrbBlob(panel, b, ctl); } catch (e) { break; }
  }
  if (!ctl.signal.aborted && panel._ask === st) serverClearBusy(panel);

function gbReplay() {
  const st = gb._ask, text = gb.querySelector(".gb-words").textContent.replace(/^This device has no voice[^\n]*\n/, "").trim();
  if (!text) return;
  if (askMode === "server" && st.lastBlobs && st.lastBlobs.length) replayBlobs(gb, st.lastBlobs);

}
async function askSendServer(id, i, panel, question, isChip) {
  const st = panel._ask;
  if (!st) return;
  st.pending = { id, i, question, isChip };
  if (passNeeded && !serverPass) {
    const row = panel.querySelector(".ask-pass");
    row.hidden = false;
    row.querySelector("input").focus();
    return;
  }
  if (st.ctl) st.ctl.abort();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (orbAudio) orbAudio.pause();
  const ctl = new AbortController();
  st.ctl = ctl;
  const lang = askLang(question, isChip);
  serverSetBusy(panel, "Thinking…");
  try {
    const text = await askServer(id, i, question);
    if (ctl.signal.aborted || panel._ask !== st) return;
    st.hist.push({ role: "user", content: question }, { role: "assistant", content: text });
    st.hist = st.hist.slice(-6);
    st.first = false;
